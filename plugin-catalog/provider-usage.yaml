name: provider-usage
repo: https://github.com/PhoeniXAbhisheK/hermes-plugin-provider-usage
sha: "8f78fcadd351daf77a9013011f220f4665322b7f"   # tag v0.3.1
description: "Per-provider quota and balance readout in the Hermes desktop status bar. Per-provider chips with eye toggles, a popover with every quota window, reset times, balance and key-cap amounts, near-limit amber tint, a desktop notification per threshold crossing, and burn-rate projections (ETA to reset or depletion). Providers: OpenCode Go, OpenAI Codex, OpenRouter, plus Anthropic, GitHub Copilot, Nous, Z.AI, Kimi, MiniMax and DeepSeek when configured. Disclosure — resolves provider credentials read-only (Hermes account-usage helpers and profile secrets, else the profile's .env and the vendor CLI login files ~/.codex/auth.json, ~/.claude/.credentials.json and ~/.local/share/opencode/auth.json) and sends each only to that provider's usage endpoint; the GitHub Copilot check presents the VS Code / Copilot client identity. No subprocesses, no telemetry."
description_tr: "Hermes masaüstü durum çubuğunda sağlayıcı başına kota ve bakiye okuması. Göz düğmeleri olan sağlayıcı başına çipler, her kota penceresini, sıfırlama zamanlarını, bakiyeyi ve anahtar tavan miktarlarını gösteren bir açılır pencere, sınıra yakın kehribar tonlama, her eşik geçişinde bir masaüstü bildirimi ve tüketim hızı tahminleri (sıfırlamaya ya da tükenmeye kalan süre). Sağlayıcılar: OpenCode Go, OpenAI Codex, OpenRouter ve yapılandırıldığında Anthropic, GitHub Copilot, Nous, Z.AI, Kimi, MiniMax ve DeepSeek. Açıklama — kimlik bilgileri salt okunur çözülür (Codex/Claude/Copilot/Nous için Hermes hesap kullanımı yardımcıları ve profil sırları, yoksa profilin .env dosyası ve satıcı CLI oturum açma dosyaları ~/.codex/auth.json, ~/.claude/.credentials.json ve ~/.local/share/opencode/auth.json) ve asla serileştirilmez; her biri yalnızca o sağlayıcının kullanım uç noktasına gönderilir ve yalnızca README'de listelenen sağlayıcı uçları çağrılır; GitHub Copilot denetimi VS Code / Copilot istemci kimliğini sunar. Alt süreç, telemetri ya da kendini güncelleme yok."
