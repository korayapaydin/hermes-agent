subdir: camofox
description: 'Camofox browser backend: browse with a self-hosted anti-detection Firefox (Camoufox, C++
  fingerprint spoofing) through the camofox-browser REST server. Registers the browser_* tools (navigate,
  snapshot with clickable refs, click, type, scroll, back, press, get_images, vision, JavaScript console,
  plus cookie import when CAMOFOX_API_KEY is set) in the `camofox` toolset, with `hermes camofox
  setup|status`; existing CAMOFOX_* variables and browser.camofox settings carry over. Formerly built
  into Hermes core; existing users are migrated automatically. Disclosure: one Python dependency
  (requests). It talks only to the Camofox server at CAMOFOX_URL (e.g. http://localhost:9377, which you
  run yourself: Docker or `npm start`), sending CAMOFOX_API_KEY as a bearer token when set. Page text
  reaches only your model as tool output; browser_vision sends the screenshot to your configured
  auxiliary vision model. Snapshots mask values that look like secrets (API keys, tokens), but text typed
  into form fields, passwords included, shows up in snapshots. Oversized snapshots and screenshots are
  written under the Hermes home (cache/web, browser_screenshots). Cookie import reads Netscape
  cookies.txt files only from browser.camofox.cookies_dir (default ~/.camofox/cookies). Inert on Hermes
  cores that still bundle Camofox.'
description_tr: "Camofox tarayıcı arka ucu: camofox-browser REST sunucusu üzerinden, kendi barındırdığınız algılamaya karşı Firefox (Camoufox, C++ parmak izi taklidi) ile gezinin. `camofox` araç setinde browser_* araçlarını kaydeder (navigate, tıklanabilir referanslarla snapshot, click, type, scroll, back, press, get_images, vision, JavaScript konsolu ve CAMOFOX_API_KEY ayarlıysa çerez içe aktarma) ve `hermes camofox setup|status` komutlarını ekler; mevcut CAMOFOX_* değişkenleri ve browser.camofox ayarları korunur. Önceden Hermes çekirdeğinde yerleşikti; mevcut kullanıcılar otomatik olarak geçirilir. Açıklama: bir Python bağımlılığı (requests) vardır. Yalnızca CAMOFOX_URL adresindeki Camofox sunucusuyla konuşur (örn. kendiniz çalıştırdığınız http://localhost:9377: Docker veya `npm start`); ayarlıysa CAMOFOX_API_KEY değerini bearer token olarak gönderir. Sayfa metni modelinize yalnızca araç çıktısı olarak ulaşır; browser_vision ekran görüntüsünü yapılandırdığınız yardımcı görüntü modeline gönderir. Snapshot'lar gizli görünen değerleri (API anahtarları, token'lar) maskeler, ancak form alanlarına yazılan metin, parolalar dahil, snapshot'larda görünür. Aşırı büyük snapshot'lar ve ekran görüntüleri Hermes ana dizini altına yazılır (cache/web, browser_screenshots). Çerez içe aktarma, Netscape cookies.txt dosyalarını yalnızca browser.camofox.cookies_dir dizininden okur (varsayılan ~/.camofox/cookies). Camofox'u hâlâ içeren Hermes çekirdeklerinde etkisizdir."
maintainer: NousResearch
