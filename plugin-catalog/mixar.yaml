description: >-
  Mixar's own desktop MCP server over stdio, with a Mixar workflow skill: build and edit 3D scenes,
  generate models, textures, rigs and animation with AI, render, and export game-ready assets for
  Unity, Unreal and Godot. Requires Mixar 4.2.1+ on macOS, Windows or Linux, signed in with Connect
  MCP turned on, on the same computer as Hermes. Disclosure — runs the launcher the installed Mixar
  app writes at ~/.mixar/connector/mixar-mcp (%USERPROFILE%\.mixar\connector\mixar-mcp.cmd on
  Windows), which reads Mixar's own files under ~/.mixar/; tools execute arbitrary Python inside
  Mixar with your privileges; a tool call can start the installed Mixar app, which stays open after
  Hermes exits; calls go over loopback to Mixar, which forwards them to api.mixar.app under the
  signed-in account; generation prompts and reference images go to the AI provider running the
  chosen model; Mixar's backend keeps diagnostic records of MCP tool calls (inputs and results) and
  deletes them within 30 days; AI generation and create_layered_material spend Mixar credits, declared to Hermes as cost ranges with a 500-credit spend limit per chat; the
  plugin stores no credentials, ships no binaries, sends no telemetry and never updates itself; the
  optional MIXAR_MCP_LAUNCHER variable makes it run the program it names; at install Hermes looks
  for Mixar (macOS: Mixar.app in /Applications and ~/Applications; Windows: the installed-apps entry
  or %ProgramFiles%\Mixar; Linux: a mixar command on PATH or Mixar's launcher) and refuses the
  install when it is missing or, on macOS and Windows, older than 4.2.1.
description_tr: "stdio üzerinden Mixar'ın kendi masaüstü MCP sunucusu ve bir Mixar iş akışı yeteneği: 3D sahneler oluşturun ve düzenleyin, yapay zeka ile modeller, dokular, rig'ler ve animasyonlar üretin, render alın ve Unity, Unreal ve Godot için oyuna hazır varlıklar dışa aktarın. macOS, Windows veya Linux üzerinde Hermes ile aynı bilgisayarda, Connect MCP açık şekilde oturum açılmış Mixar 4.2.1+ gerektirir. Bilgilendirme — yüklü Mixar uygulamasının ~/.mixar/connector/mixar-mcp adresine yazdığı başlatıcıyı (Windows'ta %USERPROFILE%\\\\.mixar\\\\connector\\\\mixar-mcp.cmd) çalıştırır, bu da ~/.mixar/ altındaki Mixar'ın kendi dosyalarını okur; araçlar Mixar içinde sizin yetkilerinizle rastgele Python kodları yürütür; bir araç çağrısı, Hermes çıktıktan sonra da açık kalan yüklü Mixar uygulamasını başlatabilir; çağrılar loopback üzerinden Mixar'a gider ve Mixar bunları oturum açmış hesap altında api.mixar.app'e iletir; üretim istemleri ve referans görüntüler seçilen modeli çalıştıran yapay zeka sağlayıcısına gider; Mixar arka ucu, MCP araç çağrılarının (girdiler ve sonuçlar) tanılam kayıtlarını tutar ve bunları 30 gün içinde siler; yapay zeka üretimi ve create_layered_material, sohbet başına 500 kredi harcama sınırı olan maliyet aralıkları şeklinde Hermes'e bildirilen Mixar kredilerini tüketir; eklenti kimlik bilgisi saklamaz, ikili dosya göndermez, telemetri göndermez ve asla kendini güncellemez; isteğe bağlı MIXAR_MCP_LAUNCHER değişkeni, belirttiği programı çalıştırmasını sağlar; kurulum sırasında Hermes Mixar'ı arar (macOS: /Applications ve ~/Applications içinde Mixar.app; Windows: yüklü uygulamalar girişi veya %ProgramFiles%\\\\Mixar; Linux: PATH üzerinde bir mixar komutu veya Mixar başlatıcısı) ve eksik olduğunda veya macOS ve Windows'ta 4.2.1'den eski olduğunda kurulumu reddeder."
