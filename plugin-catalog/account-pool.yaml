title: Account Pool
description: "Run several accounts of one provider in Hermes' credential pool: `hermes account <provider> <action>` adds accounts with email verification, shows live usage per account, keeps the least-used account first (fill_first + a 5-minute balance timer over every provider with accounts), parks accounts for hours or on a weekly schedule, shows which bot is on which account and its tokens at API prices, alerts on dead logins, a full pool or a runaway bot, and can start an idle account's 5-hour window with one tiny request (wake). Adapters for anthropic and openai-codex; generic commands for any pool provider. Optional Accounts page in Hermes Desktop. Linux and Windows. Disclosure — logins stay in Hermes: park holds an entry out of rotation in Hermes' pool (mark_exhausted_and_rotate, reason \"parked\") and unpark is reset_status; the plugin's park list holds labels, ids and times only; expired tokens are refreshed by Hermes (try_refresh_matching); sign-in, in the terminal and on the Desktop page, runs `hermes auth add`; other profiles' accounts are read with read_credential_pool. It uses each account's access token as Hermes stores it for live usage and the email check (api.anthropic.com/api/oauth/usage and /profile, chatgpt.com/backend-api/wham/usage, with the client headers of Hermes' usage fetcher) and for wake (a command, a page button, or the timer after the opt-in `wake auto-on`): one one-word request per account through Hermes' Anthropic client or the Codex Responses endpoint, and the account's model list. Telegram alerts through `hermes send -t telegram` to the bot's home channel or a chat id kept in account-pool.json; no telemetry. Its session tracker, a post_api_request hook, runs in every profile and writes labels, ids and token counts only. `setup` writes plugins.enabled of every profile, links the plugin into every profile, removes the retired account-pool-tracker (`hermes plugins remove`) and, with --timer, adds a systemd user timer (Linux) or a Task Scheduler task for the user (Windows, no admin rights). Runs systemctl --user and notify-send (Linux), schtasks, powershell.exe and taskkill (Windows), hermes config set, hermes auth add/remove, hermes send, hermes plugins remove; reads every profile's config.yaml and state.db (read-only), the gateway config (whether the Telegram bot has a home channel) and /proc on Linux. The command registers in the default profile only and provides no tools. Live usage, the email check and wake send each account's own access token from Hermes' pool straight to its vendor with Claude Code (anthropic) and Codex CLI (openai-codex) client headers. The session tracker reads the running agent's current pool account (label and id only) by scanning Python thread frames for Hermes' private _credential_pool. On the first run after 3.x it moves parked logins from account-pool-parked.json back into Hermes' pool and deletes that file."
description_tr: "Hermes'in kimlik bilgisi havuzunda tek bir sağlayıcının birkaç hesabını çalıştırın: `hermes account <provider> <action>` e-posta doğrulamasıyla hesap ekler, her hesabın anlık kullanımını gösterir, en az kullanılan hesabı önde tutar (fill_first + hesabı olan her sağlayıcı için 5 dakikalık denge zamanlayıcısı), hesapları saatlerce ya da haftalık programa göre park eder, hangi botun hangi hesapta olduğunu ve token'larını API fiyatlarıyla gösterir, ölü girişlerde, havuz dolduğunda veya bir bot kontrolden çıktığında uyarır ve boşta duran bir hesabın 5 saatlik penceresini tek küçük istekle başlatabilir (wake). anthropic ve openai-codex için bağdaştırıcılar; havuzdaki her sağlayıcı için genel komutlar. Hermes Desktop'ta isteğe bağlı Hesaplar sayfası. Linux ve Windows. Açıklama — girişler Hermes'te kalır: park, Hermes'in havuzunda bir girdiyi rotasyon dışında tutar (mark_exhausted_and_rotate, reason \"parked\") ve unpark reset_status'tür; eklentinin park listesi yalnızca etiketleri, kimlikleri ve zamanları tutar; süresi dolmuş token'lar Hermes tarafından yenilenir (try_refresh_matching); terminalde ve Desktop sayfasındaki oturum açma `hermes auth add` çalıştırır; diğer profillerin hesapları read_credential_pool ile okunur. Anlık kullanım ve e-posta denetimi için her hesabın erişim token'ını Hermes'in sakladığı biçimde kullanır (api.anthropic.com/api/oauth/usage ve /profile, chatgpt.com/backend-api/wham/usage, Hermes'in kullanım getiricisinin istemci başlıklarıyla) ve wake için de (bir komut, bir sayfa düğmesi veya isteğe bağlı `wake auto-on` sonrasında zamanlayıcı): Hermes'in Anthropic istemcisi veya Codex Responses uç noktası üzerinden hesap başına tek kelimelik bir istek ve hesabın model listesi. Telegram uyarıları, `hermes send -t telegram` ile botun ana kanalına veya account-pool.json dosyasında tutulan bir sohbet kimliğine gönderilir; telemetri yok. Bir post_api_request kancası olan oturum izleyicisi her profilde çalışır ve yalnızca etiketleri, kimlikleri ve token sayılarını yazar. `setup` her profilin plugins.enabled değerini yazar, eklentiyi her profile bağlar, kullanımdan kaldırılmış account-pool-tracker'ı kaldırır (`hermes plugins remove`) ve --timer ile bir systemd kullanıcı zamanlayıcısı (Linux) veya kullanıcı için bir Görev Zamanlayıcı görevi (Windows, yönetici hakları gerekmez) ekler. systemctl --user ve notify-send (Linux), schtasks, powershell.exe ve taskkill (Windows), hermes config set, hermes auth add/remove, hermes send, hermes plugins remove çalıştırır; her profilin config.yaml ve state.db dosyasını (salt okunur), ağ geçidi yapılandırmasını (Telegram botunun ana kanalı olup olmadığını) ve Linux'ta /proc dizinini okur. Komut yalnızca varsayılan profilde kaydolur ve hiçbir araç sunmaz. Anlık kullanım, e-posta denetimi ve wake, her hesabın kendi erişim token'ını Hermes'in havuzundan doğrudan satıcısına Claude Code (anthropic) ve Codex CLI (openai-codex) istemci başlıklarıyla gönderir. Oturum izleyicisi, Python iş parçacığı çerçevelerini Hermes'in özel _credential_pool'u için tarayarak çalışan ajanın geçerli havuz hesabını (yalnızca etiket ve kimlik) okur. 3.x sonrası ilk çalıştırmada park edilmiş girişleri account-pool-parked.json dosyasından Hermes'in havuzuna geri taşır ve o dosyayı siler."
