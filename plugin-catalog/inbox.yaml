description: "hermes inbox: one read-only view of everything in flight for the active profile: failed or paused cron jobs, stalled or dropped delegations, orphaned background processes, blocked kanban tasks, running work, undelivered delegation results, upcoming cron runs and open chat sessions, with --json for scripts. A Hermes Labs plugin: built by Nous Research, not supported. Disclosure — reads processes.json, cron/jobs.json, runtime/active_sessions.json and state.db (SQLite read-only) in the profile's home, plus the shared kanban board's kanban.db (read-only); it never writes, repairs or prunes them, adds no model tools or hooks, and sends nothing anywhere."
description_tr: "hermes inbox: etkin profil için yürürlükteki her şeye tek ve salt okunur bir bakış: başarısız veya duraklatılmış cron görevleri, tıkanmış ya da düşmüş devretmeler, sahipsiz arka plan süreçleri, engellenmiş kanban görevleri, çalışan işler, teslim edilmemiş devretme sonuçları, yaklaşan cron çalıştırmaları ve açık sohbet oturumları; betikler için --json. Bir Hermes Labs eklentisi: Nous Research tarafından geliştirildi, desteklenmiyor. Açıklama — profilin ana dizinindeki processes.json, cron/jobs.json, runtime/active_sessions.json ve state.db (SQLite, salt okunur) dosyalarını, ayrıca paylaşılan kanban panosunun kanban.db dosyasını (salt okunur) okur; bunları asla yazmaz, onarmaz veya budamaz, hiçbir model aracı ya da kanca eklemez ve hiçbir yere veri göndermez."
