version: "0.4.4"
title: ctx checkpoint
description: "Memory provider that archives the direct user/assistant transcript into a ctx knowledge store before every compaction, deterministically and with no LLM in the path, and hands the resulting block IDs to the compaction summary so the exact wording stays recoverable. Best-effort on any supported Hermes; with compression.checkpoint_required on Hermes 0.21.1+ it uses the fail-closed pre-compress checkpoint contract (#94639) and blocks compaction until the checkpoint is durable. Disclosure — the turns about to be compacted (tool results and system prompts excluded, secrets redacted twice) are written through Hermes' MCP dispatch to the ctx server you configure in mcp_servers; the plugin holds no credentials, makes no other network calls and has no telemetry; it imports the core modules agent.redact, tools.registry and hermes_cli.config."
description_tr: "Her sıkıştırmadan önce, doğrudan kullanıcı/asistan dökümünü deterministik olarak ve yolda LLM olmadan bir ctx bilgi deposuna arşivleyen ve sonuçlanan blok kimliklerini sıkıştırma özetine sunan bellek sağlayıcısı; böylece tam ifade geri kazanılabilir kalır. Desteklenen herhangi bir Hermes üzerinde en iyi çabayla çalışır; Hermes 0.21.1+ üzerinde compression.checkpoint_required ile fail-closed pre-compress checkpoint sözleşmesini (#94639) kullanır ve kontrol noktası kalıcı olana kadar sıkıştırmayı engeller. Açıklama — Sıkıştırılmak üzere olan turlar (araç sonuçları ve sistem istemleri hariç, gizli bilgiler iki kez maskelenmiş), Hermes'in MCP dağıtımı aracılığıyla mcp_servers'da yapılandırdığınız ctx sunucusuna yazılır; eklenti hiçbir kimlik bilgisi tutmaz, başka ağ çağrısı yapmaz ve telemetrisi yoktur; çekirdek modüller agent.redact, tools.registry ve hermes_cli.config'i içe aktarır."
maintainer: GottZ
tier: community
