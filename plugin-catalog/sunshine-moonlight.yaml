description: "Set up and diagnose Moonlight game streaming (Sunshine host <-> Moonlight client) between machines that run Hermes. One tool, action-based: discover hosts on the tailnet/LAN, preflight ports, install+start Sunshine, pair clients, verify encoders, and launch a stream. Writes to remote machines only over SSH and only when the action says so. Disclosure — runs shell commands as your user on this machine and, over SSH, on hosts you name (BatchMode, your existing keys); `install` runs `sudo` with your package manager to install `sunshine` or `moonlight-qt` without a Hermes approval prompt; `configure`/`start` rewrite Sunshine's config (with a backup) and restart its user service; `discover` reads `tailscale status` and port-probes your tailnet peers; `launch` starts a Moonlight process. No credentials stored, no telemetry."
description_tr: "Hermes çalıştıran makineler arasında Moonlight oyun akışını (Sunshine sunucu <-> Moonlight istemci) kurun ve teşhis edin. Tek araç, eylem tabanlı: tailnet/LAN üzerindeki sunucuları keşfedin, portları önden denetleyin, Sunshine'ı kurun ve başlatın, istemcileri eşleştirin, kodlayıcıları doğrulayın ve bir akış başlatın. Uzak makinelere yalnızca SSH üzerinden ve yalnızca eylem öyle söylediğinde yazar. Açıklama — Bu makinede ve SSH üzerinden adlandırdığınız konaklarda (BatchMode, mevcut anahtarlarınız) kullanıcınız olarak kabuk komutları çalıştırır; `install`, Hermes onay istemi olmadan `sunshine` veya `moonlight-qt` kurmak için paket yöneticinizle `sudo` çalıştırır; `configure`/`start`, Sunshine'ın yapılandırmasını (yedekle birlikte) yeniden yazar ve kullanıcı servisini yeniden başlatır; `discover`, `tailscale status` okur ve tailnet eşlerinizin portlarını yoklar; `launch`, bir Moonlight süreci başlatır. Kimlik bilgisi saklanmaz, telemetri yoktur."
