title: Czech (Čeština) Language Pack
description: >-
  Czech (Čeština) language pack for Hermes Agent covering all three UI surfaces — core
  CLI/gateway/platforms (3,509/3,509 keys), the Ink TUI (1,385/1,385) and the Desktop app (5,324 of
  5,451). Core and TUI keys match the English source of `main` at d050956 (2026-10-25) exactly: no
  key upstream has since removed and no placeholder divergence, checked by flattening both sides.
  The remaining 125 Desktop keys are the ones whose English value is a function with branching
  (plural counts such as `cron.count`, conditional labels such as `assistant.thread.errorSwitchToModel`),
  which the pack format cannot express as one template — they are omitted so they fall back to
  English instead of rendering a wrong Czech form. Two core strings (`display.verb_connector.search`
  and `.default`) drop an invisible zero-width space the upstream English catalog carries for
  spacing; the install scanner rates it HIGH while the visible text is identical. Ships the same
  text as upstream PR #105503, so if that PR lands the bundled locale and this pack agree. Manifest-only
  plugin: flat dotted YAML catalogs under locales/, no network, no dependencies. Disclosure — an
  `__init__.py` whose `register()` is a no-op is included so the Desktop "Install from Git" flow
  accepts the pack (#138118); registering the pack never changes display.language, the user opts in
  via `hermes config set display.language cs`. Česká lokalizace rozhraní Hermes Agent.
maintainer: ostravajih
description_tr: "Hermes Ajanı için üç kullanıcı arayüzü yüzeyini de kapsayan Çekçe (Čeština) dil paketi — çekirdek CLI/ağ geçidi/platformlar (3,509/3,509 anahtar), Ink TUI (1,385/1,385) ve Masaüstü uygulaması (5,451 anahtarın 5,324'ü). Çekirdek ve TUI anahtarları, `main` dalının d050956 (2025-10-25) tarihindeki İngilizce kaynağıyla tam olarak eşleşir: Üst akışta hiçbir anahtar kaldırılmamıştır ve yer tutucu sapması yoktur, bu durum her iki tarafın düzleştirilmesiyle kontrol edilmiştir. Kalan 125 Masaüstü anahtarı, İngilizce değerinin dallanma içeren bir fonksiyon olduğu (cron.count gibi çoğul sayımlar, assistant.thread.errorSwitchToModel gibi koşullu etiketler) anahtarlardır; paket formatı bunları tek bir şablon olarak ifade edemediği için bunlar atlanmıştır, böylece yanlış bir Çekçe biçim oluşturmak yerine İngilizceye dönerler. İki çekirdek dize (`display.verb_connector.search` ve `.default`), üst akış İngilizce kataloğunun boşluk için taşıdığı görünmez sıfır genişlikli boşluğu atar; kurulum tarayıcısı bunu YÜKSEK olarak puanlar ancak görünür metin aynıdır. Üst akış PR #105503 ile aynı metni sunar, dolayısıyla o PR kabul edilirse paketli yerel ayar ve bu paket uyumlu olur. Yalnızca manifest içeren eklenti: locales/ altında düz noktalı YAML katalogları, ağ erişimi yok, bağımlılık yok. Açıklama — Masaüstü \"Git'ten Yükle\" akışının paketi kabul etmesi için (#138118) register() fonksiyonu işlem yapmayan bir __init__.py dosyası eklenmiştir; paketin kaydolması display.language ayarını asla değiştirmez, kullanıcı `hermes config set display.language cs` ile bunu seçer. Česká lokalizace rozhraní Hermes Agent."
