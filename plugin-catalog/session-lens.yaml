sha: 69bc2b183fd376acf27256cd9b43f578a16388ae
version: "0.53.2"
description: "Read-only observability for Hermes Desktop: what each session cost and why, its full trace, recurring tool failures, every profile at a glance, provider quotas and service balances, model comparison with cheaper-route evidence, and instruction-rule grading. Disclosure — reads every profile's state.db read-only plus agent logs, cron/gateway state, config.yaml and .env (key names, and the values of keys an adapter uses); with the credentials Hermes' own resolvers return, calls only each configured vendor's usage or balance endpoint (hosts listed in the README), sending Grok CLI client headers to cli-chat-proxy.grok.com and a Claude Code user-agent to api.anthropic.com; Hermes' resolvers may renew Hermes' Codex, Nous and xAI logins and, when Hermes holds no other Anthropic credential, Claude Code's login; runs the local monid CLI when installed; an Anthropic one-token Claude Haiku probe is off by default; writes no Hermes state itself and sends no session content anywhere."
description_tr: "Hermes Desktop için salt okunur gözlemlenebilirlik: her oturumun neye mal olduğu ve neden, tam izi, tekrarlayan araç hataları, her profilin bir bakışta görünümü, sağlayıcı kotaları ve servis bakiyeleri, daha ucuz rota kanıtıyla model karşılaştırması ve talimat kuralı puanlaması. Açıklama — her profilin state.db dosyasını salt okunur olarak, ayrıca ajan günlüklerini, cron/ağ geçidi durumunu, config.yaml ve .env dosyalarını (anahtar adları ve bir bağdaştırıcının kullandığı anahtarların değerleri) okur; Hermes'in kendi çözümleyicilerinin döndürdüğü kimlik bilgileriyle yalnızca yapılandırılmış her satıcının kullanım veya bakiye uç noktasını çağırır (ana bilgisayarlar README'de listelenmiştir), cli-chat-proxy.grok.com adresine Grok CLI istemci başlıklarını ve api.anthropic.com adresine Claude Code kullanıcı aracısını gönderir; Hermes'in çözümleyicileri Hermes'in Codex, Nous ve xAI oturum açmalarını ve Hermes'in başka Anthropic kimlik bilgisi tutmadığı durumda Claude Code'un oturum açmasını yenileyebilir; kurulduğunda yerel monid CLI'sini çalıştırır; Anthropic tek token'lık Claude Haiku yoklaması varsayılan olarak kapalıdır; kendisi hiçbir Hermes durumu yazmaz ve hiçbir oturum içeriğini hiçbir yere göndermez."
