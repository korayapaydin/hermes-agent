description: "Local speech-to-text (provider stt_enhance) with faster-whisper or opt-in sherpa-onnx Parakeet V3 and long-audio chunking, plus an optional bounded LLM pass that enhances the transcript using a custom skill, an inline prompt or the default, and keeps the raw transcript on failure. Disclosure — audio is decoded locally. Post-processing is on by default and sends the transcript text to the LLM Hermes routes the stt_enhance auxiliary task to (your main, usually remote, provider unless you point it at a local endpoint or set post_processing.enabled: false). It reads the body of the SKILL.md you configure (never executed) and runs ffmpeg/ffprobe. The opt-in Parakeet backend reads a local model export and, on first use and only when your config.yaml explicitly sets security.allow_lazy_installs: true, installs pinned sherpa-onnx and numpy from PyPI into ~/.hermes/plugin-runtimes/hermes-stt-enhance/ (shared by all profiles). No tools, hooks, background processes, telemetry or stored credentials."
description_tr: "faster-whisper ya da isteğe bağlı sherpa-onnx Parakeet V3 ve uzun ses parçalama ile yerel sesten metne (sağlayıcı stt_enhance), ayrıca isteğe bağlı, sınırlı bir LLM geçişi: dökümü yapılandırdığınız özel bir yetenek, satır içi bir istem ya da varsayılanı kullanarak geliştirir ve başarısızlıkta ham dökümü korur. Açıklama — ses yerel olarak çözülür. Son işleme varsayılan olarak açıktır ve döküm metnini, Hermes'in stt_enhance yardımcı görevini yönlendirdiği LLM'e gönderir (yerel bir uç noktaya yönlendirmediğiniz veya post_processing.enabled: false ayarlamadığınız sürece ana, genellikle uzak sağlayıcınız). Yapılandırdığınız SKILL.md'nin gövdesini okur (asla çalıştırılmaz) ve ffmpeg/ffprobe çalıştırır. İsteğe bağlı Parakeet arka ucu yerel bir model dışa aktarımını okur ve ilk kullanımda, yalnızca config.yaml'iniz açıkça security.allow_lazy_installs: true ayarlıysa, sabitlenmiş sherpa-onnx ve numpy'yi PyPI'dan ~/.hermes/plugin-runtimes/hermes-stt-enhance/ dizinine kurar (tüm profillerce paylaşılır). Araç, kanca, arka plan süreci, telemetri veya saklanan kimlik bilgisi yok."
