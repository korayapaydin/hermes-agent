name: stop-ledger
repo: https://github.com/olric3015/hermes-plugins
sha: 604940a4bb6754c571b7562362fe2d1ceac1d741
subdir: stop-ledger
description: "Local ledger of the turns you stopped while Hermes was still working (/stop, or /new and /reset during a running turn, on messaging platforms, the TUI and the desktop app): /stop-log shows how many running turns were stopped, how many by /stop and by /new, in how many sessions and how long ago the last one was, per platform or per day, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /stop-log recent lists the newest stops (ten, or up to 100 with /stop-log recent 50). Disclosure — writes stop metadata (platform, /stop or /new, Hermes's label for the stop, a 12-digit hash of the session key; no session key or chat content) to plugin-data/stop-ledger/stops.jsonl, trimmed to 5,000 rows past 2 MB; observer only, cannot delay or undo a stop; no network"
description_tr: "Hermes hâlâ çalışırken durdurduğunuz turların yerel defteri (/stop, ya da çalışan bir tur sırasında /new ve /reset; mesajlaşma platformlarında, TUI'da ve masaüstü uygulamasında): /stop-log, son 24 saat, istenen sayıda saat ya da gün, en son oturum ya da kaydedilen her şey için; platforma veya güne göre kaç çalışan turun durdurulduğunu, bunlardan kaçının /stop ve kaçının /new ile, kaç oturumda ve sonuncusunun ne kadar önce olduğunu gösterir; /stop-log recent en yeni durdurmaları listeler (on ya da /stop-log recent 50 ile en fazla 100). Açıklama — durdurma üst verilerini (platform, /stop veya /new, Hermes'in durdurma için kullandığı etiket, oturum anahtarının 12 haneli karması; oturum anahtarı ya da sohbet içeriği yok) plugin-data/stop-ledger/stops.jsonl dosyasına yazar, 2 MB aşıldığında 5.000 satıra kırpılır; yalnızca gözlemcidir, bir durdurmayı geciktiremez ya da geri alamaz; ağ yok"
maintainer: olric3015
tier: community
category: tools
requires_hermes: ">=0.21.5"
