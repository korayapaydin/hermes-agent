sha: 20c7a0e1f56d6fea9761077f6994ab7b3d174b99
subdir: pep-ref
description: >-
  @pep:<number> context references: attach a Python Enhancement Proposal to a message (status, type,
  authors, Python version and its first section, usually the Abstract), or one section with
  @pep:<number>#<section>, with PEP number and title autocomplete in the TUI and Desktop composer.
  Disclosure — sends HTTPS GET requests to peps.python.org only (the PEP index and the referenced
  PEP's page; section names and autocomplete text are matched locally); keeps the index in memory
  for an hour; no API key, no files written, no subprocess; register() only adds the @pep:
  reference provider.
description_tr: "@pep:<number> bağlam referansları: bir mesaja bir Python Geliştirme Önerisi ekleyin (durum, tür, yazarlar, Python sürümü ve ilk bölümü, genellikle Özet), ya da @pep:<number>#<section> ile tek bir bölümü; TUI ve Desktop yazma alanında PEP numarası ve başlığı otomatik tamamlama. Açıklama — yalnızca peps.python.org adresine HTTPS GET istekleri gönderir (PEP dizini ve başvurulan PEP'in sayfası; bölüm adları ve otomatik tamamlama metni yerelde eşleştirilir); dizini bir saat boyunca bellekte tutar; API anahtarı yok, dosya yazılmaz, alt süreç yok; register() yalnızca @pep: referans sağlayıcısını ekler."
