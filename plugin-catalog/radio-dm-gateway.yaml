name: radio-dm-gateway
repo: https://github.com/TakeshiTGAL/hermes-plugin-radio-dm-gateway
sha: cc543e3fcd331bb3aeb995d8176947593134e7a3
description: "Answers an allowlisted direct message on your Meshtastic® radio. Disclosure — talks only to the MESHTASTIC_URL you set, over plain tcp, so channel keys and text travel unencrypted. An empty MESHTASTIC_ALLOWED_NODES answers nobody. A channel packet or a direct message without pkiEncrypted is never answered, because a channel key can forge a sender. Allowlisted nodes can prompt the agent, use tools until hermes tools turns them off, and approve one command at a time. An approval question is sent only when its line shows exactly the command /approve will run. A line that still goes out after that send was declined does not let /approve run it, and the next approval is declined once. Each direct message runs an agent turn on your model, and the agent cannot send on its own. No cron job comes with it; one the agent makes stays until hermes cron remove. Hermes main does not load this platform when plugins run in their own process. Node ids, sizes and times go to nodes.json in this profile's plugin-data and stay after uninstall. The message text is not stored. Not tried on a physical radio. Meshtastic® is a registered trademark of Meshtastic LLC. This site is not affiliated with or endorsed by the Meshtastic project."
description_tr: "Meshtastic® radyonuzdaki izin listesindeki doğrudan mesajı yanıtlar. Açıklama — yalnızca sizin ayarladığınız MESHTASTIC_URL ile, düz tcp üzerinden konuşur; bu yüzden kanal anahtarları ve metin şifrelenmeden yol alır. Boş bir MESHTASTIC_ALLOWED_NODES hiç kimseye yanıt vermez. Bir kanal paketi ya da pkiEncrypted olmayan bir doğrudan mesaj asla yanıtlanmaz, çünkü bir kanal anahtarı göndericiyi taklit edebilir. İzin listesindeki düğümler ajana istem gönderebilir, hermes tools onları kapatana kadar araç kullanabilir ve her seferinde bir komut onaylayabilir. Onay sorusu yalnızca satırı /approve komutunun çalıştıracağı komutu tam olarak gösterdiğinde gönderilir. O gönderim reddedildikten sonra hâlâ dışarı çıkan bir satır, /approve komutunun onu çalıştırmasına izin vermez ve bir sonraki onay bir kez reddedilir. Her doğrudan mesaj modelinizde bir ajan turu çalıştırır ve ajan kendi başına gönderim yapamaz. Beraberinde cron görevi gelmez; ajanın oluşturduğu görev hermes cron remove çalıştırılana kadar kalır. Eklentiler kendi süreçlerinde çalıştığında Hermes ana süreci bu platformu yüklemez. Düğüm kimlikleri, boyutları ve zamanları bu profilin plugin-data dizinindeki nodes.json dosyasına gider ve kaldırma sonrasında kalır. Mesaj metni saklanmaz. Fiziksel bir radyoda denenmedi. Meshtastic®, Meshtastic LLC'nin tescilli markasıdır. Bu site Meshtastic projesiyle bağlantılı değildir ve proje tarafından onaylanmamıştır."
