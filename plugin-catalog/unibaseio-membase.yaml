sha: d304dc773e028bd6a90ae628692b9c8dc008e8dc
subdir: integrations/hermes
title: Membase
description: "Long-term memory for you and your AI from Membase (membase.com, by Unibase): one memory every connected AI shares. Searches the user's Membase memory before each turn (8 s, fail-open) and adds membase_search, membase_save and membase_profile. Disclosure — user prompts are sent as search queries to the Membase API (api.app.membase.com); with the opt-in capture_turns setting the user's messages are saved there too, and what Hermes' built-in memory records about the user is saved to their Membase profile. MEMBASE_API_KEY comes from the Hermes secret scope; the only local file is $HERMES_HOME/unibaseio-membase.json. No background processes, shell commands or telemetry."
description_tr: "Siz ve yapay zekanız için Membase'den (membase.com, Unibase tarafından) uzun süreli bellek: bağlı tüm yapay zekaların paylaştığı tek bir bellek. Her turdan önce kullanıcının Membase belleğini arar (8 s, hata durumunda açık bırakır) ve membase_search, membase_save ve membase_profile araçlarını ekler. Bilgilendirme — kullanıcı promptları Membase API'sine (api.app.membase.com) arama sorguları olarak gönderilir; isteğe bağlı capture_turns ayarıyla kullanıcının mesajları da oraya kaydedilir ve Hermes'in yerleşik belleğinin kullanıcı hakkında kaydettiği bilgiler Membase profiline kaydedilir. MEMBASE_API_KEY, Hermes gizli kapsamından gelir; tek yerel dosya $HERMES_HOME/unibaseio-membase.json'dır. Arka plan işlemleri, kabuk komutları veya telemetri yoktur."
maintainer: unibaseio
tier: community
category: memory
requires_hermes: ">=0.22.2"
