sha: 544e6f35c65c45d085a90078a328dbd8c3fb8872
subdir: plugin
title: runbox
version: "0.1.0"
description: "Build, run and test Python in an offline container per chat, with results as a plain file:line issue list. The agent syncs files or folders in as copies, then runs run (a shell command), check (ruff error rules) and test (pytest); fixes stay in the box until the user asks for export, which writes changed files back through write_file and reports host files changed since the sync as conflicts. In Hermes Desktop a VS Code-style editor opens beside the chat: file tabs with in-place editing, Run / Check / Test / Stop, and PROBLEMS / OUTPUT / RUNS panels that follow the agent live. Ships the runbox:dev-loop starting-point skill. Disclosure — needs Docker (on macOS a dedicated colima profile 'runbox', started on demand with --activate=false and its own Docker config); pulls the container image pinned by digest and installs a hash-pinned checker toolchain (ruff 0.16.9, pytest 9.1.1 and deps) from PyPI once per image; the work container has no network, hardened flags, and runs commands without Hermes' dangerous-command approval like Hermes' Docker backend; install (PyPI) always asks for approval in a separate installer container; a write_file/patch on an imported original asks for approval (guard_imports); export reads each existing target through read_file before replacing it; a background thread removes idle containers (15 min), stops the VM, and removes boxes of deleted or long-idle chats (reads state.db read-only hourly); adds a short per-turn note (about 80 tokens); no credentials or telemetry."
description_tr: "Sohbet başına çevrimdışı bir konteynerde Python derleyin, çalıştırın ve test edin; sonuçlar düz bir file:line sorun listesi olarak gelir. Ajan dosyaları veya klasörleri kopya olarak eşitler, ardından run (bir kabuk komutu), check (ruff hata kuralları) ve test (pytest) çalıştırır; düzeltmeler kullanıcı dışa aktarmayı isteyene kadar kutunun içinde kalır; dışa aktarma değişen dosyaları write_file ile geri yazar ve eşitlemeden bu yana değişen ana makine dosyalarını çakışma olarak bildirir. Hermes Desktop'ta sohbetin yanında VS Code tarzı bir düzenleyici açılır: yerinde düzenlemeli dosya sekmeleri, Run / Check / Test / Stop ve ajanı canlı takip eden PROBLEMS / OUTPUT / RUNS panelleri. runbox:dev-loop başlangıç yeteneğini içerir. Açıklama — Docker gerektirir (macOS'ta özel bir colima profili 'runbox', istek üzerine --activate=false ile ve kendi Docker yapılandırmasıyla başlatılır); konteyner imajını özetle sabitlenmiş olarak çeker ve imaj başına bir kez PyPI'den karma değeri sabitlenmiş bir denetleyici araç zinciri (ruff 0.16.9, pytest 9.1.1 ve bağımlılıklar) kurar; çalışma konteynerinin ağı yoktur, sıkılaştırılmış bayraklarla çalışır ve Hermes'in Docker arka ucu gibi komutları Hermes'in tehlikeli komut onayı olmadan çalıştırır; kurulum (PyPI) her zaman ayrı bir kurulum konteynerinde onay ister; içe aktarılmış bir orijinal üzerinde write_file/patch onay ister (guard_imports); dışa aktarma, mevcut her hedefi değiştirmeden önce read_file üzerinden okur; bir arka plan iş parçacığı boş konteynerleri (15 dakika) kaldırır, VM'i durdurur ve silinmiş ya da uzun süre boşta kalmış sohbetlerin kutularını kaldırır (state.db'yi saatte bir salt okunur okur); tur başına kısa bir not ekler (yaklaşık 80 token); kimlik bilgisi veya telemetri yok."
maintainer: Zek-Takai
