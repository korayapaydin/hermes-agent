name: gemini-media
repo: https://github.com/bytecakelake/hermes-gemini-media-generation
sha: 44bc2dd0349c08cecdcb44333b9fa0000ef01d95
description: "Google Gemini image (Nano Banana) and video (Gemini Omni) generation backends for image_generate and video_generate, in one plugin built on the google-genai SDK. Image: text-to-image and reference-guided editing (up to 14 images). Video: text-, image- and reference-to-video with native audio. Model picker comes from the key's live models.list. Disclosure — prompts, reference images and the Gemini API key (GEMINI_API_KEY, falling back to GOOGLE_API_KEY, the key Hermes's own Gemini chat provider uses) are sent to generativelanguage.googleapis.com; reference-image URLs are downloaded by the plugin (public hosts only, redirects re-checked) and a local reference path can be any image file the user can read (accepted only after a magic-byte check); generation is billed to the API key's Google project; writes generated media under $HERMES_HOME/cache/generated/ and a model-list cache (key hash only) under $HERMES_HOME/cache/gemini_media/; no telemetry, shell commands, background processes or self-updates. Installs google-genai."
description_tr: "google-genai SDK üzerine kurulu tek bir eklenti içinde, image_generate ve video_generate için Google Gemini görsel (Nano Banana) ve video (Gemini Omni) üretim arka uçları. Görsel: Metinden görsele ve referans odaklı düzenleme (14 görsele kadar). Video: Metinden, görselden ve referanstan videoya, yerel ses ile birlikte. Model seçici, anahtarın canlı models.list verilerinden gelir. Açıklama — İstemler, referans görseller ve Gemini API anahtarı (GEMINI_API_KEY, aksi takdirde Hermes'in kendi Gemini sohbet sağlayıcısının kullandığı GOOGLE_API_KEY) generativelanguage.googleapis.com adresine gönderilir; referans görsel URL'leri eklenti tarafından indirilir (yalnızca genel hostlar, yönlendirmeler tekrar kontrol edilir) ve yerel bir referans yolu kullanıcının okuyabildiği herhangi bir görsel dosyası olabilir (yalnızca bir magic-byte kontrolünden sonra kabul edilir); üretim, API anahtarının Google projesine faturalandırılır; üretilen medyaları $HERMES_HOME/cache/generated/ altına ve bir model listesi önbelleğini (yalnızca anahtar karması) $HERMES_HOME/cache/gemini_media/ altına yazar; telemetri, kabuk komutları, arka plan süreçleri veya otomatik güncellemeler yoktur. google-genai paketini yükler."
maintainer: bytecakelake
tier: community
category: tools
requires_hermes: ">=0.21.0"
docs_url: https://github.com/bytecakelake/hermes-gemini-media-generation#readme
version: "0.1.2"
known_issues:
  - The Gemini Omni video endpoint stalls intermittently; calls are bounded by a wall-clock deadline (default 300 s) and return error_type timeout.
  - Video input (editing, extending, reference videos) is not supported; API-key authentication only.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - GEMINI_API_KEY
