name: print3d
repo: https://github.com/mfranzon/print3d
sha: ff98a8c07253a90f5e4afefa42c2ffd893797eec
description: "Turn an idea, a photo of an object, or a shop listing into a sliced Bambu Studio project. The agent writes a Blender script, print3d checks the mesh (overhangs, thin walls, fits between parts, likeness to the photo), slices it and says what to fix, until it prints clean; each run also writes a 3D view the agent opens in the Desktop preview pane. Portable Agent Plugins v1 package: one skill and a stdio MCP server run through uvx, so Blender 4.2+, Bambu Studio and uv are required; at install Hermes looks for Blender in the standard locations (/Applications and Steam on macOS; PATH, flatpak, snap and Steam on Linux) and refuses the install without it. Disclosure — runs Blender and the Bambu Studio CLI as local child processes; Blender runs the agent-written Python with your user's permissions, outside Hermes's terminal sandbox, and the server is marked untrusted, so Hermes asks before every tool that runs a script or changes a job (the read-only tools still write preview images and the 3D view under ~/print3d/jobs without asking); installs Pillow and mcp from PyPI; the 3D view loads three.js from cdn.jsdelivr.net; the optional `print3d setup` command (not needed for a catalog install) edits Hermes, Codex, Claude, Cursor and Gemini config files, with backups. Never contacts the printer; no telemetry, no credentials."
description_tr: "Bir fikri, bir nesne fotoğrafını veya bir mağaza listesini dilimlenmiş bir Bambu Studio projesine dönüştürün. Ajan bir Blender betiği yazar, print3d ağı kontrol eder (çıkıntılar, ince duvarlar, parçalar arası uyum, fotoğrafa benzerlik), onu dilimler ve temiz bir şekilde yazdırılana kadar neyin düzeltilmesi gerektiğini söyler; her çalıştırma aynı zamanda ajanın Masaüstü önizleme panelinde açtığı bir 3D görünüm yazar. Taşınabilir Ajan Eklentileri v1 paketi: bir yetenek ve uvx üzerinden çalıştırılan bir stdio MCP sunucusu, bu nedenle Blender 4.2+, Bambu Studio ve uv gereklidir; kurulumda Hermes, Blender'ı standart konumlarda (/Applications ve Steam macOS'ta; PATH, flatpak, snap ve Steam Linux'ta) arar ve bulamadığında kurulumu reddeder. Bilgilendirme — Blender ve Bambu Studio CLI'yı yerel alt işlemler olarak çalıştırır; Blender, ajanın yazdığı Python kodunu, Hermes'in terminal kum havuzunun dışında, kullanıcınızın izinleriyle çalıştırır ve sunucu güvenilmeyen olarak işaretlenmiştir, bu nedenle Hermes, bir betik çalıştıran veya bir işi değiştiren her araçtan önce izin ister (salt okunur araçlar hala izin istemeden ~/print3d/jobs altına önizleme görüntüleri ve 3D görünüm yazar); PyPI'den Pillow ve mcp'yi yükler; 3D görünüm cdn.jsdelivr.net'ten three.js'i yükler; isteğe bağlı `print3d setup` komutu (katalog kurulumu için gerekli değildir), yedeklerle birlikte Hermes, Codex, Claude, Cursor ve Gemini yapılandırma dosyalarını düzenler. Yazıcıyla asla iletişim kurmaz; telemetri, kimlik bilgileri yoktur."
