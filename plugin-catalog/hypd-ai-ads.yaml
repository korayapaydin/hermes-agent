description: "Read-only paid-media analysis for Google Ads, Meta (Facebook) Ads, Microsoft Ads, LinkedIn Ads, Google Analytics (GA4), Search Console and Merchant Center through the hosted HYPD MCP. Portable Agent Plugins v1 package with four skills (setup, tool rules, overview, ready-made analyses). OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required. Read-only: never changes campaigns, budgets or ads. Disclosure — runs the pinned mcp-remote@0.1.49 through npx (downloaded from npm on first run) as a local bridge to HYPD's hosted MCP server at mcp.hypd.ai; tool arguments and the ad, analytics, Search Console and Merchant Center data HYPD returns pass through HYPD's servers; sign-in is a browser OAuth flow whose tokens mcp-remote stores in ~/.mcp-auth; read-only is HYPD's server-side guarantee, and the analysis templates the skills follow are fetched from HYPD's server at run time."
description_tr: "Barındırılan HYPD MCP aracılığıyla Google Ads, Meta (Facebook) Ads, Microsoft Ads, LinkedIn Ads, Google Analytics (GA4), Search Console ve Merchant Center için salt okunur ücretli medya analizi. Dört yeteneğe (kurulum, araç kuralları, genel bakış, hazır analizler) sahip Taşınabilir Ajan Eklentileri v1 paketi. OAuth, npx stdio üzerinden sabitlenmiş mcp-remote@0.1.49 sürümünü kullanır, bu nedenle Node.js 20.18.1+ ve npm gereklidir. Salt okunurdur: kampanyaları, bütçeleri veya reklamları asla değiştirmez. Bilgilendirme — HYPD'nin mcp.hypd.ai adresindeki barındırılan MCP sunucusuna yerel bir köprü olarak npx aracılığıyla sabitlenmiş mcp-remote@0.1.49'u çalıştırır (ilk çalıştırmada npm'den indirilir); araç bağımsız değişkenleri ve HYPD'nin döndürdüğü reklam, analitik, Search Console ve Merchant Center verileri HYPD sunucularından geçer; oturum açma, token'larının mcp-remote tarafından ~/.mcp-auth altında saklandığı bir tarayıcı OAuth akışıdır; salt okunurluk HYPD'nin sunucu tarafı garantisidir ve yeteneklerin takip ettiği analiz şablonları çalışma zamanında HYPD'nin sunucusundan alınır."
