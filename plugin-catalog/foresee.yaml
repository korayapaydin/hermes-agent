description: >-
  Let AI assistants shop for home and auto insurance: compare instant quotes across every carrier.
  Connects to the hosted Foresee MCP server (Streamable HTTP at agents.go-foresee.com), with three
  workflow skills bundled. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure —
  portable Agent Plugins v1 package (hosted MCP server plus three skills), no Python and nothing runs
  locally; the vendor is Foresee Insurance Services, LLC (go-foresee.com). Every quote request sends
  the profile the user gives in chat (ZIP, age or date of birth, vehicles, drivers, driving record,
  home details) to agents.go-foresee.com with no account or API key. The live_carrier_quotes tool
  additionally sends the user's identity (name, date of birth, street address, email, optionally phone
  and driver's licence number) and, after the user's in-chat consent recorded verbatim, Foresee's
  agents submit those details to the selected insurance carriers, who may run a soft credit-based
  insurance score pull and contact the user. Foresee does not take payment or bind policies.
description_tr: "YZ asistanların ev ve otomatik sigorta için alışveriş yapmasına izin verin: her sigortacıdan anında teklifleri karşılaştırın. Barındırılan Foresee MCP sunucusuna (agents.go-foresee.com adresinde Streamable HTTP) bağlanır, üç iş akışı yeteneği paketlenmiştir. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/). Açıklama — taşınabilir Agent Plugins v1 paketi (barındırılan MCP sunucusu ve üç yetenek), Python yok ve yerelde hiçbir şey çalışmaz; satıcı Foresee Insurance Services, LLC (go-foresee.com). Her teklif isteği, kullanıcının sohbette verdiği profili (posta kodu, yaş veya doğum tarihi, araçlar, sürücüler, sürüş geçmişi, konut bilgileri) hesap veya API anahtarı olmadan agents.go-foresee.com adresine gönderir. live_carrier_quotes aracı ayrıca kullanıcının kimliğini (ad, doğum tarihi, açık adres, e-posta, isteğe bağlı telefon ve ehliyet numarası) gönderir ve kullanıcının sohbet içinde birebir kaydedilen onayının ardından Foresee'nin ajanları bu bilgileri seçilen sigorta şirketlerine iletir; bunlar yumuşak, krediye dayalı bir sigorta puanı sorgusu yapabilir ve kullanıcıyla iletişime geçebilir. Foresee ödeme almaz veya poliçe bağlamaz."
