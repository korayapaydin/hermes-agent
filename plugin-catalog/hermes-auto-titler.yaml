image: https://raw.githubusercontent.com/Vocllum/hermes-auto-titler/42259f5cf346eba307e1cc8cac835203d986bcb6/docs/catalog-card.png
description: "Topic-aware session title tracking for Hermes Agent. Hermes generates the first title by default; AutoTitler follows conversation changes and session close without changing the host title-generation switch. Disclosure — sends excerpts of each conversation (sampled user turns, short assistant replies, compaction summaries) to your Hermes title-generation model in the background, also for up to 200 recent untitled sessions at startup; needs plugins.entries.hermes-auto-titler.llm.allow_task_override (or allow_provider/model_override for a custom route). 0.3 no longer edits config.yaml, but users upgrading from 0.2.x keep auxiliary.title_generation.enabled=false until they re-enable it (/autotitler status shows the fix)."
description_tr: "Hermes Agent için konuya duyarlı oturum başlığı takibi. Hermes ilk başlığı varsayılan olarak üretir; AutoTitler, ana makinenin başlık üretme anahtarını değiştirmeden konuşma değişikliklerini ve oturum kapanışını izler. Açıklama — her konuşmanın bölümlerini (örneklenmiş kullanıcı sıraları, kısa asistan yanıtları, sıkıştırma özetleri) arka planda Hermes başlık üretme modelinize gönderir; başlangıçta en fazla 200 son başlıksız oturum için de gönderir; plugins.entries.hermes-auto-titler.llm.allow_task_override (veya özel bir yol için allow_provider/model_override) gerekir. 0.3 artık config.yaml dosyasını düzenlemez, ancak 0.2.x sürümünden yükselten kullanıcılar, yeniden etkinleştirene kadar auxiliary.title_generation.enabled=false ayarını korur (/autotitler status düzeltmeyi gösterir)."
