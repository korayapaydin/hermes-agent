subdir: wsl-terminal
description: >-
  Run Hermes' terminal tools inside an existing WSL distro on Windows: one bash -c per
  command as the distro's default user, over the same files Windows sees at /mnt/<drive>, with
  no Docker Desktop, no image and no container to start or tear down. A host cwd is
  translated (C:\Users\me\proj becomes /mnt/c/Users/me/proj, \\wsl.localhost paths become the
  distro's own paths) and the mount root is asked once with wslpath, so a distro that moved
  its automount point still gets correct paths. cwd persists across commands, stdin and exit
  codes ride through wsl.exe, and hermes doctor / setup and the dashboard picker get real rows
  (wsl.exe path, WSL version, distros present, selected distro). HERMES_WSL_DISTRO and
  HERMES_WSL_USER select the distro and the user. Disclosure — this is a full-access backend,
  not a sandbox: when it is the selected backend, everything the terminal tool runs executes
  as your user inside your distro, with that distro's files, permissions and network access,
  so dangerous-command approval stays on and Hermes never stops the distro. The plugin itself
  reads no credentials, stores nothing and makes no network calls; it spawns wsl.exe per
  command and wslpath once per distro. It rewrites one core-produced string, the trailing cwd
  marker, because under WSL a command substitution is handed the directory wsl.exe started in
  rather than the shell's current one (measurements in the repo's VALIDATION.md); nothing in
  Hermes is patched or rebound at runtime.
description_tr: "Hermes'in terminal araçlarını Windows'ta mevcut bir WSL dağıtımı içinde çalıştırın: komut başına bir bash -c, dağıtımın varsayılan kullanıcısı olarak, Windows'ın /mnt/<drive> altında gördüğü aynı dosyalar üzerinde; Docker Desktop yok, imaj yok, başlatılıp sökülecek konteyner yok. Ana makine cwd'si çevrilir (C:\\Users\\me\\proj /mnt/c/Users/me/proj olur, \\\\wsl.localhost yolları dağıtımın kendi yollarına dönüşür) ve bağlama kökü bir kez wslpath ile sorulur; böylece automount noktasını taşıyan bir dağıtım da doğru yolları alır. cwd komutlar arasında kalıcıdır, stdin ve çıkış kodları wsl.exe üzerinden aktarılır, hermes doctor / setup ve gösterge paneli seçicisi gerçek satırlar alır (wsl.exe yolu, WSL sürümü, mevcut dağıtımlar, seçili dağıtım). HERMES_WSL_DISTRO ve HERMES_WSL_USER dağıtımı ve kullanıcıyı seçer. Açıklama — bu tam erişimli bir arka uçtur, sandbox değil: seçili arka uç olduğunda terminal aracının çalıştırdığı her şey, kullanıcınız olarak dağıtımınızın içinde, o dağıtımın dosyaları, izinleri ve ağ erişimiyle çalışır; bu nedenle tehlikeli komut onayı açık kalır ve Hermes dağıtımı asla durdurmaz. Eklentinin kendisi hiçbir kimlik bilgisi okumaz, hiçbir şey saklamaz ve hiçbir ağ çağrısı yapmaz; komut başına wsl.exe, dağıtım başına bir kez wslpath başlatır. Çekirdek tarafından üretilen tek bir dizeyi, sondaki cwd işaretçisini yeniden yazar; çünkü WSL altında bir komut ikamesine, kabuğun geçerli dizini yerine wsl.exe'nin başladığı dizin verilir (ölçümler depodaki VALIDATION.md içinde); Hermes'te hiçbir şey çalışma zamanında yamalanmaz veya yeniden bağlanmaz."
