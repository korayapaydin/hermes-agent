description: "Plan, build and run LinkedIn and email outreach in LinkedCamp through LinkedCamp's hosted MCP server (Streamable HTTP at https://mcp.linkedcamp.com/mcp, OAuth sign-in with the account's API key, no keys in config): campaigns, audience search URLs, multi-step sequences, leads, unified inbox and AI-drafted replies, sending-account health, analytics, reply agents, and agency sub-accounts. Bundles the linkedcamp-outreach workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — every tool call goes to LinkedCamp's hosted server (mcp.linkedcamp.com) and acts on the user's LinkedCamp account; the tool set is served by that server at runtime and is not covered by the pinned sha. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. Some tools reach real people (campaign_launch starts outreach, message_send delivers at once); the package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and blocks them in unattended runs."
description_tr: "LinkedCamp'in barındırılan MCP sunucusu (https://mcp.linkedcamp.com/mcp adresinde Streamable HTTP, hesabın API anahtarıyla OAuth oturum açma, yapılandırmada anahtar yok) aracılığıyla LinkedCamp'te LinkedIn ve e-posta erişimlerini planlayın, oluşturun ve çalıştırın: kampanyalar, hedef kitle arama URL'leri, çok adımlı diziler, potansiyel müşteriler, birleşik gelen kutusu ve yapay zeka tarafından taslak haline getirilmiş yanıtlar, gönderim hesabı sağlığı, analitik, yanıt ajanları ve ajans alt hesapları. linkedcamp-outreach iş akışı yeteneğini paketler. Ajan Eklentileri v1 paketi (plugin.json + mcp.json + skills/), yalnızca yapılandırma. Bilgilendirme — her araç çağrısı LinkedCamp'in barındırılan sunucusuna (mcp.linkedcamp.com) gider ve kullanıcının LinkedCamp hesabında işlem yapar; araç seti çalışma zamanında bu sunucu tarafından sunulur ve sabitlenmiş sha tarafından kapsanmaz. Oturum açma, npx aracılığıyla sabitlenmiş mcp-remote@0.1.49'u çalıştırır (Node.js 20.18.1+ ve npm gereklidir), bu da ilk kullanımda bir tarayıcı ve yerel bir geri çağırma portu açar ve OAuth token'larını ~/.mcp-auth altında saklar. Bazı araçlar gerçek insanlara ulaşır (campaign_launch erişimi başlatır, message_send anında iletir); paket sunucuyu güvenilmeyen olarak işaretler, bu nedenle Hermes, sunucunun salt okunur olarak işaretlemediği her araçtan önce izin ister ve bunları gözetimsiz çalıştırmalarda engeller."
