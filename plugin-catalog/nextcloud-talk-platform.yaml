name: nextcloud-talk-platform
repo: https://github.com/smilinTux/hermes-nextcloud-talk
sha: 03f27203fd983d4714891302c49f06b404c4b02f
description: "Nextcloud Talk platform adapter for Hermes Agent, in two modes behind one plugin: a webhook bot (Nextcloud Talk Bot API, HMAC-SHA256 signed, with an explicit body-size cap and a nonce-replay cache ahead of payload parsing) and a real Nextcloud user account (app password, long-polling the Chat REST API, with federation-invite support, per-room mention/watch/free modes, and an agent-to-agent loop guard plus active-listening context for multi-agent rooms). Mode is picked automatically by which credential is configured. No extra SDKs -- aiohttp for bot mode, httpx for user mode, both already Hermes dependencies. Disclosure — Connects to your Nextcloud server either as a Talk bot (HMAC-verified webhook listener, 127.0.0.1:18797 by default) or as a real Nextcloud user with an app password (long-polls the Chat API and auto-accepts federation invites only from NEXTCLOUD_TALK_ALLOWED_INVITERS); in user mode, unanswered room messages from allowed senders (up to 40 per room by default) and, for rooms listed in NEXTCLOUD_TALK_ROOM_MODES or with room_rules_all_rooms on, the room description are added to the agent's next turn in that room."
description_tr: "Hermes Ajanı için Nextcloud Talk platformu adaptörü, tek bir eklenti arkasında iki modda çalışır: bir webhook botu (Nextcloud Talk Bot API, HMAC-SHA256 imzalı, açık bir gövde boyutu sınırı ve yükleme ayrıştırmasından önce bir nonce-replay önbelleği ile) ve gerçek bir Nextcloud kullanıcı hesabı (uygulama şifresi, Chat REST API'sini long-polling ile izleme, federasyon daveti desteği, oda başına bahsetme/izleme/serbest modlar ve ajanlar arası döngü koruması ile çok ajanlı odalar için aktif dinleme bağlamı). Mod, hangi kimlik bilgisinin yapılandırıldığına göre otomatik olarak seçilir. Ek SDK'lar yoktur -- bot modu için aiohttp, kullanıcı modu için httpx kullanılır ve her ikisi de zaten Hermes bağımlılıklarıdır. Bilgilendirme — Nextcloud sunucunuza ya bir Talk botu (HMAC doğrulamalı webhook dinleyicisi, varsayılan olarak 127.0.0.1:18797) ya da uygulama şifresine sahip gerçek bir Nextcloud kullanıcısı olarak bağlanır (Chat API'sini long-poll ile izler ve yalnızca NEXTCLOUD_TALK_ALLOWED_INVITERS listesindeki federasyon davetlerini otomatik olarak kabul eder); kullanıcı modunda, izin verilen göndericilerden gelen yanıtlanmamış oda mesajları (varsayılan olarak oda başına 40 adede kadar) ve NEXTCLOUD_TALK_ROOM_MODES listesinde olan veya room_rules_all_rooms açık olan odalar için oda açıklaması, ajanın o odadaki bir sonraki turuna eklenir."
