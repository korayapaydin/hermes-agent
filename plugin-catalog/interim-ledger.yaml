name: interim-ledger
repo: https://github.com/olric3015/hermes-plugins
sha: ed94f43f5573b4b55f355bb97f37c225e36d6f19
subdir: interim-ledger
description: "Local ledger of the messages models write in the middle of a turn, before their final answer (the text that comes with a tool call, which on chat platforms can arrive as messages of their own): /interim-log shows how many each model wrote, in how many turns, how many per such turn, their median length and how long ago the last one was, per model, provider, surface or day, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /interim-log recent lists the newest messages (ten, or up to 100 with /interim-log recent 50). Counted even where display.interim_assistant_messages hides them. Disclosure — writes message metadata (model, provider, surface, step of the turn, length in characters, 12-digit hashes of the session and turn ids; never the message text) to plugin-data/interim-ledger/interim.jsonl, trimmed to 5,000 rows past 2 MB; observer only, cannot delay, change or hide a message; no network"
description_tr: "Modellerin bir tur içinde, nihai yanıtlarından önce yazdığı mesajların yerel defteri (bir araç çağrısıyla birlikte gelen metin; sohbet platformlarında kendi mesajları olarak gelebilir): /interim-log her modelin kaç mesaj yazdığını, kaç turda yazdığını, böyle bir tur başına kaç mesaj yazdığını, medyan uzunluğunu ve sonuncusunun ne kadar önce yazıldığını; model, sağlayıcı, yüzey ya da güne bazında; son 24 saat, istenen sayıda saat ya da gün, en son oturum veya kaydedilen her şey için gösterir; /interim-log recent en yeni mesajları listeler (on tane, ya da /interim-log recent 50 ile en fazla 100). display.interim_assistant_messages bunları gizlese bile sayılır. Açıklama — mesaj üst verilerini (model, sağlayıcı, yüzey, turun adımı, karakter cinsinden uzunluk, oturum ve tur kimliklerinin 12 haneli hash'leri; mesaj metni asla) plugin-data/interim-ledger/interim.jsonl dosyasına yazar, 2 MB'ı aşınca 5.000 satıra kırpılır; yalnızca gözlemcidir, bir mesajı geciktiremez, değiştiremez veya gizleyemez; ağ yok."
