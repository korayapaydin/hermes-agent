name: darkmoon
repo: https://github.com/ASCIT31/darkmoon-hermes-plugin
sha: '4a24b4eb77f01bf8ba56c11f37803d623fc14f14'
description: "Triage the findings file of a Darkmoon autonomous pentest scan (JSON or SARIF): filter by severity and proof status, get a severity-sorted summary and a pass/fail gate for a release. Read-only and offline: no network, no subprocess, no credentials, standard library only. Darkmoon is open source (GPL-3.0); its web dashboard and remediation agent are Pro and are not used here. Disclosure — reads a local .json or .sarif file at a model-supplied path (10 MB cap) and returns its findings; no network, subprocess or writes"
description_tr: "Darkmoon otonom sızma testi taramasının bulgu dosyasını (JSON ya da SARIF) inceleyin: önem derecesine ve kanıt durumuna göre süzün, önem derecesine göre sıralı bir özet ve bir sürüm için geçti/kaldı karar kapısı alın. Salt okunur ve çevrimdışı: ağ yok, alt süreç yok, kimlik bilgisi yok, yalnızca standart kitaplık. Darkmoon açık kaynaklıdır (GPL-3.0); web panosu ve düzeltme ajanı Pro'dadır ve burada kullanılmaz. Açıklama — modelin sağladığı yoldaki yerel bir .json ya da .sarif dosyasını okur (10 MB sınırı) ve bulgularını döndürür; ağ, alt süreç ya da yazma yok."
