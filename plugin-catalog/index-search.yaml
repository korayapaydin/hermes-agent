name: index-search
repo: https://github.com/TakeshiTGAL/hermes-plugin-index-search
sha: e3303f6e42636d6efa41c240fe79981e23b79c1e
description: "Search one index you run and watch one saved query, with index_search, index_health and index_watch. Disclosure — Sends MEILI_API_KEY as a Bearer token to your MEILI_HOST. Over plain http that key travels unencrypted, and a master or admin key is sent as given, so use a search-only key. The tools are on for every surface, including gateways: anyone you allow on your Hermes gateway can search with your key and approve a watch. Turn a surface off with hermes tools. index_watch schedule creates one cron job that runs a model turn every 15 minutes (two or more model requests when it calls the tool) with no daily cap, and it watches only the first 20 hits. The job stays after uninstall until you run hermes cron remove, with -p and the profile name when the profile is not default. Scheduling and unscheduling ask for Hermes approval every time and are refused under cron, yolo, approvals off, unattended sessions and plugins.isolation: host, where the watch only posts a notice that it cannot run, on every run. Answering \"always\" adds an unused line to config.yaml. The watch relies on private parts of Hermes, so an update can stop it."
description_tr: "Çalıştırdığınız bir dizini arayın ve kayıtlı bir sorguyu izleyin; index_search, index_health ve index_watch araçlarıyla. Açıklama — MEILI_API_KEY değerini Bearer token olarak MEILI_HOST adresinize gönderir. Düz http üzerinden bu anahtar şifrelenmeden yol alır ve bir master ya da admin anahtarı olduğu gibi gönderilir; bu yüzden yalnızca arama amaçlı bir anahtar kullanın. Araçlar ağ geçitleri dahil her yüzeyde açıktır: Hermes ağ geçidinizde izin verdiğiniz herkes sizin anahtarınızla arama yapabilir ve bir izleme onaylayabilir. Bir yüzeyi hermes tools ile kapatın. index_watch schedule, her 15 dakikada bir model turu çalıştıran (aracı çağırdığında iki veya daha fazla model isteği) ve günlük sınırı olmayan tek bir cron görevi oluşturur; yalnızca ilk 20 sonucu izler. Görev, siz hermes cron remove çalıştırana kadar kaldırma sonrasında da kalır; profil varsayılan değilse -p ve profil adıyla birlikte. Zamanlama ve zamanlamayı kaldırma her seferinde Hermes onayı ister ve cron, yolo, approvals off, katılımsız oturumlar ve plugins.isolation: host altında reddedilir; son durumda izleme her çalışmada yalnızca çalışamadığına dair bir bildirim yayınlar. \"always\" yanıtı config.yaml dosyasına kullanılmayan bir satır ekler. İzleme, Hermes'in özel bölümlerine dayanır; bu yüzden bir güncelleme onu durdurabilir."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-index-search#readme
version: "0.1.0"
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - index_search
  - index_health
  - index_watch
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - MEILI_HOST
  - MEILI_API_KEY
