version: "1.2.3"
description: "Hindsight long-term memory provider — knowledge graph, entity resolution and multi-strategy retrieval (recall/reflect/retain tools plus automatic per-turn capture). Maintained by Vectorize; cloud, local external and local embedded modes are available. `hermes memory setup` fetches its bank-template catalog from raw.githubusercontent.com (vectorize-io/hindsight main). Disclosure — in cloud mode (and local external) every turn's conversation, and every entry the agent adds or replaces in Hermes's built-in MEMORY/USER stores, is sent to api.hindsight.vectorize.io or the URL you configure, into every bank it writes to; local embedded mode starts a background Hindsight daemon (fetched with uvx, version-pinned, on first run when hindsight-api is not installed) and keeps its LLM settings in ~/.hindsight/profiles/<profile>.env; setup writes the keys you enter to the profile .env; repositories under folders you list in trusted_project_dirs may choose their bank with .hindsight/config.toml; `hermes memory setup` fetches its bank-template catalog from raw.githubusercontent.com (vectorize-io/hindsight main)."
description_tr: "Hindsight uzun süreli bellek sağlayıcısı — bilgi grafiği, varlık çözümleme ve çok stratejili geri çağırma (recall/reflect/retain araçları ve otomatik tur başına yakalama). Vectorize tarafından sürdürülür; bulut, yerel harici ve yerel gömülü kipler mevcuttur. `hermes memory setup`, banka şablonu kataloğunu raw.githubusercontent.com adresinden çeker (vectorize-io/hindsight main). Açıklama — bulut kipinde (ve yerel harici kipte) her turun konuşması ve ajanın Hermes'in yerleşik MEMORY/USER depolarına eklediği veya değiştirdiği her giriş, api.hindsight.vectorize.io adresine ya da yapılandırdığınız URL'ye, yazdığı her bankaya gönderilir; yerel gömülü kip, arka planda bir Hindsight daemon'u başlatır (hindsight-api kurulu değilken ilk çalıştırmada uvx ile çekilir ve sürümü sabitlenir) ve LLM ayarlarını ~/.hindsight/profiles/<profile>.env içinde tutar; kurulum, girdiğiniz anahtarları profil .env dosyasına yazar; trusted_project_dirs içinde listelediğiniz klasörler altındaki depolar, bankalarını .hindsight/config.toml ile seçebilir; `hermes memory setup`, banka şablonu kataloğunu raw.githubusercontent.com adresinden çeker (vectorize-io/hindsight main)."
