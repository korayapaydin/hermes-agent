title: Pidgeon
description: "Email for Hermes through Pidgeon: mail to your agent's own address starts a conversation, one per email thread, and the agent's answer goes back as a reply in that thread. The agent reads Pidgeon Firewall's clean text, mail flagged as prompt injection is held before it reaches the agent, mail whose From fails DMARC never reaches it, and the agent can only reply, never write to a new recipient. Standard library only. Disclosure — while the gateway runs it polls pidgeon.ai (or `PIDGEON_BASE_URL`) every five seconds with `PIDGEON_API_KEY` and sends the agent's answers as email replies through Pidgeon; mail from senders in `PIDGEON_ALLOWED_USERS` that passes DMARC becomes agent turns with the agent's full toolset (Firewall-flagged mail is held by default; setting `PIDGEON_ALLOW_UNAUTHENTICATED=true` also admits mail whose From is not authenticated, so anyone who knows an allowed address could instruct the agent), and a cursor/message-id state file is kept under `<HERMES_HOME>/pidgeon/`."
description_tr: "Pidgeon aracılığıyla Hermes için e-posta: ajanın kendi adresine gönderilen e-postalar, her e-posta iş parçacığı başına bir tane olacak şekilde bir konuşma başlatır ve ajanın yanıtı o iş parçacığında bir yanıt olarak geri döner. Ajan, Pidgeon Firewall'un temiz metnini okur, istem enjeksiyonu olarak işaretlenen e-postalar ajana ulaşmadan önce bekletilir, Gönderen kısmı DMARC'tan geçemeyen e-postalar ona asla ulaşmaz ve ajan yalnızca yanıt verebilir, asla yeni bir alıcıya yazamaz. Yalnızca standart kütüphane kullanılır. Bilgilendirme — ağ geçidi çalışırken, PIDGEON_API_KEY ile her beş saniyede bir pidgeon.ai (veya `PIDGEON_BASE_URL`) adresini sorgular ve ajanın yanıtlarını Pidgeon üzerinden e-posta yanıtları olarak gönderir; DMARC'tan geçen `PIDGEON_ALLOWED_USERS` listesindeki göndericilerden gelen e-postalar, ajanın tam araç setiyle ajan turları haline gelir (Firewall tarafından işaretlenen e-postalar varsayılan olarak bekletilir; `PIDGEON_ALLOW_UNAUTHENTICATED=true` ayarı, Gönderen kısmı doğrulanmamış e-postaların da kabul edilmesini sağlar, böylece izin verilen bir adresi bilen herkes ajana talimat verebilir) ve `<HERMES_HOME>/pidgeon/` altında bir imleç/mesaj-id durum dosyası tutulur."
