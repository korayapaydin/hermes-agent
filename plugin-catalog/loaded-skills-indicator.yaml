# Community catalog entry: loaded-skills-indicator
#
# Owner-submitted: the PR author (`yugasurfer`) owns and maintains the repo below.
# Exact-SHA pin (40-hex). No self-updating code: the desktop half ships as static
# files under `desktop/plugin.js` and never fetches, downloads, or replaces itself.
name: loaded-skills-indicator
repo: https://github.com/yugasurfer/loaded-skills-indicator
sha: "1c501473b192a45cbb36d08d1bc8c51f940ea416"   # tag v1.0.0
description: "Status-bar chip, popover and dockable pane showing which skills are read into the active Hermes Desktop conversation's context: full bodies bold with an accent dot, compression-pruned ones ghosted, never-loaded ones not listed. A second pane view lists the whole skill library grouped by category with descriptions and a loaded marker, and clicking a skill drops /<skill> into the composer for you to send (it never submits). A small local backend reads the profile's state.db read-only to tell a live skill body from a [SKILL_PRUNED] marker, and reads SKILL.md frontmatter for the descriptions. No network calls, no credentials, no telemetry, no writes. Disclosure — the local backend opens state.db read-only for the requested session in this profile, the default root and, as a fallback, every other profile's state.db, and returns only skill names and load state; it reads SKILL.md frontmatter under the Hermes skill directories and makes no network calls or writes."
description_tr: "Aktif Hermes Masaüstü konuşmasının bağlamına hangi yeteneklerin okunduğunu gösteren durum çubuğu çipi, açılır pencere ve kenetlenebilir panel: tam gövdeler kalın ve vurgu noktasıyla, sıkıştırma ile budanmış olanlar hayalet görünümde, hiç yüklenmemiş olanlar ise listelenmez. İkinci bir panel görünümü, tüm yetenek kütüphanesini açıklamalar ve yüklü işaretiyle kategoriye göre gruplandırılmış olarak listeler ve bir yeteneğe tıklandığında, göndermeniz için /<skill> komutunu düzenleyiciye ekler (asla otomatik olarak göndermez). Küçük bir yerel arka uç, canlı bir yetenek gövdesini bir [SKILL_PRUNED] işaretinden ayırt etmek için profilin state.db dosyasını salt okunur olarak okur ve açıklamalar için SKILL.md ön bilgilerini okur. Ağ çağrısı, kimlik bilgisi, telemetri veya yazma işlemi yoktur. Bilgilendirme — yerel arka uç, bu profildeki istenen oturum için state.db'yi salt okunur olarak açar, varsayılan kök dizini ve yedek olarak diğer tüm profillerin state.db'sini açar ve yalnızca yetenek adlarını ve yükleme durumunu döndürür; Hermes yetenek dizinleri altındaki SKILL.md ön bilgilerini okur, ağ çağrısı veya yazma işlemi yapmaz."
