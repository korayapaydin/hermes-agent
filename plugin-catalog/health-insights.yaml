sha: d6d09c1f17ada6ca60368a1e0c7a7b5bd4efefc6
description: "Deterministic, local-first analysis of your own Apple Health data - weekly trends, rule-based concern checks, nutrition versus Dietary Reference Intakes, an IOM energy target, lab results and opt-in modules (GLP-1 monitoring, medication adherence; all off by default). Portable Agent Plugins v1 package of ten skills that drive the separately installed health-insights command line tool (installed from the plugin's own pinned copy); the plugin itself contains no executable. Works on a self-hosted HealthRelay or Health Bridge receiver database. Disclosure - it handles sensitive health data, so use a local model or one you trust; personal integrations (medication counts, model wording) are off by default. Disclosure — the skills run a separately installed health-insights CLI that reads your HealthRelay or Health Bridge SQLite database read-only and keeps imported lab and ECG results under ~/.local/share/health-insights; the health values it prints are sent to whichever model provider your Hermes session uses."
description_tr: "Kendi Apple Health verinizin deterministik, yerel öncelikli analizi — haftalık eğilimler, kural tabanlı endişe denetimleri, beslenme ile Besin Referans Alımları karşılaştırması, bir IOM enerji hedefi, laboratuvar sonuçları ve isteğe bağlı modüller (GLP-1 izleme, ilaca uyum; varsayılan olarak hepsi kapalı). Ayrı olarak kurulan health-insights komut satırı aracını süren on yetenekten oluşan taşınabilir Agent Plugins v1 paketi (eklentinin kendi sabitlenmiş kopyasından kurulur); eklentinin kendisi çalıştırılabilir dosya içermez. Kendi sunucunuzdaki HealthRelay ya da Health Bridge alıcı veritabanı üzerinde çalışır. Açıklama — hassas sağlık verileriyle çalıştığı için yerel bir model ya da güvendiğiniz bir model kullanın; kişisel entegrasyonlar (ilaç sayımları, model ifadeleri) varsayılan olarak kapalıdır. Açıklama — yetenekler, ayrıca kurulmuş health-insights CLI'sini çalıştırır; bu CLI, HealthRelay veya Health Bridge SQLite veritabanınızı salt okunur olarak okur ve içe aktarılan laboratuvar ve ECG sonuçlarını ~/.local/share/health-insights altında tutar; yazdırdığı sağlık değerleri, Hermes oturumunuzun kullandığı model sağlayıcısına gönderilir."
