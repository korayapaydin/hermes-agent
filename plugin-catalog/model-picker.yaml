name: model-picker
repo: https://github.com/aean0x/hermes-model-picker
sha: 8ba20ad970f68d6adecc958da8992034e89f3481
description: "Per-turn cost classifier across three model tiers (Quick / Standard / Expert): rates each user turn from configurable best_for lists and rewrites the outgoing request's model through the llm_request middleware, biased to keep the previous tier unless the turn changes shape, with escalate_model for tool failures. Disclosure — the plugin rewrites the model field of every outgoing request for a classified session, picking between three configured model ids that must all belong to the session's own provider (a foreign-provider tier is refused and the session model stands); it makes one bounded auxiliary classifier call through the host's plugin LLM route on each classified turn (up to about 12,000 characters of recent conversation plus the prompt), reading its model ids from config.json next to the plugin, MODEL_PICKER_CONFIG, or MODEL_PICKER_* env, and falls back to the host's primary model; routing decisions, with the first 120 characters of each classified prompt, are logged to $HERMES_HOME/logs/model-picker.log; a classifier-driven tier change can ask the context engine to compact the transcript before the switch, and escalate_model replaces the next request's context with a model-written handoff summary plus the recent tail; that engine registers only when the host config sets context.engine: model-picker."
description_tr: "Üç model kademesi (Quick / Standard / Expert) arasında tur başına maliyet sınıflandırıcısı: her kullanıcı turunu yapılandırılabilir best_for listelerinden puanlar ve giden isteğin modelini llm_request ara katmanı üzerinden yeniden yazar; tur biçim değiştirmedikçe önceki kademeyi korumaya eğilimlidir, araç hataları için escalate_model vardır. Açıklama — eklenti, sınıflandırılmış bir oturum için giden her isteğin model alanını yeniden yazar ve hepsi oturumun kendi sağlayıcısına ait olması gereken üç yapılandırılmış model kimliği arasından seçer (yabancı sağlayıcıya ait bir kademe reddedilir ve oturum modeli geçerli kalır); her sınıflandırılmış turda ana makinenin eklenti LLM rotası üzerinden sınırlı sayıda tek bir yardımcı sınıflandırıcı çağrısı yapar (son konuşmanın yaklaşık 12.000 karakterine kadar artı istem), model kimliklerini eklentinin yanındaki config.json, MODEL_PICKER_CONFIG veya MODEL_PICKER_* ortam değişkenlerinden okur ve ana makinenin birincil modeline geri döner; yönlendirme kararları, her sınıflandırılmış istemin ilk 120 karakteriyle birlikte $HERMES_HOME/logs/model-picker.log dosyasına günlüğe kaydedilir; sınıflandırıcı kaynaklı bir kademe değişikliği, bağlam motorundan geçişten önce transkripti sıkıştırmasını isteyebilir ve escalate_model, sonraki isteğin bağlamını model tarafından yazılmış bir devir özeti artı son kuyrukla değiştirir; bu motor yalnızca ana makine yapılandırması context.engine: model-picker ayarladığında kaydedilir."
maintainer: aean0x
tier: community
category: models
docs_url: https://github.com/aean0x/hermes-model-picker#readme
