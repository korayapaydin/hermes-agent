subdir: workflow-record
description: "hermes record: demonstrate a browser workflow once (clicks, field values, navigations) and its bundled skill lets /learn turn the recording into a skill that replays it with the browser tools. A Hermes Labs plugin: built by Nous Research, not supported. Disclosure — attaches over CDP to a Chromium you point it at (--cdp, BROWSER_CDP_URL, browser.cdp_url or 127.0.0.1:9222) and records what you do in that tab until Ctrl-C; password, one-time-code and card fields are masked inside the page as {SECRET:name} and never written. Recordings stay local in <HERMES_HOME>/recordings; nothing is sent anywhere until you run /learn on one, which hands it to your active model."
description_tr: "hermes record: bir tarayıcı iş akışını bir kez gösterin (tıklamalar, alan değerleri, gezinmeler); paketlenmiş yeteneği, /learn komutunun kaydı tarayıcı araçlarıyla yeniden oynatan bir yeteneğe dönüştürmesini sağlar. Bir Hermes Labs eklentisi: Nous Research tarafından geliştirildi, desteklenmiyor. Açıklama — işaret ettiğiniz bir Chromium'a CDP üzerinden bağlanır (--cdp, BROWSER_CDP_URL, browser.cdp_url veya 127.0.0.1:9222) ve Ctrl-C'ye kadar o sekmede yaptıklarınızı kaydeder; parola, tek kullanımlık kod ve kart alanları sayfa içinde {SECRET:name} olarak maskelenir ve hiçbir zaman yazılmaz. Kayıtlar yerelde <HERMES_HOME>/recordings altında kalır; bir kayıt üzerinde /learn çalıştırana kadar hiçbir yere gönderilmez, o komut kaydı etkin modelinize verir."
