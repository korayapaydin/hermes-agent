name: hermes-soniox
repo: https://github.com/XimilalaXiang/hermes-soniox
sha: 99c747918d3049bca3c6744ba92b176b3f6bef6c
description: >-
  Native BYOK Soniox text-to-speech and asynchronous speech-to-text providers with configurable
  languages and voices, automatic STT language detection, and Hermes voice-bubble support.
  Disclosure — TTS sends reply text and synthesis settings to tts-rt.soniox.com; STT uploads audio,
  optional language hints, and optional prompt context to api.soniox.com, then best-effort deletes
  the remote transcription and uploaded file. SONIOX_API_KEY is resolved through Hermes' active-profile
  secret scope. No telemetry, shell commands, background processes, or stored credentials.
maintainer: XimilalaXiang
description_tr: "Yapılandırılabilir diller ve sesler, otomatik STT dil algılama ve Hermes ses balonu desteği ile yerel BYOK Soniox metinden konuşmaya (TTS) ve asenkron konuşmadan metne (STT) sağlayıcıları. Açıklama — TTS, yanıt metnini ve sentez ayarlarını tts-rt.soniox.com adresine gönderir; STT sesi, isteğe bağlı dil ipuçlarını ve isteğe bağlı istem bağlamını api.soniox.com adresine yükler, ardından uzak dökümü ve yüklenen dosyayı en iyi çabayla siler. SONIOX_API_KEY, Hermes'in aktif-profil gizli kapsamı üzerinden çözümlenir. Telemetri, kabuk komutları, arka plan süreçleri veya saklanan kimlik bilgileri yoktur."
tier: community
version: "0.2.0"
category: voice
requires_hermes: ">=0.22.4"
docs_url: https://github.com/XimilalaXiang/hermes-soniox#readme
platforms: []
known_issues:
  - Realtime WebSocket TTS/STT is not implemented; v0.2.0 uses file-based synthesis and asynchronous transcription.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - SONIOX_API_KEY
