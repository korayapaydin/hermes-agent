name: specstream
repo: https://github.com/specstream/specstream-tools
sha: d62eac8deb008f106d6df8036d2724e1a483e0d3
subdir: plugins/hermes
description: "SpecStream gives Hermes finished lists from the live web: describe the list in plain words and get every matching row with the page it was read from, priced per match with a maximum you approve before anything runs. Portable Agent Plugins v1 package with the hosted MCP server (remote streamable-http, OAuth 2.1 with dynamic client registration) and four skills (compile, review-work, approve-work, continue-work); no Python, no executables, no stored credentials. Disclosure — your request text and your answers to the price are sent to api.specstream.ai; approving a price spends your SpecStream balance (new accounts get $10 free) and the plugin marks its server `untrusted`, so Hermes asks before every call that is not read-only and refuses those calls in unattended runs; a `specstream` server you define in config.yaml replaces the package's and drops that prompt unless you add `trust: untrusted`."
description_tr: "SpecStream, Hermes'e canlı web'den hazır listeler verir: listeyi sade bir dille tanımlayın ve okunduğu sayfayla birlikte eşleşen her satırı alın; eşleşme başına fiyatlandırılır ve hiçbir şey çalışmadan önce onayladığınız bir üst sınırı vardır. Barındırılmış MCP sunucusu (uzak streamable-http, dinamik istemci kaydıyla OAuth 2.1) ve dört yetenek (compile, review-work, approve-work, continue-work) içeren taşınabilir Agent Plugins v1 paketi; Python yok, çalıştırılabilir dosya yok, saklanan kimlik bilgisi yok. Açıklama — istek metniniz ve fiyata ilişkin yanıtlarınız api.specstream.ai'ye gönderilir; bir fiyatı onaylamak SpecStream bakiyenizden harcama yapar (yeni hesaplara 10 $ ücretsiz verilir) ve eklenti sunucusunu `untrusted` olarak işaretler; bu nedenle Hermes salt okunur olmayan her çağrıdan önce sorar ve gözetimsiz çalışmalarda bu çağrıları reddeder; config.yaml içinde tanımladığınız bir `specstream` sunucusu paketinkini değiştirir ve `trust: untrusted` eklemediğiniz sürece bu istemi kaldırır."
