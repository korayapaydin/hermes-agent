name: office-3d
title: Office 3D
repo: https://github.com/oslook/hermes-desktop-plugin-office-3d
sha: "efe1b65e8aa8508dc5b799a389e5a12b69ef00af"
description: "A live isometric office for Hermes Desktop: every profile is a person at a desk — a profile doing real work sits typing with a lit terminal screen, an online-but-idle one relaxes in the lounge with tea, an offline one leaves an empty desk with a dark monitor. Click a desk to inspect that profile (state, sessions, tokens, cost) and open its chat or latest session; a cost/tokens leaderboard ranks the profiles; plus a global Total/Working/Idle/Offline overview, a status-bar chip, a palette command with keybind, a settings page, and an office_status agent tool that reports the same status to the model. Disclosure — the backend and the tool read each profile's gateway_state.json and open its state.db read-only, running aggregate queries only (COUNT/SUM/MAX over the sessions table: counts, token totals, cost, last-activity); they never read message content, system prompts or titles, make no network calls, and need no credentials. Opening a profile's latest session asks the app's own session.list RPC for that session's id (metadata only) and then opens it through the app's own openSession; no message content is read. POSIX only (platforms: [linux, macos]) because the process-liveness check uses os.kill(pid, 0), which on Windows would terminate the target process."
description_tr: "Hermes Masaüstü için canlı izometrik bir ofis: her profil masadaki bir kişidir — gerçek iş yapan bir profil, ışıklı bir terminal ekranıyla yazı yazarken oturur, çevrimiçi ancak boşta olan bir profil dinlenme alanında çay içer, çevrimdışı olan bir profil ise karanlık bir monitörle boş bir masa bırakır. Bir masaya tıklayarak o profili (durum, oturumlar, token'lar, maliyet) inceleyebilir ve sohbetini veya en son oturumunu açabilirsiniz; bir maliyet/token liderlik tablosu profilleri sıralar; ayrıca küresel bir Toplam/Çalışan/Boşta/Çevrimdışı genel bakışı, bir durum çubuğu çipi, kısayolu olan bir palet komutu, bir ayarlar sayfası ve aynı durumu modele bildiren bir office_status ajan aracı bulunur. Bilgilendirme — arka uç ve araç, her profilin gateway_state.json dosyasını okur ve state.db'yi salt okunur olarak açarak yalnızca toplama sorguları (oturumlar tablosu üzerinden COUNT/SUM/MAX: sayılar, token toplamları, maliyet, son etkinlik) çalıştırır; mesaj içeriğini, sistem istemlerini veya başlıkları asla okumazlar, ağ çağrısı yapmazlar ve kimlik bilgisi gerektirmezler. Bir profilin en son oturumunu açmak, uygulamanın kendi session.list RPC'sinden o oturumun kimliğini (yalnızca meta veri) ister ve ardından uygulamanın kendi openSession'ı üzerinden açar; mesaj içeriği okunmaz. Yalnızca POSIX (platformlar: [linux, macos]) desteklenir çünkü işlem canlılık kontrolü os.kill(pid, 0) kullanır ve bu Windows'ta hedef işlemi sonlandırırdı."
