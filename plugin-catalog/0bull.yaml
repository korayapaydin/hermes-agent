description: >-
  Control real iPhones rented from 0bull (screenshots, on-screen text, taps, typing,
  device commands, recorded macros, an on-phone agent) and publish videos to TikTok and
  YouTube Shorts from them, through the hosted 0bull Streamable HTTP MCP server plus three
  workflow skills. Portable Agent Plugins v1 package (mcp.json + skills/), no plugin code.
  Requires a 0bull account with a rented phone and browser OAuth consent (add the server
  with auth: oauth, then hermes mcp login 0bull); no API key or client secret is stored in
  the plugin. Posting sends the user's video and caption to TikTok or YouTube through the
  phone's own apps. Disclosure — hosted-only connector; screenshots, on-screen text,
  anything typed on the phone (including passwords or codes you hand the agent) and your
  videos and captions go to 0bull.net; posts publish publicly to TikTok or YouTube; the
  server also exposes rental tools that spend money, which the skills tell the model never
  to call but Hermes does not block.
description_tr: "0bull'dan kiralanan gerçek iPhone'ları denetleyin (ekran görüntüleri, ekrandaki metin, dokunuşlar, yazma, cihaz komutları, kayıtlı makrolar, telefondaki ajan) ve bunlardan TikTok ile YouTube Shorts videoları yayınlayın; bunu barındırılan 0bull Streamable HTTP MCP sunucusu ve üç iş akışı yeteneği üzerinden yapar. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), eklenti kodu yok. Kiralanmış telefonlu bir 0bull hesabı ve tarayıcı OAuth onayı gerekir (sunucuyu auth: oauth ile ekleyin, sonra hermes mcp login 0bull); eklentide API anahtarı veya istemci sırrı saklanmaz. Yayınlama, kullanıcının videosunu ve açıklamasını telefonun kendi uygulamaları üzerinden TikTok veya YouTube'a gönderir. Açıklama — yalnızca barındırılan bağlayıcı; ekran görüntüleri, ekrandaki metin, telefona yazılan her şey (ajana verdiğiniz parolalar veya kodlar dahil) ve videolarınız ile açıklamalarınız 0bull.net adresine gider; gönderiler TikTok veya YouTube'da herkese açık olarak yayımlanır; sunucu ayrıca para harcayan kiralama araçları sunar; yetenekler modele bunları asla çağırmamasını söyler ama Hermes engellemez."
