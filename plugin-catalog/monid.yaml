name: monid
repo: https://github.com/monid-ai/hermes-plugin
sha: cdf26de6da51a04c5ffccaa48bee0a2d51f7c35c
description: "Connect your agent to third-party tools and APIs (web search and scraping, people and company data, social media, media generation, email and phone) through one integration. The agent discovers, compares and runs tools at runtime, paid per call from one Monid balance. Disclosure — Monid (monid.ai, by Monid / monid-ai) is a paid third-party marketplace: the agent installs the @monid-ai/cli npm package or connects to mcp.monid.ai, sends your requests and any uploaded files to Monid and on to its providers, and each run spends your prepaid Monid workspace balance. The \"confirm the price first\" step is an instruction to the model in the bundled skill, not a Hermes approval prompt, unless you add `trust: untrusted` to `mcp_servers.monid`."
description_tr: "Ajanınızı üçüncü taraf araçlara ve API'lere (web araması ve kazıma, kişi ve şirket verileri, sosyal medya, medya üretimi, e-posta ve telefon) tek bir entegrasyon üzerinden bağlayın. Ajan, araçları çalışma zamanında keşfeder, karşılaştırır ve çalıştırır; çağrı başına tek bir Monid bakiyesinden ücret öder. Açıklama — Monid (monid.ai, Monid / monid-ai tarafından) ücretli bir üçüncü taraf pazar yeridir: ajan @monid-ai/cli npm paketini kurar veya mcp.monid.ai adresine bağlanır, isteklerinizi ve yüklediğiniz dosyaları Monid'e ve oradan sağlayıcılarına gönderir ve her çalıştırma ön ödemeli Monid çalışma alanı bakiyenizden harcar. \"Önce fiyatı onayla\" adımı, paketlenen yetenekte modele verilen bir talimattır, Hermes onay istemi değildir; ancak `mcp_servers.monid` altına `trust: untrusted` eklerseniz Hermes kendi onayını uygular."
