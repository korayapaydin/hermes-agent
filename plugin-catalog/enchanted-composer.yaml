title: Enchanted Composer
description: "Draft enhancement, reusable prompt libraries, undo/redo, and owner-bound full-duplex voice for Hermes Desktop. Disclosure — Derived from hermes-live-voice by Synero (itself derived from hermes-talk) and prompt-enhance by apoapostolov (both MIT; notices preserved). Starting voice captures microphone audio. The Codex-subscription lane spawns the official codex app-server CLI under its own login with a minimal environment; through it the captured profile's SOUL.md (up to 4,000 chars), the list of installed skills and enabled tools, and Hermes task results go to OpenAI. The API lane runs only when COMPOSER_REALTIME_OFFER_URL is set: it posts the SDP offer to that https URL with COMPOSER_OPENAI_API_KEY, or the profile's OPENAI_API_KEY, as a Bearer token (redirects refused). A user-configured wss:// bridge receives microphone audio, chat/profile identifiers and task results. Spoken requests the voice model delegates run as Hermes agent turns with tools in the chat where voice started; runs that need approval are stopped, not approved. Settings and usage totals are stored under HERMES_HOME/plugin-data/enchanted-composer/. No telemetry, no self-updater, no Codex OAuth-file reads."
description_tr: "Hermes Desktop için taslak geliştirme, yeniden kullanılabilir istem kitaplıkları, geri al/yinele ve sahibine bağlı tam çift yönlü ses. Açıklama — Synero'nun hermes-live-voice eklentisinden (kendisi de hermes-talk'tan türetilmiştir) ve apoapostolov'un prompt-enhance eklentisinden türetilmiştir (ikisi de MIT; bildirimler korunmuştur). Ses başlatma mikrofon sesini yakalar. Codex abonelik hattı, resmi codex app-server CLI'sini kendi oturum açması altında asgari bir ortamla başlatır; bunun üzerinden yakalanan profilin SOUL.md dosyası (4.000 karaktere kadar), kurulu yeteneklerin ve etkin araçların listesi ve Hermes görev sonuçları OpenAI'ye gider. API hattı yalnızca COMPOSER_REALTIME_OFFER_URL ayarlıyken çalışır: SDP teklifini COMPOSER_OPENAI_API_KEY veya profilin OPENAI_API_KEY değerini Bearer token olarak kullanarak o https URL'sine gönderir (yönlendirmeler reddedilir). Kullanıcı tarafından yapılandırılmış bir wss:// köprüsü mikrofon sesini, sohbet/profil tanımlayıcılarını ve görev sonuçlarını alır. Ses modelinin devrettiği sesli istekler, sesin başladığı sohbette araçlarla Hermes ajan turları olarak çalışır; onay gerektiren çalışmalar onaylanmaz, durdurulur. Ayarlar ve kullanım toplamları HERMES_HOME/plugin-data/enchanted-composer/ altında saklanır. Telemetri yok, kendi kendini güncelleyici yok, Codex OAuth dosyası okuması yok."
