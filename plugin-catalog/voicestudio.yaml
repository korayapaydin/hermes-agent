description: "Client for the local VoiceStudio text-to-speech app (debpalash/VoiceStudio): speak short text, design or clone voices, browse voices, render chaptered long-form audio, dub videos, and check server status. Six tools with mirrored slash commands plus a bundled skill. Disclosure — sends the text, script files, videos and voice samples you point it at to the VoiceStudio server you configure (default http://127.0.0.1:3900, plain HTTP) and saves the returned audio under HERMES_HOME/plugin-data/voicestudio; no credentials, no telemetry, no self-update."
description_tr: "Yerel VoiceStudio metinden sese uygulaması (debpalash/VoiceStudio) için istemci: kısa metin konuştur, ses tasarla ya da klonla, seslere göz at, bölümlü uzun içerik seslendir, videoları dublajla ve sunucu durumunu denetle. Aynı eğik çizgi komutlarıyla altı araç ve paketlenmiş bir yetenek. Açıklama — işaret ettiğiniz metni, betik dosyalarını, videoları ve ses örneklerini yapılandırdığınız VoiceStudio sunucusuna (varsayılan http://127.0.0.1:3900, düz HTTP) gönderir ve dönen sesi HERMES_HOME/plugin-data/voicestudio altına kaydeder; kimlik bilgisi yok, telemetri yok, kendini güncelleme yok."
