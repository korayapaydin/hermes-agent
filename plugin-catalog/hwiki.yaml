name: hwiki
repo: https://github.com/ottosulin/hwiki
sha: d1961956eaafbd64fef71cb7135d475efcc8f954
version: "1.0.0"
description: "Markdown wiki as Hermes long-term memory: plain files you and the agent edit together (Obsidian-compatible, git-versionable), local SQLite FTS5 search with optional qmd hybrid retrieval. Inspired by the Karpathy LLM wiki. Disclosure — reads every Markdown file under the wiki folder you set (wiki_path, outside HERMES_HOME; untrusted_dirs, default raw/, excluded) and injects up to ~1,400 characters of matching excerpts into each turn; the agent appends dated notes only under <wiki>/<memory_dir> (default wiki/memory), and additions to Hermes's built-in memory are mirrored there by default (mirror_builtin_memory), so they land in a folder you may commit or sync; keeps an index at HERMES_HOME/hwiki-index.sqlite and config in HERMES_HOME/hwiki.json, and adds the wiki folder to hermes backup. Cron and subagent runs get read-only recall. No network with the default fts5 backend; the optional qmd backend runs the separately installed qmd CLI (npm @tobilu/qmd, Node ≥22), whose vector modes download local models (~0.3–1.6 GB)."
description_tr: "Hermes uzun süreli belleği olarak Markdown wiki: sizin ve ajanın birlikte düzenlediği düz dosyalar (Obsidian uyumlu, git ile sürümlenebilir), isteğe bağlı qmd hibrit geri çağırmayla yerel SQLite FTS5 araması. Karpathy LLM wiki'sinden esinlendi. Açıklama — ayarladığınız wiki klasörü altındaki her Markdown dosyasını okur (wiki_path, HERMES_HOME dışında; untrusted_dirs, varsayılan raw/, hariç) ve her tura eşleşen alıntılardan ~1.400 karaktere kadar enjekte eder; ajan tarihli notları yalnızca <wiki>/<memory_dir> (varsayılan wiki/memory) altına ekler ve Hermes'in yerleşik belleğine yapılan eklemeler varsayılan olarak oraya yansıtılır (mirror_builtin_memory), böylece commit'leyebileceğiniz veya eşitleyebileceğiniz bir klasöre düşerler; HERMES_HOME/hwiki-index.sqlite konumunda bir dizin ve HERMES_HOME/hwiki.json içinde yapılandırma tutar ve wiki klasörünü hermes backup'a ekler. Cron ve alt ajan çalışmaları salt okunur geri çağırma alır. Varsayılan fts5 arka ucuyla ağ yoktur; isteğe bağlı qmd arka ucu, ayrıca kurulan qmd CLI'sını (npm @tobilu/qmd, Node ≥22) çalıştırır ve bunun vektör kipleri yerel modelleri indirir (~0,3–1,6 GB)."
maintainer: ottosulin
tier: community
