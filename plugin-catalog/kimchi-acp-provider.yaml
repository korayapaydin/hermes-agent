description: "The Kimchi coding harness (kimchi.dev) as a Hermes model provider over ACP stdio — spawns kimchi --mode acp keeping the harness's permission prompts on (YOLO opt-in via KIMCHI_ACP_ARGS=\"--mode acp --yolo\"), the harness owns its own auth, and completed tool calls surface as inline bullets in the reply. Disclosure — every turn spawns the local Kimchi CLI (`kimchi --mode acp`, overridable with KIMCHI_ACP_COMMAND / KIMCHI_ACP_ARGS) in Hermes's working directory and hands it the conversation. The harness calls kimchi.dev with its own stored login and runs its own shell, file and web tools. Its permission prompts stay on, and Hermes cancels them, so gated tools don't run, unless you opt in with KIMCHI_ACP_ARGS=\"--mode acp --yolo\", which runs them with no approval prompt (not for shared gateway or cron use). To show setup status, it parses ~/.config/kimchi/config.json (or KIMCHI_CONFIG_PATH) only to check that a key is present; the key is never stored or sent by Hermes."
description_tr: "Kimchi kodlama çalıştırma ortamı (kimchi.dev), ACP stdio üzerinden Hermes model sağlayıcısı olarak — kimchi --mode acp başlatır, çalıştırma ortamının izin istemleri açık kalır (KIMCHI_ACP_ARGS=\"--mode acp --yolo\" ile YOLO isteğe bağlı), çalıştırma ortamı kendi kimlik doğrulamasını yönetir ve tamamlanan araç çağrıları yanıtta satır içi madde olarak görünür. Açıklama — her tur, yerel Kimchi CLI'sini (`kimchi --mode acp`, KIMCHI_ACP_COMMAND / KIMCHI_ACP_ARGS ile geçersiz kılınabilir) Hermes'in çalışma dizininde başlatır ve konuşmayı ona verir. Çalıştırma ortamı, kendi sakladığı oturum açma bilgisiyle kimchi.dev'i çağırır ve kendi kabuk, dosya ve web araçlarını çalıştırır. İzin istemleri açık kalır ve Hermes bunları iptal eder, bu yüzden kapılı araçlar çalışmaz; ancak KIMCHI_ACP_ARGS=\"--mode acp --yolo\" ile isteğe bağlı olarak etkinleştirirseniz, onları onay istemi olmadan çalıştırır (paylaşılan ağ geçidi veya cron kullanımı için uygun değildir). Kurulum durumunu göstermek için ~/.config/kimchi/config.json (veya KIMCHI_CONFIG_PATH) dosyasını yalnızca bir anahtarın mevcut olup olmadığını kontrol etmek üzere ayrıştırır; anahtar Hermes tarafından asla saklanmaz veya gönderilmez."
