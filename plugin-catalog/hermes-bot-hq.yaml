description: "Desktop fleet page plus a per-bot Home (status, metrics, alerts, tasks, routines, buttons) published by the bot as JSON. Disclosure — reads each local profile's home files, can run a declared cron routine from the UI on that bot's profile and credentials, and opens chat, a path, or a URL the bot declared; send_prompt buttons send the shown prompt into the bot's Bot Chat. Bot-declared run_action buttons run a script from the bot's home/actions/ folder: a script runs only after the user approves that exact file (SHA-256), is re-approved if it changes, and is limited to 30s and to that folder, but it runs as your user with the Hermes backend's full environment, including provider keys loaded for the profile Hermes was launched with. Approvals are kept under the Hermes root in bot-hq/approvals/. The `hermes hermes-bot-hq setup` command (asks first unless --yes) links the plugin into every profile's plugins folder and enables it there. No database, signup, or telemetry."
description_tr: "Masaüstü filo sayfası ve bot başına bir Home (durum, metrikler, uyarılar, görevler, rutinler, düğmeler) — bot tarafından JSON olarak yayımlanır. Açıklama — her yerel profilin home dosyalarını okur, kullanıcı arayüzünden bildirilmiş bir cron rutinini o botun profili ve kimlik bilgileriyle çalıştırabilir ve sohbeti, bir yolu veya botun bildirdiği bir URL'yi açar; send_prompt düğmeleri gösterilen istemi botun Bot Chat'ine gönderir. Bot tarafından bildirilen run_action düğmeleri botun home/actions/ klasöründen bir betik çalıştırır: bir betik yalnızca kullanıcı o tam dosyayı onayladıktan sonra (SHA-256) çalışır, dosya değişirse yeniden onaylanır ve 30 saniye ile o klasörle sınırlıdır, ancak sizin kullanıcınız olarak Hermes arka ucunun tam ortamıyla, yani Hermes'in başlatıldığı profil için yüklenen sağlayıcı anahtarları dahil çalışır. Onaylar Hermes kökü altındaki bot-hq/approvals/ dizininde tutulur. `hermes hermes-bot-hq setup` komutu (--yes olmadan önce sorar) eklentiyi her profilin plugins klasörüne bağlar ve orada etkinleştirir. Veritabanı, kayıt veya telemetri yok."
