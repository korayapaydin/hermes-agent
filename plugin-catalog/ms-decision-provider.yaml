name: ms-decision-provider
repo: https://github.com/guglxni/ms-decision-provider
sha: a28887362a55f9b4b03362568760ce6d0ae903e5
description: "Microsoft-Decision-1 (Azure AI Foundry System One) decision provider for bounded agent decisions. Registers typed-decision tools (decision_noul, decision_choice, decision_score, decide) that preserve full probability distributions, plus an opt-in pre_tool_call hook that requests human approval for known-risk calls without sending their arguments to Azure. Reference implementation of the typed decision-provider runtime in #113008. Disclosure — the four decision tools send the caller-supplied state/questions text to the Azure Foundry endpoint you set in AZURE_FOUNDRY_BASE_URL (nothing is sent while it is unset); with MS_DECISION_GATE=1 the pre_tool_call gate sends only a coarse operation label for known-risk tool calls to that endpoint and routes them to Hermes's human approval prompt (MS_DECISION_GATE_MODE=block hard-denies instead); the labelled eval corpus under tests/ contains literal destructive commands as should-refuse examples."
description_tr: "Sınırlı ajan kararları için Microsoft-Decision-1 (Azure AI Foundry System One) karar sağlayıcısı. Tam olasılık dağılımlarını koruyan tip belirtilmiş karar araçlarını (decision_noul, decision_choice, decision_score, decide) ve ayrıca bilinen riskli çağrılar için insan onayı isteyen, argümanlarını Azure'a göndermeyen isteğe bağlı bir pre_tool_call hook'unu kaydeder. #113008'deki tip belirtilmiş karar sağlayıcı çalışma zamanının referans uygulaması. Açıklama — dört karar aracı, çağıranın sağladığı state/questions metnini AZURE_FOUNDRY_BASE_URL içinde ayarladığınız Azure Foundry uç noktasına gönderir (ayarlanmadığı sürece hiçbir şey gönderilmez); MS_DECISION_GATE=1 iken pre_tool_call kapısı, bilinen riskli araç çağrıları için o uç noktaya yalnızca kaba bir işlem etiketi gönderir ve bunları Hermes'in insan onayı istemine yönlendirir (MS_DECISION_GATE_MODE=block bunun yerine kesin olarak reddeder); tests/ altındaki etiketli değerlendirme külliyatı, reddedilmesi gereken örnekler olarak gerçek yıkıcı komutlar içerir."
maintainer: guglxni
tier: community
category: automation
requires_hermes: ">=0.21"
docs_url: https://github.com/guglxni/ms-decision-provider#readme
platforms: []
capabilities:
  provides_tools:
    - decision_noul
    - decision_choice
    - decision_score
    - decide
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - AZURE_FOUNDRY_API_KEY
    - AZURE_FOUNDRY_BASE_URL
version: 1.0.0
