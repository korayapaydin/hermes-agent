name: vector-platform
repo: https://github.com/BonesGit/hermes-vector-platform
sha: 94e1af49a2dcbce4952cb3d17b8591b8e3e10bed
description: "Vector (vectorapp.io) messaging platform plugin: Hermes becomes a first-class Nostr-based Vector bot (its own nsec/npub identity), relaying DMs through a local Rust sidecar that wraps vector-sdk. First run needs `hermes gateway setup`, which provisions the bot identity (create or import). Disclosure — `hermes gateway setup` downloads a prebuilt vector-bridge binary from github.com/BonesGit/hermes-vector-platform/releases (tag v<version>, sha256 checked against that release's SHA256SUMS; set vector.prebuilt.download: false to build from the bundled Rust source), merges `vector:` settings into ~/.hermes/config.yaml, writes VECTOR_* to ~/.hermes/.env, and publishes a public bot profile (kind-0, bot: true) to Nostr discovery relays."
description_tr: "Vector (vectorapp.io) mesajlaşma platformu eklentisi: Hermes, birinci sınıf bir Nostr tabanlı Vector botu olur (kendi nsec/npub kimliği), DM'leri vector-sdk'yı saran yerel bir Rust yardımcı süreci üzerinden aktarır. İlk çalıştırma `hermes gateway setup` gerektirir; bu, bot kimliğini oluşturur ya da içe aktarır. Açıklama — `hermes gateway setup` github.com/BonesGit/hermes-vector-platform/releases adresinden önceden derlenmiş bir vector-bridge ikili dosyasını indirir (etiket v<version>, sha256 bu sürümün SHA256SUMS dosyasına göre denetlenir; paketlenmiş Rust kaynağından derlemek için vector.prebuilt.download: false ayarlayın), `vector:` ayarlarını ~/.hermes/config.yaml içine birleştirir, VECTOR_* değişkenlerini ~/.hermes/.env dosyasına yazar ve herkese açık bir bot profili (kind-0, bot: true) Nostr keşif aktarıcılarına yayınlar."
maintainer: BonesGit
tier: community
category: platform
docs_url: https://github.com/BonesGit/hermes-vector-platform
image: https://raw.githubusercontent.com/BonesGit/hermes-vector-platform/refs/heads/master/vector-hermes-agent-plugin.png
