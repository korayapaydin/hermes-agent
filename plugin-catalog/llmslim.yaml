sha: 12a88324218c0c6f8d6bfbab94d9f7c5e3de21d1
subdir: plugins/hermes
description: "Context engine that compresses older tool output and turns locally with LLMSlim instead of asking a model for a summary: no LLM call, deterministic output, and the start of the prompt is sent unchanged, so prompt caching keeps working. Select it with context.engine: llmslim. Disclosure: installs llmslim==0.11.2 from PyPI (with numpy, scikit-learn and jsonschema); registers no tools, hooks or middleware; makes no network calls, runs no shell commands, needs no credentials, writes no files and sends no telemetry; reads its settings from config.yaml through Hermes's config loader. Token counts use a character estimate unless tiktoken is already installed in Hermes's environment, in which case tiktoken may download its encoding file once."
description_tr: "Eski araç çıktılarını ve turları yerel olarak LLMSlim ile sıkıştıran, özet için modele sormayan bağlam motoru: LLM çağrısı yok, deterministik çıktı ve istemin başı değişmeden gönderilir, böylece istem önbelleği çalışmayı sürdürür. context.engine: llmslim ile seçin. Açıklama: PyPI'dan llmslim==0.11.1 kurar (numpy, scikit-learn ve jsonschema ile); araç, hook veya middleware kaydetmez; ağ çağrısı yapmaz, shell komutu çalıştırmaz, kimlik bilgisi gerektirmez, dosya yazmaz ve telemetri göndermez; ayarlarını Hermes'in yapılandırma yükleyicisi üzerinden config.yaml'dan okur. Token sayımları, Hermes'in ortamında tiktoken zaten kurulu değilse karakter tahmini kullanır; kuruluysa tiktoken kodlama dosyasını bir kez indirebilir."
