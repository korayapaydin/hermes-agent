name: effortless-hermes
repo: https://github.com/ivcained/effortless-hermes
sha: 5444e7b130a74e1c03e826f224da65789abdffb5
description: "Picks the reasoning effort for every prompt: a fast judge (Jev/TypeSafe, a local OpenAI-compatible model, or any custom API) reads the next message once per turn and rewrites the request's reasoning effort before it ships — easy questions run cheap, hard jobs get high. Port of effortless for Claude Code. Disclosure — sends the next message (≤4000 chars) plus a short recent-conversation excerpt (≤1600 chars) to the configured judge endpoint (default api.typesafe.ai for Jev; a local or custom OpenAI-compatible API otherwise), solely to pick the effort; the optional model_map setting (off by default) also switches the turn's model to the one you map to the verdict; keeps recent per-turn token counts in its own plugin state; no telemetry; secrets resolved only through Hermes' secret scope; stdlib-only, no pip dependencies."
description_tr: "Her istem için akıl yürütme çabasını seçer: hızlı bir yargıç (Jev/TypeSafe, yerel bir OpenAI uyumlu model ya da herhangi bir özel API) her turda bir kez sonraki mesajı okur ve istek gönderilmeden önce akıl yürütme çabasını yeniden yazar — kolay sorular ucuz koşar, zor işler yüksek alır. Claude Code için effortless'un portu. Açıklama — sonraki mesajı (≈4000 karakter) ve kısa bir son görüşme alıntısını (≈1600 karakter) yalnızca çabayı seçmek amacıyla yapılandırılmış yargıç uç noktasına gönderir (Jev için varsayılan api.typesafe.ai; aksi halde yerel ya da özel bir OpenAI uyumlu API); isteğe bağlı model_map ayarı (varsayılan olarak kapalı) turun modelini de karar sonucuna eşlediğiniz modele geçirir; son turlara ait token sayılarını kendi eklenti durumunda tutar; telemetri yoktur; gizli bilgiler yalnızca Hermes'in gizli kapsamı üzerinden çözülür; yalnızca standart kitaplık kullanılır, pip bağımlılığı yoktur."
