name: tinyfish
repo: https://github.com/tinyfish-io/tinyfish-web-agent-integrations
sha: 770a3765fa6249b1f6a6153ddaaf65b76bf8fdd4
subdir: hermes
description: "TinyFish: the web, built into Hermes. Free Search and Fetch power Hermes's own web_search and web_extract, and when a site needs clicks, forms or a login, a remote browser and the tinyfish_agent web agent handle it. Disclosure — sends search queries, URLs to fetch and tinyfish_agent goals with your TINYFISH_API_KEY to the TinyFish API (*.tinyfish.ai). Browser sessions and tinyfish_agent runs spend TinyFish credits. Under the default `request` policy each one goes through Hermes's approval prompt first (a session/always answer covers every later call; cron and unattended runs are denied unless you allow them). Setting `tinyfish.credit_policy.<feature>: allow` or YOLO skips the prompt. `hermes tinyfish setup` / `browser enable` (run by you) save the key to Hermes .env, set web.search_backend/extract_backend and browser.cloud_provider in config.yaml, enable the web/browser toolsets, and can install the agent-browser CLI after asking."
description_tr: "TinyFish: Hermes'e gömülü web. Ücretsiz Arama ve Getirme, Hermes'in kendi web_search ve web_extract araçlarını besler; bir site tıklama, form ya da oturum açma gerektirdiğinde ise uzak bir tarayıcı ve tinyfish_agent web ajanı devreye girer. Açıklama — TINYFISH_API_KEY'inizle arama sorgularını, getirilecek URL'leri ve tinyfish_agent hedeflerini TinyFish API'sine (*.tinyfish.ai) gönderir. Tarayıcı oturumları ve tinyfish_agent koşuları TinyFish kredisi harcar. Varsayılan `request` ilkesi altında her biri önce Hermes'in onay isteminden geçer (bir session/always yanıtı sonraki her çağrıyı kapsar; cron ve gözetimsiz koşular siz izin vermedikçe reddedilir). `tinyfish.credit_policy.<feature>: allow` ya da YOLO ayarlamak istemi atlar. `hermes tinyfish setup` / `browser enable` (sizin çalıştırdığınız) anahtarı Hermes .env dosyasına kaydeder, config.yaml içinde web.search_backend/extract_backend ve browser.cloud_provider ayarlarını yapar, web/browser araç kümelerini etkinleştirir ve sorduktan sonra agent-browser CLI'sini kurabilir."
maintainer: tinyfish-io
title: TinyFish
version: "0.2.3"
image: https://raw.githubusercontent.com/tinyfish-io/tinyfish-web-agent-integrations/770a3765fa6249b1f6a6153ddaaf65b76bf8fdd4/hermes/assets/banner.png
tier: verified
category: web
