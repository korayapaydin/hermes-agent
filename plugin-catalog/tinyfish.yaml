docs_url: https://docs.tinyfish.ai
capabilities:
  provides_tools:
  - tinyfish_agent
  provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - on_session_finalize
  provides_middleware: []
  requires_env:
  - TINYFISH_API_KEY
