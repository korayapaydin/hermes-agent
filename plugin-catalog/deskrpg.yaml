name: deskrpg
repo: https://github.com/dandacompany/deskrpg-hermes-plugin
sha: 1e9914a614f17186b6749916031da69ed6b61aa0
description: "Hermes gateway integration for DeskRPG virtual offices, with profiles, kanban, cron, artifacts and NPC skill management. Install it through the DeskRPG setup wizard. Optional (off by default): when enabled by the operator, links the plugin into every profile so kanban workers and cron runs can save artifacts. Disclosure — NPC skill management runs hermes skills/curator commands as background subprocesses per profile and edits that profile's skills, config.yaml and memory files; creating new review-policy kanban cards needs a review-policy API that upstream Hermes does not ship (the README points at the author's hermes-agent fork for it), and that feature stays inert on upstream."
description_tr: "DeskRPG sanal ofisleri için Hermes ağ geçidi entegrasyonu; profiller, kanban, cron, çıktılar ve NPC yetenek yönetimiyle. DeskRPG kurulum sihirbazı üzerinden kurun. İsteğe bağlı (varsayılan olarak kapalı): operatör etkinleştirdiğinde eklentiyi her profile bağlar, böylece kanban işçileri ve cron koşuları çıktı kaydedebilir. Açıklama — NPC yetenek yönetimi, profil başına arka plan alt süreçleri olarak hermes skills/curator komutlarını çalıştırır ve o profilin yeteneklerini, config.yaml dosyasını ve bellek dosyalarını düzenler; yeni review-policy kanban kartları oluşturmak, upstream Hermes'in sunmadığı bir review-policy API'si gerektirir (README bunun için yazarın hermes-agent çatalına işaret eder) ve bu özellik upstream'de etkisiz kalır."
maintainer: dandacompany
tier: community
category: automation
requires_hermes: ">=0.21.1"
docs_url: https://github.com/dandacompany/deskrpg-hermes-plugin/tree/1e9914a614f17186b6749916031da69ed6b61aa0
version: "0.16.0"
readme: true
platforms: []
capabilities:
  provides_tools:
    - artifact_save
    - propose_kanban_card
  provides_hooks:
    - post_tool_call
    - post_llm_call
  provides_middleware: []
  requires_env: []
