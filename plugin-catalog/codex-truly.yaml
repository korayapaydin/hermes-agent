platforms: []
known_issues:
  - "Full 1M of input is not reachable on the Codex OAuth route: ~1.05M total context is shared with a 128K output reserve, leaving ~920K of input. The plugin defaults to 900,000 and clamps to 918,000 rather than promising more."
  - "An over-large window fails late - the request streams response.created and then returns context_length_exceeded - so it surfaces as a mid-turn crash rather than a configuration error. Lower target_context_window and re-apply if a turn dies that way."
capabilities:
  provides_tools:
    - codex_truly
  provides_hooks: []
  provides_middleware: []
  requires_env: []
