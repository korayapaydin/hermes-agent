sha: 1913d2a0a4b2dd3e4283af5c78241de4d3a2995e
description: "Gives ChatGPT/Codex-subscription models the context window the backend actually accepts instead of the one its catalog advertises. Measured live on 2026-10-14: gpt-6.1-sol advertises 500K, caps at 872K and accepts 919,956 input tokens, while the -900k opt-in variant had silently stopped working because Hermes only raises a legacy 272K advertisement. The plugin reads the live catalog, writes one scoped model_overrides.<provider>.<model_id>.context_window entry per model (a documented step of context resolution, so no core patch), and ships a probe that bisects the API for the true ceiling because the refusal is a late SSE event, not an HTTP error. It also selects core's Codex-backed image provider so image_generate runs on the subscription with no OPENAI_API_KEY. Disclosure - uses the profile's Codex sign-in through Hermes's credentialed_provider_request (requires_auth: [openai-codex]); the plugin never reads auth.json and never holds a token, and network calls go only to chatgpt.com. Its only writes are scoped model_overrides entries and image_gen.provider (only when unset), through Hermes's atomic config writers; revert removes exactly what it wrote. No telemetry, no background processes, no shell commands, no self-updater. probe spends subscription quota (refused requests are free, accepted ones bill) and is never run automatically. Disclosure — uses the profile's Codex sign-in only through Hermes's credentialed_provider_request (requires_auth: openai-codex) and calls chatgpt.com only; its CLI and the model-callable codex_truly tool write scoped model_overrides context_window entries and image_gen.provider (only when unset) to config.yaml with no approval prompt, and `probe` sends large padding requests that spend subscription quota."
description_tr: "ChatGPT/Codex aboneliği modellerine, kataloglarının duyurduğu değer yerine arkaucun gerçekten kabul ettiği bağlam penceresini verir. 2026-10-14 tarihinde canlı ölçüldü: gpt-6.1-sol 500K duyuruyor, 872K'de tavan yapıyor ve 919.956 giriş token'ı kabul ediyor; -900k isteğe bağlı varyantı ise Hermes yalnızca eski 272K duyurusunu yükselttiği için sessizce çalışmaz hâle gelmişti. Eklenti canlı kataloğu okur, her model için tek bir kapsamlı model_overrides.<provider>.<model_id>.context_window girdisi yazar (bağlam çözümlemesinin belgelenmiş bir adımı olduğu için çekirdek yaması gerekmez) ve gerçek tavanı bulmak için API'yi ikiye bölerek arayan bir prob sunar; çünkü ret bir HTTP hatası değil, geç gelen bir SSE olayıdır. Ayrıca çekirdeğin Codex destekli görsel sağlayıcısını seçer; böylece image_generate, OPENAI_API_KEY olmadan abonelik üzerinde çalışır. Açıklama — profil Codex oturum açmasını Hermes'in credentialed_provider_request'i (requires_auth: [openai-codex]) üzerinden kullanır; eklenti auth.json'u asla okumaz ve asla token tutmaz, ağ çağrıları yalnızca chatgpt.com'a gider. Tek yazdıkları, Hermes'in atomik yapılandırma yazıcıları aracılığıyla kapsamlı model_overrides girdileri ve image_gen.provider'dır (yalnızca ayarlanmamışsa); revert tam olarak yazdıklarını kaldırır. Telemetri, arka plan süreçleri, shell komutları ve kendi kendini güncelleyici yoktur. probe abonelik kotası harcar (reddedilen istekler ücretsizdir, kabul edilenler ücretlendirilir) ve asla otomatik çalıştırılmaz. Açıklama — profil Codex oturum açmasını yalnızca Hermes'in credentialed_provider_request'i (requires_auth: openai-codex) üzerinden kullanır ve yalnızca chatgpt.com'a çağrı yapar; CLI'si ve modelin çağırabildiği codex_truly aracı, onay istemi olmadan config.yaml'a kapsamlı model_overrides context_window girdileri ve image_gen.provider (yalnızca ayarlanmamışsa) yazar; `probe` ise abonelik kotası harcayan büyük dolgu istekleri gönderir."
maintainer: kyssta-exe
title: Codex Truly
