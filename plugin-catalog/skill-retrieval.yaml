name: skill-retrieval
repo: https://github.com/moonlight-lupin/agent-skills
sha: 79801c69e797f5f8efd619f8f451ca89d18c7240
subdir: plugins/skill-retrieval
description: >-
  BM25-based skill retrieval for large skill libraries. An llm_request middleware rewrites
  the outgoing request's <available_skills> block to names only (the same bytes every turn,
  so prompt caching is unaffected), and a pre_llm_call hook appends the top-K matching
  skill descriptions to the current user message. Uses public plugin surfaces only
  (register_middleware, register_hook); reads SKILL.md frontmatter from the profile's skill
  roots and imports a few agent.prompt_builder / agent.skill_utils helpers read-only.
  pyyaml is the only dependency. Disclosure — optional Jev rerank, off by default: with
  SKILL_RETRIEVAL_RERANK=jev and TYPESAFE_API_KEY set (read from the environment only), each
  turn POSTs the user message (injection patterns stripped, capped at 2000 chars) and up to
  12 shortlisted skill descriptions (400 chars each) to api.typesafe.ai (3 s timeout, no
  retries, BM25 order kept on error), and appends a local JSONL log (timestamp, session id,
  200-char query excerpt, both orders) under $HERMES_HOME/data/jev-trial/, rotated past 5 MB.
  With the rerank off it makes no network calls and writes no files.
description_tr: "Büyük yetenek kitaplıkları için BM25 tabanlı yetenek getirme. Bir llm_request ara katmanı, giden isteğin <available_skills> bloğunu yalnızca adlara yeniden yazar (her turda aynı baytlar, böylece istem önbelleklemesi etkilenmez) ve bir pre_llm_call kancası, en iyi-K eşleşen yetenek açıklamalarını mevcut kullanıcı mesajına ekler. Yalnızca genel eklenti yüzeylerini kullanır (register_middleware, register_hook); profilin yetenek köklerinden SKILL.md ön bilgisini okur ve birkaç agent.prompt_builder / agent.skill_utils yardımcısını salt okunur içe aktarır. Tek bağımlılık pyyaml'dır. Açıklama — isteğe bağlı Jev yeniden sıralama, varsayılan olarak kapalı: SKILL_RETRIEVAL_RERANK=jev ve TYPESAFE_API_KEY ayarlandığında (yalnızca ortamdan okunur), her tur kullanıcı mesajını (enjeksiyon desenleri ayıklanmış, en fazla 2000 karakter) ve en fazla 12 kısa listeye alınmış yetenek açıklamasını (her biri 400 karakter) api.typesafe.ai adresine POST eder (3 s zaman aşımı, yeniden deneme yok, hata durumunda BM25 sırası korunur) ve $HERMES_HOME/data/jev-trial/ altına yerel bir JSONL günlüğü ekler (zaman damgası, oturum kimliği, 200 karakterlik sorgu alıntısı, her iki sıra), 5 MB'ı aşınca döndürülür. Yeniden sıralama kapalıyken ağ çağrısı yapmaz ve dosya yazmaz."
