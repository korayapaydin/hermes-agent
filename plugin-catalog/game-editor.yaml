name: game-editor
repo: https://github.com/TakeshiTGAL/hermes-plugin-game-editor
sha: 3a2b23e8a60714b4346b3d8f7c9c2a12b29718a8
version: "1.2.3"
requires_hermes: ">=0.21.6"
description: "In the Godot 4 project open in your editor, it places assets into the scene, plays the game, and the next plan fixes each error from its file and line. Disclosure — Needs Godot 4.7 or later, the Godot AI 4.x add-on, and uv. The first start downloads godot-ai==4.3.0 from pypi.org and files.pythonhosted.org. There is no API key. The editor is reached only on 127.0.0.1. A server this plugin starts sends no telemetry. The add-on follows godot_ai/telemetry_enabled (on by default) and can send usage to godot-ai-telemetry-v2-pudmurzsnq-uw.a.run.app. plan_change sends only the session list. apply_plan asks once. A plan that deletes, overwrites, drops unsaved work, writes outside the project or runs code it wrote is not made when what is lost exceeds 1,700 characters, and otherwise runs only after confirm_risky_plan. Play and tests ask once and run the project's code. Tools are on by default on every surface, including the gateway, so anyone who can message Hermes there can ask and approve. This plugin keeps no user list of its own. Cron, hermes chat -q and unattended runs decline. Data stays in <HERMES_HOME>/plugin-data/agent-plugin-game-editor-<id> after removal. Stop with hermes plugins disable game-editor, or hermes tools for one surface. macOS only."
description_tr: "Editörünüzde açık olan Godot 4 projesinde, varlıkları sahneye yerleştirir, oyunu oynatır ve bir sonraki plan dosyasındaki ve satırdaki her hatayı düzeltir. Açıklama — Godot 4.7 veya daha sonrası, Godot AI 4.x eklentisi ve uv gerektirir. İlk başlatma pypi.org ve files.pythonhosted.org'dan godot-ai==4.3.0 sürümünü indirir. API anahtarı yoktur. Editöre yalnızca 127.0.0.1 üzerinden erişilir. Bu eklentinin başlattığı bir sunucu telemetri göndermez. Eklenti godot_ai/telemetry_enabled (varsayılan olarak açık) ayarını takip eder ve kullanımı godot-ai-telemetry-v2-pudmurzsnq-uw.a.run.app adresine gönderebilir. plan_change yalnızca oturum listesini gönderir. apply_plan bir kez sorar. Silme işlemi yapan, üzerine yazan, kaydedilmemiş işleri düşüren, proje dışına yazan veya yazdığı kodu çalıştıran bir plan, kaybolan miktar 1.700 karakteri aştığında oluşturulmaz, aksi takdirde yalnızca confirm_risky_plan onayından sonra çalışır. Oynatma ve testler bir kez sorar ve projenin kodunu çalıştırır. Araçlar, ağ geçidi dahil her yüzeyde varsayılan olarak açıktır, böylece orada Hermes'e mesaj gönderebilen herkes isteyebilir ve onaylayabilir. Bu eklenti kendi kullanıcı listesini tutmaz. Cron, hermes chat -q ve başında insan olmayan çalıştırmalar reddeder. Veriler, kaldırıldıktan sonra <HERMES_HOME>/plugin-data/agent-plugin-game-editor-<id> altında kalır. hermes plugins disable game-editor veya bir yüzey için hermes tools ile durdurun. Yalnızca macOS."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-game-editor
platforms: [macos]
capabilities:
  provides_tools:
    - mcp__game_editor__scene_look
    - mcp__game_editor__script_look
    - mcp__game_editor__file_look
    - mcp__game_editor__project_look
    - mcp__game_editor__change_guide
    - mcp__game_editor__plan_change
    - mcp__game_editor__apply_plan
    - mcp__game_editor__confirm_risky_plan
  provides_hooks: []
  provides_middleware: []
  requires_env: []
