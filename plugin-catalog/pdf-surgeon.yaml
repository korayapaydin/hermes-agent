name: pdf-surgeon
repo: https://github.com/Samuek9/pdf-surgeon
sha: 0d3baf4f45bd00c2730e3f23e2d8981e5c916165
description: >-
  Model-driven editor of PDF text whose result keeps the original typesetting, by rewriting the
  page content stream in place — the string operand inside the existing BT/ET block is replaced and
  the Tm origin of everything after it on the line is retargeted, so font, size, colour, baseline,
  char/word spacing, horizontal scale and kerning survive untouched because they are never
  rewritten. This is the alternative to redact-and-re-stamp, which defaults to Helvetica 8pt and
  makes you restate font, size and colour by hand; get any of that wrong and the page reads as
  forged. The phrase must match exactly (whitespace is ignored); a fuzzy match is refused rather
  than allowed to edit text the caller never named. Until an edit is accepted the output is
  written under a temporary name next to the destination and moved into place only after
  verification passes, so a failed check leaves nothing behind; the destination must end in .pdf,
  must not already exist, must not resolve to the input, and must have an existing parent
  directory, because the path arrives from the model. Verification enforces that the edited line
  reads exactly as the original with the phrase swapped and nothing else, that every other line
  on the page is unchanged, that block count, baseline, font, size and spacing hold, that the old
  phrase's occurrence count dropped by exactly one (allowing for copies inside the replacement),
  and that the page's font/size/colour set is unchanged; a pixel-diff band is reported for
  information and does not decide the outcome. Refuses, writing nothing, on scans, Type3/XObject
  text, pages with more than one content stream, and a replacement needing
  a glyph the embedded subset lacks — it never falls back to substituting a typeface. Widths are
  measured from the embedded font program, not the system font of the same name. action="inspect"
  lists each line with its baseline and BT/ET block count so a caller can tell whether a document
  is editable before choosing what to replace. Requires a digital-born PDF whose text is laid out
  as one block per word/run with an explicit Tm origin (Word, LibreOffice, Excel, Google Docs).
  Disclosure — this can alter documents such as certificates or invoices; use it only on documents
  you are entitled to change. The edit is not visible on the page and not recorded in the Info
  dictionary. It is detectable at file level: the PDF is re-saved by PyMuPDF as a single revision,
  so the file hash and the second trailer /ID change, any earlier incremental-save history is
  dropped and any digital signature no longer validates. Writes only a new .pdf that does not
  exist yet and never touches the input. No network, credentials or subprocesses. Depends on
  PyMuPDF (AGPL-3.0), which Hermes installs for this plugin. Output files inherit the 0600 mode
  of the temporary file they are moved from.
description_tr: "Özgün dizgiyi koruyan, model tarafından yönlendirilen PDF metin düzenleyicisi — sayfa içerik akışı yerinde yeniden yazılarak: mevcut BT/ET bloğu içindeki dize işleneni değiştirilir ve satırdaki sonraki her şeyin Tm başlangıcı yeniden hedeflenir, böylece yazı tipi, boyut, renk, taban çizgisi, karakter/kelime aralığı, yatay ölçek ve kerning hiç değişmeden kalır, çünkü hiçbiri yeniden yazılmaz. Bu, varsayılan olarak Helvetica 8pt olan ve yazı tipi, boyut ve rengi elle yeniden yazmanızı gerektiren redakte-et-ve-yeniden-damgalama yöntemine bir alternatiftir; bunlardan herhangi birini yanlış yaparsanız sayfa sahte görünür. İfade tam olarak eşleşmelidir (boşluklar yok sayılır); bulanık eşleşme reddedilir, çağıranın hiç adlandırmadığı metni düzenlemeye izin verilmez. Bir düzenleme kabul edilene kadar çıktı, hedefin yanında geçici bir adla yazılır ve yalnızca doğrulama geçtikten sonra yerine taşınır, böylece başarısız bir denetim geride hiçbir şey bırakmaz; hedef .pdf ile bitmelidir, zaten var olmamalıdır, girdiye çözümlenmemeli ve var olan bir üst dizine sahip olmalıdır, çünkü yol modelden gelir. Doğrulama, düzenlenen satırın ifade değiştirilmiş olarak özgün metinle birebir okunduğunu ve başka hiçbir şeyin değişmediğini, sayfadaki diğer her satırın değişmediğini, blok sayısının, taban çizgisinin, yazı tipi, boyut ve aralığın korunduğunu, eski ifadenin geçiş sayısının tam olarak bir azaldığını (değiştirilen metnin içindeki kopyalar hariç) ve sayfanın yazı tipi/boyut/renk kümesinin değişmediğini dayatır; bir piksel farkı bandı bilgi amacıyla raporlanır ve sonucu belirlemez. Taranmış belgelerde, Type3/XObject metninde, birden çok içerik akışı olan sayfalarda ve gömülü alt kümede bulunmayan bir glif gerektiren değişikliklerde hiçbir şey yazmadan reddeder — asla bir yazı tipini ikame etmeye geri dönmez. Genişlikler, aynı adlı sistem yazı tipinden değil, gömülü yazı tipi programından ölçülür. action=\"inspect\", bir çağıranın neyi değiştireceğini seçmeden önce bir belgenin düzenlenebilir olup olmadığını anlaması için her satırı taban çizgisi ve BT/ET blok sayısıyla listeler. Metni açık bir Tm başlangıcıyla kelime/metin öbeği başına tek blok halinde yerleştirilmiş, dijital olarak doğmuş bir PDF gerektirir (Word, LibreOffice, Excel, Google Docs). Açıklama — bu, sertifika veya fatura gibi belgeleri değiştirebilir; yalnızca değiştirme yetkiniz olan belgelerde kullanın. Düzenleme sayfada görünmez ve Info sözlüğüne kaydedilmez. Dosya düzeyinde algılanabilir: PDF, PyMuPDF tarafından tek bir revizyon olarak yeniden kaydedilir, bu nedenle dosya karması ve ikinci trailer /ID değişir, önceki artımlı kaydetme geçmişi düşer ve herhangi bir dijital imza artık doğrulanmaz. Yalnızca henüz var olmayan yeni bir .pdf yazar ve girdiye asla dokunmaz. Ağ, kimlik bilgisi veya alt süreç yok. Bu eklenti için Hermes'in kurduğu PyMuPDF'e (AGPL-3.0) dayanır. Çıktı dosyaları, taşındıkları geçici dosyanın 0600 modunu devralır."
