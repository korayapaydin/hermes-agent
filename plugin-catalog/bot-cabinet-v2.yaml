name: bot-cabinet-v2
title: Cabinet
repo: https://github.com/Dgardenhire/hermes-cabinet
sha: d6a816c350f800e908075de437a108c44ff982e3
description: "Tell Cabinet the job you need done and it answers with the smallest setup that does it (one chat, a skill, a routine, a Bot or a crew), shows which answers led there, then helps you act: add one of botcabinet.com's 20 Bots (each with its test record shown) as a Hermes profile, plan a new Bot line by line, or set up a crew of Bots in a handoff order with blocked Kanban cards. Everything Cabinet makes can be removed again from My Bots, and a Bot that Hermes's own Bots catalog carries is handed over to it, never duplicated. Disclosure — fetches its Bot catalog from https://botcabinet.com/catalog.json on open and Refresh (data only, 2 MB cap) and, after you confirm, creates Hermes profiles whose instructions (SOUL.md) come from that catalog; can create and archive Kanban cards for a crew; deletes only profiles it created that you have not changed; reads ~/.hermes/profiles and hashes profile files to track what it made; calls private Hermes modules (hermes_cli.profiles, kanban_db), so a Hermes update can break it; no shell, credentials, telemetry or self-updates."
description_tr: "Cabinet'e yapılması gereken işi söyleyin; o da bunu yapan en küçük kurulumla yanıt verir (tek bir sohbet, bir yetenek, bir rutin, bir Bot ya da bir ekip), hangi yanıtların buna yol açtığını gösterir, sonra eyleme geçmenize yardımcı olur: botcabinet.com'daki 20 Bot'tan birini (her biri için test kaydı gösterilerek) Hermes profili olarak ekleyin, yeni bir Bot'u satır satır planlayın ya da devralma sırasıyla ve engellenmiş Kanban kartlarıyla bir Bot ekibi kurun. Cabinet'in oluşturduğu her şey My Bots'tan yeniden kaldırılabilir ve Hermes'in kendi Bots kataloğunda bulunan bir Bot ona devredilir, asla çoğaltılmaz. Açıklama — Bot kataloğunu açılışta ve Yenile'de https://botcabinet.com/catalog.json adresinden getirir (yalnızca veri, 2 MB üst sınır) ve siz onayladıktan sonra, talimatları (SOUL.md) o katalogdan gelen Hermes profilleri oluşturur; bir ekip için Kanban kartları oluşturup arşivleyebilir; yalnızca kendi oluşturduğu ve sizin değiştirmediğiniz profilleri siler; ~/.hermes/profiles dizinini okur ve ne yaptığını izlemek için profil dosyalarının karmasını alır; özel Hermes modüllerini (hermes_cli.profiles, kanban_db) çağırır, bu yüzden bir Hermes güncellemesi onu bozabilir; kabuk, kimlik bilgisi, telemetri veya kendi kendine güncelleme yoktur."
