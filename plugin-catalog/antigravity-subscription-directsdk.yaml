name: antigravity-subscription-directsdk
repo: https://github.com/soyelmismo/hermes-antigravity-subscription
sha: 4cbb0563a670d318dfc81bb5e7813b86621e71b5
description: "Run Hermes on an Antigravity subscription via the official agy CLI (DirectSDK path). Streams tokens progressively, persists multi-turn trajectories via agy --conversation (up to 239k tokens), discovers models dynamically per account, maps thinking effort, reports quota in /usage, and aborts reported native tools. Disclosure — routes inference and /usage quota reads through Google's official agy CLI under your subscription (usage counts against it); links (symlink, else hardlink/copy) the antigravity-oauth-token into a per-session private temp HOME deleted on close; probes OS keyring presence (Linux Secret Service, macOS Keychain, Windows Credential Manager) without reading secrets; on macOS symlinks ~/Library/Keychains for CLI session reuse; never writes to vendor credential stores; strips credential-looking environment variables before spawning agy (name heuristic; ANTIGRAVITY_ENV_STRICT for an allow-list). Disclosure — the opt-in ANTIGRAVITY_DEBUG_PROMPT_DIR env var writes every outgoing prompt (full conversation text) to that directory."
description_tr: "Hermes'i resmî agy CLI'si (DirectSDK yolu) üzerinden bir Antigravity aboneliğiyle çalıştırın. Token'ları kademeli olarak akıtır, çok turlu yörüngeleri agy --conversation ile kalıcılaştırır (239 bin tokene kadar), her hesap için modelleri dinamik olarak keşfeder, akıl yürütme çabasını eşler, /usage'da kotayı bildirir ve bildirilen yerel araçları iptal eder. Açıklama — çıkarımı ve /usage kota okumalarını aboneliğiniz kapsamında Google'ın resmî agy CLI'si üzerinden yönlendirir (kullanım abonelikten düşer); antigravity-oauth-token dosyasını oturum başına özel bir geçici HOME'a bağlar (symlink, olmazsa sabit bağlantı/kopya) ve bu HOME kapanışta silinir; sırları okumadan işletim sistemi anahtarlık varlığını yoklar (Linux Secret Service, macOS Keychain, Windows Credential Manager); macOS'ta CLI oturumunun yeniden kullanımı için ~/Library/Keychains dizinine symlink oluşturur; satıcı kimlik bilgisi depolarına asla yazmaz; agy başlatılmadan önce kimlik bilgisi gibi görünen ortam değişkenlerini ayıklar (ad sezgiseli; izin listesi için ANTIGRAVITY_ENV_STRICT). Açıklama — isteğe bağlı ANTIGRAVITY_DEBUG_PROMPT_DIR ortam değişkeni, giden her istemi (tam konuşma metni) o dizine yazar."
