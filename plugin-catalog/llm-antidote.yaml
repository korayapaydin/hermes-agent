name: llm-antidote
repo: https://github.com/GroveMinting/llmAntidote
sha: c7f6a5428abbdba2b48f8b5fd3494b7ae2e3c5e8
description: "Runtime guardrails, behavioral evaluation, and signed fleet admission for Hermes Agent: a versioned capability policy that blocks or requires approval for model tool calls, paired synthetic behavioral evaluation with no real side effects, and a signed local promotion gate that refuses a model whose evidence does not satisfy signed fleet policy. Hooks-only (no agent tools). Disclosure — Adds approval prompts to tool calls by default (balanced mode): every MCP, connector or other-plugin tool, memory and skill writes, file reads outside the working and temp directories, and network-capable terminal/code commands go to Hermes's approval prompt; strict mode blocks them instead, and opt-in enforced fleet mode blocks all tool calls until the served model name matches the admitted one. The user-run `hermes antidote eval run` command sends synthetic prompts (and the API key you name) to the OpenAI-compatible endpoint you pass, as billed model calls (default suite up to ~170 requests); `model inspect hf:` queries huggingface.co; `fleet keygen` writes unencrypted Ed25519 private keys (mode 0600) to paths you choose."
description_tr: "Hermes Agent için çalışma zamanı koruma korkulukları, davranışsal değerlendirme ve imzalı filo kabulü: modelin araç çağrılarını engelleyen ya da onay gerektiren sürümlenmiş bir yetenek politikası, gerçek yan etkisi olmayan eşleştirilmiş sentetik davranışsal değerlendirme ve kanıtı imzalı filo politikasını karşılamayan bir modeli reddeden imzalı yerel terfi kapısı. Yalnızca kancalar (ajan aracı yok). Açıklama — Varsayılan olarak (dengeli kip) araç çağrılarına onay istemleri ekler: her MCP, bağlayıcı veya diğer eklenti aracı, bellek ve yetenek yazmaları, çalışma ve geçici dizinlerin dışındaki dosya okumaları ve ağ erişimli terminal/kod komutları Hermes'in onay istemine gider; katı kip ise bunları engeller ve isteğe bağlı zorunlu filo kipi, sunulan model adı kabul edilenle eşleşene kadar tüm araç çağrılarını engeller. Kullanıcı tarafından çalıştırılan `hermes antidote eval run` komutu, sentetik istemleri (ve adını verdiğiniz API anahtarını) belirttiğiniz OpenAI uyumlu uç noktaya faturalandırılan model çağrıları olarak gönderir (varsayılan paket yaklaşık 170 isteğe kadar); `model inspect hf:` huggingface.co adresini sorgular; `fleet keygen`, şifrelenmemiş Ed25519 özel anahtarlarını (0600 kipinde) seçtiğiniz yollara yazar."
maintainer: GroveMinting
tier: community
