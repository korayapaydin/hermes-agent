name: invinoveritas-receipts
repo: https://github.com/babyblueviper1/hermes-invinoveritas
sha: 6a4f9c7b49beac69899f18f3bcf1d0b340297624
description: "Signed, independently checkable receipts for Hermes approval verdicts and, since 0.2.0, for turns that stop on iteration exhaustion. Observe-only: a post_approval_response hook requests an invinoveritas decision receipt for each Guardian LLM verdict (or every approve/deny with scope=all); post_llm_call + on_session_end record, when a turn ends with max_iterations_reached, whether the turn's todo ledger (the last todo result or the list re-injected after compaction) was complete (turn_scope: exhausted by default, all, or off). Each receipt is a signed set of salted commitments that anyone can check for free at /verify-proof and that the holder can later open with the salt kept locally. Never approves, denies, delays, continues or blocks anything. Disclosure — one HTTPS POST per recorded approval decision or recorded turn to api.babyblueviper.com/decision-receipt (or the configured api_url) under INVINOVERITAS_API_KEY, paid automatically at 100 sats per receipt from your invinoveritas balance with no per-call confirmation (defaults: Guardian LLM verdicts, and only turns that stop on max_iterations_reached; scope: all adds every human approve/deny, turn_scope: all pays on every turn); sends a fixed question, the options, the choice, a nonce-salted SHA-256 of the context and the tool_call_id/turn_id, never the command text, todo contents or reply text; stores receipts, salts and the full contexts (including the command as Hermes passed it, and the todo ledger) in plugin-data/invinoveritas-receipts/receipts.jsonl."
description_tr: "Hermes onay hükümleri ve 0.2.0'dan bu yana yineleme tükenmesiyle duran turlar için imzalı, bağımsız olarak doğrulanabilir makbuzlar. Yalnızca gözlem: bir post_approval_response kancası, her Guardian LLM hükmü (ya da scope=all ile her onay/red için) bir invinoveritas karar makbuzu ister; post_llm_call + on_session_end, bir tur max_iterations_reached ile bittiğinde, turun görev defterinin (son görev sonucu ya da sıkıştırmadan sonra yeniden enjekte edilen liste) tamamlanıp tamamlanmadığını kaydeder (turn_scope: varsayılan exhausted, all ya da off). Her makbuz, tuzlanmış taahhütlerden oluşan imzalı bir kümedir; herkes /verify-proof adresinde ücretsiz olarak doğrulayabilir ve makbuz sahibi tuzu yerelde tutarak sonra açabilir. Hiçbir şeyi onaylamaz, reddetmez, geciktirmez, sürdürmez ya da engellemez. Açıklama — kaydedilen her onay kararı ya da kaydedilen her tur için api.babyblueviper.com/decision-receipt adresine (ya da yapılandırılmış api_url) INVINOVERITAS_API_KEY ile bir HTTPS POST gönderir, makbuz başına 100 sats invinoveritas bakiyenizden çağrı başına onay istenmeden otomatik olarak ödenir (varsayılanlar: Guardian LLM hükümleri ve yalnızca max_iterations_reached ile duran turlar; scope: all her insan onay/reddini ekler, turn_scope: all her turda öder); sabit bir soruyu, seçenekleri, seçimi, bağlamın nonce ile tuzlanmış SHA-256'sını ve tool_call_id/turn_id değerini gönderir, komut metnini, görev içeriğini ya da yanıt metnini asla göndermez; makbuzları, tuzları ve tam bağlamları (Hermes'in geçirdiği haliyle komut ve görev defteri dahil) plugin-data/invinoveritas-receipts/receipts.jsonl dosyasında saklar."
