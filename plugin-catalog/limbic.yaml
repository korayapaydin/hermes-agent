name: limbic
repo: https://github.com/dyiapanis/limbic
sha: e7a3cd30424ea853746c863bb1691beca4cd9b39
description: "Local long-term memory for Hermes agents. Everything stays on your machine: an SQLite store plus bundled embedding and NLI models, no telemetry, no LLMs.\nLimbic is designed on the physiological brain, opaque and organic. Memories strengthen or atrophy with use, corrections replace what they superseded — all deterministic background mechanisms, zero LLM calls.\nAlgorithmic forgetting keeps atrophied memories out of the database. Recall is calibrated: when nothing in memory is confident enough, it abstains instead of guessing, so the agent answers honestly rather than surfacing near-misses. First start downloads ~1 GB of pinned models once, then runs fully offline. PolyForm Noncommercial 1.0.0 (commercial use requires a separate license). Disclosure — the agent-facing tools are remember, recall and forget (forget lists candidate facts for a query, then deletes the one fact id the user picks, scoped to the current user, and appends a hash-only receipt of the content's sha256, length, user id and fact id to limbic.db.deletions.jsonl beside the database); on first primary session start downloads ~1.0GB of ONNX models (Arctic Embed 2.0 L int8 embedding, ~570MB; MiniLMv2 NLI, ~430MB, on first contradiction check) from huggingface.co at pinned commits with hash checks into ~/.cache/limbic/ (outside HERMES_HOME; %USERPROFILE%\\.cache\\limbic on Windows); at every model load, every file in those cache folders that is not in the pinned manifest is deleted — including unrelated files if you point embedding/nli cache_dir at a shared folder; spaCy NER models are optional: `hermes limbic languages --set <lang>` and `hermes limbic setup` run `python -m spacy download <model>`, which pip-installs each model package (~14.5MB, version picked by spaCy, not hash-pinned) from spaCy's GitHub releases into Hermes's own Python environment, and `hermes limbic setup` also pre-downloads both ONNX models; memory stays local in limbic.db under HERMES_HOME, facts whose trust decays to zero are deleted automatically, and hermes backup adds VACUUM snapshots under HERMES_HOME/backups; no telemetry."
description_tr: "Kendini düzenleyen bellek sağlayıcısı (MemoryProvider ABC): yerel SQLite (WAL) ve sqlite-vec KNN + FTS5 karma geri çağırma, uyarlanabilir güven puanlama, etkinleştirme olgunlaşması, girişime dayalı unutma, NLI tabanlı düzeltme algılama ve sinaptik atrofi. LLM maliyeti yok — tüm yaşam döngüsü mekanizmaları deterministiktir. İsteğe bağlı satır içi sohbet geri çağırma göstergesi varsayılan olarak kapalıdır (limbic.yaml içinde recall_indicator) ve bellek enjeksiyonu her iki durumda da aynı çalışır. Geri çağırma güvenle sınırlıdır: hiçbir şey kalibrasyon tabanını geçmediğinde, yakın eşleşmeleri yüzeye çıkarmak yerine geri çağırma çekinir (no_confident_match) ve ajan, belleğe hiçbir şey atfetmeden bildikleriyle yanıt verir. Araçlar (remember/recall) ve yaşam döngüsü kancaları, kayıtlı sağlayıcıdan MemoryManager üzerinden gönderilir — bu girdi yalnızca bir MemoryProvider kaydeder, bu yüzden provides_tools/provides_hooks boştur. Açıklama — ilk birincil oturum başlangıcında huggingface.co adresinden sabitlenmiş commit'lerde karma doğrulamalarla ~1.0GB ONNX modeli indirir (Arctic Embed 2.0 L int8 gömme, ~570MB; MiniLMv2 NLI, ~430MB, ilk çelişki denetiminde) ve bunları ~/.cache/limbic/ dizinine koyar (HERMES_HOME dışında); her model yüklemesinde, bu önbellek klasörlerindeki sabitlenmiş bildirimde olmayan her dosya silinir — embedding/nli cache_dir değerini paylaşılan bir klasöre yönlendirirseniz ilgisiz dosyalar dahil — bu da önceki sürümlerden kalan eskimiş artıkları geri kazanır (ör. ~2.2GB'lık daha eski bir fp32 önbelleği); bellek veritabanına asla dokunulmaz; spaCy NER modelleri indirilmez ve varlık çıkarımı için elle kurulmalıdır; bellek HERMES_HOME altındaki limbic.db içinde yerel kalır ve hermes backup, HERMES_HOME/backups altına VACUUM anlık görüntüleri ekler; telemetri yoktur. 0.6.0 ve sonrasında oluşturulan veya yeniden dizinlenen depolar, vektörlerini üreten gömücüyü kaydeder ve bir gömücü değişikliğinden sonra `hermes limbic reindex` çalıştırılana kadar stale_embedder=true bildirir; 0.5.x depoları, yeniden dizinlenene kadar fp32 vektörlerini işaretsiz sunmaya devam eder. PolyForm Noncommercial 1.0.0 (ticari kullanım ayrı bir lisans gerektirir)."
