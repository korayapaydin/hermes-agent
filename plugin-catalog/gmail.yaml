title: Gmail
description: "Hermes Desktop Gmail mailbox UI for search, reading, and thread inspection, with preview-confirmed send, reply, archive, trash, and label changes. Uses the active profile's existing Google Workspace OAuth setup; email is sensitive external content. Gmail actions and data access require user review and configuration. Disclosure — reads the active profile's Hermes Google Workspace token (google_token.json, refreshed in memory only) and calls the Gmail API; opening an unread message marks it read, other send/trash/label changes go through a confirm step (one setting can skip every review dialog, and then the prepare ticket, account/profile binding, exact snapshot validation and readback verification still run); remote email images load only after the user allows them. Attachment metadata listing and bounded read-only attachment download (25 MB cap) are profile/account-scoped."
description_tr: "Hermes Desktop'ta Gmail posta kutusu arayüzü: arama, okuma ve konuşma incelemesi; önizlemeyle onaylanan gönderme, yanıtlama, arşivleme, çöp ve etiket değişiklikleri. Etkin profilin mevcut Google Workspace OAuth kurulumunu kullanır; e-posta hassas dış içeriktir. Gmail eylemleri ve veri erişimi kullanıcı incelemesi ve yapılandırması gerektirir. Açıklama — etkin profilin Hermes Google Workspace tokenını (google_token.json, yalnızca bellekte yenilenir) okur ve Gmail API'sini çağırır; okunmamış bir iletiyi açmak onu okundu olarak işaretler, diğer gönderme/çöp/etiket değişiklikleri bir onay adımından geçer (tek bir ayar her inceleme iletişim kutusunu atlayabilir; o zaman bile hazırlık bileti, hesap/profil bağlama, tam anlık görüntü doğrulaması ve geri okuma doğrulaması yine çalışır); uzak e-posta görselleri yalnızca kullanıcı izin verdikten sonra yüklenir. Ek meta verisi listeleme ve sınırlı salt okunur ek indirme (25 MB üst sınır) profil/hesap kapsamlıdır."
