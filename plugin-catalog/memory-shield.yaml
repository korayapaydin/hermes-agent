name: memory-shield
title: Memory Shield
repo: https://github.com/churnast/hermes-memory-shield
sha: 347ab18408da52937f7e808a6e88a52b74184225
description: >-
  Keeps your agent from rewriting or wiping what it remembers about you: by default the agent may add facts
  to the owner profile (USER.md) wherever it may write and may correct one only when the owner asks in a
  direct chat, the CLI or a trusted chat, and nobody may delete one; the agent's notes (MEMORY.md) cannot
  be deleted; group chats are read-only except for the people and owner-only chats you trust, and once
  trusted_users is set a direct chat with anyone not listed is read-only too; Hermes' unattended
  background review may not touch the owner profile. Block, ask through Hermes' approval prompt or just
  log, and undo edits and deletions from snapshots.
  Disclosure — no network calls, credentials, shell commands or background processes. One pre_tool_call hook
  reads the turn's platform, chat type, chat id and name, sender id and name and the cron flag
  (gateway.session_context) and whether the run is Hermes' unattended review
  (tools.skill_provenance.is_unattended_review), checks memory tool calls, and checks write_file, patch,
  terminal and execute_code calls only for a write into, or a removal of, USER.md, MEMORY.md or the memory
  folder (reading a memory file or copying it elsewhere passes in calls up to 16 KB; a longer call that names
  them is refused); mode approve asks through Hermes' approval gate in the owner's direct chats and the CLI
  and blocks in shared chats, cron and direct chats with people not in trusted_users. Writes
  plugin-data/memory-shield/audit.jsonl (the last 500 refused or flagged writes: time, chat, sender and a
  160-character excerpt) and snapshots/ (full copies of USER.md and MEMORY.md taken right before an allowed
  edit or deletion, 20 per file by default). Reads the memory files and holds the memory store's lock files
  while it reads or writes them (not on Windows); /memory-shield restore overwrites one memory file.
  /memory-shield log and restore answer only in direct chats, the CLI and trusted_chats, and once
  trusted_users is set only the people listed there (a session without a user id, such as the CLI, counts as
  the owner); /memory-shield, snapshots and whoami answer in any chat with settings, counts, times, sizes and
  the caller's own id, name and chat key.
description_tr: "Ajanınızın sizin hakkınızdaki hatırladıklarını yeniden yazmasını ya da silmesini engeller: varsayılan olarak ajan, yazabileceği her yerde sahip profiline (USER.md) olgu ekleyebilir ve bir olguyu yalnızca sahibi doğrudan sohbette, CLI'da ya da güvendiğiniz bir sohbette istediğinde düzeltebilir; kimse bir olguyu silemez; ajanın notları (MEMORY.md) silinemez; grup sohbetleri, güvendiğiniz kişilerin ve sahibin özel sohbetleri dışında salt okunurdur ve trusted_users ayarlandıktan sonra listede olmayan biriyle doğrudan sohbet de salt okunur olur; Hermes'in gözetimsiz arka plan incelemesi sahip profiline dokunamaz. Engelleyin, Hermes'in onay istemiyle sorun ya da yalnızca günlüğe yazın ve düzenlemeleri ve silmeleri anlık görüntülerden geri alın. Açıklama — ağ çağrısı, kimlik bilgisi, kabuk komutu veya arka plan süreci yoktur. Tek bir pre_tool_call kancası turun platformunu, sohbet türünü, sohbet kimliğini ve adını, gönderici kimliğini ve adını ve cron bayrağını (gateway.session_context) ve koşunun Hermes'in gözetimsiz incelemesi olup olmadığını (tools.skill_provenance.is_unattended_review) okur, bellek aracı çağrılarını denetler ve write_file, patch, terminal ve execute_code çağrılarını yalnızca USER.md, MEMORY.md veya bellek klasörüne bir yazma ya da bunların kaldırılması için denetler (bir bellek dosyasını okumak veya başka bir yere kopyalamak 16 KB'a kadar olan çağrılarda geçer; bunları adlandıran daha uzun bir çağrı reddedilir); approve kipi sahibin doğrudan sohbetlerinde ve CLI'da Hermes'in onay kapısı üzerinden sorar ve paylaşılan sohbetlerde, cron'da ve trusted_users içinde olmayan kişilerle doğrudan sohbetlerde engeller. plugin-data/memory-shield/audit.jsonl (son 500 reddedilen veya işaretlenen yazma: zaman, sohbet, gönderici ve 160 karakterlik bir alıntı) ve snapshots/ (izin verilen bir düzenleme veya silmeden hemen önce alınan USER.md ve MEMORY.md tam kopyaları, varsayılan olarak dosya başına 20) yazar. Bellek dosyalarını okur ve okurken veya yazarken bellek deposunun kilit dosyalarını tutar (Windows'ta değil); /memory-shield restore bir bellek dosyasının üzerine yazar. /memory-shield log ve restore yalnızca doğrudan sohbetlerde, CLI'da ve trusted_chats'te yanıt verir ve trusted_users ayarlandıktan sonra yalnızca orada listelenen kişiler yanıt alır (CLI gibi kullanıcı kimliği olmayan bir oturum sahip sayılır); /memory-shield, snapshots ve whoami herhangi bir sohbette ayarlar, sayımlar, zamanlar, boyutlar ve çağıranın kendi kimliği, adı ve sohbet anahtarıyla yanıt verir."
