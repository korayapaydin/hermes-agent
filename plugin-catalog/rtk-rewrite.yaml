name: rtk-rewrite
repo: https://github.com/kerrz2020/hermes-rtk-rewrite
sha: 4c5f8a5abdfd7980cba5ef02df86b8efe52c00d6
description: >-
  Community (non-official) plugin that rewrites Hermes terminal commands through
  RTK (rtk-ai/rtk, Apache-2.0) before execution, so the model sees compact output
  instead of raw command spam — cutting tokens on common dev commands. Adds a
  fail-open pre_tool_call hook (2s timeout, unexpected exits leave the command
  untouched), an optional desktop pane, and update scripts. Disclosure — every
  terminal tool command is passed to the rtk binary found on PATH (rtk-ai/rtk,
  installed separately) and replaced with rtk's rewrite before approval and
  execution; fail-open when rtk is missing or errors. Community mirror of
  upstream's hooks/hermes/rtk-rewrite, not affiliated with rtk-ai.
  scripts/update.sh downloads the pinned RTK release binary (v0.49.0,
  checksum-verified).
description_tr: "Hermes terminal komutlarını, çalıştırılmadan önce RTK (rtk-ai/rtk, Apache-2.0) üzerinden yeniden yazan topluluk (resmî olmayan) eklentisi, böylece model ham komut spam'i yerine sıkıştırılmış çıktı görür — yaygın geliştirici komutlarında token tasarrufu sağlar. Hata durumunda açık kalan bir pre_tool_call kancası (2 sn zaman aşımı, beklenmeyen çıkışlar komutu olduğu gibi bırakır), isteğe bağlı bir masaüstü paneli ve güncelleme betikleri ekler. Açıklama — her terminal aracı komutu, PATH'te bulunan rtk ikilisine (rtk-ai/rtk, ayrıca kurulur) aktarılır ve onay ile çalıştırmadan önce rtk'nin yeniden yazımıyla değiştirilir; rtk yoksa ya da hata verirse hata durumunda açık kalır. Üst kaynaktaki hooks/hermes/rtk-rewrite dizininin topluluk aynasıdır; rtk-ai ile bağlantılı değildir. scripts/update.sh, sabitlenmiş RTK sürüm ikilisini (v0.49.0, sağlama toplamı doğrulanmış) indirir."
maintainer: kerrz2020
