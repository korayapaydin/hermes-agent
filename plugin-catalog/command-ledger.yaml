subdir: command-ledger
description: "Local ledger of the slash commands you run in Hermes (built-in commands in the CLI, built-in and plugin commands on messaging platforms): /command-log shows how often each command was used, its share, in how many sessions and when last, per command, platform, surface or day, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /command-log recent lists the newest commands (ten, or up to 100 with /command-log recent 50) with the alias typed. Disclosure — writes command metadata (command name, alias typed, surface, platform, a 12-digit hash of the session key; no arguments, session key or user id) to plugin-data/command-ledger/commands.jsonl, trimmed to 5,000 rows past 2 MB; observer only, cannot block or change a command; no network"
description_tr: "Hermes'te çalıştırdığınız eğik çizgi komutlarının yerel defteri (CLI'daki yerleşik komutlar, mesajlaşma platformlarındaki yerleşik ve eklenti komutları): /command-log her komutun ne sıklıkta kullanıldığını, payını, kaç oturumda geçtiğini ve en son ne zaman kullanıldığını komut, platform, yüzey ya da gün göre, son 24 saat, istenen sayıda saat ya da gün, en son oturum ya da kayıtlı her şey için gösterir; /command-log recent en yeni komutları, yazılan takma adla listeler (on tane ya da /command-log recent 50 ile en fazla 100). Açıklama — komut üst verisini (komut adı, yazılan takma ad, yüzey, platform, oturum anahtarının 12 haneli karması; argüman, oturum anahtarı veya kullanıcı kimliği yok) plugin-data/command-ledger/commands.jsonl dosyasına yazar ve 2 MB sonrasında 5.000 satıra kırpar; yalnızca gözlemcidir, bir komutu engelleyemez veya değiştiremez; ağ erişimi yoktur."
maintainer: olric3015
