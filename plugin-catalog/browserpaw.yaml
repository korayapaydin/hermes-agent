name: browserpaw
repo: https://github.com/GoldenLoaf24h/browserpaw
sha: 66a7349532a5ab6251b2090d2a4ab347aa07ad45
subdir: "plugins/browserpaw"
description: >-
  Drive your own Chrome from Hermes through a BrowserPaw MCP server you configure: 16 browserpaw_* tools for navigation, indexed DOM reading, click/fill, batch actions, screenshots and tabs. Disclosure — a thin wrapper over a BrowserPaw MCP server you add yourself (mcp_servers.browserpaw, plus plugins.entries.browserpaw.mcp_allowlist: [browserpaw]); it drives your real Chrome profile (logged-in sessions, cookies) through the separately installed BrowserPaw extension and native host on 127.0.0.1:12306, whose credential lives in ~/.chrome-mcp/bridge-token; the agent can click, fill, submit and read pages without a Hermes approval prompt unless you set trust: untrusted on that server (the README sample enables the full 50-tool profile, including in-page JavaScript, HttpOnly cookie reads and raw CDP, as native Hermes MCP tools); the optional Jev remote mode sends structured page state to TypeSafe AI or a base URL you set, and its local model download contacts hf-mirror.com/aifasthub.com/huggingface.co (probing baidu.com/bilibili.com first).
description_tr: "Hermes'ten kendi Chrome'unuzu, yapılandırdığınız bir BrowserPaw MCP sunucusu üzerinden sürün: gezinme, dizinlenmiş DOM okuma, tıklama/doldurma, toplu eylemler, ekran görüntüleri ve sekmeler için 16 browserpaw_* aracı. Açıklama — kendi eklediğiniz bir BrowserPaw MCP sunucusunun (mcp_servers.browserpaw ve plugins.entries.browserpaw.mcp_allowlist: [browserpaw]) üzerinde ince bir sarmalayıcıdır; gerçek Chrome profilinizi (oturum açılmış oturumlar, çerezler) ayrıca kurulmuş BrowserPaw uzantısı ve 127.0.0.1:12306 üzerindeki yerel ana bilgisayar aracılığıyla sürer; kimlik bilgisi ~/.chrome-mcp/bridge-token içinde tutulur; ajan, o sunucuda trust: untrusted ayarlamadığınız sürece Hermes onay istemi olmadan tıklayabilir, doldurabilir, gönderebilir ve sayfaları okuyabilir (README örneği, sayfa içi JavaScript, HttpOnly çerez okumaları ve ham CDP dahil 50 araçlık tam profili yerel Hermes MCP araçları olarak etkinleştirir); isteğe bağlı Jev uzak kipi yapılandırılmış sayfa durumunu TypeSafe AI'ya veya ayarladığınız bir temel URL'ye gönderir ve yerel model indirmesi hf-mirror.com/aifasthub.com/huggingface.co adreslerine bağlanır (önce baidu.com/bilibili.com sorgulanır)."
maintainer: GoldenLoaf24h
tier: community
category: web
requires_hermes: ">=0.21.5"
docs_url: "https://github.com/GoldenLoaf24h/browserpaw#readme"
version: "4.0.0"
capabilities:
  provides_tools:
    - browserpaw_act_toward_goal
    - browserpaw_navigate
    - browserpaw_read_dom
    - browserpaw_interact_index
    - browserpaw_fill_index
    - browserpaw_batch_actions
    - browserpaw_screenshot
    - browserpaw_smart_scroll
    - browserpaw_scroll_until_found
    - browserpaw_inspect_media
    - browserpaw_grep
    - browserpaw_get_markdown
    - browserpaw_switch_tab
    - browserpaw_close_tabs
    - browserpaw_get_windows_and_tabs
    - browserpaw_tool_docs
  provides_hooks: []
  provides_middleware: []
  requires_env: []
