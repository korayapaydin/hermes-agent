description: "Local-first OpenWhispr dictation history and shared notes for Hermes agents: find what the user said, search notes, transcribe local audio. Free local desktop bridge by default, paid cloud opt-in only. Skill-carrier plugin, no tools or hooks registered. Disclosure — skill only: the agent runs the external OpenWhispr CLI (installed with an unpinned `npm install -g @openwhispr/cli`) through the terminal tool to read your dictation history and notes over the OpenWhispr desktop app's authenticated loopback bridge, and, with your consent each time, to create, update or delete notes, transcriptions and dictionary entries and to transcribe local audio files; OpenWhispr Cloud (api.openwhispr.com, including an email-code sign-in that mints an API key kept in the CLI's own config) is used only when you opt in; the agent never opens credential files itself."
description_tr: "Hermes ajanları için yerel öncelikli OpenWhispr dikte geçmişi ve paylaşılan notlar: kullanıcının ne dediğini bulun, notlarda arayın, yerel sesi yazıya dökün. Varsayılan olarak ücretsiz yerel masaüstü köprüsü, ücretli bulut yalnızca isteğe bağlı. Yetenek taşıyıcı eklenti, kayıtlı araç ya da kanca yok. Açıklama — yalnızca yetenek: ajan, dikte geçmişinizi ve notlarınızı OpenWhispr masaüstü uygulamasının kimlik doğrulamalı döngüsel köprüsü üzerinden okumak için harici OpenWhispr CLI'sını (sabitlenmemiş `npm install -g @openwhispr/cli` ile kurulur) terminal aracı üzerinden çalıştırır ve her seferinde onayınızla notları, dökümleri ve sözlük girdilerini oluşturur, günceller veya siler ve yerel ses dosyalarını yazıya döker; OpenWhispr Cloud (api.openwhispr.com, CLI'nin kendi yapılandırmasında tutulan bir API anahtarı üreten e-posta kodlu oturum açma dahil) yalnızca isteğe bağlı olarak katıldığınızda kullanılır; ajan kimlik bilgisi dosyalarını asla kendisi açmaz."
