name: klipper-print-watch
repo: https://github.com/TakeshiTGAL/hermes-plugin-klipper-print-watch
sha: 20aa6f0083d0a81bea36f47490ea9be7ac4a72ff
description: "Built on the Moonraker HTTP API. Cron reports klippy_shutdown, complete, error, paused (after printing), cancelled, stalled. Disclosure — Talks to the one Moonraker URL you set. Over plain http on a LAN, MOONRAKER_API_KEY is sent unencrypted. Pause, resume and cancel ask for Hermes approval every time and are refused under cron, yolo, approvals off and unattended sessions. The plugin has no user list of its own: anyone you allow on your Hermes gateway can request a move and approve it. Answering \"always\" adds an unused line to config.yaml. The optional watch is a cron job (a model turn every 5 minutes by default) that stays after uninstall until you run unschedule. vision_check, off by default, sends webcam stills to your model. The plugin host cannot watch. Not tested on real hardware."
description_tr: "Moonraker HTTP API'si üzerine kuruldu. Cron; klippy_shutdown, complete, error, paused (yazdırmadan sonra), cancelled ve takılma durumunda stalled durumlarını raporlar. Açıklama — ayarladığınız tek Moonraker URL'iyle konuşur. Bir LAN'da düz http üzerinden MOONRAKER_API_KEY şifrelenmemiş olarak gönderilir. Duraklat, devam et ve iptal her seferinde Hermes onayı ister ve cron, yolo, onaylar kapalı ve katılımsız oturumlarda reddedilir. Eklentinin kendi kullanıcı listesi yoktur: Hermes ağ geçidinizde izin verdiğiniz herkes bir hareket isteyebilir ve onaylayabilir. \"always\" yanıtı config.yaml'e kullanılmayan bir satır ekler. İsteğe bağlı izleme bir cron işidir (varsayılan olarak her 5 dakikada bir model turu) ve siz unschedule çalıştırana kadar kaldırmadan sonra da kalır. Varsayılan olarak kapalı olan vision_check, web kamerası karelerini modelinize gönderir. Eklenti ana bilgisayarı izleyemez. Gerçek donanımda test edilmedi."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.4"
