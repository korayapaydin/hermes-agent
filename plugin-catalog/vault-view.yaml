version: "0.5.0"
title: Vault View
description: "Local Markdown vault workspace for Hermes Desktop: visual editing, progressive reading, cached image previews, optional per-conversation workspaces, pinned tabs, explicit selection quoting, tag search, links, backlinks and a graph. Compatible with Obsidian vaults. File transport requires a Linux/macOS gateway; Windows Desktop requires a WSL-hosted Unix backend, not a native Windows gateway; ffmpeg thumbnails are optional. Remote images and agent guidance are independent opt-ins and disabled by default; automatic note-content sharing is disabled; direct Obsidian opening is temporarily hidden. Disclosure — reads and writes notes in the vault folder you choose through Desktop shell commands on the gateway host; remote Markdown images and agent navigation guidance stay off until you opt in."
description_tr: "Hermes Desktop için yerel Markdown kasası çalışma alanı: görsel düzenleme, kademeli okuma, önbelleklenmiş görsel önizlemeleri, isteğe bağlı sohbet başına çalışma alanları, sabit sekmeler, açık seçim alıntısı, etiket araması, bağlantılar, geri bağlantılar ve bir graf. Obsidian kasalarıyla uyumludur. Dosya taşıma bir Linux/macOS ağ geçidi gerektirir; Windows Desktop, yerel bir Windows ağ geçidi değil, WSL'de barındırılan bir Unix arka ucu gerektirir; ffmpeg küçük resimleri isteğe bağlıdır. Uzak görseller ve ajan rehberliği ayrı ayrı isteğe bağlıdır ve varsayılan olarak kapalıdır; otomatik not içeriği paylaşımı kapalıdır; doğrudan Obsidian'da açma geçici olarak gizlidir. Açıklama — seçtiğiniz kasa klasöründeki notları, ağ geçidi ana makinesindeki Desktop kabuk komutları aracılığıyla okur ve yazar; uzak Markdown görselleri ve ajan gezinme rehberliği, siz seçim yapana kadar kapalı kalır."
