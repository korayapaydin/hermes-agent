name: hermes-vision-inline
repo: https://github.com/BrokeSkill/hermes-vision-inline
sha: 281bce608e799834cd1b60929d3f9b44756cb7c2
description: "Attach an image inline to the session model when it can see one, instead of letting an explicit auxiliary.vision backend describe it. Core already attaches images natively by default; what this plugin changes is an explicit auxiliary.vision setting, which it overrides so the model reads the pixels directly. The image stays in context, so follow-ups do not reprocess it. The model's modality comes from the local models.dev cache; no network calls and nothing to configure. Disclosure — replaces the vision_analyze handler through tool_execution middleware: when the local models.dev cache says the main model takes images and its provider carries images in tool results, it attaches the image itself even if you configured an auxiliary.vision backend (agent.image_input_mode: text still turns this off); the image stays in the conversation and is resent on later turns; relies on Hermes private vision helpers, so after a Hermes update it may silently fall back to the normal path."
description_tr: "Görüntüyü, açık bir auxiliary.vision arka ucunun onu betimlemesine izin vermek yerine, oturum modeli görebildiğinde satır içi olarak ekleyin. Çekirdek zaten görüntüleri varsayılan olarak yerleşik biçimde ekler; bu eklentinin değiştirdiği şey, açık bir auxiliary.vision ayarıdır; eklenti bu ayarı geçersiz kılar, böylece model pikselleri doğrudan okur. Görüntü bağlamda kalır, böylece takip soruları onu yeniden işlemez. Modelin modalitesi yerel models.dev önbelleğinden gelir; ağ çağrısı yoktur ve yapılandırılacak bir şey yoktur. Açıklama — vision_analyze işleyicisini tool_execution ara katmanı üzerinden değiştirir: yerel models.dev önbelleği ana modelin görüntü aldığını ve sağlayıcısının araç sonuçlarında görüntü taşıdığını söylediğinde, siz bir auxiliary.vision arka ucu yapılandırmış olsanız bile görüntüyü kendisi ekler (agent.image_input_mode: text bunu yine de kapatır); görüntü sohbette kalır ve sonraki turlarda yeniden gönderilir; Hermes'in özel görüntü yardımcılarına dayanır, bu yüzden bir Hermes güncellemesinden sonra sessizce normal yola geri dönebilir."
