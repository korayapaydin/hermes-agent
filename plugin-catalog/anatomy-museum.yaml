version: "0.1.0"
description: "Native Anatomy community gallery with search, local favorites and explicit sandboxed standalone playback. Disclosure — when opened it fetches gallery metadata and thumbnails from a third-party GitHub repository (wheresryan22/anatomy-community, resolved at runtime from its mutable previews branch via api.github.com and raw.githubusercontent.com). \"Open figure in Hermes\" downloads that community figure's HTML and runs its JavaScript inside the Desktop SDK sandbox (opaque origin, scripts only), and \"Browse Ryan's website\" embeds skills.wheresryan.sh the same way. Favorites and filters stay in Desktop-local plugin storage; no credentials or Hermes data are sent."
description_tr: "Arama, yerel favoriler ve açıkça sandboxlanmış bağımsız oynatma ile yerel Anatomy topluluk galerisi. Açıklama — açıldığında galeri meta verilerini ve küçük resimleri üçüncü taraf bir GitHub deposundan (wheresryan22/anatomy-community; çalışma zamanında, değişebilen previews dalından api.github.com ve raw.githubusercontent.com üzerinden çözümlenir) getirir. \"Figürü Hermes'te aç\", o topluluk figürünün HTML'ini indirir ve JavaScript'ini Masaüstü SDK sandbox'ı içinde (opak köken, yalnızca betikler) çalıştırır; \"Ryan'ın web sitesine göz at\" ise skills.wheresryan.sh adresini aynı şekilde gömer. Favoriler ve süzgeçler Masaüstü yerel eklenti depolamasında kalır; hiçbir kimlik bilgisi veya Hermes verisi gönderilmez."
maintainer: DanRudy33
tier: community
