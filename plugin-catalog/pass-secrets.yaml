name: pass-secrets
repo: https://github.com/dyiapanis/pass-secrets
sha: 485f105150e09dad28461b26b9eca9ffc511b15d
description: "pass (password-store) secret source: resolves secrets from a local, GPG-encrypted, git-tracked password store into environment variables at startup, as a first-class SecretSource beside the built-in Bitwarden and 1Password sources. Stdlib-only (subprocess + pathlib), no Python deps, no network — ever. Config: secrets.pass.{enabled,store_path,subdirs,override_existing,timeout_seconds}. Disclosure — when enabled, shells out to the local pass binary (10 s per entry) for every .gpg entry under the configured store subdirs and injects each as an env var that by default overrides .env and shell values; when enabled, also adds a ~900-char system-prompt note about secret resolution; no network."
description_tr: "pass (password-store) gizli bilgi kaynağı: sırları yerel, GPG ile şifrelenmiş, git ile izlenen bir parola deposundan başlangıçta ortam değişkenlerine çözer; yerleşik Bitwarden ve 1Password kaynaklarının yanında birinci sınıf bir SecretSource olarak. Yalnızca standart kitaplık (subprocess + pathlib), Python bağımlılığı yok, hiçbir zaman ağ yok. Yapılandırma: secrets.pass.{enabled,store_path,subdirs,override_existing,timeout_seconds}. Açıklama — etkinleştirildiğinde, yapılandırılmış depo alt dizinleri altındaki her .gpg girdisi için yerel pass ikili dosyasını (girdi başına 10 sn) çağırır ve her birini varsayılan olarak .env ve kabuk değerlerini geçersiz kılan bir ortam değişkeni olarak enjekte eder; etkinleştirildiğinde ayrıca gizli bilgi çözümlemesi hakkında ~900 karakterlik bir sistem istemi notu ekler; ağ yok."
