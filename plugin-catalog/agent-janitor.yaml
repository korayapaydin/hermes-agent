name: agent-janitor
version: "0.3.1"
repo: https://github.com/ZidoCode/agent-janitor
sha: f8306948aa8edd0f7197dc9890ccd4fa19dd7aee
description: "Process hygiene for agent machines — finds the background processes your agent left behind (dev servers, tunnels, watchers, nohup jobs) using evidence signals (ppid=1 reparent, port listener via /proc/net/tcp{,6}, dev-server traits, TTL exceeded) and attributes them to the originating tool call via agent-ledger's ledger when present. Dry-run by default: nothing is killed until you write policy_mode=enforce; system daemons and host/VM management agents are exempt by name, a user-editable whitelist covers your real infrastructure, and each kill re-reads the cmdline first (SIGTERM, 2s, SIGKILL with PID-reuse check). stdlib-only, fails open. Disclosure — inside Hermes it only appends terminal commands that look like they start background work (first 300 characters, which can include inline secrets) to plugin-data/agent-janitor/spawns.jsonl, and reads agent-ledger's ledger.db read-only when present. Killing is a separate CLI you run yourself (janitor_cli.py sweep): after you write \"enforce\" to plugin-data/agent-janitor/policy_mode it sends SIGTERM then SIGKILL to every process re-parented to PID 1 for over a minute that is not on its built-in exempt list or your whitelist, whoever started it (for example a tmux server or a nohup'd hermes gateway), including other users' processes when run as root. Dry-run first; the dry-run list is the kill list."
description_tr: "Ajan makineleri için süreç hijyeni — ajanınızın geride bıraktığı arka plan süreçlerini (geliştirme sunucuları, tüneller, izleyiciler, nohup işleri) kanıt sinyalleriyle (ppid=1 yeniden ebeveynleme, /proc/net/tcp{,6} üzerinden port dinleyicisi, geliştirme sunucusu özellikleri, aşılmış TTL) bulur ve mevcutsa agent-ledger'ın defteri üzerinden onları kaynaklandıkları araç çağrısına bağlar. Varsayılan olarak kuru çalışma: policy_mode=enforce yazmadığınız sürece hiçbir şey öldürülmez; sistem daemon'ları ve ana makine/VM yönetim ajanları ada göre muaftır, gerçek altyapınızı kapsayan kullanıcı tarafından düzenlenebilir bir beyaz liste vardır ve her öldürme önce komut satırını yeniden okur (SIGTERM, 2 saniye, PID yeniden kullanımı kontrolüyle SIGKILL). Yalnızca standart kitaplık, hata durumunda açık bırakır. Açıklama — Hermes içinde yalnızca arka plan işi başlatmaya benzeyen terminal komutlarını (satır içi gizli bilgiler içerebilen ilk 300 karakter) plugin-data/agent-janitor/spawns.jsonl dosyasına ekler ve mevcutsa agent-ledger'ın ledger.db dosyasını salt okunur okur. Öldürme, kendi çalıştırdığınız ayrı bir CLI'dır (janitor_cli.py sweep): plugin-data/agent-janitor/policy_mode dosyasına \"enforce\" yazdıktan sonra, bir dakikadan uzun süredir PID 1'e yeniden ebeveynlenmiş ve yerleşik muaf listesinde ya da beyaz listenizde olmayan her sürece, kim başlatmış olursa olsun (örneğin bir tmux sunucusu ya da nohup ile başlatılmış bir hermes ağ geçidi), root olarak çalıştırıldığında diğer kullanıcıların süreçleri dahil, SIGTERM ardından SIGKILL gönderir. Önce kuru çalıştırın; kuru çalıştırma listesi öldürme listesidir."
