title: rply
description: "rply gateway platform: talk to Hermes from the rply inbox on your phone and laptop, with web push. Messages and files both ways, seen/working/done with a live activity note, clarify questions and command approvals as tappable questions, cron delivery, a pinned table of scheduled jobs, a dashboard app with run/pause/resume, and an rply_request_secret tool that saves API keys to the profile's .env without the value passing through the chat. Each profile joins the channel as its own agent. Disclosure — keeps a long-polling connection to the configured rply server only (RPLY_SERVER, default https://app.rply.sh; self-hostable, AGPL server); messages the channel's members send reach Hermes as user instructions and members answer its approval and clarify prompts; the dashboard sends the server Hermes' cron job list, the titles and previews of the 10 most recent sessions from every platform, token and cost totals and the default model, and runs, pauses or resumes jobs when its buttons are pressed; stores the agent token in the profile's .env, an X25519 keypair in <profile>/rply/secret-key.json (0600) and secrets the human provides in the profile's .env under a variable name the agent picks (core's env denylist applies; the .env path is sent to the server with the request); the secret tool waits up to 15 minutes for the human and refuses under cron; adds a `hermes rply` setup command; credentials read through Hermes' profile-scoped route; no shell commands, no telemetry, no self-update."
description_tr: "rply ağ geçidi platformu: telefonunuzdaki ve dizüstünüzdeki rply gelen kutusundan Hermes'le konuşun, web push ile. İki yönlü mesajlar ve dosyalar, canlı etkinlik notuyla görüldü/çalışıyor/tamamlandı, dokunulabilir sorular olarak netleştirme soruları ve komut onayları, cron teslimatı, zamanlanmış işlerin sabitlenmiş tablosu, çalıştır/duraklat/devam ettir içeren bir gösterge paneli uygulaması ve API anahtarlarını değer sohbetten geçirmeden profilin .env dosyasına kaydeden bir rply_request_secret aracı. Her profil kanala kendi ajanı olarak katılır. Açıklama — yalnızca yapılandırılmış rply sunucusuna uzun yoklamalı bir bağlantı tutar (RPLY_SERVER, varsayılan https://app.rply.sh; kendi kendine barındırılabilir, AGPL sunucu); kanal üyelerinin gönderdiği mesajlar Hermes'e kullanıcı talimatı olarak ulaşır ve üyeler onun onay ve netleştirme istemlerini yanıtlar; pano sunucuya Hermes'in cron iş listesini, her platformdan en son 10 oturumun başlıklarını ve önizlemelerini, token ve maliyet toplamlarını ve varsayılan modeli gönderir ve düğmelerine basıldığında işleri çalıştırır, duraklatır veya devam ettirir; ajan token'ını profilin .env dosyasında, bir X25519 anahtar çiftini <profile>/rply/secret-key.json dosyasında (0600) ve insanın sağladığı sırları profilin .env dosyasında ajanın seçtiği bir değişken adı altında saklar (çekirdeğin env engel listesi geçerlidir; .env yolu istekle birlikte sunucuya gönderilir); sır aracı insan için 15 dakikaya kadar bekler ve cron altında reddeder; bir `hermes rply` kurulum komutu ekler; kimlik bilgileri Hermes'in profile özgü rotası üzerinden okunur; kabuk komutu yok, telemetri yok, kendi kendini güncelleme yok."
