name: greyridge-token-safety
repo: https://github.com/rezearcher/greyridge-token-safety-skill
sha: 3a7848edcac2163a4e02c7b9a084c8c8476384f3
description: "Skill that runs a pre-trade safety check on Base ERC-20 tokens (honeypot/sellability, measured transfer tax, owner/mint/pause flags, liquidity, SAFE/CAUTION/AVOID verdict) by curling the Grey Ridge x402 API's free preview endpoint. Skill-only: no tools, hooks or env vars. Disclosure — the skill has the agent run `curl` against Grey Ridge Signals Group LLC's API (x402-data-api.sigrunner.workers.dev, the same service as api.greyridgesignals.ai) with the token address and, for the swap gate, trade side and USD size; each response carries a paid URL that the skill tells the agent it can call with an x402 client (suggesting `npm i x402-fetch viem`), paying $0.01 USDC per call on Base from whatever wallet that client is given, and it mentions an unpinned `pip install git+https://github.com/rezearcher/greyridge-x402-tools` helper that the user installs themselves. Its verdict is a heuristic, not financial advice."
description_tr: "Grey Ridge x402 API'nin ücretsiz önizleme uç noktasına curl ile erişerek Base üzerindeki ERC-20 token'lar için işlem öncesi güvenlik denetimi yapan yetenek (honeypot/satılabilirlik, ölçülen transfer vergisi, sahip/mint/pause bayrakları, likidite, SAFE/CAUTION/AVOID kararı). Yalnızca yetenek: araç, hook veya ortam değişkeni yok. Açıklama — yetenek, ajanın token adresiyle ve takas kapısı için işlem yönü ve USD tutarıyla birlikte Grey Ridge Signals Group LLC'nin API'sine (api.greyridgesignals.ai) `curl` çalıştırmasını sağlar; ücretli bir x402 rotasından (Base üzerinde çağrı başına $0.01 USDC) ve kullanıcının kendisinin kurduğu, sürümü sabitlenmemiş bir `pip install git+https://github.com/rezearcher/greyridge-x402-tools` yardımcısından söz eder. Verdiği karar bir buluşsal yöntemdir, finansal tavsiye değildir."
maintainer: rezearcher
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/rezearcher/greyridge-token-safety-skill
version: "0.1.0"
known_issues:
  - Base chain only; DEX buy/sell tax is not measured (only transferTaxBps). Free preview is rate-limited; unattended use needs the paid x402 route ($0.01/call).
