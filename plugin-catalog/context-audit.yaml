name: context-audit
version: "0.1.0"
repo: https://github.com/ZidoCode/context-audit
# Filled by the publisher at push time: `git rev-parse HEAD` of the tagged commit.
sha: 2aaa96aab2c685798b011a5d6479a4a1fa6a033f
description: "Context-window forensics: per-turn input/output token estimates, the single largest tool output of each turn, oversized tool calls (args over 50 KB), and compaction events, recorded as metadata only (tool name, byte length, ids, timestamps — never args or results) in a local SQLite DB under HERMES_HOME/plugin-data/context-audit/. Adds a /context-audit slash command that prints the top 5 context eaters over a window with one mitigation per entry."
description_tr: "Bağlam penceresi adli incelemesi: tur başına girdi/çıktı token tahminleri, her turun en büyük araç çıktısı, aşırı büyük araç çağrıları (50 KB üzeri argümanlar) ve sıkıştırma olayları; yalnızca üst veri olarak (araç adı, bayt uzunluğu, kimlikler, zaman damgaları — asla argüman ya da sonuç değil) HERMES_HOME/plugin-data/context-audit/ altındaki yerel bir SQLite veritabanına kaydedilir. /context-audit eğik çizgi komutu ekler; belirli bir pencerede en çok bağlam yiyen ilk 5 girdiyi, her girdi için bir azaltma önerisiyle birlikte yazdırır."
maintainer: ZidoCode
tier: community
category: tools
