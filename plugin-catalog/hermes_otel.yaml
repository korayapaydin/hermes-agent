name: hermes_otel
repo: https://github.com/briancaffey/hermes-otel
sha: "d234865b13e997e0b3a50dc18aaad7c7d7b1b1fe"
subdir: hermes_otel
description: "OpenTelemetry for Hermes Agent: sessions, LLM and API calls, tool calls, sub-agents and approvals as OTLP traces, metrics and logs to any OTLP backend. Disclosure — sends span data including prompts, tool arguments and tool output only to backends you configure (a backends: list, an OTEL_* variable, or LANGSMITH_TRACING=true); by default content_capture is full and unclipped (preview clips to 1200 chars, off sends none); vendor SDK keys already in the environment are used only after that opt-in; with nothing configured it keeps a local owner-only SQLite store under $HERMES_HOME and sends nothing; installs opentelemetry-api, -sdk, -exporter-otlp-proto-http (>=1.35,<2) and PyYAML."
description_tr: "Hermes Agent için OpenTelemetry: oturumlar, LLM ve API çağrıları, araç çağrıları, alt ajanlar ve onaylar, herhangi bir OTLP arka ucuna OTLP izleri, ölçütler ve günlükler olarak. Açıklama — istemleri, araç argümanlarını ve araç çıktısını içeren iz verilerini yalnızca sizin yapılandırdığınız arka uçlara gönderir (bir backends: listesi, bir OTEL_* değişkeni ya da LANGSMITH_TRACING=true); varsayılan olarak content_capture full değerindedir ve kırpılmaz (preview 1200 karaktere kırpar, off hiçbir şey göndermez); ortamda zaten bulunan sağlayıcı SDK anahtarları yalnızca bu isteğe bağlı katılımdan sonra kullanılır; hiçbir şey yapılandırılmadığında $HERMES_HOME altında yalnızca sahibinin erişebildiği yerel bir SQLite deposu tutar ve hiçbir şey göndermez; opentelemetry-api, -sdk, -exporter-otlp-proto-http (>=1.35,<2) ve PyYAML paketlerini kurar."
maintainer: briancaffey
tier: community
category: general
requires_hermes: ">=0.21"
docs_url: https://briancaffey.github.io/hermes-otel/
version: "1.18.2"
image: https://raw.githubusercontent.com/briancaffey/hermes-otel/d234865b13e997e0b3a50dc18aaad7c7d7b1b1fe/docs/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
  - api_request_error
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_start
  - post_api_request
  - post_approval_response
  - post_llm_call
  - post_tool_call
  - pre_api_request
  - pre_approval_request
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
