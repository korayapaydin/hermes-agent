title: Agent Mixer
maintainer: Sahil-SS9
tier: community
category: general
version: "0.2.0"
description: "A mixing desk for how much a coding agent may change: four enforced dials (edits, write-scope globs, per-turn line budget, new-dependency policy) with /mixer, live presets, a Desktop dial panel in the composer, a web-dashboard saved-defaults bar and a steering-console page. Also drives Claude Code, Codex and Gemini CLI through the agent-mixer hook command. Disclosure — enforces edit/scope/line-budget/new-dependency dials in pre_tool_call (blocks, or escalates \"ask\" to Hermes approval, which /yolo skips) and adds a one-line rules context via pre_llm_call when a dial is off its default; per-session dial state is stored under HERMES_HOME/plugin-data/hermes-agent-mixer/sessions/, and the Desktop panel and dashboard bar write the plugin's own saved defaults into config.yaml (plugins.entries.hermes-agent-mixer.settings); the separately installed agent-mixer CLI keeps its own state in ~/.config/agent-mixer and ~/.local/state/agent-mixer, writes hook entries into ~/.claude/settings.json, ~/.claude/commands/mixer.md, ~/.codex/hooks.json or ~/.gemini/settings.json only when run as `agent-mixer install <harness> --yes`, and `agent-mixer ui` serves a token-guarded console on 127.0.0.1:8377."
description_tr: "Bir kodlama ajanının ne kadar değiştirebileceğine karar veren bir karıştırma masası: zorunlu dört kadran (düzenlemeler, yazma kapsamı glob'ları, tur başına satır bütçesi, yeni bağımlılık politikası) ve /mixer, canlı hazır ayarlar, yazma alanındaki bir Desktop kadran paneli, web panosunda kayıtlı varsayılanlar çubuğu ve bir yönlendirme konsolu sayfası ile. Ayrıca Claude Code, Codex ve Gemini CLI'yi agent-mixer kanca komutuyla sürer. Açıklama — düzenleme/kapsam/satır bütçesi/yeni bağımlılık kadranlarını pre_tool_call içinde uygular (engeller ya da \"ask\" seçeneğini Hermes onayına yükseltir; /yolo bunu atlar) ve bir kadran varsayılanından saptığında pre_llm_call üzerinden tek satırlık bir kural bağlamı ekler; oturum başına kadran durumu HERMES_HOME/plugin-data/hermes-agent-mixer/sessions/ altında saklanır ve Desktop paneli ile pano çubuğu eklentinin kendi kayıtlı varsayılanlarını config.yaml dosyasına (plugins.entries.hermes-agent-mixer.settings) yazar; ayrıca kurulan agent-mixer CLI'si kendi durumunu ~/.config/agent-mixer ve ~/.local/state/agent-mixer altında tutar, kanca girdilerini yalnızca `agent-mixer install <harness> --yes` olarak çalıştırıldığında ~/.claude/settings.json, ~/.claude/commands/mixer.md, ~/.codex/hooks.json veya ~/.gemini/settings.json dosyalarına yazar ve `agent-mixer ui`, 127.0.0.1:8377 üzerinde token korumalı bir konsol sunar."
