description: 'Uptime-Kuma monitoring for agents: the community MCP server for Uptime Kuma v2 (pinned @0.11.18 over npx stdio) with workflow skills for incident review, status digests, and confirmation-gated maintenance. Credentials stay in host-native MCP config (portable Agent Plugins v1 package, mcp.json + skills/; needs Node.js >= 22 on PATH and a Uptime Kuma v2 instance). Disclosure — first run has npx fetch @davidfuchs/mcp-uptime-kuma@0.11.18 (single-maintainer community package) from npm; that server exposes 31 read/WRITE tools against your Uptime Kuma instance, including permanent delete tools the bundled skills never call.'
description_tr: "Ajanlar için Uptime-Kuma izleme: Uptime Kuma v2 için topluluk MCP sunucusu (npx stdio üzerinden sabitlenmiş @0.11.18) ve olay incelemesi, durum özetleri ve onay kapılı bakım için iş akışı yetenekleri. Kimlik bilgileri konuk yerel MCP yapılandırmasında kalır (taşınabilir Agent Plugins v1 paketi, mcp.json + skills/; PATH'te Node.js >= 22 ve bir Uptime Kuma v2 örneği gerekir). Açıklama — ilk çalıştırmada npx, npm'den @davidfuchs/mcp-uptime-kuma@0.11.18 (tek bakımcılı topluluk paketi) paketini indirir; bu sunucu Uptime Kuma örneğinize karşı 31 okuma/YAZMA aracı sunar, buna paketlenmiş yeteneklerin asla çağırmadığı kalıcı silme araçları da dahildir."
