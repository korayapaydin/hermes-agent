subdir: src/hermes_desensitize
description: "Chinese-context desensitization for Hermes chats. Replaces PII and business-sensitive
  entities — person names, company names, addresses, file paths, and magnitude figures — with
  reversible placeholders before a message reaches the model, then restores them in the reply.
  Two layers: an optional local/OpenAI-compatible LLM for semantic entity judgment, plus a
  sub-millisecond regex fallback (phone, ID card, email, IP, path) that keeps the conversation
  working when the model is unavailable. Disclosure — the semantic layer sends the
  pre-redaction text to the configured LLM, because recognising a name requires seeing it:
  with the default provider=ollama that is the local Ollama host and nothing leaves the
  machine, but provider=openai without an explicit base_url falls back to
  https://api.siliconflow.cn/v1 (remote); set base_url, or stay on ollama, to keep it local.
  Also rewrites inbound user messages and outbound
  assistant replies, so transcript content differs from what you typed; placeholders are
  code-generated and may over-match (18-digit ID-card-shaped strings, names that collide with
  the public-entity allowlist); company names are matched greedily and a modifier such as
  原北京某某有限公司 is absorbed into the placeholder; magnitude masking drops the numeric
  value and only fires on the configured trigger words, so a domain term absent from that list
  is left unmasked without warning; the placeholder mapping is held in memory only and never
  written to disk."
description_tr: "Hermes sohbetleri için Çince bağlamına yönelik hassas veri giderme. Kişisel olarak tanımlanabilir bilgileri ve iş açısından hassas varlıkları — kişi adlarını, şirket adlarını, adresleri, dosya yollarını ve büyüklük değerlerini — bir mesaj modele ulaşmadan önce geri döndürülebilir yer tutucularla değiştirir, ardından yanıtta geri koyar. İki katman: anlamsal varlık yargısı için isteğe bağlı yerel/OpenAI uyumlu bir LLM ve model kullanılamadığında sohbetin çalışmaya devam etmesini sağlayan milisaniye altı bir düzenli ifade yedeği (telefon, kimlik kartı, e-posta, IP, yol). Açıklama — anlamsal katman, redaksiyon öncesi metni yapılandırılmış LLM'e gönderir, çünkü bir adı tanımak onu görmeyi gerektirir: varsayılan provider=ollama ile bu yerel Ollama konağıdır ve makineden hiçbir şey çıkmaz, ancak açık bir base_url olmadan provider=openai, https://api.siliconflow.cn/v1 adresine (uzak) geri döner; yerel tutmak için base_url ayarlayın ya da ollama'da kalın. Ayrıca gelen kullanıcı mesajlarını ve giden asistan yanıtlarını yeniden yazar, böylece döküm içeriği yazdığınızdan farklı olur; yer tutucular kodla üretilir ve aşırı eşleşebilir (18 haneli kimlik kartı biçimli dizeler, genel varlık izin listesiyle çakışan adlar); şirket adları açgözlü biçimde eşleştirilir ve 原北京某某有限公司 gibi bir niteleyici yer tutucuya yutulur; büyüklük maskeleme sayısal değeri düşürür ve yalnızca yapılandırılmış tetikleyici sözcüklerde devreye girer, bu nedenle o listede bulunmayan bir alan terimi uyarı verilmeden maskelenmeden bırakılır; yer tutucu eşlemesi yalnızca bellekte tutulur ve hiçbir zaman diske yazılmaz."
