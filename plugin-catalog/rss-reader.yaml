description: "Desktop RSS reader with reader-mode capture, drag-reorder subscriptions, mute rules, saved searches, AI summaries, keyboard shortcuts, and an optional headline ticker. Disclosure — optional YouTube cookies you paste in Settings are sent with YouTube feed requests; selectable User-Agent presets (incl. a ChatGPT-User string) are sent to feed hosts; YouTube videos render as youtube-nocookie.com embed iframes inside the reader."
description_tr: "Okuma kipi yakalama, sürükleyerek abonelik sıralaması, susturma kuralları, kayıtlı aramalar, yapay zekâ özetleri, klavye kısayolları ve isteğe bağlı bir başlık şeridi ile masaüstü RSS okuyucu. Açıklama — Ayarlar'da yapıştırdığınız isteğe bağlı YouTube çerezleri YouTube besleme istekleriyle gönderilir; seçilebilir User-Agent ön ayarları (bir ChatGPT-User dizesi dâhil) besleme konaklarına gönderilir; YouTube videoları okuyucu içinde youtube-nocookie.com gömme iframe'leri olarak görüntülenir."
