version: "0.3.13"
description: "Local-first long-term memory for Hermes agents: a canonical append-only store (SQLite or PostgreSQL+pgvector) with five-dimensional tenant/profile/collection/agent/session scope, hybrid BM25+vector retrieval with a re-ranker, memories that cite the observations they came from, per-turn user facts, real dates next to relative times, truth resolution when a newer fact replaces an older one, and a conflict note when two returned memories disagree. Fully offline by default; Qwen3-Embedding-0.6B semantic embeddings opt-in, locally or in a user-owned sidecar. On OmniMemEval's public long-term-memory leaderboard (its own models, prompts and full public sets) it scores 90.6 LongMemEval (1st), 87.3 LoCoMo (2nd) and 71.6 BEAM 100K (2nd, within noise of the lead); it re-ran LCM-X to check the board's records, and per-question results, a strict second marker and scripts are published in the repo. Disclosure — stores every conversation turn in one SQLite database under the Hermes root (`<hermes root>/severian`) shared by all profiles with rows scoped per profile, or in the PostgreSQL database named by `SEVERIAN_DSN`; the opt-in Qwen/Granite embeddings download a model from Hugging Face on first use, and the opt-in embedding sidecar sends memory text to the URL you configure."
description_tr: "Hermes ajanları için yerel öncelikli uzun süreli bellek: beş boyutlu kiracı/profil/koleksiyon/ajan/oturum kapsamına sahip, yalnızca ekleme yapılabilen standart bir depo (SQLite veya PostgreSQL+pgvector), yeniden sıralayıcıya sahip hibrit BM25+vektör erişimi, geldikleri gözlemleri referans gösteren bellekler, her tur için kullanıcı gerçekleri, göreli zamanların yanında gerçek tarihler, yeni bir gerçeğin eskisinin yerini aldığı durumlarda doğruluk çözünürlüğü ve iki dönen belleğin çeliştiği durumlarda bir çelişki notu. Varsayılan olarak tamamen çevrimdışıdır; isteğe bağlı olarak yerel veya kullanıcıya ait bir yan araçta Qwen3-Embedding-0.6B anlamsal gömmeler kullanılır. OmniMemEval'in genel uzun süreli bellek liderlik tablosunda (kendi modelleri, promptları ve tüm genel setleri ile) 90.6 LongMemEval (1.), 87.3 LoCoMo (2.) ve 71.6 BEAM 100K (2., liderle gürültü sınırları içinde) puanları almıştır; tablo kayıtlarını kontrol etmek için LCM-X'i yeniden çalıştırmıştır ve soru başına sonuçlar, katı bir ikinci işaretleyici ve betikler repoda yayınlanmıştır. Bilgilendirme — her konuşma turunu, tüm profiller tarafından paylaşılan ve satırları profil bazlı kapsamlanan Hermes kök dizini altındaki (`<hermes root>/severian`) tek bir SQLite veritabanında veya `SEVERIAN_DSN` ile belirlenen PostgreSQL veritabanında saklar; isteğe bağlı Qwen/Granite gömmeleri ilk kullanımda Hugging Face'den bir model indirir ve isteğe bağlı gömme yan aracı bellek metnini yapılandırdığınız URL'ye gönderir."
