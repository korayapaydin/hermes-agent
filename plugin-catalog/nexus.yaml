version: "0.22.32"
description: "Self-hosted long-term memory on Qdrant: automatic per-turn prefetch and write-back, plus recall/remember/forget, guardrail rules and a knowledge graph; Hermes and any MCP-connected agent share one collection. Embeddings run fully local by default (sentence-transformers with Qwen/Qwen3-Embedding-0.6B, 1024d, about 1.2 GB from Hugging Face on first use; on Apple Silicon the model is pinned to the CPU, because PyTorch's MPS backend aborts the whole process under two overlapping encodes). A cloud embedder runs only when NEXUS_EMBEDDING_PROVIDER names it and its key is present, and a key that merely sits in the environment never selects one. Access levels fail closed: a memory, a protection rule or a graph label without a known level counts as the most restrictive. A local service on 127.0.0.1:9122 serves embeddings and the full MCP toolset; its /embed and /mcp routes demand a per-installation key (service_auth.key, mode 0600) and reject non-loopback Host/Origin, while the open /healthz answers liveness only. The plugin starts that service when Hermes cannot load the embedding stack, and it keeps running afterwards. Session-end fact extraction sends conversation text to the model endpoint from Hermes config.yaml, and the consolidation daemon to its configured model, which defaults to Hermes's own default model through local Ollama; reads ~/.hermes/.env and config.yaml; state and daily backups under ~/.nexus-memory; NEXUS_UPDATE_CHECK=1 opts into a GitHub release check. Disclosure — when Hermes cannot load the embedding stack (and always on Apple Silicon unless NEXUS_EMBED_IN_HOST=1), the plugin starts `nexus-memory serve` on 127.0.0.1:9122 (embeddings, the full Nexus MCP toolset and a consolidation daemon that sends memory text to the Ollama endpoint at 127.0.0.1:11434 or NEXUS_OLLAMA_BASE under the model named by NEXUS_CONSOLIDATION_MODEL, nexus-memory.consolidation_model or Hermes's model.default, which can be an Ollama cloud model), and the service keeps running after Hermes exits; its /embed and MCP routes require a per-install key in ~/.nexus-memory/service_auth.key (0600) and a loopback Host/Origin; session-end fact extraction sends conversation text to the model endpoint in Hermes config.yaml, and the opt-in recall reranker (nexus-memory.rerank or NEXUS_RERANK=1) defaults to sending each query plus up to 20 memory snippets to that same endpoint using the provider API key it reads from config.yaml; reads ~/.hermes/.env and config.yaml; state and daily backups under ~/.nexus-memory; opt-in NEXUS_UPDATE_CHECK=1 adds a GitHub release check and an upgrade nudge to the system prompt."
description_tr: "Qdrant üzerinde kendinizde barındırılan uzun süreli bellek: otomatik tur başına ön getirme ve geri yazma, ayrıca recall/remember/forget, guardrail kuralları ve bir bilgi grafiği; Hermes ve MCP ile bağlı her ajan tek bir koleksiyonu paylaşır. Gömmeler varsayılan olarak tamamen yerelde çalışır (sentence-transformers ile Qwen/Qwen3-Embedding-0.6B, 1024d, ilk kullanımda Hugging Face'den yaklaşık 1.2 GB indirilir; Apple Silicon'da model CPU'ya sabitlenir, çünkü PyTorch'un MPS arka ucu iki örtüşen kodlama altında tüm süreci sonlandırır). Bir bulut gömücü yalnızca NEXUS_EMBEDDING_PROVIDER onu adlandırdığında ve anahtarı mevcut olduğunda çalışır; yalnızca ortamda duran bir anahtar tek başına sağlayıcı seçmez. Erişim düzeyleri hata durumunda kapalıdır: bilinen bir düzeyi olmayan bir bellek, koruma kuralı ya da graf etiketi en kısıtlayıcı olan olarak ele alınır. 127.0.0.1:9122 üzerindeki yerel servis gömmeleri ve eksiksiz MCP araç setini sunar; /embed ve /mcp rotaları kurulum başına bir anahtar ister (service_auth.key, kip 0600) ve geri döngü olmayan Host/Origin değerlerini reddeder, açık /healthz ise yalnızca canlılık yanıtı verir. Eklenti, Hermes gömme yığınını yükleyemediğinde bu servisi başlatır ve sonrasında da çalışmaya devam eder. Oturum sonu olgu çıkarma, konuşma metnini Hermes'in config.yaml dosyasındaki model uç noktasına, birleştirme daemonunu ise varsayılan olarak bulut olan yapılandırılmış modeline gönderir; ~/.hermes/.env ve config.yaml dosyalarını okur; durum ve günlük yedekler ~/.nexus-memory altında tutulur; isteğe bağlı NEXUS_UPDATE_CHECK=1, GitHub sürüm denetimine katılım sağlar. Açıklama — Hermes gömme yığınını yükleyemediğinde (ve NEXUS_EMBED_IN_HOST=1 olmadıkça Apple Silicon'da her zaman), eklenti `nexus-memory serve` komutunu 127.0.0.1:9122 üzerinde başlatır (gömmeler, eksiksiz Nexus MCP araç seti ve varsayılan modeli bellek metnini alan bir bulut modeli olan birleştirme daemonu) ve hizmet Hermes çıktıktan sonra da çalışmaya devam eder; /embed ve MCP rotaları ~/.nexus-memory/service_auth.key içinde kurulum başına bir anahtar (0600) ve geri döngü bir Host/Origin gerektirir; oturum sonu olgu çıkarma, konuşma metnini Hermes config.yaml dosyasındaki model uç noktasına gönderir; ~/.hermes/.env ve config.yaml dosyalarını okur; durum ve günlük yedekler ~/.nexus-memory altında; isteğe bağlı NEXUS_UPDATE_CHECK=1, bir GitHub sürüm denetimi ve sistem prompt'una bir yükseltme hatırlatması ekler."
