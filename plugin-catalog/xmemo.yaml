name: xmemo
repo: https://github.com/yonro/hermes-xmemo-plugin
sha: 499a383778647e897d30db3e92e8c8ad4397c799
subdir: src/hermes_xmemo/xmemo
description: >-
  Native XMemo memory provider for Hermes Agent — durable, identity-aware cross-session memory with semantic search.
  Disclosure — cloud memory provider: sends each user prompt (for recall and the search tools), model-written
  memories and mirrored built-in Hermes memory writes, plus a stable install ID, to xmemo.dev (Yonro Co., Ltd.);
  keeps a local SQLite cache of recalled results and a queue of unsent writes in $HERMES_HOME/xmemo_cache.db,
  partitioned by a hashed account identity; reads the key from XMEMO_KEY (also MEMORY_OS_API_KEY / MEMORY_OS_MCP_TOKEN)
  and, if none is set, falls back to the xmemo login token in ~/.config/xmemo/credentials.json (a catalog rule 11
  deviation kept for existing users); workflow and destructive tools and timeline capture are off by default and opt-in.
description_tr: "Hermes Agent için yerel XMemo bellek sağlayıcısı — dayanıklı, kimlik farkındalıklı, oturumlar arası bellek ve anlamsal arama. Açıklama — bulut bellek sağlayıcısı: her kullanıcı istemini (hatırlama ve arama araçları için), model tarafından yazılan anıları ve yansıtılan yerleşik Hermes bellek yazımlarını, ayrıca sabit bir kurulum kimliğini xmemo.dev (Yonro Co., Ltd.) adresine gönderir; hatırlanan sonuçların yerel bir SQLite önbelleğini ve gönderilmemiş yazımların kuyruğunu $HERMES_HOME/xmemo_cache.db içinde, karma bir hesap kimliğine göre bölümlenmiş olarak tutar; anahtarı XMEMO_KEY (ayrıca MEMORY_OS_API_KEY / MEMORY_OS_MCP_TOKEN) üzerinden okur ve hiçbiri ayarlanmamışsa ~/.config/xmemo/credentials.json içindeki xmemo oturum açma token'ına geri döner (mevcut kullanıcılar için mevcut kullanıcılar için korunan bir katalog kuralı 11 istisnası); iş akışı ve yıkıcı araçlar ile zaman çizelgesi yakalama varsayılan olarak kapalıdır ve isteğe bağlıdır."
maintainer: yonro
tier: community
category: memory
requires_hermes: '>=0.19'
