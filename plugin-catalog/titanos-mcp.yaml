description: "Connect Hermes to Titanos marketplace, Amazon, listings, Ads, and product research tools through the pinned Titanos OAuth MCP client. This portable Agent Plugin v1 package bundles seven operating skills, requires Node.js 20.18.1 or newer, and uses browser authorization with a Titanos account. Disclosure — starts the npm package @titanos/mcp-agents@1.47.2 via npx (fetched from npm on first run); its tools read and WRITE live marketplace/Ads accounts under your Titanos OAuth session."
description_tr: "Hermes'i, sabitlenmiş Titanos OAuth MCP istemcisi üzerinden Titanos pazaryeri, Amazon, listelemeler, Ads ve ürün araştırma araçlarına bağlayın. Bu taşınabilir Agent Plugin v1 paketi yedi işletim yeteneği paketler, Node.js 20.18.1 ya da daha yeni bir sürüm gerektirir ve bir Titanos hesabıyla tarayıcı yetkilendirmesi kullanır. Açıklama — @titanos/mcp-agents@1.47.2 npm paketini npx ile başlatır (ilk çalıştırmada npm'den indirilir); araçları, Titanos OAuth oturumunuz altında canlı pazaryeri/Ads hesaplarını OKUR ve YAZAR."
