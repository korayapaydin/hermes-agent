name: maqami-travel
repo: https://github.com/negm17111995/mcp-server
sha: 6478de2d093fcf9bdd3c5dbff6d6ef267dcb56ae
description: "Search hotels (3M+ hotels) and flights worldwide on MAQAMI, read hotel details and reviews, then send the customer a secure checkout link on book.maqami.co, through the official MAQAMI Travel MCP server (Streamable HTTP at mcp.maqami.co, no account or key), with the maqami-travel-booking skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — connects to the hosted MAQAMI MCP server at mcp.maqami.co (no key); its tool list is defined by that server, not by the pinned repo. The tool arguments the agent sends go to it: destinations, dates, guests, lead-guest nationality and currency, plus booking ID and email for lookups, amendments and cancellations. Prebook (hotels) and verify (flights) hold a real rate, and the amend and cancel tools change or cancel real bookings (late or non-refundable cancellations are still charged); the skill tells the agent to show the details and get a clear yes before each prebook, amend or cancel. Customers pay only on book.maqami.co; no tool takes card or passport details."
description_tr: "MAQAMI üzerinde otelleri (3 milyondan fazla otel) ve dünya genelindeki uçuşları arayın, otel ayrıntılarını ve yorumları okuyun, sonra müşteriye book.maqami.co adresinde güvenli bir ödeme bağlantısı gönderin; resmî MAQAMI Travel MCP sunucusu üzerinden (Streamable HTTP, mcp.maqami.co, hesap ya da anahtar yok) ve paketlenmiş maqami-travel-booking yeteneğiyle. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/). Açıklama — barındırılan MAQAMI MCP sunucusuna mcp.maqami.co adresinde bağlanır (anahtar yok); araç listesi sabitlenmiş depo tarafından değil, o sunucu tarafından tanımlanır. Ajanın gönderdiği araç bağımsız değişkenleri oraya gider: varış yerleri, tarihler, misafirler, asıl misafirin uyruğu ve para birimi, ayrıca aramalar, değişiklikler ve iptaller için rezervasyon kimliği ve e-posta. Prebook (oteller) ve verify (uçuşlar) gerçek bir fiyatı kilitler; amend ve cancel araçları gerçek rezervasyonları değiştirir veya iptal eder (geç veya iade edilemez iptaller yine de ücretlendirilir); yetenek, ajana her prebook, amend veya cancel öncesinde ayrıntıları göstermesini ve açık bir evet almasını söyler. Müşteriler yalnızca book.maqami.co üzerinde ödeme yapar; hiçbir araç kart veya pasaport bilgisi almaz."
