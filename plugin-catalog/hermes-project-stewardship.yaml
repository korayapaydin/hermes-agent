name: hermes-project-stewardship
repo: https://github.com/Sahil-SS9/hermes-project-stewardship
sha: 687bb035a2341fd1f26ade5e50b36b2331565ff5
description: "Durable project ownership and bounded initiative management for Hermes fleets. Disclosure — a `pre_llm_call` hook adds a project's saved rules, decisions and facts to turns of bots assigned to that project; objective checks run allowlisted local programs only at autonomy level 3+ and GitHub objectives shell out to your own `gh api`; it creates and edits Hermes Kanban tasks through Hermes' internal kanban modules (title/body/tenant written directly to kanban.db), keeps its own SQLite DB under `<Hermes home>/plugin-data/hermes-dockyard/`, and its optional HTTP API (`/stewardship/v1`, 127.0.0.1) stays closed until you set a bearer token."
description_tr: "Hermes filosları için kalıcı proje sahipliği ve sınırlı girişim yönetimi. Açıklama — bir `pre_llm_call` kancası, bir projenin kayıtlı kurallarını, kararlarını ve olgularını o projeye atanmış botların turlarına ekler; nesnel denetimler, izin listesindeki yerel programları yalnızca özerklik düzeyi 3+ iken çalıştırır ve GitHub hedefleri kendi `gh api` komutunuzu kabuk üzerinden çağırır; Hermes'in iç kanban modülleri üzerinden Hermes Kanban görevleri oluşturur ve düzenler (başlık/gövde/kiracı doğrudan kanban.db'ye yazılır), kendi SQLite veritabanını `<Hermes home>/plugin-data/hermes-dockyard/` altında tutar ve isteğe bağlı HTTP API'si (`/stewardship/v1`, 127.0.0.1) siz bir bearer token ayarlayana kadar kapalı kalır."
maintainer: Sahil-SS9
tier: community
category: automation
requires_hermes: ">=0.21"
docs_url: https://github.com/Sahil-SS9/hermes-project-stewardship
platforms: []
capabilities:
  provides_tools:
    - steward_status
    - steward_run_cycle
    - steward_propose_initiative
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
