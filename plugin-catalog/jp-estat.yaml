name: jp-estat
repo: https://github.com/TakeshiTGAL/hermes-plugin-estat
sha: 2cf442a83be2ed90b0a07cc4e8707d591f1e9196
description: "Japanese government statistics from the e-Stat API: search tables and fetch figures such as population, households, wages, and prices, with estat_search_tables, estat_table_info, and estat_get_data. Disclosure — It needs a free e-Stat application ID, set as ESTAT_APP_ID in the .env of each profile. Each call sends your search words and table selections to api.e-stat.go.jp and puts ESTAT_APP_ID in the request URL. The ID is read for the active profile on each call. An HTTP proxy set in the environment is not used, and no other host is called. Nothing is written to disk, and this plugin creates no cron job. The tools are on for every surface, including gateways, so anyone you allow there can call them with your ID. Turn a surface off with hermes tools. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off."
description_tr: "e-Stat API (政府統計の総合窓口, Japonya'nın resmî devlet istatistikleri portalı) üzerine kurulu olarak Hermes Agent için Japon devlet istatistikleri: tabloları arayın, kategorilerini görün ve adla sayıları getirin (nüfus, hane sayısı, sektöre göre işletmeler, ücretler, tüketici fiyatları) birimler, anket tarihleri ve atıflarla; estat_search_tables, estat_table_info ve estat_get_data araçlarıyla. Açıklama — ücretsiz bir e-Stat uygulama kimliği gerektirir; her profilin .env dosyasında ESTAT_APP_ID olarak ayarlanır. Her çağrı, arama sözcüklerinizi ve tablo seçimlerinizi api.e-stat.go.jp adresine gönderir ve istek URL'sine ESTAT_APP_ID koyar. Kimlik her çağrıda etkin profil için okunur. Ortamda ayarlanmış bir HTTP proxy kullanılmaz ve başka hiçbir ana makine çağrılmaz. Diske hiçbir şey yazılmaz ve bu eklenti hiçbir cron işi oluşturmaz. Araçlar ağ geçitleri dahil her yüzeyde açıktır, böylece orada izin verdiğiniz herkes bunları sizin kimliğinizle çağırabilir. Bir yüzeyi hermes tools ile kapatın. Eklenti etkinken yeteneği her oturumun yetenek dizinine bir satır ekler; araçların kapatıldığı yüzeyler de dahil."
maintainer: TakeshiTGAL
tier: community
