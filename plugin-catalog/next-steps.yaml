description: "Next-step suggestions under the Hermes Desktop composer after each turn: local Ollama inference, per-session state, target routing (session, new tab, bots, kanban), tiny-model capacity profiles, EN/DE UI. No API keys. Disclosure — after every agent turn, sends the last 8 messages (each cut to 200 chars) plus the working directory to Ollama on localhost; clicking a suggestion immediately submits it as a prompt in the current session, a new session, or another profile's session, or creates a kanban card, and for non-current targets also attaches the working directory and the last 6 messages (on by default, can be turned off under Targets)."
description_tr: "Hermes Desktop yazma alanının altında her turdan sonra sonraki adım önerileri: yerel Ollama çıkarımı, oturum başına durum, hedef yönlendirme (oturum, yeni sekme, botlar, kanban), küçük model kapasite profilleri, EN/DE arayüz. API anahtarı yok. Açıklama — her ajan turundan sonra son 8 mesajı (her biri 200 karaktere kısaltılmış) ve çalışma dizinini localhost'taki Ollama'ya gönderir; bir öneriye tıklamak onu hemen geçerli oturumda, yeni bir oturumda veya başka bir profilin oturumunda istem olarak gönderir ya da bir kanban kartı oluşturur; geçerli oturum dışındaki hedefler için ayrıca çalışma dizinini ve son 6 mesajı ekler (varsayılan olarak açık, Targets altında kapatılabilir)."
