name: cursor-acp
repo: https://github.com/neerazz/hermes-cursor-acp
sha: d5b6146c4e6dcfca110fbcf736d8b51823bc8e64
description: "Use your Cursor subscription models (Claude Opus/Sonnet 5.5, Composer 2.5, GPT-5.6, Grok) inside Hermes Agent via the Cursor CLI's ACP server (`agent acp`). Install with one command (`npx hermes-cursor-acp`) or `hermes plugins install cursor-acp`. The plugin rewrites `.cursor/cli.json` in an empty private workspace every run with a deny-all list (`Read`, `Write`, `Shell`, `WebFetch`, `Mcp`) to prevent Cursor's native CLI tools from accessing host files. It includes a custom extractor that recovers both flat `{\"name\", \"arguments\"}` and inline `<tool_call>` blocks that standard regex bridges drop, retries on concurrent `set_model` calls, and reports `usage=None` so Hermes proactive context compression functions correctly. Disclosure — sends the full conversation, Hermes tool schemas and tool results to Cursor through your locally installed, signed-in Cursor CLI (`agent acp`); Cursor's own tools are fenced by a deny-all `.cursor/cli.json` that the plugin rewrites in a private workspace under `$HERMES_HOME/cache/cursor-acp-workspace` on every start (a differing existing file is backed up to `cli.json.bak`), and Hermes executes every tool call under its own approvals."
description_tr: "Cursor abonelik modellerinizi (Claude Opus/Sonnet 5.5, Composer 2.5, GPT-5.6, Grok), Cursor CLI'nin ACP sunucusu (`agent acp`) aracılığıyla Hermes Agent içinde kullanın. Tek bir komutla kurun (`npx hermes-cursor-acp`) ya da `hermes plugins install cursor-acp`. Eklenti, her çalıştırmada boş bir özel çalışma alanındaki `.cursor/cli.json` dosyasını, her şeyi reddeden bir listeyle (`Read`, `Write`, `Shell`, `WebFetch`, `Mcp`) yeniden yazar; böylece Cursor'ın yerel CLI araçlarının konak dosyalarına erişmesi engellenir. Hem düz `{\"name\", \"arguments\"}` hem de satır içi `<tool_call>` bloklarını, standart regex köprülerinin attığı blokları geri kazanabilen özel bir çıkarıcı içerir; eşzamanlı `set_model` çağrılarında yeniden dener ve `usage=None` bildirir, böylece Hermes'in proaktif bağlam sıkıştırması düzgün çalışır. Açıklama — Tam konuşmayı, Hermes araç şemalarını ve araç sonuçlarını, yerel olarak kurulu ve oturum açılmış Cursor CLI'niz (`agent acp`) aracılığıyla Cursor'a gönderir; Cursor'ın kendi araçları, eklentinin her başlangıçta `$HERMES_HOME/cache/cursor-acp-workspace` altındaki özel bir çalışma alanında yeniden yazdığı her şeyi reddeden `.cursor/cli.json` dosyasıyla çevrelenir (farklı olan mevcut dosya `cli.json.bak` olarak yedeklenir) ve Hermes her araç çağrısını kendi onayları altında çalıştırır."
