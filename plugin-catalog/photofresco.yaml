sha: e2e3239b555742904b4cdd035aefdab717cd91a1
description: "Edit images in a PhotoFresco window you approve: layers, masks, selections, adjustment layers, previews and PNG/PSD export. Portable Agent Plugins v1 package (mcp.json + skills/) with a local stdio MCP server and bundled skill; needs Node.js 22+ and Chrome, Edge or Chromium 120+. Disclosure — opens https://photofresco.com/app/ (remote web editor, live code not covered by this pin) in a separate Chrome/Edge/Chromium profile under ~/.local/share/photofresco-connector (macOS ~/Library/Application Support/PhotoFresco Connector), with cookies/sign-in/autosave kept there; previews and document state the agent requests go to your model provider; with the Send/Spend permissions granted in the PhotoFresco window, AI ops spend PhotoFresco credits up to the budget you set and cloud/feedback ops send document data to PhotoFresco, and Hermes does not prompt before those calls; with Export granted, quick-export ops save to the browser's download folder; no local folders are readable or writable unless you add --read/--write yourself."
description_tr: "Onayladığınız bir PhotoFresco penceresinde görselleri düzenleyin: katmanlar, maskeler, seçimler, ayar katmanları, önizlemeler ve PNG/PSD dışa aktarımı. Yerel bir stdio MCP sunucusu ve paketlenmiş yetenek içeren taşınabilir Agent Plugins v1 paketi (mcp.json + skills/); Node.js 22+ ve Chrome, Edge veya Chromium 120+ gerektirir. Açıklama — https://photofresco.com/app/ adresini (uzak web düzenleyici, canlı kod bu sabitlemenin kapsamında değildir) ~/.local/share/photofresco-connector (macOS ~/Library/Application Support/PhotoFresco Connector) altında ayrı bir Chrome/Edge/Chromium profilinde açar; çerezler, oturum açma ve otomatik kaydetme orada tutulur; ajanın istediği önizlemeler ve belge durumu model sağlayıcınıza gider; PhotoFresco penceresinde verilen Gönder/Harca izinleriyle AI işlemleri belirlediğiniz bütçeye kadar PhotoFresco kredisi harcar ve bulut/geri bildirim işlemleri belge verilerini PhotoFresco'ya gönderir, Hermes bu çağrılardan önce sormaz; Dışa Aktar izniyle hızlı dışa aktarma işlemleri tarayıcının indirme klasörüne kaydeder; kendiniz --read/--write eklemedikçe hiçbir yerel klasör okunamaz veya yazılamaz."
