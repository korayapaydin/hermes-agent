name: spotify-desktop
repo: https://github.com/cruzlxyz/hermes-spotify-desktop
sha: 9b564d53c219f9962404dee5f84d3bbb47683897
description: 'Spotify Connect remote for Hermes Desktop — status-bar mini player (now playing,
  transport, volume, devices, search, playlists, queue) reusing the Hermes Spotify login
  (Spotify Premium required for playback control). Unified agent+desktop
  package: Electron status-bar player plus a dashboard-API backend (desktop-focused, no web UI).
  No agent tools; config via plugins.entries.spotify-desktop.settings (poll intervals).'
description_tr: "Hermes Desktop için Spotify Connect uzaktan kumandası — durum çubuğu mini oynatıcısı (şu an çalan, taşıma, ses, cihazlar, arama, çalma listeleri, kuyruk), Hermes'in Spotify girişini yeniden kullanır (oynatma denetimleri için Spotify Premium gerekir). Birleşik ajan+masaüstü paketi: Electron durum çubuğu oynatıcısı ve pano API arka ucu (masaüstü odaklı, web arayüzü yok). Ajan aracı yok; yapılandırma plugins.entries.spotify-desktop.settings ile yapılır (yoklama aralıkları)."
maintainer: cruzlxyz
tier: community
version: "0.1.2"
category: desktop
docs_url: https://github.com/cruzlxyz/hermes-spotify-desktop
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
  - "On Hermes releases where Spotify moved to the `spotify` plugin, the player needs spotify-desktop with cruzlxyz/hermes-spotify-desktop#2 plus `hermes plugins install spotify` (login: `hermes spotify login`); this pin predates that change."
