name: hermes-wslc-sandbox
repo: https://github.com/Yicheng-Mark/hermes-windows-plugins
sha: b26b92760b2bfc36a91c280af96b0171c4d00267
subdir: wslc-sandbox
version: "0.1.0"
description: "Run Hermes' terminal, file and execute_code tools in a Linux container on Microsoft's WSL Containers (wslc) runtime, so Windows users who run WSL Containers get a sandbox without Docker Desktop. Disclosure — the plugin spawns the wslc CLI (one short-lived process per command, plus one long-lived container per environment) and every call runs inside that container; containers have outbound network access unless docker_network is false; persistent sandboxes are left stopped on disk until removed; host environment variables enter the container only when named in docker_forward_env, and only paths listed in docker_volumes are bind-mounted. wslc rejects --cap-drop, --security-opt, --pids-limit, --init and --storage-opt, so this sandbox is not capability-dropped the way the Docker backend's is, container_disk is reported but not enforced, and dangerous-command approval deliberately stays enabled for this backend. The plugin reads no credentials, stores none, and makes no network calls of its own."
description_tr: "Hermes'in terminal, dosya ve execute_code araçlarını Microsoft'un WSL Containers (wslc) çalışma zamanında bir Linux konteynerinde çalıştırın; böylece WSL Containers çalıştıran Windows kullanıcıları Docker Desktop olmadan bir kum havuzu elde eder. Açıklama — eklenti wslc CLI'sini başlatır (komut başına kısa ömürlü bir süreç ve ortam başına uzun ömürlü bir konteyner) ve her çağrı o konteynerin içinde çalışır; docker_network false olmadıkça konteynerlerin dışa ağ erişimi vardır; kalıcı kum havuzları kaldırılana kadar diskte durdurulmuş olarak bırakılır; ana makine ortam değişkenleri konteynere yalnızca docker_forward_env içinde adlandırıldığında girer ve yalnızca docker_volumes içinde listelenen yollar bağlanır. wslc, --cap-drop, --security-opt, --pids-limit, --init ve --storage-opt seçeneklerini reddeder; bu yüzden bu kum havuzu Docker arka ucunun sahip olduğu yetenek düşürmesine sahip değildir, container_disk bildirilir ancak uygulanmaz ve tehlikeli komut onayı bu arka uç için bilerek açık kalır. Eklenti hiçbir kimlik bilgisini okumaz, saklamaz ve kendi adına hiçbir ağ çağrısı yapmaz."
maintainer: Yicheng-Mark
tier: community
