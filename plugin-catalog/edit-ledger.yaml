subdir: edit-ledger
description: "Local ledger of the turns in which the agent changed files with write_file or patch: /edit-log shows how many turns changed files, how many files in all, the median per turn, the most changed file type and how long ago the last one was, per model, platform or day, a table of file types (extensions), or the newest turns, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /edit-log recent lists the newest turns (ten, or up to 100 with /edit-log recent 50). A turn another plugin keeps going is counted once. Disclosure — subscribes to pre_verify as an observer only: always returns nothing, so it never keeps the agent going or changes a turn; writes turn metadata (model, platform, file count, files per extension, a 12-digit hash of the session id; never a path, file name or answer text) to plugin-data/edit-ledger/edits.jsonl, trimmed to 5,000 rows past 2 MB; never opens the changed files; no network"
description_tr: "Ajanın write_file veya patch ile dosya değiştirdiği turların yerel defteri: /edit-log dosya değiştiren tur sayısını, toplam dosya sayısını, tur başına medyanı, en çok değişen dosya türünü ve sonuncusunun ne kadar önce değiştiğini; model, platform ya da güne bazında; dosya türleri (uzantılar) tablosunu ya da en yeni turları; son 24 saat, istenen sayıda saat ya da gün, en son oturum veya kaydedilen her şey için gösterir; /edit-log recent en yeni turları listeler (on tane, ya da /edit-log recent 50 ile en fazla 100). Başka bir eklentinin devam ettirdiği bir tur bir kez sayılır. Açıklama — pre_verify'e yalnızca gözlemci olarak abone olur: her zaman hiçbir şey döndürmez, böylece ajanı asla devam ettirmez veya bir turu değiştirmez; tur meta verilerini (model, platform, dosya sayısı, uzantı başına dosyalar, oturum kimliğinin 12 haneli bir hash'i; asla bir yol, dosya adı veya yanıt metni) plugin-data/edit-ledger/edits.jsonl dosyasına yazar, 2 MB'ı aşınca 5.000 satıra kırpılır; değişen dosyaları asla açmaz; ağ yok."
