name: waypoint
repo: https://github.com/mochiNJ/hermes-waypoint
sha: 971bab6762466bfdf6036aeaeb35352d6308f61d
description: "Session status for Hermes Desktop: a thin bar next to every sidebar session with four states — Working (remembers your next step), Waiting on someone (who/what plus a follow-up reminder), Done (outcome plus a fresh-start handoff) and untracked. Suggests 3 next steps per session (instant quick ideas from the chat, opt-in AI ideas from the auxiliary model, priority colours) with one-click Ask, a Power up button that asks a strong model for sharper ideas on demand, and Mark complete to stop suggestions. Adds a Status Board page (columns, follow-ups due, stale sessions, archive all done), triage of untracked sessions, a resume banner above the composer, a status-bar counter, a daily summary, palette commands and English/Arabic (RTL). SDK-only: session-row slots, a route, sidebar nav, status bar, composer banner, palette. Disclosure — no network calls of its own (all model calls go through Hermes llm.oneshot); AI next-step suggestions are OFF by default; when enabled, after new replies (at most every 90 s) the plugin sends the focused session's last ~12 user/assistant messages (≤ ~7,000 chars) plus its title and the user's notes to the auxiliary task title_generation (Hermes default \"auto\" = your main model); Power up runs only when pressed — also with AI suggestions off — and sends a longer excerpt (last ~20 messages, ≤ ~12,000 chars) to the plugin's own auxiliary tasks waypoint_ideas / waypoint_ideas_2 (registered by __init__.py; unset they resolve to \"auto\" = your main model) or, for \"My chat model\", to the open session's model; an optional automatic big idea (off by default) uses the same choice at most every 10 minutes; Power up call log (2.5.0): the Python half also registers two observe-only hooks (pre_auxiliary_call, post_auxiliary_call) that ignore every auxiliary task except waypoint_ideas / waypoint_ideas_2 and, for those, write one line per call to the user's own Hermes log (logs/agent.log) and append a record to <HERMES_HOME>/plugin-data/waypoint/power-calls.jsonl (rolls over at ~1 MB): model, provider, reasoning effort, response time, token counts (logged as 'unknown' with a reason when Hermes reports none), finish reason and status — never prompt, message or reply text, nothing leaves the machine, and the hooks never modify a call; reads session history (session.history) and titles (session.list); statuses, notes and cached suggestion text are kept in desktop plugin storage; archives sessions only when you press Archive (undo offered) or confirm \"Archive N done\" on the board (no undo; sessions stay under Archived); posts in-app and native OS notifications for due reminders and a once-a-day local summary; writes composer drafts only on Ask / Insert / Start fresh session and never sends them."
description_tr: "Hermes Desktop için oturum durumu: her kenar çubuğu oturumunun yanında dört durumlu ince bir çubuk — Çalışıyor (bir sonraki adımınızı hatırlar), Birini bekliyor (kim/kim ne ve bir takip hatırlatması), Bitti (sonuç ve yeni başlangıç devri) ve izlenmiyor. Oturum başına 3 sonraki adım önerir (sohbetten anında hızlı fikirler, yardımcı modelden isteğe bağlı YZ fikirleri, öncelik renkleri) ve tek tıkla Sor, talep üzerine daha keskin fikirler için güçlü bir modele başvuran bir Güçlendir düğmesi ve önerileri durdurmak için Tamamlandı olarak işaretle sunar. Bir Durum Panosu sayfası (sütunlar, gelen takipler, bayat oturumlar, tamamlananların tümünü arşivle), izlenmemiş oturumların triyajı, yazma alanının üstünde bir devam banner'ı, bir durum çubuğu sayacı, günlük bir özet, palet komutları ve İngilizce/Arapça (RTL) ekler. Yalnızca SDK: oturum satırı yuvaları, bir rota, kenar çubuğu gezinmesi, durum çubuğu, yazma alanı banner'ı, palet. Açıklama — kendine ait ağ çağrısı yoktur (tüm model çağrıları Hermes llm.oneshot üzerinden gider); YZ sonraki adım önerileri varsayılan olarak KAPALIDIR; etkinleştirildiğinde, yeni yanıtlardan sonra (en fazla 90 saniyede bir) eklenti, odaklanmış oturumun son ~12 kullanıcı/asistan mesajını (≤ ~7.000 karakter) ve başlığını ve kullanıcının notlarını yardımcı title_generation görevine gönderir (Hermes varsayılanı \"auto\" = ana modeliniz); Güçlendir yalnızca basıldığında çalışır — YZ önerileri kapalıyken de — ve daha uzun bir alıntıyı (son ~20 mesaj, ≤ ~12.000 karakter) eklentinin kendi yardımcı görevlerine waypoint_ideas / waypoint_ideas_2 gönderir (__init__.py tarafından kaydedilir; ayarlanmamışsa \"auto\" = ana modeliniz olarak çözümlenir) veya \"My chat model\" için açık oturumun modeline; isteğe bağlı otomatik büyük fikir (varsayılan olarak kapalı) aynı seçimi en fazla 10 dakikada bir kullanır; Güçlendir çağrı günlüğü (2.5.0): Python tarafı ayrıca iki yalnızca gözlem kancası (pre_auxiliary_call, post_auxiliary_call) kaydeder; bunlar waypoint_ideas / waypoint_ideas_2 dışındaki her yardımcı görevi yok sayar ve bunlar için çağrı başına kullanıcının kendi Hermes günlüğüne (logs/agent.log) bir satır yazar ve <HERMES_HOME>/plugin-data/waypoint/power-calls.jsonl dosyasına bir kayıt ekler (~1 MB'da devreder): model, sağlayıcı, akıl yürütme eforu, yanıt süresi, token sayıları (Hermes hiç bildirmediğinde bir nedeniyle 'unknown' olarak günlüğe yazılır), bitiş nedeni ve durum — asla prompt, mesaj veya yanıt metni değil, hiçbir şey makineden çıkmaz ve kancalar bir çağrıyı asla değiştirmez; oturum geçmişini (session.history) ve başlıkları (session.list) okur; durumlar, notlar ve önbelleğe alınmış öneri metni masaüstü eklenti deposunda tutulur; oturumları yalnızca Arşivle'ye bastığınızda (geri alma sunulur) veya panoda \"Archive N done\" onayladığınızda arşivler (geri alma yok; oturumlar Arşivlenenler altında kalır); vadesi gelen hatırlatmalar ve günde bir yerel özet için uygulama içi ve yerel işletim sistemi bildirimleri gönderir; yazma alanı taslaklarını yalnızca Ask / Insert / Start fresh session durumlarında yazar ve asla göndermez."
