title: Hermes Mobile Adapter
description: "WebSocket platform for your own mobile, desktop or web app: it talks to the agent directly — text, voice, images, video and documents in both directions, approval/clarify/slash cards answered from the app, streaming edits, typing and avatar state events, cron delivery to a chosen device. On request it also answers command-catalog and model-list frames (commands from the agent's own registry, models from its model inventory) so a client renders command and model pickers from the agent's data instead of bundling a snapshot; auto-push after ready is off by default (MOBILE_CATALOG_AFTER_READY=1). Ships TypeScript and Python SDKs, platform guides and an acceptance checklist. Disclosure — opens a listening WebSocket server (plain ws://, no built-in TLS; 127.0.0.1:8787 by default, the wildcard address only when set, behind a wss proxy) guarded by MOBILE_TOKEN plus optional per-device tokens; anyone holding an unbound token can chat with the agent, run slash commands and answer the approval and clarify cards of the device id they connect as; device_id=token entries bind a token to one device. deliver frames are accepted only from loopback peers or MOBILE_DELIVER_TOKENS. Inbound media is written under $HERMES_HOME/mobile-media; secrets are read through Hermes's profile-scoped route; approvals resolve through Hermes's own resolvers; no telemetry, no third-party network calls, no self-update."
description_tr: "Kendi mobil, masaüstü ya da web uygulamanız için WebSocket platformu: doğrudan ajanla konuşur — metin, ses, görsel, video ve belgeler iki yönlü, uygulamadan yanıtlanan onay/açıklama/slash kartları, akışlı düzenlemeler, yazma durumu ve avatar durumu olayları, seçtiğiniz cihaza cron teslimatı. İstek üzerine komut kataloğu ve model listesi çerçevelerini de yanıtlar (komutlar ajanın kendi kaydından, modeller model envanterinden), böylece istemci komut ve model seçicilerini ajanın verisinden çizer; hazır olduktan sonra otomatik gönderim varsayılan olarak kapalıdır (MOBILE_CATALOG_AFTER_READY=1). TypeScript ve Python SDK'ları, platform rehberleri ve bir kabul denetim listesi ile gelir. Açıklama — MOBILE_TOKEN ve isteğe bağlı cihaz başına tokenlarla korunan bir dinleme WebSocket sunucusu açar (düz ws://, yerleşik TLS yok; varsayılan 127.0.0.1:8787, joker adres yalnızca ayarlandığında, bir wss vekili arkasında); bir cihaza bağlanmamış bir token'ı elinde tutan herkes ajanla sohbet edebilir, slash komutları çalıştırabilir ve bağlandığı cihaz kimliğinin onay ve açıklama kartlarını yanıtlayabilir; device_id=token girdileri bir token'ı tek bir cihaza bağlar. deliver çerçeveleri yalnızca loopback eşlerinden veya MOBILE_DELIVER_TOKENS'ten kabul edilir. Gelen medya $HERMES_HOME/mobile-media altına yazılır; gizli bilgiler Hermes'in profil kapsamlı yolu üzerinden okunur; onaylar Hermes'in kendi çözücüleri üzerinden sonuçlanır; telemetri, üçüncü taraf ağ çağrısı veya kendi kendini güncelleme yoktur."
