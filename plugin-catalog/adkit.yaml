description: "Manage ads on Google Ads, Meta Ads (Facebook, Instagram), TikTok, LinkedIn, Microsoft, Reddit and X Ads through the hosted AdKit MCP: launch campaigns, ad sets and ads as drafts, pull performance reports with breakdowns, browse competitor ads in the Meta, Google and LinkedIn ad libraries, and generate ad creatives. Built for people who run several ad accounts. Agent Plugins v1 package (plugin.json + mcp.json), configuration only; OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required. Disclosure — creates and edits real ad campaigns that spend your ad budgets (creates are drafts until you approve publishing); the package marks the adkit server untrusted, so Hermes asks before every tool the server does not annotate as read-only and refuses them in cron and headless runs. Every tool call goes to mcp.adkit.so; sign-in runs npx mcp-remote@0.1.49 from the npm registry, which stores its OAuth tokens in ~/.mcp-auth. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
description_tr: "Barındırılan AdKit MCP üzerinden Google Ads, Meta Ads (Facebook, Instagram), TikTok, LinkedIn, Microsoft, Reddit ve X Ads üzerindeki reklamları yönetin: kampanyaları, reklam setlerini ve reklamları taslak olarak başlatın, detaylı performans raporları alın, Meta, Google ve LinkedIn reklam kütüphanelerindeki rakip reklamlarına göz atın ve reklam görselleri oluşturun. Birden fazla reklam hesabı yöneten kişiler için tasarlanmıştır. Agent Plugins v1 paketi (plugin.json + mcp.json), yalnızca yapılandırma içerir; OAuth, npx stdio üzerinden sabitlenmiş mcp-remote@0.1.49 sürümünü kullanır, bu nedenle Node.js 20.18.1+ ve npm gereklidir. Açıklama — Reklam bütçelerinizi harcayan gerçek reklam kampanyaları oluşturur ve düzenler (oluşturulanlar siz yayınlamayı onaylayana kadar taslak halindedir); paket, adkit sunucusunu güvenilmez olarak işaretler, bu nedenle Hermes, sunucunun salt okunur olarak işaretlemediği her araçtan önce onay ister ve bunları cron ile başlıksız (headless) çalıştırmalarda reddeder. Her araç çağrısı mcp.adkit.so adresine gider; giriş işlemi npm kayıt defterinden npx mcp-remote@0.1.49 sürümünü çalıştırır ve OAuth belirteçlerini ~/.mcp-auth altında saklar. Araç seti çalışma zamanında uzak sunucu tarafından sağlanır ve sabitlenmiş sha kapsamına girmez."
