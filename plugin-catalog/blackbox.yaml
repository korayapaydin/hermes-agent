title: Agent Blackbox
description: "Security for agents: checks every tool call and model request before it runs against a curated, verifiable threat graph (prompt injection, dangerous commands, malicious packages, unsafe skills, phishing and drainer indicators) and local rules that keep an agent away from wallet stores, seed phrases, private keys and exchange API keys. Audit mode records; block mode refuses. Can share privacy-safe threat reports with an open community graph once the user turns sharing on (off by default); community findings only ever flag. Hooks only: no tools, no middleware. Disclosure — hooks see every tool call and model request; `hermes blackbox setup` installs Node (via a checksum-pinned nvm installer) if missing, the OriginTrail DKG node from npm (checksum-pinned) and Blazegraph in Docker or Oxigraph, registers the DKG node and the dashboard as login services (systemd/LaunchAgent), and joins the DKG peer-to-peer network; package installs are looked up on api.osv.dev (name and version); community threat reports signed by a local reporter key (threat identifiers, including domains of fetched pages that served a verified injection) are shared to the community graph only after you turn sharing on (off by default); the optional LLM reviewer sends the current turn's user and tool text to OpenAI or Anthropic; `blackbox attach` copies the plugin into the Hermes homes/profiles and OpenClaw workspaces you name and enables it in their config (automatic attaching is off unless you set `auto_attach: true`); `hermes blackbox chat` creates an `agent-blackbox` profile cloned from the current one (config.yaml and .env); the dashboard runs on 127.0.0.1:9700."
description_tr: "Ajanlar için güvenlik: her araç çağrısını ve model isteğini, çalıştırmadan önce özenle seçilmiş, doğrulanabilir bir tehdit grafiğine (prompt injection, tehlikeli komutlar, kötücül paketler, güvenli olmayan yetenekler, kimlik avı ve drainer göstergeleri) ve bir ajanı cüzdan depolarından, tohum ifadelerinden, özel anahtarlardan ve borsa API anahtarlarından uzak tutan yerel kurallara karşı denetler. Denetim modu kaydeder; engelleme modu reddeder. Kullanıcı paylaşımı açtığında (varsayılan olarak kapalı) gizliliğe saygılı tehdit raporlarını açık bir topluluk grafiğiyle paylaşabilir; topluluk bulguları yalnızca işaretler. Yalnızca hook'lar: araç yok, middleware yok. Açıklama — kancalar her araç çağrısını ve model isteğini görür; `hermes blackbox setup` eksikse Node'u (sağlama toplamıyla sabitlenmiş bir nvm yükleyicisiyle), npm'den OriginTrail DKG düğümünü (sağlama toplamıyla sabitlenmiş) ve Docker içinde Blazegraph'ı ya da Oxigraph'ı kurar, DKG düğümünü ve panoyu oturum açma hizmetleri olarak kaydeder (systemd/LaunchAgent) ve DKG eşler arası ağına katılır; paket kurulumları api.osv.dev üzerinde aranır (ad ve sürüm); yerel bir raportör anahtarıyla imzalanan topluluk tehdit raporları (doğrulanmış bir enjeksiyona hizmet vermiş getirilen sayfaların alan adları dahil tehdit tanımlayıcıları) yalnızca siz paylaşımı açtıktan sonra topluluk grafiğiyle paylaşılır (varsayılan olarak kapalı); isteğe bağlı LLM inceleyicisi mevcut turun kullanıcı ve araç metnini OpenAI veya Anthropic'e gönderir; `blackbox attach` eklentiyi adlandırdığınız Hermes evlerine/profillerine ve OpenClaw çalışma alanlarına kopyalar ve yapılandırmalarında etkinleştirir (otomatik iliştirme, `auto_attach: true` ayarlamadıkça kapalıdır); `hermes blackbox chat` mevcut olandan klonlanmış bir `agent-blackbox` profili oluşturur (config.yaml ve .env); pano 127.0.0.1:9700 üzerinde çalışır."
