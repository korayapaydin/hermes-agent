  - "After installing, run `hermes blackbox setup` once: it installs Blackbox's local DKG node (a pinned, checksum-verified OriginTrail release from npm) and its graph store (Blazegraph in Docker, or Oxigraph when Docker is not available), then syncs the verified threat graph. Until setup has run, the built-in rules protect and `hermes blackbox status` says setup is needed."
