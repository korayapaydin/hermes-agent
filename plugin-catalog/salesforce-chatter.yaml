title: Salesforce Chatter
description: "Talk to Hermes from Salesforce Chatter: @mention the bot user in a post or comment, it Likes the message as an acknowledgement and replies in the same thread, keeping the thread as one session. Images and files on the post are passed to the model; MEDIA files are attached back. Community plugin, not affiliated with Salesforce. Disclosure — authenticates as a dedicated bot user with the OAuth 2.0 JWT bearer flow, reading the private key file at SF_CHATTER_PRIVATE_KEY_PATH; talks to the configured Salesforce login host and the org instance (attachment downloads follow Salesforce redirects); image URLs in the agent's replies are fetched from the gateway host over HTTPS (any public host; private, loopback and metadata addresses are refused) and uploaded to Chatter; polls the To Me feed every 60 s and, for allowlisted groups, runs a SOQL probe every 5 s by default (counts against the org API quota); writes Likes, comments, files in the bot user's Files and optional home-channel posts; keeps its ledger in plugin-data/salesforce-chatter/inbox.sqlite. dry_run defaults to true (no Salesforce writes, no outbound image fetch); with SF_CHATTER_ALLOWED_USERS unset nobody is answered. Optional, off by default: html_preview renders model-generated HTML to PNG with Chromium in a network-isolated Docker container (digest-pinned image, pulled if missing). No telemetry."
description_tr: "Salesforce Chatter'dan Hermes ile konuşun: bir gönderi ya da yorumda bot kullanıcısını @mention edin; mesajı onay olarak Like'lar ve aynı iş parçacığında yanıtlar, iş parçacığını tek bir oturum olarak tutar. Gönderideki görseller ve dosyalar modele aktarılır; MEDIA dosyaları geri eklenir. Topluluk eklentisi, Salesforce ile bağlantılı değildir. Açıklama — OAuth 2.0 JWT bearer akışıyla özel bir bot kullanıcısı olarak kimlik doğrular ve SF_CHATTER_PRIVATE_KEY_PATH konumundaki özel anahtar dosyasını okur; yapılandırılmış Salesforce oturum açma ana bilgisayarı ve kuruluş örneğiyle konuşur (ek indirmeleri Salesforce yönlendirmelerini izler); ajanın yanıtlarındaki görsel URL'leri ağ geçidi ana bilgisayarından HTTPS üzerinden çekilir (herkese açık herhangi bir ana bilgisayar; özel, geri döngü ve meta veri adresleri reddedilir) ve Chatter'a yüklenir; To Me akışını her 60 saniyede bir yoklar ve izin listesindeki gruplar için varsayılan olarak her 5 saniyede bir SOQL sorgusu çalıştırır (kuruluş API kotasından düşer); Like'ları, yorumları, bot kullanıcısının Files alanındaki dosyaları ve isteğe bağlı ana kanal gönderilerini yazar; defterini plugin-data/salesforce-chatter/inbox.sqlite içinde tutar. dry_run varsayılan olarak true'dur (Salesforce'a yazma yok, giden görsel çekme yok); SF_CHATTER_ALLOWED_USERS ayarlanmamışsa kimseye yanıt verilmez. İsteğe bağlı, varsayılan olarak kapalı: html_preview, model tarafından üretilen HTML'yi ağdan yalıtılmış bir Docker konteynerinde Chromium ile PNG'ye dönüştürür (digest ile sabitlenmiş imaj, yoksa çekilir). Telemetri yok."
