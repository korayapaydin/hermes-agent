name: gigamail
repo: https://github.com/adecubed/hermes-plugin-gigamail
sha: a056fe1a5ac09595a97952ab6062dba7504b57af
description: >-
  Email and calendar through an existing local GigaMail MCP server, with a
  workflow skill and stdio launcher. Requires Python and a separately
  configured backend; no automatic backend installation or updates. Reads
  real mail and attachments; sending, deletion and calendar writes use
  GigaMail's out-of-band human approval. Disclosure — a thin stdio launcher for the
  separately installed GigaMail MCP server from Adecubed inc. (gigamail.ai,
  github.com/adecubed/gigamail, same author as this plugin); the plugin holds no mail logic
  or credentials and downloads nothing, but it starts that third-party executable from PATH
  or a configured path, points it at GigaMail's own data directory under your user profile
  (%APPDATA%\ADE or ~/.ade), and send, delete and calendar writes are gated by that backend's
  out-of-band approval rather than by Hermes.
description_tr: "Mevcut yerel GigaMail MCP sunucusu üzerinden e-posta ve takvim; bir iş akışı yeteneği ve stdio başlatıcısıyla. Python ve ayrıca yapılandırılmış bir arka uç gerekir; otomatik arka uç kurulumu ya da güncellemesi yoktur. Gerçek postaları ve ekleri okur; gönderme, silme ve takvim yazma işlemleri GigaMail'in bant dışı insan onayını kullanır. Açıklama — Adecubed inc. tarafından ayrıca kurulan GigaMail MCP sunucusu için ince bir stdio başlatıcısıdır (gigamail.ai, github.com/adecubed/gigamail, bu eklentiyle aynı yazar); eklenti hiçbir posta mantığı ya da kimlik bilgisi tutmaz ve hiçbir şey indirmez, ancak bu üçüncü taraf çalıştırılabilir dosyasını PATH'ten ya da yapılandırılmış bir yoldan başlatır, onu kullanıcı profiliniz altındaki GigaMail'in kendi veri dizinine (%APPDATA%\\ADE veya ~/.ade) yönlendirir ve gönderme, silme ile takvim yazma işlemleri Hermes yerine o arka ucun bant dışı onayıyla denetlenir."
