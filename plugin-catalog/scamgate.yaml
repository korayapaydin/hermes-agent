name: scamgate
repo: https://github.com/odaiameera/scamgate
sha: 297299b5b44153b5a255a2ad512ef26f9f21fb4f
subdir: src/scamgate
description: "Offline scam gate. Blocks known-bad links and payments before a tool runs, and asks a human when it cannot see the destination. Disclosure — blocks agent tool calls that would edit Hermes config/profiles/plugins/hooks or turn approvals off, and with approvals off turns its \"ask\" into a block (setting when_approvals_off: allow restores asks); keeps its signing key and ask log under ~/.local/state/scamgate and phishing feeds under ~/.cache/scamgate (not per-profile); feeds download only when you run `scamgate update-feeds` (openphish.com, Phishing-Database on GitHub, optional urlhaus); optional SCAMGATE_RDAP=live sends each checked link's domain to its RDAP registry."
description_tr: "Çevrimdışı dolandırıcılık kapısı. Bilinen kötü bağlantıları ve ödemeleri bir araç çalışmadan önce engeller ve hedefi göremediğinde bir insana sorar. Açıklama — Hermes yapılandırmasını/profillerini/eklentilerini/kancalarını düzenleyecek veya onayları kapatacak ajan araç çağrılarını engeller ve onaylar kapalıyken \"sor\" davranışını bir engellemeye dönüştürür (when_approvals_off: allow ayarı soruları geri getirir); imzalama anahtarını ve soru günlüğünü ~/.local/state/scamgate, kimlik avı akışlarını ~/.cache/scamgate altında tutar (profil başına değil); akışlar yalnızca `scamgate update-feeds` çalıştırdığınızda iner (openphish.com, GitHub'daki Phishing-Database, isteğe bağlı urlhaus); isteğe bağlı SCAMGATE_RDAP=live, denetlenen her bağlantının alan adını RDAP kaydına gönderir."
maintainer: odaiameera
tier: community
category: tools
requires_hermes: ">=0.19.1"
version: "0.3.1"
docs_url: https://github.com/odaiameera/scamgate
readme: true
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - scamgate_check_url
    - scamgate_check_payment
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
