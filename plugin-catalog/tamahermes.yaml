name: tamahermes
repo: https://github.com/ahrazzle/TamaHermes
subdir: plugins/tamahermes
sha: d25f76fdf5d8032910ffbe1dca3ba00bf442061f
description: >-
  Grow a local TamaHermes pet from real Hermes agent activity. Disclosure — hooks write a pet
  ledger and sprite atlas under $HERMES_HOME only; the optional python -m tamahermes CLI
  additionally reads/writes ~/.codex, ~/.petdex and ~/.evopet, runs an unauthenticated loopback
  preview server (127.0.0.1:8765) and on macOS compiles a Swift overlay and installs a
  RunAtLoad+KeepAlive LaunchAgent with no uninstall command. No network egress, no credential
  reads.
description_tr: "Gerçek Hermes ajan etkinliğinden yerel bir TamaHermes evcil hayvanı büyütün. Açıklama — hook'lar yalnızca $HERMES_HOME altına bir evcil hayvan defteri ve sprite atlası yazar; isteğe bağlı python -m tamahermes CLI'si ayrıca ~/.codex, ~/.petdex ve ~/.evopet okur/yazar, kimlik doğrulaması olmayan bir geri döngü önizleme sunucusu çalıştırır (127.0.0.1:8765) ve macOS'ta bir Swift katmanı derleyip kaldırma komutu olmayan bir RunAtLoad+KeepAlive LaunchAgent kurar. Ağ çıkışı yok, kimlik bilgisi okuma yok."
maintainer: ahrazzle
tier: community
category: general
requires_hermes: ">=0.21"
docs_url: https://github.com/ahrazzle/TamaHermes
version: "1.2.3"
readme: true
platforms:
  - macos
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - post_tool_call
    - post_api_request
    - on_session_end
  provides_middleware: []
  requires_env: []
