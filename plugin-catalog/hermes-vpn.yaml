name: hermes-vpn
repo: https://github.com/Maytrella007/Hermes-VPN
sha: adc6ba81afe3071223d50cde18c41e1adee25261
description: "Named network exits for the agent's browser: ask it to browse from another country and it switches, then verifies by reading back the address the far end actually saw, never trusting a label. Any VPN, WireGuard config or proxy works as a local exit; gluetun containers are discovered automatically and one can be brought up on demand. VPN credentials never reach the agent, the chat or the model. Disclosure -- a root-owned helper, installed out of band by the user through a narrow exact-path sudoers rule, is the only thing that reads the credentials and writes them to a root-only file (the agent names a country, never the key), and it pulls the gluetun image pinned by digest; the helper manages gluetun Docker containers, bringing exits up and down; the plugin registers a tool_execution middleware that holds browser_* calls when no verified exit is up (the kill switch, and optional cross-provider failover); it verifies exits by calling public IP-geolocation services (ipinfo, ifconfig.co, ip2location, cloudflare); credential entry is CLI-only, with no model tool for it -- `hermes vpn provider <name> --set` (interactive) or `--from-ref`, which resolves a WireGuard config from pass/gopass or a host file host-side and never returns it to the model; opening a .onion needs `hermes vpn allow-onion`, a terminal command a person runs (no model tool) that turns off Hermes's own internal-address check so onion names resolve and restarts Hermes, and the plugin never writes that setting itself; the active profile comes from the plugin context (ctx.profile_name), not a private core import."
description_tr: "Ajanın tarayıcısı için adlandırılmış ağ çıkışları: Ondan başka bir ülkeden göz atmasını isteyin, o da geçiş yapar ve ardından uzak ucun gerçekte gördüğü adresi geri okuyarak bunu doğrular, asla bir etikete güvenmez. Herhangi bir VPN, WireGuard yapılandırması veya proxy yerel bir çıkış olarak çalışır; gluetun konteynerleri otomatik olarak keşfedilir ve talep üzerine biri başlatılabilir. VPN kimlik bilgileri asla ajana, sohbete veya modele ulaşmaz. Açıklama -- Kullanıcı tarafından dar bir kesin-yol sudoers kuralı ile bant dışı olarak yüklenen, root sahipliğindeki bir yardımcı, kimlik bilgilerini okuyan ve onları yalnızca root'un erişebildiği bir dosyaya yazan tek şeydir (ajan bir ülke adlandırır, asla anahtarı değil) ve digest ile sabitlenmiş gluetun imajını çeker; yardımcı, gluetun Docker konteynerlerini yönetir, çıkışları açıp kapatır; eklenti, doğrulanmış bir çıkış açık değilken browser_* çağrılarını tutan bir tool_execution ara yazılımı (kill switch ve isteğe bağlı sağlayıcılar arası yedekleme) kaydeder; çıkışları genel IP-coğrafi konum servislerini (ipinfo, ifconfig.co, ip2location, cloudflare) çağırarak doğrular; kimlik bilgisi girişi yalnızca CLI üzerinden yapılır, bunun için bir model aracı yoktur -- `hermes vpn provider <name> --set` (etkileşimli) veya `--from-ref` (bir WireGuard yapılandırmasını pass/gopass'ten veya host tarafındaki bir dosyadan çözer ve bunu asla modele döndürmez); bir .onion açmak `hermes vpn allow-onion` gerektirir; bu, bir kişinin çalıştırdığı bir terminal komutudur (model aracı değildir), Hermes'in kendi dahili-adres kontrolünü kapatarak onion adlarının çözülmesini sağlar ve Hermes'i yeniden başlatır, eklenti bu ayarı asla kendisi yazmaz; aktif profil, özel bir çekirdek iç aktarımıyla değil, eklenti bağlamından (ctx.profile_name) gelir."
maintainer: Maytrella007
tier: community
category: web
