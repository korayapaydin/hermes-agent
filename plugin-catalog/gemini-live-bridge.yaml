sha: a0016e33244ff2f74fd33bae1869e4a8c06f5034
description: >-
  Realtime duplex voice chat with the Gemini Live API — a status-bar minibar for the Hermes
  desktop app (transcript, model catalog, thinking level, session token meter, auto-redial via
  session resumption). Full-proxy architecture: the plugin backend owns the upstream Live
  WebSocket and the user's key (requires_env GOOGLE_API_KEY); the desktop UI only talks to
  localhost and receives single-use ephemeral tokens. No agent tools; desktop-focused, dashboard
  tab hidden. Disclosure — pressing Start captures microphone audio and streams it through the
  local backend to generativelanguage.googleapis.com using GOOGLE_API_KEY (or GEMINI_API_KEY) from
  the environment; input/output transcripts are held in backend memory for the session, and a
  Gemini session-resumption handle is written to .resume.json inside the plugin's install
  directory.
description_tr: "Gemini Live API ile gerçek zamanlı çift yönlü sesli sohbet — Hermes masaüstü uygulaması için durum çubuğu minibarı (döküm, model kataloğu, düşünme düzeyi, oturum token sayacı, oturum yeniden başlatmayla otomatik yeniden arama). Tam vekil mimarisi: eklenti arka ucu üst düzey Live WebSocket'ini ve kullanıcının anahtarını sahiplenir (requires_env GOOGLE_API_KEY); masaüstü arayüzü yalnızca localhost ile konuşur ve tek kullanımlık geçici token'lar alır. Ajan aracı yok; masaüstü odaklıdır, pano sekmesi gizlidir. Açıklama — Başlat düğmesine basmak mikrofon sesini yakalar ve yerel arka uç üzerinden, ortamdan alınan GOOGLE_API_KEY (veya GEMINI_API_KEY) kullanılarak generativelanguage.googleapis.com adresine akıtır; giriş/çıkış dökümleri oturum boyunca arka uç belleğinde tutulur ve bir Gemini oturum devam ettirme tutamacı, eklentinin kurulum dizinindeki .resume.json dosyasına yazılır."
