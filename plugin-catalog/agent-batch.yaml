name: agent-batch
repo: https://github.com/raaaas/hermes-agent-batch
sha: "064afc5dba8869df703ba055aa2760730c0d30dc"
subdir: plugin
description: "Parallel AI task orchestrator. Paste a task list into the desktop panel; Hermes phases it into dependency-ordered groups through the agent_batch_plan / agent_batch_phase tools (or you group it yourself in one click), then each phase dispatches one independent coding agent per task to a GitHub Actions workflow in a repo you name — own branch, own PR — and the panel tracks the runs and the PRs. GITHUB_TOKEN is the only required credential; AGENT_BATCH_REPO, AGENT_BATCH_WORKFLOW, AGENT_BATCH_MODEL and AGENT_BATCH_STATE are optional (the last is a directory override for the plan file, not a secret) and each can be set per plan in the panel instead. Disclosure — Hermes can read and rewrite the stored phase plan through the agent_batch_plan / agent_batch_phase tools, but dispatch is always a confirmed click in the panel. Each dispatch fires a GitHub workflow_dispatch with your GITHUB_TOKEN (Actions + pull-requests write) on the repo you name. The workflow you copy into that repo installs third-party coding-agent CLIs (cline by default; the others are unpinned npm packages) and runs them unattended, with auto-approve / skip-permissions, repo write access and your provider secrets. They push real branches and open real PRs, and your task text and repository code go to that runner's model vendor. LLM cost belongs to the runner: cline spends Cline Credits or a BYOK key, opencode free models need its zen relay, kilo needs an active Kilo Go subscription (keyless CI runs fail), and claude-code / codex / dsh need their own keys."
description_tr: "Paralel YZ görev düzenleyicisi. Görev listesini masaüstü paneline yapıştırın; Hermes bunu agent_batch_plan / agent_batch_phase araçlarıyla bağımlılık sırasına göre gruplara böler (ya da siz tek tıkla gruplarsınız), sonra her aşama, adını verdiğiniz depodaki bir GitHub Actions iş akışına görev başına bir bağımsız kodlama ajanı gönderir — kendi dalı, kendi PR'ı — ve panel koşuları ile PR'ları izler. Gerekli tek kimlik bilgisi GITHUB_TOKEN'dur; AGENT_BATCH_REPO, AGENT_BATCH_WORKFLOW, AGENT_BATCH_MODEL ve AGENT_BATCH_STATE isteğe bağlıdır (sonuncusu plan dosyası için bir dizin geçersiz kılmasıdır, sır değil) ve her biri bunun yerine panelde plan başına ayarlanabilir. Açıklama — Hermes, saklanan aşama planını agent_batch_plan / agent_batch_phase araçlarıyla okuyabilir ve yeniden yazabilir, ancak gönderim her zaman panelde onaylanmış bir tıklamadır. Her gönderim, adını verdiğiniz depoda GITHUB_TOKEN'ınızla (Actions + pull-requests yazma) bir GitHub workflow_dispatch tetikler. O depoya kopyaladığınız iş akışı, üçüncü taraf kodlama ajanı CLI'lerini kurar (varsayılan olarak cline; diğerleri sabitlenmemiş npm paketleridir) ve bunları otomatik onay / izinleri atla, depo yazma erişimi ve sağlayıcı sırlarınızla gözetimsiz çalıştırır. Gerçek dallar push eder ve gerçek PR'lar açar; görev metniniz ve depo kodunuz o runner'ın model satıcısına gider. LLM maliyeti runner'a aittir: cline Cline Credits veya bir BYOK anahtarı harcar, opencode ücretsiz modelleri zen aktarma sunucusuna ihtiyaç duyar, kilo etkin bir Kilo Go aboneliği gerektirir (anahtarsız CI koşuları başarısız olur) ve claude-code / codex / dsh kendi anahtarlarına ihtiyaç duyar."
