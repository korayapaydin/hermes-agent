title: Brazilian Portuguese (Português do Brasil) Language Pack
description: "Brazilian Portuguese (pt-BR) language pack for Hermes Agent covering all three UI surfaces — core CLI/gateway/platforms (3,477/3,477 keys), the Ink TUI (1,356/1,356) and the Desktop app (5,172/5,176). Every translatable key exists and every value is translated against the English source of `main`: no key upstream has since removed, zero placeholder divergence, and the four remaining Desktop keys are arrays/structured values a text pack cannot carry. Checked with `hermes plugins validate` and with the pack's own `tools/verify_pack.py`, which also runs as public CI on every push. Core and TUI mirror the bundled `pt` locale, registered as a real `pt-br` variant so it wins over the `pt`/`pt-BR` alias; the Desktop catalog is the original contribution (first proposed upstream in PR #92590, 2026-08-23), since the Desktop app ships no Portuguese at all. Manifest-only plugin: flat dotted YAML catalogs under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `hermes config set display.language pt-br`. A weekly drift workflow reports when `main` adds or drops keys; nothing self-updates. Tradução pt-BR da interface do Hermes Agent."
description_tr: "Brezilya Portekizcesi (pt-BR) dil paketi, Hermes Agent'in üç arayüz yüzeyini de kapsar — çekirdek CLI/ağ geçidi/platformlar (3,477/3,477 anahtar), Ink TUI (1,356/1,356) ve Desktop uygulaması (5,172/5,176). Her çevrilebilir anahtar mevcuttur ve her değer `main`'in İngilizce kaynağına karşı çevrilmiştir: upstream'in sonradan kaldırdığı hiçbir anahtar yok, yer tutucu farkı sıfır ve kalan dört Desktop anahtarı, bir metin paketinin taşıyamayacağı dizi/yapılandırılmış değerlerdir. `hermes plugins validate` ile ve paketin kendi `tools/verify_pack.py` aracıyla denetlendi; bu araç her push'ta herkese açık CI olarak da çalışır. Çekirdek ve TUI, paketlenmiş `pt` yerelini yansıtır ve `pt`/`pt-BR` takma adının önüne geçmesi için gerçek bir `pt-br` varyantı olarak kaydedilir; Desktop kataloğu asıl katkıdır (ilk kez upstream'de PR #92590, 2026-08-23 tarihinde önerildi), çünkü Desktop uygulaması hiç Portekizce göndermez. Yalnızca manifest eklentisi: locales/ altında düz noktalı YAML katalogları, kod yok, ağ yok, bağımlılık yok. Paketi kaydetmek hiçbir zaman display.language değerini değiştirmez — kullanıcı `hermes config set display.language pt-br` ile seçer. Haftalık sapma iş akışı, `main` anahtar eklediğinde ya da kaldırdığında bildirir; hiçbir şey kendini güncellemez. Hermes Agent arayüzünün pt-BR çevirisi."
