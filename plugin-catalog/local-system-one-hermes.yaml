subdir: integrations/hermes/local-system-one-hermes
description: >-
  Local System One / Laya Typed Decisions control plane for Hermes Agent. Sends bounded turn data to
  a configurable sidecar for reversible OFF/Shadow/Canary routing decisions, with explicit Canary
  acknowledgement and fail-open behavior. Disclosure — executes nothing and does not start the
  sidecar. In Shadow/Canary mode, Search and Model Tier may POST the current task plus bounded recent
  conversation context; Notification Shadow may POST the completed turn's final assistant response
  (up to 6000 chars) plus lifecycle metadata. The default sidecar URL is loopback
  127.0.0.1:8787 but is user-configurable to any host and no auth header is added. Notification is
  observation-only: the plugin never sends a push/message/webhook and persists decision metadata,
  not raw response text. Its only request mutations, in acknowledged Canary mode on the first
  provider call of a turn, are removing web_search/web_extract tools for audited deterministic
  no-Web rules and (off by default) lowering reasoning_effort for gemini-3.8-flash-tiered on audited
  hard-fast rules. The sidecar (same repo, separate pip install, Apple-Silicon MLX/CoreML) is a text
  classifier that downloads a pinned Hugging Face model.
description_tr: "Hermes Agent için yerel System One / Laya tipli karar denetim düzlemi. Sınırlı tur verisini, geri alınabilir OFF/Shadow/Canary yönlendirme kararları için yapılandırılabilir bir yan sürece gönderir; açık Canary onayı ve hata durumunda açık kalma davranışı vardır. Açıklama — hiçbir şey yürütmez ve yan süreci başlatmaz. Shadow/Canary kipinde Search ve Model Tier, geçerli görevi ve sınırlı son sohbet bağlamını POST edebilir; Notification Shadow, tamamlanan turun son asistan yanıtını (6.000 karaktere kadar) ve yaşam döngüsü üst verilerini POST edebilir. Varsayılan yan süreç URL'i döngüsel 127.0.0.1:8787'dir ancak kullanıcı tarafından herhangi bir ana makineye ayarlanabilir ve hiçbir kimlik doğrulama başlığı eklenmez. Bildirim yalnızca gözlem amaçlıdır: eklenti asla push/mesaj/webhook göndermez ve ham yanıt metnini değil, karar üst verilerini kalıcılaştırır. İsteklerde yaptığı tek değişiklikler, onaylanmış Canary kipinde bir turun ilk sağlayıcı çağrısında, denetlenmiş, deterministik web kullanmayan kurallar için web_search/web_extract araçlarını kaldırmak ve (varsayılan olarak kapalı) denetlenmiş hızlı-sabit kurallar için gemini-3.8-flash-tiered üzerinde reasoning_effort değerini düşürmektir. Yan süreç (aynı depo, ayrı pip kurulumu, Apple Silicon MLX/CoreML) sabitlenmiş bir Hugging Face modeli indiren bir metin sınıflandırıcısıdır."
