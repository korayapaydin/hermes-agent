description: "Token consumption analytics for Hermes: records exact per-call usage from pre/post_api_request hooks, decomposes every request into categories (system prompt, built-in and per-MCP-server tool schemas, skills, memory, history, tool results, output, reasoning) calibrated to billed totals, and adds a Token Lens dashboard tab plus a Sessions-page card with deterministic and AI-evaluated token-reduction suggestions; `hermes token-lens refresh` runs a suggestion refresh from the CLI. Disclosure — records per-API-call token counts (no message text) from pre/post_api_request hooks into token_lens.db at the Hermes home root (per-call rows kept 90 days, rollups kept), and reads Hermes's state.db read-only for session token totals and, during the optional dashboard history import, message text for estimation only; after 10 recorded sessions it automatically calls your configured main model through Hermes's plugin LLM facade every 5 sessions (up to two calls per refresh, capped at 50,000 tokens by meta_budget_tokens), sending aggregated token statistics plus the names of your enabled MCP servers and plugins, and auto-applies the model's proposed category regex rules and rubric changes (logged to token_lens.EVOLUTION.md; evolve_rules: false turns this off); the dashboard's refresh button spawns a detached `hermes token-lens refresh` process that logs to logs/token-lens-refresh.log; its data paths follow the HERMES_HOME environment variable rather than the active profile, so in a multi-profile gateway every profile records into the launch profile's database; no third-party network calls, no telemetry."
description_tr: "Hermes için token tüketim analizleri: pre/post_api_request kancalarından her çağrı başına kesin kullanımı kaydeder, her isteği faturalandırılan toplamlarla kalibre edilmiş kategorilere (sistem promptu, yerleşik ve MCP-sunucusu başına araç şemaları, yetenekler, bellek, geçmiş, araç sonuçları, çıktı, akıl yürütme) ayırır; bir Token Lens dashboard sekmesi ve deterministik ve AI tarafından değerlendirilen token azaltma önerileri sunan bir Oturumlar sayfası kartı ekler; `hermes token-lens refresh` CLI üzerinden bir öneri yenilemesi çalıştırır. Bilgilendirme — pre/post_api_request kancalarından (mesaj metni olmadan) API çağrısı başına token sayılarını Hermes ana kök dizinindeki token_lens.db'ye kaydeder (çağrı satırları 90 gün, özetler kalıcı tutulur) ve oturum token toplamları için Hermes'in state.db'sini yalnızca okuma modunda, isteğe bağlı dashboard geçmişi içe aktarımı sırasında ise tahmin amacıyla mesaj metnini okur; 10 kayıtlı oturumdan sonra her 5 oturumda bir, Hermes'in eklenti LLM arayüzü üzerinden yapılandırdığınız ana modeli otomatik olarak çağırır (yenileme başına en fazla iki çağrı, meta_budget_tokens ile 50.000 token ile sınırlandırılmıştır), toplu token istatistiklerini ve etkinleştirilen MCP sunucuları ile eklentilerinizin adlarını gönderir ve modelin önerdiği kategori regex kurallarını ve rubric değişikliklerini otomatik olarak uygular (token_lens.EVOLUTION.md'ye kaydedilir; evolve_rules: false bunu kapatır); dashboard'un yenileme butonu, logs/token-lens-refresh.log dosyasına kayıt yapan ayrı bir `hermes token-lens refresh` işlemi başlatır; veri yolları aktif profilden ziyade HERMES_HOME ortam değişkenini izler, dolayısıyla çok profilli bir ağ geçidinde her profil başlatma profilinin veritabanına kaydeder; üçüncü taraf ağ çağrıları ve telemetri yoktur."
