name: hermes-seo
title: Hermes SEO
repo: https://github.com/yuzushi-dev/hermes-seo
sha: 540b657852234b5be21286760d1ec55e9175de02
version: "0.1.2"
description: "Native Hermes port of Claude SEO 2.4.2: 45 SEO workflow and specialist skills, a credential-scoped hermes_seo_run tool, an isolated Python runtime, and advisory JSON-LD feedback. Derived from Claude SEO 2.4.2 (MIT; FLOW prompt materials CC BY 4.0). Disclosure — derived from Claude SEO 2.4.2 (MIT; FLOW prompt materials CC BY 4.0); the hermes_seo_run tool starts local subprocesses in the Hermes host process, not a Docker terminal sandbox, and model-supplied script arguments may name host paths, so it can read host files (the Gemini image-edit utility uploads the named file to Google, the IndexNow utility reads a URL-list file); `hermes seo setup` downloads Python packages from PyPI within version ranges into a private environment and optionally Chromium through Playwright; audits fetch user-selected websites; separately configured providers (Moz, Bing Webmaster, Keywords Everywhere, Google APIs, Matomo, DataForSEO, IndexNow, Google Gemini) receive the data sent to them and may incur charges; skills ask before paid or mutating calls but the tool does not enforce approvals; Gemini images are saved to ~/Documents/nanobanana_generated, and other runtime state stays in Hermes plugin data storage; provider keys are read from the active Hermes profile and passed only to the script that needs them; Google OAuth workflows are disabled; no telemetry, bundled credentials, background process or self-updater."
description_tr: "Claude SEO 2.4.2'nin yerel Hermes portu: 45 SEO iş akışı ve uzman yeteneği, kimlik bilgisi kapsamlı bir hermes_seo_run aracı, yalıtılmış bir Python çalışma zamanı ve öneri niteliğinde JSON-LD geri bildirimi. Claude SEO 2.4.2'den türetildi (MIT; FLOW istem materyalleri CC BY 4.0). Açıklama — Claude SEO 2.4.2'den türetildi (MIT; FLOW istem materyalleri CC BY 4.0); hermes_seo_run aracı, Docker terminal korumalı alanında değil Hermes ana makine sürecinde yerel alt süreçler başlatır ve model tarafından sağlanan betik bağımsız değişkenleri ana makine yollarını adlandırabilir; bu yüzden ana makine dosyalarını okuyabilir (Gemini görüntü düzenleme yardımcı programı adlandırılan dosyayı Google'a yükler, IndexNow yardımcı programı bir URL listesi dosyası okur); `hermes seo setup`, Python paketlerini PyPI'dan sürüm aralıkları içinde özel bir ortama ve isteğe bağlı olarak Playwright aracılığıyla Chromium'u indirir; denetimler kullanıcının seçtiği web sitelerini getirir; ayrı ayrı yapılandırılmış sağlayıcılar (Moz, Bing Webmaster, Keywords Everywhere, Google APIs, Matomo, DataForSEO, IndexNow, Google Gemini) kendilerine gönderilen verileri alır ve ücret doğurabilir; yetenekler ücretli veya değişiklik yapan çağrılardan önce sorar ama araç onayları zorunlu kılmaz; Gemini görselleri ~/Documents/nanobanana_generated konumuna kaydedilir ve diğer çalışma zamanı durumu Hermes eklenti veri deposunda kalır; sağlayıcı anahtarları etkin Hermes profilinden okunur ve yalnızca ihtiyaç duyan betiğe aktarılır; Google OAuth iş akışları devre dışıdır; telemetri, paketlenmiş kimlik bilgisi, arka plan süreci veya kendi kendini güncelleyici yoktur."
