name: session-flow
repo: https://github.com/agantila/session-flow
sha: 359f9afecb5872fe0864eec79867a4dfa4d88d33
description: "Session pane for Hermes Desktop: Firefox-style session groups with project grouping, list/grid views, Ctrl+Scroll session cycling with a HUD, session-row styling and a built-in settings page. All timers are ctx-owned intervals disposed on unload (live-session poll ~30 s, session refresh ~45 s, project cache 60 s, activity expiry 30 s). The standalone full build in this repo (full/plugin.js, install.sh) is not part of this catalog entry. Contact: info@agantila.com. Disclosure — SDK-only Desktop plugin: reads the local Hermes gateway through public RPCs (projects.tree, projects.list, session.list, session.active_list, session.context_breakdown) and, on your actions, writes through public RPCs (projects.create/update/add_folder/remove_folder/set_primary/set_active/delete, session.create, session.cwd.set, session.title, session.branch_stored, session.archive, session.close, session.delete); captures Ctrl+mouse-wheel across the app (browser zoom suppressed except over canvases, editors and zoomable images) to cycle sessions; settings and groups stay in the app's local plugin storage; no outbound network, no shell commands, no credentials, no self-update."
description_tr: "Hermes Desktop için oturum paneli: Firefox tarzı oturum grupları, proje gruplaması, liste/ızgara görünümleri, HUD'lu Ctrl+Kaydırma ile oturum değiştirme, oturum satırı biçimlendirmesi ve yerleşik bir ayarlar sayfası. Tüm zamanlayıcılar, unload sırasında yok edilen ctx'e ait aralıklardır (canlı oturum yoklaması ~30 sn, oturum yenileme ~45 sn, proje önbelleği 60 sn, etkinlik bitişi 30 sn). Bu depodaki bağımsız tam derleme (full/plugin.js, install.sh) bu katalog girdisinin parçası değildir. İletişim: info@agantila.com. Açıklama — yalnızca SDK kullanan Desktop eklentisi: yerel Hermes ağ geçidini herkese açık RPC'ler üzerinden okur (projects.tree, projects.list, session.list, session.active_list, session.context_breakdown) ve sizin eylemlerinizle herkese açık RPC'ler üzerinden yazar (projects.create/update/add_folder/remove_folder/set_primary/set_active/delete, session.create, session.cwd.set, session.title, session.branch_stored, session.archive, session.close, session.delete); oturumlar arasında geçiş yapmak için uygulama genelinde Ctrl+fare tekerleğini yakalar (tuval, düzenleyici ve yakınlaştırılabilir görseller dışında tarayıcı yakınlaştırması bastırılır); ayarlar ve gruplar uygulamanın yerel eklenti deposunda kalır; dışa giden ağ yok, kabuk komutu yok, kimlik bilgisi yok, kendi kendini güncelleme yok."
