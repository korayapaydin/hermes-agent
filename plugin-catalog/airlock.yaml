sha: e379b7a8f9fad21391f477732e8386944ee7d68a
subdir: airlock
version: "0.2.1"
description: >-
  Guardrails that follow what a conversation has read. Once a session reads untrusted content (a web page, a
  browser snapshot, an MCP or third-party plugin's output, a customer's message), airlock seals it: messages to
  anyone but the owner, network writes, pushes and deploys, memory, skill and cron writes, browser input, URLs
  that could carry data out and code that reaches the network go through Hermes's own approval gate. Walls hold
  in every session: credential paths and secret files, the guard's own files and Hermes's config, shell startup
  files, other profiles, commands that switch approvals off. Shell commands are read the way the shell reads
  them, so a command that computes or hides what it runs (eval, base64 | sh, $G push, wildcards, write-then-run)
  is refused until written in clear. Subagents inherit the seal. It also catches an injection by its signature:
  recognized secrets never leave in a call; a private marker in the agent's context locks the session if it shows
  up in a tool call; a send to an address the untrusted content named is blocked; repeated refusals lock the
  session; lookalike Unicode in commands is refused. Plugin and MCP tools nobody admitted need
  approval. Observe mode, stop switch, `hermes airlock check|demo|log`. Tested on a corpus of 251 attacks
  and everyday commands, and end to end in the official image.
  Disclosure — hooks only (pre_tool_call, post_tool_call, pre_llm_call, subagent_start, on_session_reset,
  post_approval_response), no tools. No network, no LLM call, runs no command. Reads the profile's config.yaml
  (home channels, approvals mode) and its own policy file (<HERMES_HOME>/airlock.yaml); lists directories to
  expand wildcards in commands it checks. Writes under plugin-data/airlock: a journal of decisions, taints and
  approvals that includes tool arguments, truncated (journal.args: none leaves them out), the taint state and the
  stop switch. When nobody can approve (--yolo, approvals.mode: off, cron set to approve) it blocks instead of
  letting Hermes auto-approve (policy approvals_off: follow restores Hermes's behaviour). Install scan: caution,
  because the default policy and the shell reader name the patterns airlock guards against (startup files,
  crontab, credential commands, exfiltration shapes).
maintainer: otsoa-dubief
description_tr: "Bir konuşmanın neler okuduğunu takip eden koruma rayları. Bir oturum güvenilmeyen bir içerik (bir web sayfası, bir tarayıcı anlık görüntüsü, bir MCP veya üçüncü taraf eklenti çıktısı, bir müşteri mesajı) okuduğunda, airlock onu mühürler: Sahibi dışındaki herhangi birine gönderilen mesajlar, ağ yazmaları, push ve deploy işlemleri, bellek, yetenek ve cron yazmaları, tarayıcı girdileri, veri dışarı taşıyabilecek URL'ler ve ağa erişen kodlar Hermes'in kendi onay kapısından geçer. Duvarlar her oturumda koruma sağlar: kimlik bilgisi yolları ve gizli dosyalar, koruyucunun kendi dosyaları ve Hermes'in yapılandırması, kabuk başlangıç dosyaları, diğer profiller ve onayları kapatan komutlar. Kabuk komutları, kabuğun onları okuduğu şekilde okunur, bu nedenle ne çalıştırdığını hesaplayan veya gizleyen bir komut (eval, base64 | sh, $G push, joker karakterler, önce yaz sonra çalıştır) açıkça yazılana kadar reddedilir. Alt ajanlar mührü miras alır. Ayrıca bir enjeksiyonu imzasından yakalar: Tanınan gizli bilgiler bir çağrıda asla dışarı çıkmaz; ajanın bağlamındaki özel bir işaretçi, bir araç çağrısında görünürse oturumu kilitler; güvenilmeyen içeriğin adlandırdığı bir adrese gönderim engellenir; tekrarlanan reddetmeler oturumu kilitler; komutlardaki benzer Unicode karakterler reddedilir. Kimsenin kabul etmediği eklenti ve MCP araçları onay gerektirir. Gözlem modu, durdurma anahtarı, `hermes airlock check|demo|log` komutlarını içerir. 251 saldırı ve günlük komuttan oluşan bir küme üzerinde ve resmi imajda uçtan uca test edilmiştir. Açıklama — Yalnızca kancalar (pre_tool_call, post_tool_call, pre_llm_call, subagent_start, on_session_reset, post_approval_response) içerir, araç içermez. Ağ erişimi, LLM çağrısı yoktur, komut çalıştırmaz. Profilin config.yaml (ev kanalları, onay modu) ve kendi politika dosyasını (<HERMES_HOME>/airlock.yaml) okur; kontrol ettiği komutlardaki joker karakterleri genişletmek için dizinleri listeler. plugin-data/airlock altına şunları yazar: araç bağımsız değişkenlerini içeren (journal.args: none seçeneği onları dışarıda bırakır), kırpılmış bir karar günlüğü, bulaşma durumu ve durdurma anahtarı. Kimse onaylayamadığında (--yolo, approvals.mode: off, cron onaya ayarlanmışsa) ..."
