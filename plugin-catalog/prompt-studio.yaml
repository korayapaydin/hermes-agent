name: prompt-studio
repo: https://github.com/bwoliveira/prompt-studio
sha: ecead76f0b2ff4f46c09341c871e234eb1692a1a
description: "Step-by-step prompt builder for Hermes Desktop (F4): option cards per step with AI suggestions, then an AI-written final prompt sent to or placed in the composer through host.composer (Hermes Desktop 0.21.5+). Tuned for Claude Opus 5.5, Claude Sonnet 5.5 and GPT-6 Astra. AI calls go through its own auxiliary task (auxiliary.prompt_studio) via the dashboard plugin API; sends no temperature. No external network beyond the configured provider; preferences in ctx.storage. Disclosure — on opening in an existing chat (default on, toggle in Studio Settings) it reads the last 8 user/assistant turns (plus any compaction summary) of that session from state.db, redacts secrets and sends up to 8k chars to the configured auxiliary model for a short summary used in step suggestions; draft and form answers go to the same auxiliary model; no other network."
description_tr: "Hermes Desktop için adım adım istem oluşturucu (F4): her adım için YZ önerileriyle seçenek kartları, ardından YZ'nin yazdığı nihai istem, host.composer üzerinden gönderilen ya da yazma alanına yerleştirilen (Hermes Desktop 0.21.5+). Claude Opus 5.5, Claude Sonnet 5.5 ve GPT-6 Astra için ayarlanmıştır. YZ çağrıları, pano eklenti API'si üzerinden kendi yardımcı görevi (auxiliary.prompt_studio) aracılığıyla yapılır; sıcaklık göndermez. Yapılandırılmış sağlayıcı dışında harici ağ yok; tercihler ctx.storage'da. Açıklama — mevcut bir sohbette açıldığında (varsayılan olarak açık, Studio Settings'ten değiştirilebilir) o oturumun son 8 kullanıcı/asistan turunu (ve varsa herhangi bir sıkıştırma özetini) state.db dosyasından okur, sırları gizler ve adım önerilerinde kullanılan kısa bir özet için yapılandırılmış yardımcı modele 8 bin karaktere kadar gönderir; taslak ve form yanıtları aynı yardımcı modele gider; başka ağ erişimi yok."
