name: kanban-stream
repo: https://github.com/mbgulden/hermes-kanban-stream
sha: d6c3e802eefb6ec1e09ad002a1bf7d45b13104a8
subdir: ""
title: Kanban Stream
description: "Live-stream Hermes kanban worker activity to a Telegram ops channel: one edit-in-place message per task with rolling tool-call history, elapsed timer, tokens/sec, thinking indicator, and a pinned final state (done/blocked). Mid-task steering via task comments — /steer from Telegram through the bundled companion daemon, or straight from the board. Ships disabled by default; needs a dedicated ops bot (KANBAN_STREAM_BOT_TOKEN + KANBAN_STREAM_ALLOWED_USERS). Outbound calls go only to api.telegram.org; reads the kanban DB read-only; no telemetry, no self-update. Disclosure — sends kanban task titles, summaries and tool names with command/path snippets to the Telegram chat you configure via your own bot; the optional steer daemon posts allowlisted Telegram users' /steer text as task comments that reach the running worker."
description_tr: "Hermes kanban işçi etkinliğini bir Telegram operasyon kanalına canlı yayınlar: görev başına yerinde düzenlenen tek mesaj; kayan araç çağrısı geçmişi, geçen süre sayacı, token/sn, düşünme göstergesi ve sabitlenmiş son durum (tamamlandı/engellendi) ile. Görev yorumlarıyla görev sırasında yönlendirme — Telegram'dan paketlenen yardımcı daemon üzerinden /steer ya da doğrudan panodan. Varsayılan olarak kapalı gelir; özel bir operasyon botu gerekir (KANBAN_STREAM_BOT_TOKEN + KANBAN_STREAM_ALLOWED_USERS). Giden çağrılar yalnızca api.telegram.org'a gider; kanban DB'sini salt okunur okur; telemetri yok, kendini güncelleme yok. Açıklama — kanban görev başlıklarını, özetlerini ve komut/yol parçacıkları içeren araç adlarını, kendi botunuzla yapılandırdığınız Telegram sohbetine gönderir; isteğe bağlı steer daemon'ı, izin listesindeki Telegram kullanıcılarının /steer metnini çalışan işçiye ulaşan görev yorumları olarak gönderir."
maintainer: mbgulden
tier: community
category: automation
requires_hermes: ">=0.20.5"
version: "1.0.2"
docs_url: https://github.com/mbgulden/hermes-kanban-stream/blob/d6c3e802eefb6ec1e09ad002a1bf7d45b13104a8/README.md
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - post_api_request
    - kanban_task_completed
    - kanban_task_blocked
  provides_middleware: []
  requires_env:
    - KANBAN_STREAM_BOT_TOKEN
    - KANBAN_STREAM_ALLOWED_USERS
