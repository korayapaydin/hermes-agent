name: hermes-proton
repo: https://github.com/Maytrella007/hermes-proton
sha: 3e0612848cf20116294f9ff58e74aadf34bc858e
description: "Proton Mail, Calendar, Contacts and Drive for a Hermes Agent, through an MIT-licensed client built from Proton's own open-source Go libraries (go-srp, go-proton-api) — no Proton Bridge and no paid plan. Reads, searches and sends mail (attachments, scheduled send, labels, folders), manages calendar events and RSVPs, contacts (signed/encrypted vCards), and Drive (upload, download, move, rename, trash, public share links). Sign-in runs in a terminal via `hermes proton login` and the account password is never taken through chat; sending is refused until a recipient allowlist is set and every send is gated by Hermes's pre_tool_call approval. Disclosure — talks to Proton's private, undocumented web API over the network; stores a per-account session file (0600) holding OAuth-style tokens and the derived key passphrase (never the password) under the profile's plugin-data folder, and on first load copies any sessions from the standalone client's `~/.config/protonlite` into it; reads local files you approve for attachments and Drive uploads and writes downloaded attachments and Drive files under that plugin-data folder; shells out to gpg for calendar/Drive key provisioning; `proton_schedule_followup` creates one-shot Hermes cron jobs (read-only Proton toolset) that run unattended and deliver to your home channel; no self-update, no downloaded binaries, no telemetry."
description_tr: "Hermes Ajanı için Proton Mail, Takvim, Kişiler ve Drive; Proton'un kendi açık kaynaklı Go kütüphanelerinden (go-srp, go-proton-api) oluşturulmuş MIT lisanslı bir istemci aracılığıyla — Proton Bridge gerektirmez ve ücretli plan istemez. Postaları okur, arar ve gönderir (ekler, zamanlanmış gönderim, etiketler, klasörler), takvim etkinliklerini ve LCV'leri yönetir, kişileri (imzalı/şifreli vCard'lar) ve Drive'ı (yükleme, indirme, taşıma, yeniden adlandırma, çöp kutusu, genel paylaşım bağlantıları) yönetir. Giriş işlemi `hermes proton login` üzerinden bir terminalde gerçekleşir ve hesap şifresi asla sohbet üzerinden alınmaz; bir alıcı izin listesi ayarlanana kadar gönderim reddedilir ve her gönderim Hermes'in pre_tool_call onayıyla denetlenir. Açıklama — Ağ üzerinden Proton'un özel, belgelenmemiş web API'si ile konuşur; OAuth tarzı belirteçleri ve türetilmiş anahtar parola ifadesini (asla şifreyi değil) tutan hesap başına bir oturum dosyasını (mod 600) profilin plugin-data klasörü altında saklar ve ilk yüklemede bağımsız istemcinin `~/.config/protonlite` dizinindeki tüm oturumları buraya kopyalar; ekler ve Drive yüklemeleri için onayladığınız yerel dosyaları okur ve indirilen ekleri ve Drive dosyalarını bu plugin-data klasörü altına yazar; takvim/Drive anahtar sağlama için gpg'ye başvurur; `proton_schedule_followup` başında insan olmayan şekilde çalışan ve ana kanalınıza iletim yapan tek seferlik Hermes cron işleri (salt okunur Proton araç seti) oluşturur; otomatik güncelleme, indirilen ikili dosyalar veya telemetri yoktur."
