title: Kumiho Memory
description: "Recall and save decisions, preferences and facts in your Kumiho Cloud workspace. Portable Agent Plugins v1 package with hosted OAuth MCP and six skills. Disclosure — connects to Kumiho's hosted MCP at https://mcp.kumiho.cloud/mcp (OAuth at control.kumiho.cloud, tokens held by Hermes); memory queries, including an automatic topic lookup near the start of relevant conversations, and approved captures are sent there; the server is marked `trust: untrusted`, so Hermes asks before every tool not annotated read-only. The optional backfill helper reads only files the user names and writes review packets to a new folder; Dream State can create a recurring Hermes cron task when asked (read-only by default). No local server, telemetry or background process."
description_tr: "Kararlarınızı, tercihlerinizi ve olgularınızı Kumiho Cloud çalışma alanınızda geri çağırın ve kaydedin. Barındırılan OAuth MCP ve altı yetenekyle Taşınabilir Agent Plugins v1 paketi. Açıklama — Kumiho'nun https://mcp.kumiho.cloud/mcp adresindeki barındırılan MCP'sine bağlanır (OAuth control.kumiho.cloud üzerinde, tokenlar Hermes tarafından tutulur); ilgili konuşmaların başında otomatik konu araması dahil bellek sorguları ve onaylanan yakalamalar oraya gönderilir; sunucu `trust: untrusted` olarak işaretlidir, bu nedenle Hermes salt okunur olarak işaretlenmemiş her araçtan önce sorar. İsteğe bağlı geri doldurma yardımcısı yalnızca kullanıcının adlandırdığı dosyaları okur ve inceleme paketlerini yeni bir klasöre yazar; Dream State, istendiğinde yinelenen bir Hermes cron görevi oluşturabilir (varsayılan olarak salt okunur). Yerel sunucu, telemetri veya arka plan süreci yoktur."
