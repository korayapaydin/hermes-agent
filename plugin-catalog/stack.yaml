name: stack
repo: https://github.com/Karb-Interactive/hermes-plugin-stack-memory
sha: a1763ec70080bf4094be7981223309264e7c0a18
version: "0.2.0"
description: "Git-backed Markdown memory with background curation and model-based recall. Disclosure — runs a background curation agent with terminal, file-read and patch tools on your configured auxiliary model, fed raw conversation turns; it commits and pushes the memory store to whatever git remotes you configure, and pulls shared submodules at session start; the engine runs via uv run, which fetches pyyaml==6.0.2 from PyPI; an optional dataset file (memory.stack.dataset_enabled, off by default) stores full transcripts locally with no rotation."
description_tr: "Arka plan düzenlemesi ve model tabanlı geri çağırma ile git destekli Markdown bellek. Açıklama — terminal, dosya okuma ve yama araçlarına sahip bir arka plan düzenleme ajanını yapılandırdığınız yardımcı model üzerinde çalıştırır ve ona ham konuşma turları verilir; bellek deposunu yapılandırdığınız her git uzak deposuna commit'ler ve iter, oturum başlangıcında paylaşılan alt modülleri çeker; motor uv run ile çalışır ve bu, PyPI'dan pyyaml==6.0.2 getirir; isteğe bağlı bir veri kümesi dosyası (memory.stack.dataset_enabled, varsayılan olarak kapalı) tam dökümleri yerel olarak rotasyonsuz saklar."
maintainer: vykhovanets
