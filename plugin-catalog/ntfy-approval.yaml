subdir: ntfy-approval
description: "Answer Hermes' approval prompts from your phone: once selected with security.approval.transport: ntfy, each dangerous-command prompt arrives as an ntfy push notification with Approve once, Approve for session and Deny buttons, and no answer still means deny. Disclosure — once selected, anyone who can read the ntfy topic can approve dangerous commands (the one-time answer codes are in the notification), so on the public ntfy.sh default the topic name is the only secret and NTFY_APPROVAL_TOKEN is optional; each pending approval publishes Hermes' reason, the redacted command (unless send_command is false), the non-default profile name and one-time answer codes to the configured ntfy server, then reads <topic>-reply and deletes the notification; any failure or timeout is a deny; reads NTFY_APPROVAL_TOPIC/NTFY_APPROVAL_TOKEN from the profile .env, never puts the token in a notification, follows no redirects, writes no files and starts no processes."
description_tr: "Hermes'in onay istemlerini telefonunuzdan yanıtlayın: security.approval.transport: ntfy ile bir kez seçildiğinde, her tehlikeli komut istemi, Bir kez onayla, Oturum boyunca onayla ve Reddet düğmeleriyle bir ntfy anlık bildirimi olarak gelir ve yanıtsızlık yine reddetmek anlamına gelir. Açıklama — bir kez seçildiğinde, ntfy konusunu okuyabilen herkes tehlikeli komutları onaylayabilir (tek kullanımlık yanıt kodları bildirimdedir); dolayısıyla herkese açık ntfy.sh varsayılanında konu adı tek sırdır ve NTFY_APPROVAL_TOKEN isteğe bağlıdır; her bekleyen onay, Hermes'in nedenini, redakte edilmiş komutu (send_command false değilse), varsayılan olmayan profil adını ve tek kullanımlık yanıt kodlarını yapılandırılmış ntfy sunucusuna yayımlar, ardından <topic>-reply okur ve bildirimi siler; herhangi bir hata veya zaman aşımı reddetme anlamına gelir; NTFY_APPROVAL_TOPIC/NTFY_APPROVAL_TOKEN değerlerini profil .env dosyasından okur, token'ı asla bir bildirime koymaz, hiçbir yönlendirmeyi izlemez, dosya yazmaz ve süreç başlatmaz."
