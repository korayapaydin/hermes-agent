name: de-law
repo: https://github.com/MadeByBrain/hermes-de-law
sha: 4be88cd048c5ae4d37491ba4e6eb88996886ae7e
description: "German federal law, EU law and German federal court decisions for Hermes Agent: read one section or article (§ 203 StGB, Art. 6 DSGVO, Art. 50 AI Act) in the source wording with version status (Stand), gazette reference and a ready source line, search the index of federal laws, list a law's sections, and find and read published decisions of BVerfG, BGH, BVerwG, BFH, BAG, BSG and BPatG. Legal texts, not legal advice. Disclosure: sends HTTPS GET requests only to www.gesetze-im-internet.de (law folder names, the daily index, weekly abbreviation lists), www.rechtsprechung-im-internet.de (the daily index, document ids of decisions you read) and publications.europa.eu (CELEX numbers, text language, one SPARQL query per act listing its consolidated versions); section numbers and search words are not sent, because whole laws are downloaded and searched locally. Public sources, no key. Writes public legal texts and indexes (JSON with ETag, Last-Modified and fetch time; no questions, no session data) under HERMES_HOME/plugin-data/de-law/cache, capped by the cache_max_mb setting (default 200 MB). Reads only its own plugin settings. At most one request per second per host, 25 s timeout, 40 MB response cap. rechtsprechung-im-internet.de sends a tdm-reservation header; the plugin fetches its index and single decisions on request only, and case_law: false turns that source off. No hooks, no cron jobs, no background processes. Tools stay on every platform, including gateways (a guest can call them; hermes tools disables one). While the plugin is enabled, its skill adds one line to the skills index of every session."
description_tr: "Hermes Ajanı için Alman federal yasaları, AB yasaları ve Alman federal mahkeme kararları: Bir bölümü veya maddeyi (§ 203 StGB, Art. 6 DSGVO, Art. 50 AI Act) sürüm durumu (Stand), resmi gazete referansı ve hazır bir kaynak satırı ile orijinal sözcükleriyle okuyun, federal yasalar dizinini arayın, bir yasanın bölümlerini listeleyin ve BVerfG, BGH, BVerwG, BFH, BAG, BSG ve BPatG'nin yayınlanmış kararlarını bulup okuyun. Hukuki metinlerdir, hukuki danışmanlık değildir. Açıklama: Yalnızca www.gesetze-im-internet.de (yasa klasör adları, günlük dizin, haftalık kısaltma listeleri), www.rechtsprechung-im-internet.de (günlük dizin, okuduğunuz kararların belge kimlikleri) ve publications.europa.eu (CELEX numaraları, metin dili, konsolide sürümlerini listeleyen yasaya yönelik tek bir SPARQL sorgusu) adreslerine HTTPS GET istekleri gönderir; bölüm numaraları ve arama kelimeleri gönderilmez, çünkü yasaların tamamı indirilir ve yerel olarak aranır. Genel kaynaklar, anahtar gerektirmez. Genel hukuki metinleri ve dizinleri (ETag, Last-Modified ve çekme zamanı içeren JSON; soru yok, oturum verisi yok) HERMES_HOME/plugin-data/de-law/cache altında, cache_max_mb ayarı (varsayılan 200 MB) ile sınırlı olarak yazar. Yalnızca kendi eklenti ayarlarını okur. Host başına saniyede en fazla bir istek, 25 saniye zaman aşımı, 40 MB yanıt sınırı. rechtsprechung-im-internet.de bir tdm-reservation başlığı gönderir; eklenti dizinini ve tekil kararları yalnızca istek üzerine çeker ve case_law: false bu kaynağı kapatır. Kanca, cron işi, arka plan süreci yoktur. Araçlar, ağ geçitleri dahil her platformda kalır (bir konuk onları çağırabilir; hermes tools birini devre dışı bırakır). Eklenti etkinken, yeteneği her oturumun yetenek dizinine bir satır ekler."
