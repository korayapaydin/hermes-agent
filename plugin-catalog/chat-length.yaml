name: chat-length
title: "Chat Length"
version: "1.1.0"
repo: https://github.com/MadeByBrain/hermes-chat-length
sha: 1759b26a66c7b4d54703186cc867a5869baa4f12
description: "Tells the user when a chat is getting too long and hands them a short opener for a fresh chat; the new chat pulls the earlier context itself via session_search, no handover document. Fill level from real provider token counts, measured against Hermes' compaction point by default; notices at 70 % and 90 % (configurable), once each per chat, re-armed after compaction, never in cron, subagent, kanban, batch or webhook runs. Notice in the conversation language, English or German. Disclosure — on the turn that crosses a threshold, pre_llm_call adds a one-turn instruction to that turn's user message (never the system prompt; replayed byte-identical, so prompt caching stays intact); post_api_request stores per-session token counts, model and provider name and which notice fired (no message content) under HERMES_HOME/plugin-data/chat-length/, pruned after 30 days; reads the session title read-only from state.db and the compression settings read-only from config.yaml; no network calls, no tools, no dependencies."
description_tr: "Sohbetin çok uzadığını kullanıcıya bildirir ve ona yeni bir sohbet için kısa bir açılış metni sunar; yeni sohbet, herhangi bir devir belgesi olmadan önceki bağlamı session_search aracılığıyla kendisi çeker. Doluluk seviyesi, gerçek sağlayıcı belirteç sayılarıyla, varsayılan olarak Hermes'in sıkıştırma noktasına göre ölçülür; sohbet başına bir kez, sıkıştırmadan sonra yeniden aktifleşecek şekilde %70 ve %90'da (yapılandırılabilir) uyarı verir; cron, alt ajan, kanban, toplu veya webhook çalıştırmalarında asla çalışmaz. Uyarı, konuşma dilinde, İngilizce veya Almancada yapılır. Açıklama — Bir eşiği aşan turda, pre_llm_call o turun kullanıcı mesajına tek turluk bir talimat ekler (asla sistem istemine eklemez; bayt düzeyinde aynı şekilde yeniden oynatılır, böylece istem önbelleklemesi bozulmaz); post_api_request oturum başına belirteç sayılarını, model ve sağlayıcı adını ve hangi uyarının tetiklendiğini (mesaj içeriği yok) HERMES_HOME/plugin-data/chat-length/ altında saklar ve 30 gün sonra siler; oturum başlığını state.db'den ve sıkıştırma ayarlarını config.yaml'dan salt okunur olarak okur; ağ çağrısı, araç veya bağımlılık yoktur."
