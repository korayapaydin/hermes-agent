name: session-mirror
repo: https://github.com/rrrrnmtsu/hermes-session-mirror
sha: 02a923f04b414f30286d31b278a3177892dd5f9f
description: "Mirrors Hermes Desktop, CLI, TUI and ACP conversations into Discord: one public thread per session in a channel you choose, one post per turn (your message and the reply), so work started on a desktop can be followed from the phone. Posting runs on a background thread and never delays or breaks a turn. Disclosure — register() adds one post_llm_call hook; every turn's text (your message and the final reply, not tool calls or outputs) is sent to the Discord REST API (discord.com) using the bot token you configure, after Hermes's redact_for_egress plus a local token-pattern filter (fail-closed: nothing is sent if the redactor is unavailable); mentions are disabled. The bot token is read only via agent.secret_scope.get_secret (an UnscopedSecretError under multiplexing skips the turn); no external command is ever run. Each turn reads the session's title and source from $HERMES_HOME/state.db read-only; session-to-thread ids are stored (mode 0600) in $HERMES_HOME/state/session-mirror.json. The optional `hermes session-mirror backfill` CLI command reads $HERMES_HOME/state.db read-only and replays past sessions through the same redaction. No other files, telemetry or long-running processes beyond one daemon sender thread."
description_tr: "Hermes Desktop, CLI, TUI ve ACP konuşmalarını Discord'a yansıtır: seçtiğiniz bir kanalda her oturum için bir herkese açık iş parçacığı, her tur için bir gönderi (sizin mesajınız ve yanıtı); böylece masaüstünde başlatılan iş telefondan takip edilebilir. Gönderim arka plan iş parçacığında çalışır ve bir turu asla geciktirmez ya da bozmaz. Açıklama — register() tek bir post_llm_call kancası ekler; her turun metni (mesajınız ve nihai yanıt, araç çağrıları veya çıktıları değil), Hermes'in redact_for_egress'i ve yerel bir token deseni filtresinden sonra (fail-closed: redakte edici kullanılamıyorsa hiçbir şey gönderilmez) yapılandırdığınız bot token'ı kullanılarak Discord REST API'sine (discord.com) gönderilir; bahsetmeler devre dışıdır. Bot token'ı yalnızca agent.secret_scope.get_secret aracılığıyla okunur (çoklama altında bir UnscopedSecretError turu atlar); hiçbir harici komut asla çalıştırılmaz. Her tur, oturumun başlığını ve kaynağını $HERMES_HOME/state.db dosyasından salt okunur olarak okur; oturumdan iş parçacığına kimlikler $HERMES_HOME/state/session-mirror.json içinde (0600 moduyla) saklanır. İsteğe bağlı `hermes session-mirror backfill` CLI komutu $HERMES_HOME/state.db dosyasını salt okunur okur ve geçmiş oturumları aynı redaksiyondan geçirerek yeniden oynatır. Tek bir daemon gönderici iş parçacığının ötesinde başka dosya, telemetri veya uzun süre çalışan süreç yoktur."
