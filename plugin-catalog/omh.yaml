name: omh
repo: https://github.com/rlaope/oh-my-hermes
sha: 021e5c63d976b4e0faf9cfc7d608701d98fe1722
subdir: src/plugin_bundle/omh
description: "Oh My Hermes (OMH) bridge: routing hints and role context for OMH workflow skills, per-task delegation model routing, plan todos and a status tool, a Hermes Desktop status pane (off until enabled), bounded evidence probes that keep prepared work apart from observed results, and a file-backed memory provider. Disclosure — omh_delegate_route writes delegation.model/provider/reasoning_effort in $HERMES_HOME/config.yaml and the session hooks restore them; omh_gather_evidence runs allowlisted checks (python -m unittest with reporting flags only, python -m compileall, git diff --check, omh doctor/probe/docs/release checks) via subprocess on the host, outside any sandboxed terminal backend and without Hermes' terminal approval, in the agent working directory or below it, so it runs whatever test code that directory holds; omh_team (only with the separate OMH core package installed) asks once through the Hermes approval prompt for an exact list of up to 8 check commands from an accepted plan, then runs them on the host as each helper returns; omh_jev_ask posts model-supplied state and questions to api.typesafe.ai (openrouter.ai only when the operator opts in via ~/.omh/jev/settings.json) with the user's own TYPESAFE_API_KEY or OPENROUTER_API_KEY, only in a turn where the user names Jev; opt-in egress_attempts (re-registers chosen core tools, needs the operator's tool-override grant) and browser_adapter (vetoes core browser_* tools) settings; reads session and cost metadata from state.db read-only; state lives under ~/.omh and <project>/.omh."
description_tr: "Oh My Hermes (OMH) köprüsü: OMH iş akışı yetenekleri için yönlendirme ipuçları ve rol bağlamı, görev başına delegasyon model yönlendirmesi, plan yapılacaklar listesi ve bir durum aracı, bir Hermes Desktop durum paneli (etkinleştirilene kadar kapalı), hazırlanmış çalışmayı gözlenen sonuçlardan ayıran sınırlı kanıt probları ve dosya destekli bir bellek sağlayıcısı. Açıklama — omh_delegate_route, $HERMES_HOME/config.yaml içine delegation.model/provider/reasoning_effort yazar ve oturum kancaları bunları geri yükler; omh_gather_evidence, izin listesine alınmış denetimleri (yalnızca raporlama bayraklarıyla python -m unittest, python -m compileall, git diff --check, omh doctor/probe/docs/release denetimleri) ana makinede alt süreç aracılığıyla, herhangi bir korumalı terminal arka ucunun dışında ve Hermes'in terminal onayı olmadan, ajanın çalışma dizininde ya da altında çalıştırır; böylece o dizinde bulunan test kodunu ne olursa olsun çalıştırır; omh_team (yalnızca ayrı OMH çekirdek paketi kuruluysa) kabul edilmiş bir plandan en fazla 8 denetim komutunun tam listesi için Hermes onay istemi aracılığıyla bir kez istekte bulunur, ardından her yardımcı döndükçe bunları ana makinede çalıştırır; omh_jev_ask, model tarafından sağlanan durumu ve soruları api.typesafe.ai adresine (openrouter.ai yalnızca operatör ~/.omh/jev/settings.json aracılığıyla tercih ettiğinde) kullanıcının kendi TYPESAFE_API_KEY ya da OPENROUTER_API_KEY anahtarıyla, yalnızca kullanıcının Jev adını verdiği bir turda gönderir; isteğe bağlı egress_attempts (seçilmiş çekirdek araçları yeniden kaydeder, operatörün araç geçersiz kılma iznini gerektirir) ve browser_adapter (çekirdek browser_* araçlarını veto eder) ayarları; oturum ve maliyet üst verisini state.db dosyasından salt okunur okur; durum ~/.omh ve <project>/.omh altında yaşar."
maintainer: rlaope
tier: community
category: tools
