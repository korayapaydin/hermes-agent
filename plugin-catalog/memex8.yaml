name: memex8
repo: https://github.com/Ex8-ca/memex8
sha: 9f30627c7d7f35d44e0b6aa73e81417482d5bdb9
subdir: plugins/memex8
version: "1.1.0"
description: "Self-hosted vector memory (Qdrant + TurboQuant compression) with auto-discovered knowledge realms, semantic search across conversations and ingested documents, and a slumber pipeline for memory consolidation. v1.1.0 adds optional per-session injection dedup with char-budget gate, decision/evaluation memory-type promotion (slower decay for load-bearing turns), prompt-injection sanitization on read, configurable system-prompt template, export/import memories as JSON, and a /memex8 slash command. New memory behaviours are opt-in; /memex8 export|import is confined to $HERMES_HOME/plugin-data/memex8 unless enable_export_import=true. Disclosure — auto-stores a truncated copy (first 300 chars) of every user and assistant turn, plus per-message previews of the whole transcript at session end and before context compression, to the memex8 server at MEMEX8_BASE_URL (self-hosted; default http://localhost:8080) using MEMEX8_API_KEY."
description_tr: "Kendinizde barındırılan vektör belleği (Qdrant + TurboQuant sıkıştırması), otomatik keşfedilen bilgi alanları, konuşmalar ve alınan belgeler arasında anlamsal arama ve bellek birleştirme için bir uyku hattı. v1.1.0 oturum başına isteğe bağlı enjeksiyon tekilleştirmesini (karakter bütçesi kapısıyla), karar/değerlendirme bellek türü terfisi (yük taşıyan turlarda daha yavaş sönüm), okuma sırasında istem enjeksiyonu temizliği, yapılandırılabilir sistem istemi şablonu, bellekleri JSON olarak dışa aktarma/içe aktarma ve bir /memex8 eğik çizgi komutu ekler. Yeni bellek davranışları isteğe bağlıdır; /memex8 export|import yalnızca $HERMES_HOME/plugin-data/memex8 ile sınırlıdır, enable_export_import=true olmadıkça. Açıklama — her kullanıcı ve asistan turunun kısaltılmış bir kopyasını (ilk 300 karakter) ve ayrıca oturum sonunda ve bağlam sıkıştırmasından önce tüm konuşma dökümünün ileti başına önizlemelerini, MEMEX8_API_KEY kullanarak MEMEX8_BASE_URL adresindeki memex8 sunucusuna (kendinizde barındırılan; varsayılan http://localhost:8080) otomatik olarak depolar."
maintainer: Ex8-ca
tier: community
category: memory
requires_hermes: ">=0.21.4"
docs_url: https://github.com/Ex8-ca/memex8/blob/main/plugins/memex8/README.md
image: https://raw.githubusercontent.com/Ex8-ca/memex8/9f30627c7d7f35d44e0b6aa73e81417482d5bdb9/plugins/memex8/docs/banner.png
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_end
    - on_pre_compress
  provides_middleware: []
  requires_env:
    - MEMEX8_API_KEY
