sha: e502204bcf5e975878d1a35bfdc2f939724cf2ca
description: "Practice Lincoln-Douglas debate. A case workbench helps a student build their own case section by section (resolution analysis, value and criterion, contentions, evidence, blocks) with a coach that gives real help and asks hard questions but never writes the case. A topic briefing maps a new resolution for both sides. A full NSDA practice round (AC, cross-examination, NC, 1AR, NR, 2AR, with prep time) runs against an AI opponent at three levels, followed by a ballot from a lay, traditional or flow judge. A fallacies guide, drill and spotter work on the student's own case and on other people's arguments. Cases are kept in a library with Word, text and backup-file export. Every model call goes to the user's own Hermes model through the plugin LLM helper. Debate Workbench is an independent community plugin. It is not made or endorsed by Nous Research or the National Speech & Debate Association. Disclosure — one network call of its own: when the user adds a topic source link, it fetches that one public web page (http or https, public addresses only, checked on every redirect, 20-second timeout, first 30,000 characters of text kept); no credentials, telemetry, shell commands, background processes or self-updates; registers no tools, hooks or middleware, only a Desktop page and a dashboard API; stores cases, rounds, ballots and briefings in $HERMES_HOME/plugin-data/ld-workbench/; reads a .docx or .txt case file or a backup file only when the user picks one; writes an export only to a path the user picks in the save dialog, inside their home folder; the optional dictation button uses the speech recognition built into the desktop app's browser engine when that engine provides it, which may send the audio to that engine's speech service; no private Hermes imports."
description_tr: "Lincoln-Douglas münazarası pratiği yapın. Bir vaka çalışma alanı, bir öğrencinin kendi vakasını bölüm bölüm (çözünürlük analizi, değer ve kriter, iddialar, kanıtlar, bloklar) oluşturmasına yardımcı olur; bunu, gerçek yardım sağlayan ve zor sorular soran ancak vakayı asla yazmayan bir koç eşliğinde yapar. Bir konu bilgilendirmesi, her iki taraf için yeni bir çözünürlüğü haritalandırır. Üç seviyede yapay zeka rakibine karşı oynanan tam bir NSDA pratik turu (AC, çapraz sorgulama, NC, 1AR, NR, 2AR ve hazırlık süresiyle birlikte), ardından sıradan, geleneksel veya akış hakiminden gelen bir oy pusulası ile tamamlanır. Mantık hataları kılavuzu, tatbikatı ve tespitçisi, öğrencinin kendi vakası ve diğer insanların argümanları üzerinde çalışır. Vakalar Word, metin ve yedek dosya dışa aktarımı ile bir kütüphanede tutulur. Her model çağrısı, eklenti LLM yardımcısı aracılığıyla kullanıcının kendi Hermes modeline gider. Debate Workbench bağımsız bir topluluk eklentisidir. Nous Research veya National Speech & Debate Association tarafından yapılmamıştır veya desteklenmemiştir. Bilgilendirme — kendi başına bir ağ çağrısı yapar: kullanıcı bir konu kaynağı bağlantısı eklediğinde, o tek kamuya açık web sayfasını çeker (yalnızca http veya https, yalnızca kamuya açık adresler, her yönlendirmede kontrol edilir, 20 saniye zaman aşımı, metnin ilk 30.000 karakteri tutulur); kimlik bilgileri, telemetri, kabuk komutları, arka plan işlemleri veya otomatik güncellemeler yoktur; araç, kanca veya ara yazılım kaydetmez, yalnızca bir Masaüstü sayfası ve bir kontrol paneli API'si sunar; vakaları, turları, oy pusulalarını ve bilgilendirmeleri $HERMES_HOME/plugin-data/ld-workbench/ altında saklar; bir .docx veya .txt vaka dosyasını veya bir yedek dosyasını yalnızca kullanıcı seçtiğinde okur; dışa aktarımı yalnızca kullanıcının kaydetme iletişim kutusunda kendi ana klasörü içinde seçtiği bir yola yazar; isteğe bağlı dikte düğmesi, masaüstü uygulamasının tarayıcı motoruna yerleşik konuşma tanımayı kullandığında (eğer motor sağlıyorsa), sesi o motorun konuşma servisine gönderebilir; özel Hermes içe aktarımları yoktur."
