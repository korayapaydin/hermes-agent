subdir: adapters/hermes
version: "1.10.6"
description: "SGME (拾光记忆) self-hosted long-term memory engine — tagged memories with provenance, per-turn recall, automatic session refinement, a skills library, wiki knowledge base, care signals, communication roles and a three-pool task system (ideas/demands/projects), all behind one HTTP service you own. The plugin is a thin bridge: no LLM, no database, everything heavy runs in your SGME server (local or remote). Disclosure — the plugin talks only to the SGME server you configure (default http://127.0.0.1:9910, SGME_BASE_URL for a remote server), sending SGME_AGENT_KEY / SGME_ADMIN_KEY read through Hermes's secret scope; each session's user, assistant and tool messages are appended to that server and refined into memories at session end by an LLM you configure on the SGME side; its sgme_* tools let the model read and change memories, skills, wiki pages and tasks on that server and write skill packages under $HERMES_HOME/plugin-data/sgme/skills/ on the SGME host; credential names in the SGME vault can be listed, and reading a credential value into the conversation is off by default (credential_get_enabled / SGME_ENABLE_CREDENTIAL_GET); no third-party services, no telemetry."
description_tr: "SGME (拾光记忆) kendi sunucunuzda barındırılan uzun süreli bellek motoru — kaynak belgeli etiketli bellekler, tur başına hatırlama, otomatik oturum iyileştirme, bir yetenekler kütüphanesi, wiki bilgi tabanı, ilgi sinyalleri, iletişim rolleri ve üç havuzlu görev sistemi (fikirler/talepler/projeler); tüm bunlar size ait tek bir HTTP servisi arkasındadır. Eklenti ince bir köprüdür: LLM yok, veritabanı yok, tüm ağır işlemler SGME sunucunuzda (yerel veya uzak) çalışır. Bilgilendirme — eklenti yalnızca yapılandırdığınız SGME sunucusuyla (varsayılan http://127.0.0.1:9910, uzak sunucu için SGME_BASE_URL) konuşur ve Hermes'in gizli kapsamından okunan SGME_AGENT_KEY / SGME_ADMIN_KEY değerlerini gönderir; her oturumun kullanıcı, asistan ve araç mesajları bu sunucuya eklenir ve oturum sonunda SGME tarafında yapılandırdığınız bir LLM tarafından bellek haline getirilir; sgme_* araçları modelin bu sunucudaki bellekleri, yetenekleri, wiki sayfalarını ve görevleri okumasına ve değiştirmesine; ayrıca SGME ana bilgisayarındaki $HERMES_HOME/plugin-data/sgme/skills/ altına yetenek paketleri yazmasına olanak tanır; SGME kasasındaki kimlik bilgisi adları listelenebilir ve bir kimlik bilgisi değerinin konuşmaya okunması varsayılan olarak kapalıdır (credential_get_enabled / SGME_ENABLE_CREDENTIAL_GET); üçüncü taraf servisler ve telemetri yoktur."
