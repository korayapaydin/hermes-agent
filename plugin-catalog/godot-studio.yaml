name: godot-studio
repo: https://github.com/Foolafroos/godot-studio
sha: 6c1d42d22ae6274f0ed4a3a9a264d2effe461736
description: >-
  Headless Godot 4 workflows for the agent game studio — godot_headless_check
  (script/resource validation via godot --headless, no editor needed),
  godot_export (CI builds from named export presets, e.g. a Web build a
  playtester agent can load), godot_builds (export presets + artifact state:
  exists/size/modified — gallery data for re-export decisions and attaching
  fresh builds in chat), godot_setup (read-only install-state report for
  Godot/godot-ai/uv with the exact registration path). Complements the
  hi-godot/godot-ai MCP editor bridge by covering the verification and export
  leg of the loop; bundles the godot-studio skill teaching edit → verify →
  export → playtest. Ships an optional desktop half (unified package): a
  Godot version statusbar chip and a builds gallery pane backed by its own
  read-only dashboard API; opt-in, degrades gracefully when the backend is
  off. Tools register only when a Godot 4 binary is present (check_fn).
  Disclosure — runs shell commands (godot --headless against the
  caller-targeted project; read-only godot --version in the desktop backend;
  read-only hermes mcp list in godot_setup); godot_headless_check and
  godot_export execute the target project's own GDScript (autoloads, main
  scene, export plugins) with no approval prompt — point them only at
  projects you trust; no network calls, no credentials, no telemetry, no
  background processes; exports write only inside the target project (the
  output path is resolved and confined to the project directory, existing
  files that aren't known export artifacts are never overwritten, and the
  default is the preset's own export_path from export_presets.cfg); the
  desktop backend reads export_presets.cfg and artifact metadata inside the
  project path the user configures in the pane.
maintainer: Foolafroos
description_tr: "Ajan oyun stüdyosu için başlıksız (headless) Godot 4 iş akışları — godot_headless_check (godot --headless aracılığıyla betik/kaynak doğrulama, editör gerektirmez), godot_export (adlandırılmış dışa aktarma ön ayarlarından CI yapıları, örneğin bir test ajanı tarafından yüklenebilen bir Web yapısı), godot_builds (dışa aktarma ön ayarları + artık durumu: mevcut/boyut/değiştirildi — yeniden dışa aktarma kararları ve sohbete yeni yapılar eklemek için galeri verileri), godot_setup (Godot/godot-ai/uv için kesin kayıt yoluyla salt okunur kurulum durumu raporu). hi-godot/godot-ai MCP editör köprüsünü, döngünün doğrulama ve dışa aktarma ayağını kapsayarak tamamlar; düzenle → doğrula → dışa aktar → test et sürecini öğreten godot-studio yeteneğini paketler. İsteğe bağlı bir masaüstü parçası (birleşik paket) sunar: Bir Godot sürüm durum çubuğu çipi ve kendi salt okunur yönetim paneli API'si tarafından desteklenen bir yapılar galerisi paneli; isteğe bağlıdır, arka uç kapalıyken sorunsuz şekilde çalışmaya devam eder. Araçlar yalnızca bir Godot 4 ikili dosyası mevcut olduğunda kaydolur (check_fn). Açıklama — Kabuk komutları çalıştırır (çağırıcı hedefli projeye karşı godot --headless; masaüstü arka ucunda salt okunur godot --version; godot_setup'ta salt okunur hermes mcp list); godot_headless_check ve godot_export, hedef projenin kendi GDScript'ini (otomatik yüklemeler, ana sahne, dışa aktarma eklentileri) onay istemi olmadan yürütür — onları yalnızca güvendiğiniz projelere yönlendirin; ağ çağrısı, kimlik bilgisi, telemetri, arka plan süreci yoktur; dışa aktarımlar yalnızca hedef proje içinde yazılır (çıktı yolu çözümlenir ve proje diziniyle sınırlandırılır, bilinen dışa aktarma artıkları olmayan mevcut dosyaların üzerine asla yazılmaz ve varsayılan, export_presets.cfg'deki ön ayarın kendi export_path'idir); masaüstü arka ucu, kullanıcının panelde yapılandırdığı proje yolu içindeki export_presets.cfg ve artık meta verilerini okur."
