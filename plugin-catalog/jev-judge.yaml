name: jev-judge
repo: https://github.com/DoGMaTiiC/hermes-jev
sha: 5dddbeaac5be08281e6c3b372eeaba3639971f0a
subdir: plugins/jev-judge
description: TypeSafe Jev as a judgment layer — a pre-tool gate (shadow by default, enforce
  escalates) on terminal, write_file and patch asking destructive / exfiltration / impact
  (a v2 signal set — reads_secrets × sends_outbound, blast_radius, self_advocating — is one
  setting away), plus a jev_ask tool for typed judgments. Thresholds in code, one JSONL line
  per decision with the fail-open reason, fail-open on every error path. Stdlib only, no Node;
  no redirects, proxy env ignored, payload capped; works with TYPESAFE_API_KEY,
  OPENROUTER_API_KEY, or AI_GATEWAY_API_KEY. Disclosure — each judged call sends the tool name
  and its redacted arguments (≤600 chars each, ≤12 args) to TypeSafe, OpenRouter, or your
  configured gateway, using your key; shadow mode only logs. With the default backend auto,
  OPENROUTER_API_KEY is used automatically whenever it is present and TYPESAFE_API_KEY is not,
  so tool names and redacted arguments go to openrouter.ai on your main-model OpenRouter key
  unless backend is set to typesafe or gateway.
description_tr: "TypeSafe Jev'i bir yargı katmanı olarak kullanın — terminal, write_file ve patch üzerinde, yıkıcı / veri sızdırma / etki soruları soran bir araç öncesi kapı (varsayılan olarak gölge, uygulama kipi yükseltir; bir v2 sinyal kümesi — reads_secrets × sends_outbound, blast_radius, self_advocating — tek bir ayar uzakta) — artı tipli yargılar için bir jev_ask aracı. Eşikler kodda; her karar, hata durumunda açık kalma gerekçesiyle birlikte bir JSONL satırı olarak yazılır ve her hata yolunda açık kalır. Yalnızca standart kitaplık, Node yok; yönlendirme yok, vekil ortam değişkenleri yok sayılır, yük sınırlıdır; TYPESAFE_API_KEY, OPENROUTER_API_KEY ya da AI_GATEWAY_API_KEY ile çalışır. Açıklama — Yargılanan her çağrı, araç adını ve kısaltılmış bağımsız değişkenlerini (her biri ≤600 karakter, ≤12 bağımsız değişken) anahtarınızı kullanarak TypeSafe, OpenRouter veya yapılandırdığınız ağ geçidine gönderir; gölge kipi yalnızca günlüğe yazar. Varsayılan backend auto ile OPENROUTER_API_KEY mevcut olduğunda ve TYPESAFE_API_KEY olmadığında otomatik olarak kullanılır, bu yüzden backend typesafe veya gateway olarak ayarlanmadıkça araç adları ve kısaltılmış bağımsız değişkenler ana model OpenRouter anahtarınızla openrouter.ai adresine gider."
