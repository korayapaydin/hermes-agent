title: Thai (ภาษาไทย) Language Pack
description: "Thai (ภาษาไทย) language pack covering all three Hermes UI surfaces — Desktop (5,023/5,030), core CLI/gateway/platforms (3,437/3,437), and the Ink TUI (1,259/1,259) — 9,719/9,725 keys total (99.9%). All three catalogs checked against the English reference with `hermes plugins validate`. Manifest-only plugin: flat nested YAML overlays under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `hermes config set display.language th`. Disclosure — text-only catalogs (no code, network or dependencies); untranslated keys fall back to English: the 7 array/conditional Desktop keys listed in the repo README, plus strings Hermes added after the pack was built."
description_tr: "Tayca (ภาษาไทย) dil paketi — Hermes'in üç arayüz yüzeyinin tamamını kapsar: Desktop (5.023/5.030), çekirdek CLI/ağ geçidi/platformlar (3.437/3.437) ve Ink TUI (1.259/1.259) — toplam 9.719/9.725 anahtar (%99,9). Üç katalog da `hermes plugins validate` ile İngilizce referansa karşı denetlendi. Yalnızca manifest içeren eklenti: locales/ altında düz iç içe YAML kaplamaları, kod yok, ağ yok, bağımlılık yok. Paketi kaydetmek hiçbir zaman display.language değerini değiştirmez — kullanıcı `hermes config set display.language th` ile seçer. Açıklama — yalnızca metin katalogları (kod, ağ ya da bağımlılık yok); çevrilmemiş anahtarlar İngilizceye geri döner: depo README'sinde listelenen 7 dizi/koşullu Desktop anahtarı ve Hermes'in paket oluşturulduktan sonra eklediği metinler."
