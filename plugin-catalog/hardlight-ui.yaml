name: hardlight-ui
title: Hardlight UI
repo: https://github.com/nosliwhtes/hardlight-ui
sha: 2254efe3ba6df2fa5962cd8ed352b5fad80306d4
description: "Frontend design guidance with sixteen original style grammars, twelve craft references, dated modern-web capability recipes, explicit direction context, and stateless tools for bounded source inspection, color contrast, and navigation task paths. Disclosure — the hardlight_inspect tool reads frontend source files (.html, .css, .js, .ts, .jsx, .tsx, .vue, .svelte and similar; at most 500 files and 8 MiB) under any local directory the model names, skipping hidden, symlinked, vendor/build and secret-named paths, and returns their design tokens and findings to the model; the plugin adds a short system-prompt section naming its tools to every session; the tools make no network calls, run no subprocesses and write no files; the optional hardlight browser command, run by hand from a shell, launches a locally installed Chromium against loopback or file:// pages only and writes its report to the output folder you give it."
description_tr: "On altı orijinal stil grameri, on iki zanaat referansı, güncel modern-web yetenek tarifleri, açık yönlendirme bağlamı ve sınırlı kaynak incelemesi, renk kontrastı ve navigasyon görev yolları için durumsuz araçlar içeren ön uç tasarım rehberliği. Açıklama — hardlight_inspect aracı, modelin adlandırdığı herhangi bir yerel dizin altındaki ön uç kaynak dosyalarını (.html, .css, .js, .ts, .jsx, .tsx, .vue, .svelte ve benzerleri; en fazla 500 dosya ve 8 MiB) okur; gizli, sembolik bağlantılı, vendor/build ve gizli adlandırılmış yolları atlar ve bunların tasarım belirteçlerini ve bulgularını modele döndürür; eklenti her oturuma araçlarını adlandıran kısa bir sistem-istem bölümü ekler; araçlar ağ çağrısı yapmaz, alt süreç çalıştırmaz ve dosya yazmaz; isteğe bağlı hardlight browser komutu, bir kabuktan elle çalıştırıldığında, yalnızca loopback veya file:// sayfalarına karşı yerel olarak yüklü bir Chromium başlatır ve raporunu verdiğiniz çıktı klasörüne yazar."
