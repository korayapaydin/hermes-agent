name: healthcare
repo: https://github.com/harrylabsj/hermes-plugin-healthcare
sha: 09f3af2b2b862efececbcfa784c4442fcc2978df
description: 'Local-first personal health records: encrypted on-device Vault (AES-GCM) for
  vitals, medications, activities, emotions, sleep, encounters, diagnosis mentions,
  medication plans and reminders, served through a Keychain-paired local daemon with 24
  scoped MCP tools. Zero-config first run: the plugin bootstraps Vault + daemon + agent
  pairing automatically under PLUGIN_DATA. Engine pinned to an immutable PyPI release
  (healthcare-mcp==0.2.1) over uvx stdio; Portable Agent Plugins v1 package (mcp.json +
  skills/), macOS only, Python 3.11+. Zero network by default; the optional LLM report-import
  endpoint stays off unless the user configures it. Approval-gated deletes, tamper-evident
  audit chain. Disclosure — personal health record-keeping, not medical advice (the skill
  forbids diagnoses and dosage changes); first run has uvx fetch healthcare-mcp==0.2.1 from PyPI;
  the optional report-import path posts report images to Alibaba DashScope (qwen-vl-max) unless
  HEALTHCARE_LLM_ENDPOINT points elsewhere, and only when HEALTHCARE_LLM_API_KEY is set.'
description_tr: "Yerel öncelikli kişisel sağlık kayıtları: vital bulgular, ilaçlar, etkinlikler, duygular, uyku, muayeneler, tanı ifadeleri, ilaç planları ve hatırlatıcılar için cihaz üzerinde şifreli Vault (AES-GCM); Anahtar Zinciri ile eşleştirilmiş yerel bir servis üzerinden 24 kapsamlı MCP aracıyla sunulur. Sıfır yapılandırmalı ilk çalıştırma: eklenti Vault + servis + ajan eşleştirmesini PLUGIN_DATA altında otomatik olarak kurar. Motor, uvx stdio üzerinden değişmez bir PyPI sürümüne (healthcare-mcp==0.2.1) sabitlenmiştir; Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), yalnızca macOS, Python 3.11+. Varsayılan olarak sıfır ağ; isteğe bağlı LLM rapor içe aktarma ucu, kullanıcı yapılandırmadıkça kapalı kalır. Onaya bağlı silmeler, kurcalamayı ortaya çıkaran denetim zinciri. Açıklama — tıbbi tavsiye değil, kişisel sağlık kaydı tutma amaçlıdır (yetenek tanı koymayı ve doz değişikliğini yasaklar); ilk çalıştırmada uvx, PyPI'dan healthcare-mcp==0.2.1 sürümünü getirir; isteğe bağlı rapor içe aktarma yolu, HEALTHCARE_LLM_ENDPOINT başka bir yeri göstermediği sürece ve yalnızca HEALTHCARE_LLM_API_KEY ayarlıysa rapor görsellerini Alibaba DashScope'a (qwen-vl-max) gönderir."
