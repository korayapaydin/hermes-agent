description: "Create, clean, and verify standalone Markdown with conservative semantic repair and deterministic artifact checks. Disclosure — skill-only plugin that has the agent run its bundled Node.js 22+ scripts through the terminal; on first use it runs `npm ci` in the plugin folder (lockfile-pinned packages from registry.npmjs.org), and the optional `/wolfmarkdown setup` also creates skill symlinks in ~/.agents/skills and ~/.claude/skills."
description_tr: "Tutucu anlamsal onarım ve deterministik çıktı denetimleriyle bağımsız Markdown oluşturun, temizleyin ve doğrulayın. Açıklama — yalnızca yetenek içeren eklenti; ajanın paketlediği Node.js 22+ betiklerini terminal üzerinden çalıştırmasını sağlar; ilk kullanımda eklenti klasöründe `npm ci` çalıştırır (registry.npmjs.org'dan lockfile ile sabitlenmiş paketler) ve isteğe bağlı `/wolfmarkdown setup` ayrıca ~/.agents/skills ve ~/.claude/skills içinde yetenek sembolik bağlantıları oluşturur."
