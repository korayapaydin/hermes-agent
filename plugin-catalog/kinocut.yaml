description: "Guardrailed local video editing: Kinocut's MCP server plus two workflow skills (editing and short-form repurposing). Trim, caption, reformat and check quality with local FFmpeg. Portable Agent Plugins v1 configuration and skills, no plugin code. Requires uv and FFmpeg on PATH; launches uvx kinocut==1.16.4 over stdio. First launch downloads Kinocut and dependencies from PyPI. URL inputs download the requested media; font and model-weight features fetch assets from GitHub. Explicit Revideo dependency installation runs npm ci and may download renderer dependencies. Local FFmpeg editing and color grading need no account or API key. Kinocut's optional vision calls default off and require explicit configuration: legacy product descriptions use an Anthropic-compatible endpoint, while sampled-frame QC uses Anthropic. The README explains how to use the host's image model instead, including local models. Revideo and Hyperframes telemetry default off. Unverified Hyperframes browser previews and Docker renders require explicit telemetry consent. Hyperframes capture/snapshots disable implicit model analysis. These controls are not a network sandbox; see the plugin README for configuration and remaining network use. Disclosure — launches `uvx kinocut==1.16.4` over stdio, which downloads Kinocut and its dependencies from PyPI on first launch; edits and writes local video files with FFmpeg; URL inputs download the requested media, font and model-weight features fetch assets from GitHub, and an explicit Revideo install runs `npm ci`; optional vision features (off by default) send selected images or sampled frames to an Anthropic-compatible endpoint or Anthropic; Revideo and Hyperframes telemetry stay off unless the operator enables them."
description_tr: "Korumalı yerel video düzenleme: Kinocut'ın MCP sunucusu ve iki iş akışı yeteneği (düzenleme ve kısa form yeniden amaçlandırma). Yerel FFmpeg ile kırpın, altyazı ekleyin, yeniden biçimlendirin ve kaliteyi kontrol edin. Taşınabilir Ajan Eklentileri v1 yapılandırması ve yetenekleri, eklenti kodu içermez. PATH üzerinde uv ve FFmpeg gerektirir; stdio üzerinden uvx kinocut==1.16.4'ü başlatır. İlk başlatma, Kinocut ve bağımlılıklarını PyPI'den indirir. URL girişleri istenen medyayı indirir; yazı tipi ve model-weight özellikleri GitHub'dan varlıklar çeker. Açık Revideo bağımlılık kurulumu npm ci'yi çalıştırır ve render bağımlılıklarını indirebilir. Yerel FFmpeg düzenleme ve renk derecelendirme için hesap veya API anahtarı gerekmez. Kinocut'ın isteğe bağlı görme çağrıları varsayılan olarak kapalıdır ve açık yapılandırma gerektirir: eski ürün açıklamaları Anthropic uyumlu bir uç nokta kullanırken, örneklenmiş kare kalite kontrolü (QC) Anthropic kullanır. README, yerel modeller dahil olmak üzere ana bilgisayarın görüntü modelinin nasıl kullanılacağını açıklar. Revideo ve Hyperframes telemetrisi varsayılan olarak kapalıdır. Doğrulanmamış Hyperframes tarayıcı önizlemeleri ve Docker render'ları açık telemetri onayı gerektirir. Hyperframes yakalama/anlık görüntüleri örtük model analizini devre dışı bırakır. Bu kontroller bir ağ kum havuzu değildir; yapılandırma ve kalan ağ kullanımı için eklenti README'sine bakın. Bilgilendirme — stdio üzerinden `uvx kinocut==1.16.4`'ü başlatır, bu da ilk başlatmada Kinocut ve bağımlılıklarını PyPI'den indirir; FFmpeg ile yerel video dosyalarını düzenler ve yazar; URL girişleri istenen medyayı indirir, yazı tipi ve model-weight özellikleri GitHub'dan varlıklar çeker ve açık bir Revideo kurulumu `npm ci` çalıştırır; isteğe bağlı görme özellikleri (varsayılan olarak kapalı), seçilen görüntüleri veya örneklenmiş kareleri Anthropic uyumlu bir uç noktaya veya Anthropic'e gönderir; Revideo ve Hyperframes telemetrisi, operatör etkinleştirmediği sürece kapalı kalır."
