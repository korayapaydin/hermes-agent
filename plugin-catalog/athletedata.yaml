version: "1.0.0"
description: "The athlete's own training and health data from 39 apps (Garmin, Oura, WHOOP, Hevy, Apple Health, Intervals.icu and more) through athletedata's hosted MCP server (Streamable HTTP at https://mcp.athletedata.health/mcp): activities, training load, HRV, sleep, readiness, nutrition, body composition, race predictions, and structured workouts pushed to the athlete's watch. Bundles one skill that tells the agent when to use it. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code: every tool call, with its arguments, goes to mcp.athletedata.health and needs an athletedata account (paid, 7-day free trial) with its API key in ATHLETEDATA_API_KEY; the athlete's health and training data is returned from that server. Write tools (push a workout to the watch, log food, create a Hevy routine) change the athlete's own accounts; the package marks the server untrusted, so Hermes asks before every tool the server does not annotate as read-only. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
description_tr: "39 uygulama (Garmin, Oura, WHOOP, Hevy, Apple Health, Intervals.icu ve daha fazlası) üzerinden sporcunun kendi antrenman ve sağlık verileri, athletedata'nın barındırılan MCP sunucusu aracılığıyla (https://mcp.athletedata.health/mcp adresinde akışlanabilir HTTP): aktiviteler, antrenman yükü, HRV, uyku, hazırlık, beslenme, vücut kompozisyonu, yarış tahminleri ve sporcunun saatine gönderilen yapılandırılmış antrenmanlar. Ajanın bunu ne zaman kullanacağını söyleyen bir yetenek paketler. Agent Plugins v1 paketi (plugin.json + mcp.json + skills/), yalnızca yapılandırma içerir. Açıklama — Yerel kodu olmayan yalnızca barındırılan bir bağlayıcıdır: her araç çağrısı, bağımsız değişkenleriyle birlikte mcp.athletedata.health adresine gider ve ATHLETEDATA_API_KEY içindeki API anahtarıyla birlikte bir athletedata hesabı (ücretli, 7 günlük ücretsiz deneme) gerektirir; sporcunun sağlık ve antrenman verileri bu sunucudan döndürülür. Yazma araçları (saate antrenman gönderme, yemek kaydetme, Hevy rutini oluşturma) sporcunun kendi hesaplarını değiştirir; paket sunucuyu güvenilmez olarak işaretler, bu nedenle Hermes, sunucunun salt okunur olarak işaretlemediği her araçtan önce onay ister. Araç seti çalışma zamanında uzak sunucu tarafından sağlanır ve sabitlenmiş sha kapsamına girmez."
