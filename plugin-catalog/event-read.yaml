name: event-read
repo: https://github.com/TakeshiTGAL/hermes-plugin-event-read
sha: d469ceb434d59dc91bb14ff9ae1e1191e135d025
description: "Read one CalDAV calendar collection you run, with list_events and read_event. Disclosure — Sends CALDAV_USER and CALDAV_PASSWORD as Basic auth to your CALDAV_URL, does not follow redirects, and starts no local program. Over plain http that password travels unencrypted. The tools are on for every surface, including gateways, and the plugin has no user list of its own: anyone you allow on your Hermes gateway reads the calendar with your password. Turn a surface off with hermes tools. A watch is a cron job you create yourself with hermes cron create. Each run is at least one model turn, there is no daily cap, and the job stays until you run hermes cron remove. Under plugins.isolation: host the watch cannot run and posts a notice saying so on every run. When the watch can run, it reports a problem on the first run, when the cause changes and again after 23 hours, or on every run when its data directory cannot be written. Each request gives up after 20 seconds without data, and a whole call has no time limit. The watch relies on private parts of Hermes, so an update can stop it. State lives in plugin-data/event-read. Not tested against a vendor-hosted calendar."
description_tr: "Kendi çalıştırdığınız bir CalDAV takvim koleksiyonunu okuyun; list_events ve read_event araçlarıyla. Açıklama — CALDAV_USER ve CALDAV_PASSWORD değerlerini CALDAV_URL adresinize Basic kimlik doğrulaması olarak gönderir, yönlendirmeleri izlemez ve yerel bir program başlatmaz. Düz http üzerinden bu parola şifrelenmeden yol alır. Araçlar ağ geçitleri dahil her yüzeyde açıktır ve eklentinin kendi kullanıcı listesi yoktur: Hermes ağ geçidinizde izin verdiğiniz herkes takvimi sizin parolanızla okur. Bir yüzeyi hermes tools ile kapatın. İzleme, kendi oluşturduğunuz ve hermes cron create ile kurduğunuz bir cron görevidir. Her çalışma en az bir model turudur, günlük sınır yoktur ve görev siz hermes cron remove çalıştırana kadar kalır. plugins.isolation: host altında izleme çalışamaz ve her çalışmada bunu belirten bir bildirim yayınlar. İzleme çalışabildiğinde bir sorunu ilk çalışmada, neden değiştiğinde ve 23 saat sonra yeniden ya da veri dizinine yazılamadığında her çalışmada bildirir. Her istek 20 saniye veri alamazsa vazgeçer ve bir çağrının tamamı için zaman sınırı yoktur. İzleme, Hermes'in özel bölümlerine dayanır; bu yüzden bir güncelleme onu durdurabilir. Durum plugin-data/event-read içinde tutulur. Satıcı tarafından barındırılan bir takvime karşı denenmedi."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-event-read#readme
version: "0.1.0"
requires_hermes: '>=0.21.4'
platforms: []
capabilities:
  provides_tools:
  - list_events
  - read_event
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - CALDAV_URL
  - CALDAV_USER
  - CALDAV_PASSWORD
