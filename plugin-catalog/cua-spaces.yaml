description: "Cua's own plugin: runs Hermes's terminal, file and code tools inside a Cua Space, an isolated Linux, macOS or Windows machine you can watch live, as a terminal backend (`hermes config set terminal.backend cua`). On Hermes 0.22.3 and later, Bot Desktop, computer_use and the browser follow the terminal into the Space too (needs the `cua` command). Disclosure — installs the `cua` Python SDK (>=0.5.0,<0.8); every command the agent runs, every file it touches, and (on 0.22.3+) every screen, click and page the agent drives go to the Space: on this machine for a local Space, or on Cua's cloud (cua.ai) or a machine you name, using the sign-in `cua auth login` saved (the plugin never reads or stores a token, and keeps CUA_API_KEY/CUA_DAEMON_TOKEN out of the Space). Windows Spaces run Hermes's tools in Git Bash, like Hermes on a Windows PC: if the Space lacks Git for Windows or Python, the plugin installs them inside the Space (pinned official installers checked against SHA-256, `winget` fallback) and adds `C:\\c`-style drive aliases there. The optional `desktop` setting installs a desktop stack (VNC, Chromium, agent-browser, cua-driver) inside a Linux Space with sudo there. Nothing is installed on this machine. With the default `space: create` it makes a fresh Space per session and deletes it when Hermes finishes (`delete_on_exit`); because that Space is a disposable sandbox, Hermes skips its dangerous-command prompts there, as it does for its other container backends. A Space you name is never deleted and keeps the prompts."
description_tr: "Cua'nın kendi eklentisi: Hermes'i, terminal, dosya ve kod araçlarını canlı olarak izleyebileceğiniz izole bir Linux makinesi olan bir Cua Space içinde terminal arka ucu olarak çalıştırır (`hermes config set terminal.backend cua`). Açıklama — `cua` Python SDK'sını (>=0.5.0,<0.6) kurar; ajanın çalıştırdığı her komut ve dokunduğu her dosya Space'e gider: yerel bir Space için bu makinede, ya da Cua'nın bulutunda (cua.ai) veya adını verdiğiniz bir makinede, kaydedilmiş `cua auth login` oturumu kullanılarak (eklenti token'ı asla okumaz veya saklamaz ve CUA_API_KEY/CUA_DAEMON_TOKEN'ı Space'in dışında tutar). Varsayılan `space: create` ile oturum başına yeni bir Space oluşturur ve Hermes bitince onu siler (`delete_on_exit`); bu Space tek kullanımlık bir korumalı alan olduğundan Hermes orada tehlikeli komut istemlerini atlar, tıpkı diğer konteyner arka uçlarında yaptığı gibi. Adını verdiğiniz bir Space asla silinmez ve istemleri korur."
