name: hermes-verifier
repo: https://github.com/am423/hermes-verifier
sha: 514ff4a7a937e391fca763ba3c9732103f351531
description: "Attach an independent verifier (advisor) model to your Hermes session: it reviews each primary-agent turn delta, raises findings (note / caution / blocker), and can steer a blocker back into the session before the primary agent goes wrong. Read-only tool access (read_file, search_files) is available but off by default and best treated as opt-in plumbing -- measured across 216 reviews the reviewer made ~4 tool calls. Supports a VERIFIER.yml roster of named specialists, each with its own model and tool grant, plus VERIFIER.md review priorities. Ships disabled and off by default. Disclosure — off by default. When enabled, each primary turn's regex-redacted transcript delta goes to the verifier model's provider on that provider's terms and billing (one or more calls per turn per roster entry). So do any VERIFIER.md / VERIFIER.yml briefs found in HERMES_HOME and from the working directory up to the repo root (confined to that root, 256 KiB per file). A project VERIFIER.yml can add named verifiers and instructions whose findings are injected into your session, and a blocker finding can keep a coding turn going. With advisor_tools on, an advisor can read any file the session can read through read_file/search_files, and those reads also go to the provider. The optional engagement gate sends a ≤1,500-char redacted digest per turn. The optional phase gate sends the redacted arguments of an impending destructive or publishing tool call and can block that call (it fails open). Findings, reasoning, short redacted excerpts and gate decisions are logged under HERMES_HOME/plugin-data/hermes-verifier (rotated at 8 MB). Adds a /verify command, a dashboard API and a Desktop Verifier page. Development scripts (evals/, sidecar/, autoresearch/) run only when launched by hand: provider experiments use DEEPSEEK_API_KEY from the process environment or the host `hermes` CLI, and offline analysis reads the active profile's session database and decision logs. No telemetry, no runtime shell execution, no access to Hermes's stored credentials."
description_tr: "Hermes oturumunuza bağımsız bir doğrulayıcı (danışman) modeli ekleyin: her birincil ajan tur değişimini inceler, bulgular (not / uyarı / engelleyici) ortaya çıkarır ve birincil ajan yanlış yola sapmadan önce bir engelleyiciyi oturuma geri yönlendirebilir. Salt okunur araç erişimi (read_file, search_files) vardır ama varsayılan olarak kapalıdır ve en iyi ihtimalle isteğe bağlı bir altyapı olarak ele alınmalıdır — 216 inceleme boyunca gözden geçiren yaklaşık 4 araç çağrısı yaptı. Her biri kendi modeli ve araç izni olan adlandırılmış uzmanlardan oluşan bir VERIFIER.yml kadrosunu, ayrıca VERIFIER.md inceleme önceliklerini destekler. Devre dışı ve varsayılan olarak kapalı gelir. Açıklama — varsayılan olarak kapalıdır. Etkinleştirildiğinde, her birincil turun regex ile gizlenmiş transkript farkı, doğrulayıcı modelin sağlayıcısına o sağlayıcının koşulları ve faturalandırmasıyla gönderilir (kadro girdisi başına tur başına bir veya daha fazla çağrı). HERMES_HOME içinde ve çalışma dizininden depo köküne kadar bulunan tüm VERIFIER.md / VERIFIER.yml belgeleri de öyle (o kökle sınırlı, dosya başına 256 KiB). Bir proje VERIFIER.yml dosyası, bulguları oturumunuza enjekte edilen adlandırılmış doğrulayıcılar ve talimatlar ekleyebilir; bir engelleyici bulgusu bir kodlama turunun devam etmesini sağlayabilir. advisor_tools açıkken bir danışman, oturumun read_file/search_files ile okuyabildiği her dosyayı okuyabilir ve bu okumalar da sağlayıcıya gider. İsteğe bağlı engagement gate, tur başına ≤1.500 karakterlik gizlenmiş bir özet gönderir. İsteğe bağlı phase gate, yaklaşan bir yıkıcı veya yayımlayıcı araç çağrısının gizlenmiş bağımsız değişkenlerini gönderir ve o çağrıyı engelleyebilir (başarısız olduğunda açık kalır). Bulgular, akıl yürütme, kısa gizlenmiş alıntılar ve kapı kararları HERMES_HOME/plugin-data/hermes-verifier altında günlüğe kaydedilir (8 MB'ta döndürülür). Bir /verify komutu, bir gösterge paneli API'si ve bir Desktop Verifier sayfası ekler. Geliştirme betikleri (evals/, sidecar/, autoresearch/) yalnızca elle başlatıldığında çalışır: sağlayıcı deneyleri süreç ortamındaki DEEPSEEK_API_KEY'i veya ana makinedeki `hermes` CLI'sini kullanır; çevrimdışı analiz ise etkin profilin oturum veritabanını ve karar günlüklerini okur. Telemetri yok, çalışma zamanında kabuk çalıştırma yok, Hermes'in sakladığı kimlik bilgilerine erişim yok."
maintainer: am423
