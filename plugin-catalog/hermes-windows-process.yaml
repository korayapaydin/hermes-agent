subdir: windows-process
description: >-
  Answer "what is still running, and who started it" on Windows: win_process_table reads the
  process table (PID, parent PID, image name) and adds each process's image path and creation
  time, then marks every row with whether its recorded parent is still the process that spawned
  it. Windows stores a parent PID rather than a handle, so a child that outlived its parent
  points at a PID that is either unused or reused by a newer process; a parent that started
  after its child cannot have spawned it, so both cases are reported as gone or reused instead
  of a plausible but wrong parent name. Filters cover one PID, several PIDs, a name or path
  substring, a parent PID, and an orphans-only view of what outlived its parent, with a result
  cap and an option to leave out Windows session processes. Use it for leftover
  gateway/backend/server children after a quit, for telling thirty python.exe rows apart by
  start time, and for checking whether a process started before or after the thing being
  debugged. Read-only: processes are opened with PROCESS_QUERY_LIMITED_INFORMATION for
  QueryFullProcessImageName and GetProcessTimes only - no memory reads (command lines are
  deliberately out of scope), no handle duplication, no writes, no child processes. Stdlib-only
  (ctypes): no Python dependencies, no network calls, no file writes, no self-update. Windows
  only. Disclosure - the tool reports image names, image paths and start times to the model,
  and those routinely include the user and machine name (C:\Users\<name>\...) and reveal which
  editor, shell or agent started which process; treat the output like a Task Manager
  screenshot.
maintainer: Yicheng-Mark
description_tr: "Windows üzerinde \\\"hala ne çalışıyor ve bunu kim başlattı\\\" sorusuna yanıt verir: win_process_table işlem tablosunu (PID, üst PID, görüntü adı) okur, her işlemin görüntü yolunu ve oluşturulma zamanını ekler ve ardından her satırı, kayıtlı üst işleminin hala onu başlatan işlem olup olmadığıyla işaretler. Windows, bir tutamaç yerine üst PID'yi saklar, bu nedenle üst işleminden daha uzun süre yaşayan bir alt işlem, ya kullanılmayan ya da yeni bir işlem tarafından yeniden kullanılan bir PID'yi işaret eder; alt işleminden sonra başlayan bir üst işlem onu başlatmış olamaz, bu nedenle her iki durum da makul ancak yanlış bir üst işlem adı yerine gitmiş veya yeniden kullanılmış olarak bildirilir. Filtreler; tek bir PID'yi, birkaç PID'yi, bir ad veya yol alt dizgisini, bir üst PID'yi ve üst işleminden daha uzun süre yaşayanların sadece yetimler görünümünü kapsar; ayrıca bir sonuç sınırı ve Windows oturum işlemlerini hariç tutma seçeneği sunar. Çıkıştan sonra kalan ağ geçidi/arka uç/sunucu alt işlemleri için, otuz adet python.exe satırını başlangıç zamanına göre ayırt etmek için ve bir işlemin hata ayıklanan şeyden önce mi yoksa sonra mı başladığını kontrol etmek için kullanın. Salt okunurdur: işlemler, yalnızca QueryFullProcessImageName ve GetProcessTimes için PROCESS_QUERY_LIMITED_INFORMATION ile açılır - bellek okumaları (komut satırları kasıtlı olarak kapsam dışıdır), tutamaç çoğaltma, yazma veya alt işlemler yoktur. Yalnızca standart kütüphane (ctypes) kullanılır: Python bağımlılıkları, ağ çağrıları, dosya yazımları veya otomatik güncellemeler yoktur. Yalnızca Windows. Bilgilendirme - araç; görüntü adlarını, görüntü yollarını ve başlangıç zamanlarını modele bildirir ve bunlar rutin olarak kullanıcı ve makine adını (C:\\\\Users\\\\<name>\\\\...) içerir ve hangi düzenleyicinin, kabuğun veya ajanın hangi işlemi başlattığını ortaya çıkarır; çıktıyı bir Görev Yöneticisi ekran görüntüsü gibi değerlendirin."
