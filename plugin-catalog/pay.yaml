title: Pay
description: "Discover priced APIs and pay per request (HTTP 402, x402, MPP) in stablecoins through the official hosted Pay MCP server (Streamable HTTP at https://connect.pay.sh/mcp, OAuth sign-in, no keys or local wallet), with the pay workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no Python or executables. Disclosure — payments plugin for pay.sh: the curl tool spends the hosted Pay account's stablecoin balance; hosted Pay enforces the account's spending limits (none move until the user sets them) and confirms each payment through MCP elicitation, declined when nobody can answer; the plugin marks its server untrusted, but the documented OAuth setup (`hermes mcp add pay`) replaces that entry with a native one that runs at `trust: full` unless the user sets `mcp_servers.pay.trust: untrusted`; chats sharing a Hermes profile share its Pay account; the tool set is served by the remote MCP server at runtime and is not covered by the pinned sha."
description_tr: "Fiyatlandırılmış API'leri keşfedin ve istek başına (HTTP 402, x402, MPP) stabilcoin ile ödeyin: resmî, barındırılan Pay MCP sunucusu (https://connect.pay.sh/mcp adresinde Streamable HTTP, OAuth ile oturum açma, anahtar veya yerel cüzdan yok) ve paketlenmiş pay iş akışı yeteneği ile. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), Python veya çalıştırılabilir dosya yok. Açıklama — pay.sh için ödeme eklentisi: curl aracı, barındırılan Pay hesabının stabilcoin bakiyesinden harcar; barındırılan Pay, hesabın harcama limitlerini uygular (kullanıcı belirleyene kadar hiçbiri hareket etmez) ve her ödemeyi MCP elicitation yoluyla onaylar, kimse yanıt veremiyorsa reddedilir; eklenti sunucusunu güvenilmez olarak işaretler, ancak belgelenen OAuth kurulumu (`hermes mcp add pay`) bu girdiyi, kullanıcı `mcp_servers.pay.trust: untrusted` ayarlamadıkça `trust: full` ile çalışan yerel bir girdiyle değiştirir; bir Hermes profilini paylaşan sohbetler onun Pay hesabını paylaşır; araç kümesi çalışma zamanında uzak MCP sunucusu tarafından sunulur ve sabitlenmiş sha kapsamında değildir."
