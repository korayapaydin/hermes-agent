title: Activity
description: "Hermes Desktop session analytics and provider-reported usage: annual heatmaps, token mix, model breakdowns and source-period summaries. Disclosure — reads the selected profile's state.db read-only and, for the Providers tab, an Activity cache under plugin-data/hermes-activity plus the optional Quota quota_cache.json. Fetch provider data runs a local Node.js (22.18+) collector and, only on that explicit click, calls chatgpt.com through Hermes's signed-in Codex request route (requires_auth: openai-codex) and api.commandcode.ai, opencode.ai and ollama.com with the optional API keys you configure as plugin secrets; it stores usage aggregates and hashed key identifiers locally. No other credential reads, telemetry or sign-in flow; remote profiles go through the configured gateway."
description_tr: "Hermes Desktop oturum analitiği ve sağlayıcıların bildirdiği kullanım: yıllık ısı haritaları, token dağılımı, model kırılımları ve dönem özetleri. Açıklama — seçili profilin state.db dosyasını salt okunur okur ve Sağlayıcılar sekmesi için plugin-data/hermes-activity altındaki bir Activity önbelleğini ve isteğe bağlı Quota quota_cache.json dosyasını okur. Sağlayıcı verilerini getir, yerel bir Node.js (22.18+) toplayıcısı çalıştırır ve yalnızca bu açık tıklamada, Hermes'in oturum açmış Codex istek yolu üzerinden (requires_auth: openai-codex) chatgpt.com'a ve eklenti sırları olarak yapılandırdığınız isteğe bağlı API anahtarlarıyla api.commandcode.ai, opencode.ai ve ollama.com'a çağrı yapar; kullanım toplamlarını ve karma anahtar tanımlayıcılarını yerel olarak saklar. Başka kimlik bilgisi okuma, telemetri veya oturum açma akışı yoktur; uzak profiller yapılandırılmış ağ geçidinden geçer."
