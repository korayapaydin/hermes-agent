description: "OpenPaths model provider for Hermes: OpenAI-compatible inference at openpaths.io with auto, auto-easy-task, auto-medium-task, auto-hard-task and auto-think task-tier routes plus GPT, Claude, Gemini and DeepSeek models, live /models listing, and Hermes reasoning effort mapped to OpenPaths reasoning_effort. Disclosure — prompts, tool schemas, tool results and conversation context are sent to openpaths.io with your OPENPATHS_API_KEY and forwarded to the upstream model vendors it routes to; the plugin makes no other network calls and registers no tools or hooks."
description_tr: "Hermes için OpenPaths model sağlayıcısı: openpaths.io üzerinden OpenAI uyumlu çıkarım; auto, auto-easy-task, auto-medium-task, auto-hard-task ve auto-think görev katmanı rotalarının yanı sıra GPT, Claude, Gemini ve DeepSeek modelleri, canlı /models listelemesi ve Hermes akıl yürütme çabasının OpenPaths reasoning_effort'ına eşlenmesi. `hermes model` ile Reka'yı seçin veya `--provider reka` kullanın. Bilgilendirme — istemler, araç şemaları, araç sonuçları ve konuşma bağlamı, OPENPATHS_API_KEY'iniz ile openpaths.io'ya gönderilir ve yönlendirdiği üst model satıcılarına iletilir; eklenti başka ağ çağrısı yapmaz, araç veya kanca kaydetmez."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - OPENPATHS_API_KEY
requires_hermes: ">=0.21.6"
