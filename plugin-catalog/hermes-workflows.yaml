name: hermes-workflows
repo: https://github.com/jacobhausler/hermes-workflows
sha: b1bf8cc99d5113cfaf8251122ce4f4492838bad8
description: "Agent-owned workflow graphs for Hermes — a background runner executes a JSON DAG of agent nodes, fan-outs (quorum) and human/machine gates with fingerprint replay-skip resume, cooperative steer, typed failure events and compact status payloads; ships a desktop DAG view, an inline transcript card and the authoring skill with measured budget recipes. Stock Hermes; no patched core required. Disclosure — every workflow run spawns a detached background runner (wf.py run <id>) that survives session end, gateway restart and plugin disable until the graph reaches a boundary or workflow stop; each agent node is a child hermes chat --query-file … --oneshot -Q … inheriting the runner's environment, and a node with profile set runs as that named profile (with its own credentials) only if the target's workflow_team.json lists the launcher; a gate's wait.until_argv runs an agent-authored argv directly from the runner, outside Hermes' tool-approval gate (the engine uses no shell, but the shipped machine-watch and incident-response templates use it to run a shell line read from a fixed-name handoff file under $HERMES_HOME, and release-lifecycle one read from a per-run handoff file in the run dir); the runner makes itself the subreaper of its children and SIGTERM/SIGKILLs any process a node leaves running (its own descendants plus pids registered in the run's .proctree_sidecar.jsonl) when the node finishes, retries or the run stops; run and amend send a one-token ping through Hermes' configured providers to check pinned model routes; at gate.held/run.done/run.failed the runner reads the API server key from config.yaml and POSTs a wake turn to the local Hermes API server — the gate.held wake only relays the gate to the human, but the run.done wake tells the woken session to turn the run's findings into tracked work and dispatch follow-up work (as PRs) before the turn ends, and the run.failed wake to apply one corrective amend/repair/resume; a transform_llm_output hook appends a ::workflow{id} card line to replies for runs the session launched in the last 30 minutes; the runner reads WORKFLOW_MAX_SEATS (that key only) from $HERMES_HOME/.env and the active profile's .env; state.db is read read-only, including every profile's session ids and profile names, and status/wait can read runs in sibling profiles' workflows dirs; state lives under $HERMES_HOME/workflows/ (or a configured runs_root). No other network of its own."
description_tr: "Hermes için ajanın sahip olduğu iş akışı grafikleri — bir arka plan koşucusu, ajan düğümlerinden oluşan bir JSON DAG'ını, fan-out'ları (çoğunluk) ve insan/makine kapılarını parmak iziyle oynatma-atlama devamı, işbirliğiyle yön verme, tipli hata olayları ve kompakt durum yükleriyle yürütür; masaüstü DAG görünümü, satır içi döküm kartı ve ölçülmüş bütçe tarifleriyle yazım yeteneği gelir. Stok Hermes; yamalanmış çekirdek gerekmez. Açıklama — her iş akışı koşusu, oturum sonunu, ağ geçidi yeniden başlatmasını ve eklentinin devre dışı bırakılmasını grafik bir sınıra ya da workflow stop'a ulaşana kadar atlatan ayrık bir arka plan koşucusu (wf.py run <id>) başlatır; her ajan düğümü, koşucunun ortamını devralan bir alt hermes chat --query-file … --oneshot -Q … sürecidir ve profile ayarlanmış bir düğüm, yalnızca hedefin workflow_team.json dosyası başlatıcıyı listeliyorsa o adlandırılmış profil olarak (kendi kimlik bilgileriyle) çalışır; bir kapının wait.until_argv'si, ajan tarafından yazılmış bir argv'yi Hermes'in araç onay kapısının dışında doğrudan koşucudan çalıştırır (motor kabuk kullanmaz, ancak gelen machine-watch ve incident-response şablonları bunu $HERMES_HOME altındaki sabit adlı bir devir dosyasından okunan bir kabuk satırını ve release-lifecycle şablonu da koşu dizinindeki koşu başına bir devir dosyasından okunan bir satırı çalıştırmak için kullanır); koşucu kendisini çocuklarının alt toplayıcısı (subreaper) yapar ve düğüm bittiğinde, yeniden denendiğinde veya koşu durduğunda bir düğümün çalışır bıraktığı her süreci (kendi alt süreçleri artı koşunun .proctree_sidecar.jsonl dosyasına kaydedilen pid'ler) SIGTERM/SIGKILL ile sonlandırır; run ve amend, sabitlenmiş model rotalarını denetlemek için Hermes'in yapılandırılmış sağlayıcıları üzerinden tek token'lık bir ping gönderir; gate.held/run.done/run.failed durumlarında koşucu config.yaml dosyasından API sunucu anahtarını okur ve yerel Hermes API sunucusuna bir uyandırma turu POST eder — gate.held uyandırması yalnızca kapıyı insana iletir, ancak run.done uyandırması uyandırılan oturuma koşunun bulgularını izlenen işe dönüştürmesini ve tur bitmeden takip işlerini (PR olarak) göndermesini, run.failed uyandırması ise tek bir düzeltici amend/repair/resume uygulamasını söyler; bir transform_llm_output kancası, oturumun son 30 dakikada başlattığı koşular için yanıtlara bir ::workflow{id} kart satırı ekler; koşucu WORKFLOW_MAX_SEATS (yalnızca o anahtar) değerini $HERMES_HOME/.env ve etkin profilin .env dosyasından okur; state.db salt okunur olarak, her profilin oturum kimlikleri ve profil adları dahil okunur ve status/wait, kardeş profillerin workflows dizinlerindeki koşuları okuyabilir; durum $HERMES_HOME/workflows/ altında (veya yapılandırılmış bir runs_root altında) tutulur. Kendine ait başka ağı yoktur."
