name: evalroute
repo: https://github.com/keppy/hermes-plugin-evalroute
sha: 836273c09d28cd5fc6c009ed955837e2014bd1f7
description: 'Route a task to the right (model, reasoning effort) arm before you start. Classifies the task into a lane, prints a provenance-carrying route card, and installs per-model reasoning-effort defaults. Strong rules run locally; weak-signal classification calls the host LLM and consumes tokens. The separate harness and shim can make paid provider calls when explicitly run; no plugin-owned credentials. Disclosure — weak-signal task classification sends the task text to your active Hermes model via the host LLM facade (token cost). The model-callable tool, /route, /rate and observed /model and /reasoning commands append task text and command args to a local ledger at <HERMES_HOME>/evalroute/labels.jsonl. "hermes evalroute install-routes" rewrites agent.reasoning_overrides in config.yaml when you run it. The bundled harness and Hermes shim are never run by the plugin. When run by hand they make paid provider calls, execute model-generated code on the host via shell checkers, and run hermes -z with approvals bypassed. Disclosure — "hermes evalroute sync" (run by hand) downloads the route table from the Hugging Face dataset keppy/evalroute-flywheel into HERMES_HOME and route cards then show that dataset''s text; "hermes evalroute dispatch" (run by hand) spawns a single-query hermes chat on the routed model (Nous provider by default) — or, with --runner claude-code, a `claude -p` (Claude Code) process under the user''s own Claude account, whose per-run cost is recorded in the local sidecar — with the brief as its query, inheriting the current environment except HERMES_YOLO_MODE (the worker never inherits --yolo; its approvals follow approvals.single_query_mode, default deny), and writes its report and a .dispatch.json sidecar beside the brief. Disclosure — "hermes evalroute contribute" (run by hand only) refuses to run unless evalroute.contribute: true is set in config.yaml, and then uploads redacted outcome rows only — lane, routed arm, confirmed arm, verdict, method, facet counts, ISO week and an HMAC-SHA256 task hash; never task text, notes, paths or the salt — to the user''s own path (contributed/<hf-username>/) in the Hugging Face dataset keppy/evalroute-flywheel using the user''s existing huggingface_hub login; "--dry-run" prints the exact rows and sends nothing; the per-install salt stays local in <HERMES_HOME>/evalroute/contribute.salt. Since evalroute 0.9.1 (schema 2) the same upload also carries lane-correction rows as lane pairs (from_lane, to_lane, method, week) with no task text, plus the max_turns value and harness name the arm ran under. Disclosure — "hermes evalroute install-encoder <dir|owner/name>" (run by hand only) downloads a small text-classification model (the default id keppy/evalroute-lane-encoder is a 146 MB ModernBERT fine-tune on the Hugging Face Hub) into <HERMES_HOME>/evalroute/encoder/ and from then on "hermes evalroute route" runs it locally, offline, to classify the task when the keyword rules are weak, instead of the LLM call; it needs torch and transformers in the plugin environment (pip extra evalroute[encoder]), which the plugin does not install; "install-encoder --remove" deletes it. "hermes evalroute export-cases" (run by hand only) writes your --lane-pinned route rows, task text included, to a local file you name, for training your own encoder; stdout carries counts only and nothing is uploaded. As of 0.6.2 the plugin is a thin adapter: all behaviour lives in the PyPI package evalroute (>=0.9.2,<0.10), declared as a Python dependency that Hermes installs on your confirmation.'
description_tr: "Başlamadan önce bir görevi doğru (model, akıl yürütme çabası) koluna yönlendirin. Görevi bir şeride sınıflandırır, kaynağıyla birlikte bir yönlendirme kartı yazdırır ve model başına akıl yürütme çabası varsayılanlarını kurar. Güçlü kurallar yerelde çalışır; zayıf sinyalli sınıflandırma ana makine LLM'ini çağırır ve token harcar. Ayrı koşum takımı ve shim'i, açıkça çalıştırıldığında ücretli sağlayıcı çağrıları yapabilir; eklentinin kendine ait kimlik bilgisi yoktur. Açıklama — zayıf sinyalli görev sınıflandırması, görev metnini ana makine LLM cephesi üzerinden etkin Hermes modelinize gönderir (token maliyeti). Model tarafından çağrılabilen araç, /route, /rate ve izlenen /model ile /reasoning komutları, görev metnini ve komut bağımsız değişkenlerini <HERMES_HOME>/evalroute/labels.jsonl konumundaki yerel bir deftere ekler. \"hermes evalroute install-routes\", siz çalıştırdığınızda config.yaml içindeki agent.reasoning_overrides ayarını yeniden yazar. Paketlenmiş koşum takımı ve Hermes shim'i eklenti tarafından asla çalıştırılmaz. Elle çalıştırıldıklarında ücretli sağlayıcı çağrıları yapar, kabuk denetleyicileri aracılığıyla model tarafından üretilen kodu ana makinede yürütür ve onaylar atlanmış olarak hermes -z çalıştırır. Açıklama — \"hermes evalroute sync\" (elle çalıştırılır), yönlendirme tablosunu Hugging Face veri kümesi keppy/evalroute-flywheel üzerinden HERMES_HOME içine indirir ve yönlendirme kartları bundan sonra o veri kümesinin metnini gösterir; \"hermes evalroute dispatch\" (elle çalıştırılır), yönlendirilen modelde (varsayılan olarak Nous sağlayıcısı) tek sorguluk bir hermes sohbeti başlatır — ya da --runner claude-code ile, kullanıcının kendi Claude hesabı altında çalışan ve çalışma başına maliyeti yerel yardımcı dosyaya kaydedilen bir `claude -p` (Claude Code) süreci — brifingi sorgusu olarak kullanır, HERMES_YOLO_MODE dışında mevcut ortamı devralır (işçi --yolo ayarını asla devralmaz; onayları approvals.single_query_mode ayarına uyar, varsayılan reddet) ve raporunu brifingin yanına bir .dispatch.json yardımcı dosyasıyla birlikte yazar. Açıklama — \"hermes evalroute contribute\" (yalnızca elle çalıştırılır), config.yaml içinde evalroute.contribute: true ayarlanmadıkça çalışmayı reddeder ve ardından yalnızca gizliliği kaldırılmış sonuç satırlarını — şerit, yönlendirilen kol, doğrulanan kol, karar, yöntem, ölçüt sayıları, ISO haftası ve bir HMAC-SHA256 görev karması; asla görev metni, notlar, yollar veya tuz — kullanıcının mevcut huggingface_hub oturumunu kullanarak Hugging Face veri kümesi keppy/evalroute-flywheel içindeki kullanıcının kendi yoluna (contributed/<hf-username>/) yükler; \"--dry-run\" tam satırları yazdırır ve hiçbir şey göndermez; kurulum başına tuz <HERMES_HOME>/evalroute/contribute.salt konumunda yerelde kalır. evalroute 0.9.1'den (şema 2) bu yana aynı yükleme, şerit düzeltme satırlarını görev metni içermeyen şerit çiftleri (from_lane, to_lane, method, week) olarak ve ayrıca kolun çalıştığı max_turns değeri ile koşum takımı adını taşır. Açıklama — \"hermes evalroute install-encoder <dir|owner/name>\" (yalnızca elle çalıştırılır), küçük bir metin sınıflandırma modelini (varsayılan kimlik keppy/evalroute-lane-encoder, Hugging Face Hub üzerinde 146 MB'lık bir ModernBERT ince ayarıdır) <HERMES_HOME>/evalroute/encoder/ içine indirir ve bundan sonra \"hermes evalroute route\", anahtar kelime kuralları zayıf olduğunda görevi sınıflandırmak için LLM çağrısı yerine modeli yerelde, çevrimdışı çalıştırır; model, eklenti ortamında torch ve transformers gerektirir (pip ek girdisi evalroute[encoder]) ve eklenti bunları kurmaz; \"install-encoder --remove\" modeli siler. \"hermes evalroute export-cases\" (yalnızca elle çalıştırılır), --lane ile sabitlenmiş yönlendirme satırlarınızı görev metni dâhil olmak üzere, kendi kodlayıcınızı eğitmeniz için adını verdiğiniz yerel bir dosyaya yazar; stdout yalnızca sayıları taşır ve hiçbir şey yüklenmez. 0.6.2'den bu yana eklenti ince bir bağdaştırıcıdır: tüm davranış, Hermes'in onayınızla kurduğu bir Python bağımlılığı olarak bildirilen PyPI paketi evalroute (>=0.9.2,<0.10) içinde yaşar."
maintainer: keppy
