description: "Official Blender Lab MCP server over stdio, pinned to upstream v1.0.3, with a Blender workflow skill. Needs Git and uv; Blender 5.1+ is not needed at install. The skill opens Blender itself when a task needs it and, after you agree, installs Blender and Blender Lab's MCP add-on. First startup downloads Python dependencies; prepare the uv environment before connecting. Disclosure — tools execute arbitrary Python in Blender with your privileges; the skill starts Blender with online access for that session only (your saved preference is unchanged), and the add-on's local server on port 9876 has no password, so any program on this computer can use it while Blender is open; only after you agree does the skill download Blender from download.blender.org (about 400 MB, about 1.5 GB unpacked), check it against blender.org's sha256 list and install it in your own folder without administrator rights (Linux ~/.local/opt, macOS ~/Applications, Windows %LOCALAPPDATA%\\Programs\\Blender Foundation; never over an existing Blender), and download the v1.0.3 add-on, check its hash and install or enable it; first start downloads the pinned Blender Lab MCP server and its Python dependencies with uv. Server discovery does not prove scene readiness."
description_tr: "stdio üzerinden resmî Blender Lab MCP sunucusu, upstream v1.0.3 sürümüne sabitlenmiş, bir Blender iş akışı yeteneği ile. Blender 5.1+, ayrıca kurulan MCP eklentisi, Git ve uv gerekir. İlk açılış Python bağımlılıklarını indirir; bağlanmadan önce uv ortamını hazırlayın. Açıklama — araçlar Blender içinde sizin ayrıcalıklarınızla rastgele Python çalıştırır; ilk başlatma, sabitlenmiş Blender Lab MCP sunucusunu ve Python bağımlılıklarını uv ile indirir; kurulum sırasında Hermes Blender'ı standart kurulum konumlarında (Windows kaldırma kaydı ve Program Files, macOS'ta /Applications ve Steam kitaplığı, PATH, flatpak, snap ve Linux'ta Steam) arar ve eksikse kurulumu reddeder. Sunucu keşfi, sahnenin hazır olduğunu kanıtlamaz."
