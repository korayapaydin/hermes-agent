name: secret-handoff
repo: https://github.com/aean0x/hermes-secret-handoff
sha: f669c2a8adce468790be46ad70cfd312df53ba79
description: "Ephemeral credential paste: request_secret asks through clarify and injects the reply over CDP, never storing it. Disclosure — the reply is typed into the focused field of the page whose origin matches the requested service, over the endpoint from BROWSER_CDP_URL or SECRET_HANDOFF_CDP_URL; the answer is visible in the CLI scrollback or the chat history of the surface that asked, and the value is never written to disk, the tool result, or the session transcript."
description_tr: "Geçici kimlik bilgisi yapıştırma: request_secret, clarify üzerinden sorar ve yanıtı CDP üzerinden enjekte eder, asla saklamaz. Açıklama — yanıt, BROWSER_CDP_URL veya SECRET_HANDOFF_CDP_URL ortam değişkenindeki uç nokta üzerinden, kaynağı istenen hizmetle eşleşen sayfanın odaklanmış alanına yazılır; yanıt, soruyu soran yüzeyin CLI kaydırma geçmişinde ya da sohbet geçmişinde görünür ve değer hiçbir zaman diske, araç sonucuna veya oturum transkriptine yazılmaz."
maintainer: aean0x
tier: community
category: tools
