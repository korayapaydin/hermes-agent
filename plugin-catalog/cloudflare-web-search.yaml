name: cloudflare-web-search
repo: https://github.com/Adolanium/hermes-cloudflare-web-search
sha: 259783bf335cfffbfe16e2ef16efa301beb6db14
description: "Cloudflare Web Search backend for Hermes' existing web_search tool, with Ceramic, Exa, or Linkup selected in plugin settings. Search only; keep a separate extract backend. Disclosure — sends queries, result limits, gateway IDs, and optional BYOK aliases to api.cloudflare.com, which forwards searches to the selected provider and records them in AI Gateway logs. Requests can consume gateway credits or provider quota. Reads its own settings and CLOUDFLARE_WEB_SEARCH_API_TOKEN through Hermes' profile-scoped APIs. Registers one web provider, with no new tools, hooks, background processes, file writes, or self-updater. Independent community plugin."
description_tr: "Hermes'in mevcut web_search aracı için Cloudflare Web Search arka ucu; eklenti ayarlarında Ceramic, Exa ya da Linkup seçilir. Yalnızca arama; ayrı bir çıkarma arka ucu tutun. Açıklama — sorguları, sonuç sınırlarını, ağ geçidi kimliklerini ve isteğe bağlı BYOK takma adlarını api.cloudflare.com adresine gönderir; bu hizmet aramaları seçilen sağlayıcıya iletir ve AI Gateway günlüklerine kaydeder. İstekler ağ geçidi kredilerini ya da sağlayıcı kotasını tüketebilir. Kendi ayarlarını ve CLOUDFLARE_WEB_SEARCH_API_TOKEN değerini Hermes'in profile özgü API'leri üzerinden okur. Yeni araçlar, kancalar, arka plan süreçleri, dosya yazmaları ya da kendini güncelleyici olmadan tek bir web sağlayıcısı kaydeder. Bağımsız topluluk eklentisi."
maintainer: Adolanium
tier: community
category: web
title: Cloudflare Web Search
docs_url: https://github.com/Adolanium/hermes-cloudflare-web-search#readme
image: https://raw.githubusercontent.com/Adolanium/hermes-cloudflare-web-search/259783bf335cfffbfe16e2ef16efa301beb6db14/assets/catalog-banner.png
version: "1.0.1"
platforms: []
known_issues:
  - >-
    Set web.cache_enabled: false in every profile using this backend. Hermes' shared
    search cache omits profiles and routing settings, so repeated queries can reuse
    another profile's result or an earlier provider, account, gateway, or BYOK route.
    This setting also disables the profile's extraction result cache.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - CLOUDFLARE_WEB_SEARCH_API_TOKEN
