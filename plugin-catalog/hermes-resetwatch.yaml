description: "Track subscription quotas and reset times in Hermes Desktop. Disclosure — probe.py re-executes itself under the Hermes Python interpreter located via HERMES_PYTHON / VIRTUAL_ENV / the parent process or the Hermes installer's managed venv (HERMES_HOME/installs). Every credential read is read-only and nothing is refreshed or stored: it reads provider API keys from the process environment, the Hermes .env, the Vaultwarden plugin's local secret cache (cache/vaultwarden_cache.json, only when Vaultwarden is the sole enabled secret source, keyed by a hash of BW_SESSION, which is never sent) and Docker s6 container env files; Hermes's saved OAuth logins (auth.json credential pool and HERMES_HOME/.anthropic_oauth.json); and other coding-assistant CLIs' local logins: Claude Code (credentials file, macOS keychain or Windows Credential Manager), Codex, Cursor (macOS keychain and the IDE's state.vscdb, opened read-only), Kimi, Grok, ZCode and Command Code. For GitHub Copilot (on by default) it tries COPILOT_GITHUB_TOKEN / GH_TOKEN / GITHUB_TOKEN (through Hermes get_secret, else the process environment), then the Copilot editor's apps.json / hosts.json, then runs gh auth token (prompts disabled, 3-second limit), trying each token in turn until GitHub accepts one. It sends each key only to its own vendor's usage endpoint, presenting the vendor client's identity headers where a private endpoint expects them (Claude Code and Codex CLI user agents, the Grok CLI client headers, and for Copilot the VS Code / Copilot Chat editor headers on api.github.com/copilot_internal/user, which GitHub does not document); environment variables such as GROK_CLI_CHAT_PROXY_BASE_URL, CLAUDE_CONFIG_DIR, CODEX_HOME and GROK_HOME change which host or file it uses. Usage results are cached under HERMES_HOME/cache/resetwatch, never tokens. It exposes nothing to the model: it is a Desktop page only."
description_tr: "Hermes Desktop'ta abonelik kotalarını ve sıfırlama zamanlarını izleyin. Açıklama — probe.py, HERMES_PYTHON / VIRTUAL_ENV / üst süreç veya Hermes kurucusunun yönettiği venv (HERMES_HOME/installs) üzerinden bulunan Hermes Python yorumlayıcısı altında kendini yeniden çalıştırır; sağlayıcı API anahtarlarını Hermes .env dosyasından, Hermes'in kendi kayıtlı OAuth oturum açmalarından (auth.json kimlik bilgisi havuzu, salt okunur), Vaultwarden eklentisinin yerel sır önbelleğinden (cache/vaultwarden_cache.json, salt okunur, yalnızca Vaultwarden etkin tek sır kaynağı olduğunda) ve Docker s6 konteyner ortam dosyalarından, ayrıca diğer kodlama asistanı CLI'lerinin yerel oturum açmalarından (macOS anahtarlık girdileri dahil) okur ve her anahtarı yalnızca kendi satıcısının kullanım uç noktasına gönderir."
