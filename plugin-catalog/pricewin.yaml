name: pricewin
repo: https://github.com/PriceDotWin/pricewin-hermes-plugin
sha: c3644c21a02fc995791d5056cc4cc8ec9e859b54
description: "Live hotel and flight prices from Booking.com, Agoda, Trip.com and Traveloka through the PriceWin MCP server (Streamable HTTP at mcp.price.win, no account or key), with the pricewin-travel-search skill and inline hotel/flight cards for the Desktop transcript bundled. Portable Agent Plugins v1 package (mcp.json + skills/ + desktop/). Booking is a request the hotel confirms; nothing is ever charged. Disclosure — connects to the hosted PriceWin MCP server at mcp.price.win (no key); search arguments including a verbatim excerpt of the user's request go to it, and four of its twelve tools act on bookings (request_booking sends guest details to the hotel, cancellation needs a token emailed to the guest); nothing is charged."
description_tr: "Booking.com, Agoda, Trip.com ve Traveloka'dan canlı otel ve uçuş fiyatları PriceWin MCP sunucusu üzerinden (Streamable HTTP, mcp.price.win, hesap ya da anahtar yok) sunulur; paketlenmiş pricewin-travel-search yeteneği ve Desktop dökümü için satır içi otel/uçuş kartları da birlikte gelir. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/ + desktop/). Rezervasyon, otelin onayladığı bir taleptir; hiçbir zaman ücret alınmaz. Açıklama — mcp.price.win adresindeki barındırılan PriceWin MCP sunucusuna bağlanır (anahtar yok); kullanıcının isteğinden birebir alıntı da dahil olmak üzere arama argümanları oraya gider ve on iki aracından dördü rezervasyonlar üzerinde işlem yapar (request_booking misafir bilgilerini otele gönderir, iptal için misafire e-postayla gönderilen bir token gerekir); hiçbir ücret alınmaz."
