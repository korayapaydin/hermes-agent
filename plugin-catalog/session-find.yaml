name: session-find
repo: https://github.com/djmango/session-find
sha: caf185c59e62c56a6e4377b8fb08a0ce0e574301
description: "A search window over your Hermes session history, opened with Cmd+Option+F, from the command palette, or from the glyph in the bottom bar whose hover shows the chord. Finds a session by an exact word, identifier or phrase through the gateway's own full text index, and by meaning as well when a session-find service answers on loopback; typed filters (in:, -in:, after:, before:, me:, repo: and quoted phrases) are mirrored as chips under the box. The empty box lists pinned then recent sessions, the preview pane shows the matching message with its neighbours, and the footer carries the round trip in whole milliseconds. It reads the session database read only, registers no agent tools, hooks or middleware, needs no credentials or environment variables; its only network calls are the loopback checks named below. The window half ships off by default and is switched on in the app's plugin inventory. Disclosure — while the search window is in use, the plugin's dashboard backend checks every 30 seconds for a separate session-find service at http://127.0.0.1:8474 (or the URL in SESSION_FIND_URL) and, when one answers, sends it your search text, preview requests and the ids of sessions you open, and shows the results it returns; otherwise it reads your Hermes session database read-only."
description_tr: "Hermes oturum geçmişiniz üzerinde, Cmd+Option+F ile, komut paletinden veya alt çubuktaki simgeden açılan bir arama penceresi. Ağ geçidinin kendi tam metin dizini aracılığıyla tam bir kelime, tanımlayıcı veya ifadeyle; ayrıca bir session-find servisi loopback üzerinden yanıt verdiğinde anlamla oturum bulur; yazılan filtreler (in:, -in:, after:, before:, me:, repo: ve tırnak içindeki ifadeler) kutunun altında çipler olarak yansıtılır. Boş kutu önce sabitlenmiş ardından son oturumları listeler, önizleme bölmesi eşleşen mesajı komşularıyla birlikte gösterir ve alt bilgi toplam gidiş-dönüş süresini milisaniye cinsinden taşır. Oturum veritabanını yalnızca okuma modunda okur, ajan araçları, kancalar veya ara katman yazılımları kaydetmez, kimlik bilgisi veya ortam değişkeni gerektirmez; tek ağ çağrıları aşağıda adı geçen loopback kontrolleridir. Pencere varsayılan olarak yarı kapalı gelir ve uygulamanın eklenti envanterinden açılır. Bilgilendirme — arama penceresi kullanılırken, eklentinin dashboard arka ucu her 30 saniyede bir http://127.0.0.1:8474 (veya SESSION_FIND_URL içindeki URL) adresinde ayrı bir session-find servisi olup olmadığını kontrol eder ve bir yanıt aldığında arama metninizi, önizleme isteklerini ve açtığınız oturumların kimliklerini göndererek dönen sonuçları gösterir; aksi takdirde Hermes oturum veritabanınızı yalnızca okuma modunda okur."
