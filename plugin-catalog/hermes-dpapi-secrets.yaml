subdir: dpapi-secrets
description: "Resolve Hermes environment variables at startup from a single secret file encrypted with the Windows Data Protection API, instead of keeping provider keys in plaintext in .env or auth.json. Config is secrets.dpapi.map, an ENV_VAR -> store-name mapping (bare names or dpapi:// names) plus an optional file path (default <HERMES_HOME>/secrets.dpapi). The file is one DPAPI blob keyed by the current Windows user profile, so it is unreadable by another Windows account and worthless off the machine; it is written by the bundled CLI (python -m hermes_dpapi_secrets set NAME, value read from a prompt or stdin, never from argv) and only read at runtime. Mapped names that are missing or empty are skipped with a warning; a file that is not ours, a blob this user cannot decrypt, or a payload that is not a flat string map is reported as an error with nothing injected. Disclosure - this source decrypts a file for every Hermes process that enables it: resolved values become environment variables of the Hermes process and its children, exactly like .env entries, so anything that can read that environment can see them. User-scope encryption only (the machine-wide flag is never used and is not exposed), and the at-rest protection is a bar for backups, cloud sync and dotfiles, not a boundary against code already running as the same user. Stdlib-only (ctypes): no Python dependencies, no subprocesses, no network calls, no self-update. Windows only. Applying fetched values stays the orchestrator's job; the plugin never writes os.environ itself. Disclosure — decrypts a DPAPI-encrypted secret file (default <HERMES_HOME>/secrets.dpapi) at startup for every Hermes process that enables it, and the resolved values become environment variables of Hermes and its child processes like `.env` entries; the encryption is per Windows user and protects backups, cloud sync and copied files, not against other code running as the same user. Local only: no network calls, no subprocesses."
description_tr: "Sağlayıcı anahtarlarını .env veya auth.json içinde düz metin olarak tutmak yerine, Hermes ortam değişkenlerini başlangıçta Windows Data Protection API ile şifrelenmiş tek bir gizli dosyadan çözer. Yapılandırma secrets.dpapi.map'tir: bir ENV_VAR -> store-name eşlemesi (yalın adlar ya da dpapi:// adları) ve isteğe bağlı bir dosya yolu (varsayılan <HERMES_HOME>/secrets.dpapi). Dosya, mevcut Windows kullanıcı profiline göre anahtarlanan tek bir DPAPI blob'udur; bu yüzden başka bir Windows hesabı tarafından okunamaz ve makine dışında hiçbir değeri yoktur; paketlenmiş CLI tarafından yazılır (python -m hermes_dpapi_secrets set NAME, değer bir istemden ya da stdin'den okunur, asla argv'den değil) ve yalnızca çalışma zamanında okunur. Eksik ya da boş olan eşlenmiş adlar bir uyarıyla atlanır; bize ait olmayan bir dosya, bu kullanıcının çözemediği bir blob ya da düz bir dize haritası olmayan bir yük bir hata olarak bildirilir ve hiçbir şey enjekte edilmez. Açıklama — bu kaynak, etkinleştiren her Hermes süreci için bir dosyanın şifresini çözer: çözülen değerler, tıpkı .env girdileri gibi Hermes sürecinin ve alt süreçlerinin ortam değişkenleri olur; dolayısıyla o ortamı okuyabilen her şey bunları görebilir. Yalnızca kullanıcı kapsamında şifreleme (makine geneli bayrak asla kullanılmaz ve sunulmaz) ve durağan veri koruması yedeklemeler, bulut eşitleme ve dotfiles için bir engel oluşturur; aynı kullanıcı olarak çalışan koda karşı bir sınır değildir. Yalnızca stdlib (ctypes): Python bağımlılığı, alt süreç, ağ çağrısı ve kendi kendini güncelleme yoktur. Yalnızca Windows. Getirilen değerlerin uygulanması orkestratörün işi olarak kalır; eklenti os.environ'u asla kendisi yazmaz. Açıklama — etkinleştiren her Hermes süreci için başlangıçta DPAPI ile şifrelenmiş gizli dosyanın (varsayılan <HERMES_HOME>/secrets.dpapi) şifresini çözer ve çözülen değerler, `.env` girdileri gibi Hermes'in ve alt süreçlerinin ortam değişkenleri olur; şifreleme Windows kullanıcısı başınadır ve yedeklemeleri, bulut eşitlemeyi ve kopyalanan dosyaları korur, aynı kullanıcı olarak çalışan diğer koda karşı korumaz. Yalnızca yerel: ağ çağrısı ve alt süreç yoktur."
