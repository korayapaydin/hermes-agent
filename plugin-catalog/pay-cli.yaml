title: Pay CLI
description: 'Discover priced APIs and pay per request (HTTP 402, x402, MPP) in stablecoins from a
  wallet on this machine, through the local `pay mcp` stdio server of the official Pay CLI, with the
  pay workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no Python or
  executables; the user installs the `pay` CLI (brew or npm) and runs `pay setup` first, and the server
  is offered only while `pay` is on PATH. Disclosure — payments plugin for pay.sh: Hermes starts `pay mcp`
  as a long-running local process; the curl tool spends the local wallet''s stablecoin balance; each
  payment is confirmed by the user through MCP elicitation (PAY_FORCE_ELICITATION=1, declined when
  nobody can answer) and the server is marked untrusted; every profile using the plugin shares the
  same local wallet.'
description_tr: "Fiyatlandırılmış API'leri keşfedin ve istek başına ödeme yapın (HTTP 402, x402, MPP) — resmi Pay CLI'ın yerel `pay mcp` stdio sunucusu üzerinden, bu makinedeki bir cüzdanın stabilcoinleriyle; pay iş akışı yeteneği paketle birlikte gelir. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), Python veya çalıştırılabilir dosya yok; kullanıcı önce `pay` CLI'ı (brew veya npm) kurar ve `pay setup` çalıştırır, sunucu yalnızca `pay` PATH'te bulunduğu sürece sunulur. Açıklama — pay.sh için ödemeler eklentisi: Hermes, `pay mcp` komutunu uzun süre çalışan yerel bir süreç olarak başlatır; curl aracı yerel cüzdanın stabilcoin bakiyesini harcar; her ödeme kullanıcı tarafından MCP elicitation yoluyla onaylanır (PAY_FORCE_ELICITATION=1, kimse yanıt veremediğinde reddedilir) ve sunucu güvenilmez (untrusted) olarak işaretlenir; eklentiyi kullanan her profil aynı yerel cüzdanı paylaşır."
