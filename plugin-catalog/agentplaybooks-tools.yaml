description: >-
  Connect AgentPlaybooks skills and hosted MCP/OpenAPI tools to Hermes, with guided setup,
  profile selection, permission diagnostics and an authenticated MCP check. Requires Node.js 20+
  and @agentplaybooks/cli@0.7.0; the CLI is installed separately. Disclosure — skill-only; the
  separately installed apb CLI does the work. `apb hermes setup --apply` restores complete skill
  trees into the chosen project and edits the selected Hermes profile's config.yaml to register
  those skills and a hosted playbook MCP endpoint. Local writes require --apply; setup also probes
  MCP initialization and tool listing using a scoped key from the process environment, without
  invoking tools. `doctor` checks profile credential variable names without exposing their values.
  Hosted operations contact agentplaybooks.ai (or an explicitly configured service); skill restore
  uses `apb login`, and `apb push --apply` uploads project configuration (secret references, not values).
description_tr: "AgentPlaybooks yeteneklerini ve barındırılan MCP/OpenAPI araçlarını Hermes'e bağlayın; rehberli kimlik doğrulama ve API anahtarı kurulumuyla. Node.js 20+ ve @agentplaybooks/cli@0.5.0 gerekir; CLI ayrıca kurulur. Açıklama — yalnızca yetenek; asıl işi ayrıca kurulan apb CLI yapar. `apb connect --target=hermes --apply` ve `apb sync --target=hermes --apply`, seçili Hermes profilinin config.yaml dosyasını düzenler (barındırılan playbook MCP uç noktasını ve birleştirilmiş MCP tanımlarını ekler, böylece o playbook'un uzak araçları ajan için kullanılabilir hâle gelir); yerel yazmalar --apply gerektirir; barındırılan işlemler `apb login` sonrasında agentplaybooks.ai ile iletişim kurar ve `apb push --apply`, projenizin yapılandırmasını (sır değerlerini değil, sır başvurularını) yükler."
