name: tam
repo: https://github.com/vbcherepanov/hermes-tam-memory
sha: 9a6e51839fb0619c6e41804ac201272e857ea825
subdir: hermes_tam_memory
version: "0.1.1"
description: "Local-first long-term memory backed by total-agent-memory (TAM) over MCP — saves each completed turn (with a noise filter; TAM's quality gate applies), recalls relevant memories before each turn within a token budget, and adds tam_recall / tam_save tools; optional TAM team server for shared company memory. Disclosure — local mode starts the separately installed tam binary as a child process per session with an allowlisted environment that carries no credentials: Hermes provider keys (including HF_TOKEN and OLLAMA_API_KEY), TAM_API_TOKEN and any *_TOKEN / *_API_KEY / *_SECRET / *_PASSWORD variable are withheld, and of HF_* / OLLAMA_* only non-secret settings pass (OLLAMA_URL, OLLAMA_EMBED_MODEL, HF_HOME, HF_HUB_OFFLINE); it stores user/assistant turn text plus built-in memory additions (not tool output) in TAM's store, by default outside HERMES_HOME and shared with other agents using TAM; remote mode sends the same text to the user-configured URL with an optional TAM_API_TOKEN bearer token; hermes memory setup tam writes tam.json, TAM_API_TOKEN to .env and memory.provider in config.yaml."
description_tr: "MCP üzerinden total-agent-memory (TAM) ile desteklenen yerel öncelikli uzun süreli bellek — her tamamlanan turu kaydeder (gürültü filtresiyle; TAM'ın kalite kapısı geçerlidir), her turdan önce token bütçesi içinde ilgili bellekleri geri çağırır ve tam_recall / tam_save araçlarını ekler; paylaşılan şirket belleği için isteğe bağlı TAM ekip sunucusu. Açıklama — yerel kip, ayrıca kurulmuş tam ikili dosyasını oturum başına, kimlik bilgisi taşımayan izin listeli bir ortamla alt süreç olarak başlatır: Hermes sağlayıcı anahtarları (HF_TOKEN ve OLLAMA_API_KEY dahil), TAM_API_TOKEN ve herhangi bir *_TOKEN / *_API_KEY / *_SECRET / *_PASSWORD değişkeni verilmez ve HF_* / OLLAMA_* değişkenlerinden yalnızca gizli olmayan ayarlar geçer (OLLAMA_URL, OLLAMA_EMBED_MODEL, HF_HOME, HF_HUB_OFFLINE); kullanıcı/asistan tur metnini ve yerleşik bellek eklemelerini (araç çıktısını değil) TAM'ın deposunda saklar, varsayılan olarak HERMES_HOME dışında ve TAM kullanan diğer ajanlarla paylaşılır; uzak kip aynı metni kullanıcının yapılandırdığı URL'ye isteğe bağlı bir TAM_API_TOKEN bearer token'ıyla gönderir; hermes memory setup tam, tam.json dosyasını, .env dosyasına TAM_API_TOKEN ve config.yaml dosyasına memory.provider yazar."
maintainer: vbcherepanov
tier: community
category: memory
requires_hermes: ">=0.21.4"
docs_url: https://github.com/vbcherepanov/hermes-tam-memory#readme
readme: true
platforms: [linux, macos]
capabilities:
  provides_tools:
  - tam_recall
  - tam_save
  provides_hooks: []
  provides_middleware: []
  requires_env: []
