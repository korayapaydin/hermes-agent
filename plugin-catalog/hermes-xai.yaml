name: hermes-xai
repo: https://github.com/Julientalbot/hermes-xai
sha: 8fd9bf8ecef1f8e9cb2cb7921fc86527acd9ede3
version: "0.1.0"
description: >-
  The xAI API surfaces core does not cover, nothing it already ships (provider, x_search, web search,
  TTS, STT and Imagine stay in core). Voice module: full-duplex Grok Voice (grok-voice-latest) in the
  Desktop composer, built like core's GPT-Live mode; the voice model hands real work to Hermes as a
  normal turn on the open chat (surface voice-live) and reads the result aloud; the backend mints a
  300 s xAI client secret so XAI_API_KEY never reaches the renderer. Collections module: one read-only
  tool, xai_collections_search, over documents the user already indexed in xAI Collections
  (GET /v1/collections, POST /v1/documents/search). Disclosure — the voice button captures microphone
  audio and streams it to api.x.ai over a WebSocket; the backend calls api.x.ai once per call with
  XAI_API_KEY (read through agent.secret_scope) to mint the secret; delegated requests run as normal
  Hermes turns with the profile's full toolset and approvals, and their final text (up to 3000
  characters) plus the last spoken turns are sent back to xAI. Each xai_collections_search call sends
  the query to api.x.ai with XAI_API_KEY and returns passages into the conversation. Nothing is
  uploaded, stored or deleted and no telemetry is emitted; xAI bills on the user's key.
description_tr: "xAI API'nin çekirdeğin kapsamadığı yüzeyleri; çekirdeğin zaten sunduğu hiçbir şey (sağlayıcı, x_search, web araması, TTS, STT ve Imagine çekirdekte kalır). Ses modülü: Desktop düzenleyicisinde tam çift yönlü Grok Voice (grok-voice-latest), çekirdeğin GPT-Live modu gibi kurulmuş; ses modeli gerçek işi, açık sohbette normal bir tur olarak Hermes'e devreder (voice-live yüzeyi) ve sonucu yüksek sesle okur; arka uç 300 saniyelik bir xAI istemci sırrı üretir, böylece XAI_API_KEY hiçbir zaman renderer'a ulaşmaz. Koleksiyonlar modülü: kullanıcının xAI Collections'ta hâlihazırda dizine eklediği belgeler üzerinde tek bir salt okunur araç, xai_collections_search (GET /v1/collections, POST /v1/documents/search). Açıklama — ses düğmesi mikrofon sesini yakalar ve bir WebSocket üzerinden api.x.ai'ye akıtır; arka uç, sırrı üretmek için çağrı başına bir kez XAI_API_KEY ile (agent.secret_scope üzerinden okunur) api.x.ai'yi çağırır; devredilen istekler, profilin tüm araç takımı ve onaylarıyla normal Hermes turları olarak çalışır ve bunların son metni (3.000 karaktere kadar) ile son konuşulan turlar xAI'ye geri gönderilir. Her xai_collections_search çağrısı sorguyu XAI_API_KEY ile api.x.ai'ye gönderir ve pasajları sohbete döndürür. Hiçbir şey yüklenmez, saklanmaz veya silinmez ve telemetri yayınlanmaz; xAI, kullanıcının anahtarı üzerinden faturalandırır."
maintainer: Julientalbot
tier: community
category: voice
docs_url: https://github.com/Julientalbot/hermes-xai/blob/8fd9bf8ecef1f8e9cb2cb7921fc86527acd9ede3/README.md
requires_hermes: ">=0.21.5"
platforms: []
capabilities:
  provides_tools: [xai_collections_search]
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - XAI_API_KEY
