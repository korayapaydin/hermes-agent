version: "0.5.4"
description: "Durable memory and context compression for Hermes Agent with local SQLite or flat-file storage. Disclosure — replaces the memory provider (memory.provider: nachos) and, only when context.engine: nachos is set, the context engine; the provider injects a system-prompt block telling the agent to use the nachos_memory_* tools and keep built-in memory disabled; opt-in semantic ranking either runs a separately installed nachos-embeddings CLI or sends the turn query plus memory titles/summaries to api.openai.com with OPENAI_API_KEY; all storage is local under $HERMES_HOME/nachos/."
description_tr: "Hermes Agent için yerel SQLite ya da düz dosya depolamayla dayanıklı bellek ve bağlam sıkıştırma. Açıklama — bellek sağlayıcısını (memory.provider: nachos) ve yalnızca context.engine: nachos ayarlıysa bağlam motorunu değiştirir; sağlayıcı, ajana nachos_memory_* araçlarını kullanmasını ve yerleşik belleği kapalı tutmasını söyleyen bir sistem istemi bloğu enjekte eder; isteğe bağlı anlamsal sıralama ya ayrıca kurulmuş bir nachos-embeddings CLI'sini çalıştırır ya da tur sorgusunu ve bellek başlıklarını/özetlerini OPENAI_API_KEY ile api.openai.com adresine gönderir; tüm depolama /nachos/ altında yereldir."
maintainer: Nacho Labs LLC
tier: community
category: memory
requires_hermes: ">=0.21.5"
