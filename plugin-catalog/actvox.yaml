version: "0.1.1"
description: "Make Hermes a team member in an ActVox workspace: on a schedule it works the tasks people assign it and answers the comments that @mention it, and submits each task for a person's review. Skills actvox:actvox and actvox:actvox-inbox, a first-turn inbox line (pre_llm_call), /actvox inbox|status, and hermes actvox setup|install-gate. A cron pre-run gate wakes the agent only when the inbox has work, so an empty tick makes no model call. Disclosure — ActVox is reached only through the user's own actvox MCP server (ctx.call_mcp, needs plugins.entries.actvox.mcp_allowlist) and the user's own actvox CLI (the gate runs `actvox inbox --all --json`); on the first turn of every non-cron session the pre_llm_call hook calls the server's check_inbox (up to 5 s) and adds one line saying how many tasks and mentions wait; the plugin holds and reads no credential and sends no telemetry. `hermes actvox install-gate` writes one file, $HERMES_HOME/scripts/actvox-inbox-gate.py, only on that explicit command and never over a file it did not write; gate state lives in $HERMES_HOME/plugin-data/actvox/. No background work of its own: the cron job runs only after the user creates it, and from then on anyone who can assign Hermes a task or @mention it in your ActVox workspaces decides what an unattended agent run on your host works on, with that job's toolsets (dangerous commands follow approvals.cron_mode, deny by default). Unattended writes need the default trust: full on the actvox server."
description_tr: "Hermes'i bir ActVox çalışma alanında ekip üyesi yapın: Belirlenen bir takvimle, insanların kendisine atadığı görevler üzerinde çalışır, kendisini @mention ile etiketleyen yorumları yanıtlar ve her görevi bir kişinin incelemesine sunar. actvox:actvox ve actvox:actvox-inbox yetenekleri, ilk tur gelen kutusu satırı (pre_llm_call), /actvox inbox|status komutları ve hermes actvox setup|install-gate araçlarını içerir. Bir cron ön çalıştırma kapısı, ajanı yalnızca gelen kutusunda iş olduğunda uyandırır, böylece boş bir döngü model çağrısı yapmaz. Açıklama — ActVox'a yalnızca kullanıcının kendi actvox MCP sunucusu (ctx.call_mcp, plugins.entries.actvox.mcp_allowlist gerektirir) ve kullanıcının kendi actvox CLI'ı (kapı `actvox inbox --all --json` komutunu çalıştırır) üzerinden erişilir; cron dışı her oturumun ilk turunda pre_llm_call kancası sunucunun check_inbox (5 saniyeye kadar) fonksiyonunu çağırır ve kaç görev ile etiketin beklediğini belirten bir satır ekler; eklenti hiçbir kimlik bilgisi tutmaz, okumaz ve telemetri göndermez. `hermes actvox install-gate` komutu, yalnızca bu açık komutla $HERMES_HOME/scripts/actvox-inbox-gate.py dosyasını yazar ve kendisinin yazmadığı bir dosyanın üzerine asla yazmaz; kapı durumu $HERMES_HOME/plugin-data/actvox/ altında tutulur. Kendi başına arka plan işlemi yapmaz: cron işi yalnızca kullanıcı oluşturduktan sonra çalışır ve o andan itibaren ActVox çalışma alanlarınızda Hermes'e görev atayabilen veya onu @mention ile etiketleyebilen herkes, ana makinenizde çalışan başında insan olmayan bir ajanın ne üzerinde çalışacağına, o işin araç setleriyle karar verir (tehlikeli komutlar approvals.cron_mode onayını takip eder, varsayılan olarak reddedilir). Başında insan olmayan yazma işlemleri varsayılan güven gerektirir: actvox sunucusunda tam yetki."
