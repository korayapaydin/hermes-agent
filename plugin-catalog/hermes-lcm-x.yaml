name: hermes-lcm-x
title: LCM-X
repo: https://github.com/electricsheephq/lcm-x
sha: 39daadd1c90f4dc60061089878bbd40dc5e4eaeb
subdir: plugin
description: "Lossless memory for long sessions: LCM-X keeps every turn in a local store instead of compacting it away, and the agent can search and expand it. The store is local SQLite (lcm.db) with a recoverable DAG of summaries over it and 15 lcm_* tools for search, recall and expansion. Select it with context.engine: lcm-x. Upgrading from hermes-lcm (breaking in v0.24.0): stop Hermes, then in plugins.enabled replace hermes-lcm with hermes-lcm-x and run exactly one LCM copy (the install script prints the steps; the old engine name lcm still resolves with a deprecation warning); lcm.db and the lcm: config block are unchanged. Summaries use the model Hermes is configured with. Disclosure — optional semantic recall (embeddings_enabled, off by default) sends message text to the embedding provider you configure (Voyage via VOYAGE_API_KEY, an OpenAI-compatible endpoint, or a local Ollama), and once enabled new summaries are embedded automatically in the background; in-process FastEmbed keeps it on the machine after a one-time model download. For known cloud providers the provider-bound copy is privacy-transformed by default (LCM_EMBEDDING_PRIVACY_ENABLED=false opts out), while lcm.db keeps the raw text. Every turn (user, assistant and tool output) is stored in plaintext in lcm.db (secret redaction at rest is opt-in), and oversized tool outputs are by default written as plaintext files under HERMES_HOME/lcm-large-outputs and replaced in the model's context by recoverable references. The engine also reads Hermes' state.db read-only for session lineage, reads private AIAgent attributes via the call stack on Hermes builds without subagent hooks, and runs git on its own install directory for lcm_status/lcm_doctor; tiktoken may fetch its BPE file on first use."
description_tr: "Kayıpsız bağlam belleği motoru: kayıplı sıkıştırma yerine LCM-X her turu yerel bir SQLite deposunda (lcm.db) tutar ve üzerine geri kazanılabilir bir özet DAG'ı kurar; önceki bağlamı aramak, geri çağırmak ve genişletmek için 15 lcm_* aracı sunar. context.engine: lcm-x ile seçin. hermes-lcm'den yükseltme (v0.24.0'da kırıcı): Hermes'i durdurun, sonra plugins.enabled içinde hermes-lcm'yi hermes-lcm-x ile değiştirin ve tam olarak bir LCM kopyası çalıştırın (kurulum betiği adımları yazdırır; eski motor adı lcm hâlâ bir kullanımdan kaldırma uyarısıyla çözülür); lcm.db ve lcm: yapılandırma bloğu değişmez. Özetler, Hermes'in yapılandırıldığı modeli kullanır. Açıklama — isteğe bağlı anlamsal geri çağırma (embeddings_enabled, varsayılan olarak kapalı) mesaj metnini yapılandırdığınız gömme sağlayıcısına gönderir (VOYAGE_API_KEY üzerinden Voyage, OpenAI uyumlu bir uç nokta veya yerel bir Ollama) ve etkinleştirildikten sonra yeni özetler arka planda otomatik olarak gömülür; süreç içi FastEmbed, tek seferlik model indirmesinden sonra bunu makinede tutar. Bilinen bulut sağlayıcıları için sağlayıcıya giden kopya varsayılan olarak gizlilik dönüşümünden geçirilir (LCM_EMBEDDING_PRIVACY_ENABLED=false bunu devre dışı bırakır), lcm.db ise ham metni tutar. Her tur (kullanıcı, asistan ve araç çıktısı) lcm.db içinde düz metin olarak saklanır (gizli bilgilerin durağan veride maskelenmesi isteğe bağlıdır) ve aşırı büyük araç çıktıları varsayılan olarak HERMES_HOME/lcm-large-outputs altında düz metin dosyaları olarak yazılır ve modelin bağlamında geri kazanılabilir referanslarla değiştirilir. Motor ayrıca oturum soyu için Hermes'in state.db dosyasını salt okunur okur, alt ajan kancaları olmayan Hermes derlemelerinde çağrı yığını üzerinden özel AIAgent özniteliklerini okur ve lcm_status/lcm_doctor için kendi kurulum dizininde git çalıştırır; tiktoken ilk kullanımda BPE dosyasını getirebilir."
