name: jp-chatwork
repo: https://github.com/TakeshiTGAL/hermes-plugin-chatwork
sha: 8dbdff609b3c99768420a19a7ca646b6daad3dbe
description: "Talk to Hermes from Chatwork rooms, built on the Chatwork API: put Hermes in a Chatwork room and ask it with [To:] or a reply, like a colleague; the answer comes back as a Chatwork reply. Polls the Chatwork API (no public URL or webhook), never answers a message twice across restarts, and while CHATWORK_ALLOWED_USERS is unset only the token's own account can use Hermes commands beyond /help, /whoami, /new and /reset or answer approval prompts. Disclosure: talks only to api.chatwork.com with your own API token; polls every 5 s by default while the gateway runs; stores read positions and the ids of its posted messages in <HERMES_HOME>/plugin-data/jp-chatwork/state.json. Disclosure — while CHATWORK_ALLOWED_USERS is unset everyone in the rooms listed in CHATWORK_ROOMS (external guests included) can prompt the agent and use its enabled tools, with Hermes commands and approval answers kept to the token's own account; talks only to api.chatwork.com with your API token, polling every 5 s while the gateway runs; stores read positions and posted message ids in <HERMES_HOME>/plugin-data/jp-chatwork/state.json; logs each asker's name and account id."
description_tr: "Chatwork API üzerine kurulu olarak Chatwork odalarından Hermes ile konuşun: Hermes'i bir Chatwork odasına koyun ve [To:] ile ya da bir yanıtla, bir iş arkadaşı gibi sürün; yanıt bir Chatwork yanıtı olarak geri gelir. Chatwork API'sini yoklar (genel URL ya da webhook yok), yeniden başlatmalar boyunca bir mesajı asla iki kez yanıtlamaz ve CHATWORK_ALLOWED_USERS ayarlanmamışken yalnızca token'ın kendi hesabı /help, /whoami, /new ve /reset dışındaki Hermes komutlarını kullanabilir ya da onay istemlerini yanıtlayabilir. Açıklama — yalnızca api.chatwork.com ile kendi API token'ınızı kullanarak konuşur; ağ geçidi çalışırken varsayılan olarak her 5 saniyede bir yoklar; okuma konumlarını ve gönderdiği mesajların kimliklerini <HERMES_HOME>/plugin-data/jp-chatwork/state.json içinde saklar. Açıklama — CHATWORK_ALLOWED_USERS ayarlanmamışken CHATWORK_ROOMS içinde listelenen odalardaki herkes (harici konuklar dahil) ajana istem verebilir ve etkin araçlarını kullanabilir; Hermes komutları ve onay yanıtları token'ın kendi hesabıyla sınırlı kalır; yalnızca api.chatwork.com ile API token'ınızı kullanarak konuşur, ağ geçidi çalışırken her 5 saniyede bir yoklar; okuma konumlarını ve gönderilen mesaj kimliklerini <HERMES_HOME>/plugin-data/jp-chatwork/state.json içinde saklar; her soranın adını ve hesap kimliğini günlüğe kaydeder."
maintainer: TakeshiTGAL
