name: tameru
title: Tameru
repo: https://github.com/0xWhiteMage/hermes-tameru-plugin
sha: 5a19df4af88b848adc29d7170182e226c0700dec
subdir: hermes_tameru_plugin
version: "1.5.0"
description: "Big tool outputs, kept small, nothing lost: old tool results shrink to the lines that matter and every distinct error, and the tameru_expand tool brings back the exact original. Deterministic and local, with no LLM calls. Disclosure — Subclasses Hermes's built-in ContextCompressor and overrides its private prune/demote methods (checks their shape at startup and falls back to stock compaction when they change). Unless you set compression.proactive_prune_tokens yourself, turns on proactive tool-result pruning with a trigger scaled to the model's context window, and after each prune shortens Hermes's re-prune runway. Adds a model-callable tameru_expand tool that returns pruned tool output from memory or from this session's archive (web, browser and MCP output stays wrapped as untrusted data); complex regex greps run in a short-lived local Python child process. No network calls; the render log is off by default."
description_tr: "Büyük araç çıktıları, küçük tutulur, hiçbir şey kaybolmaz: eski araç sonuçları önemli satırlara ve her farklı hataya indirgenir; tameru_expand aracı tam orijinali geri getirir. Deterministik ve yereldir, LLM çağrısı yapmaz. Açıklama — Hermes'in yerleşik ContextCompressor sınıfından türetilir ve özel prune/demote yöntemlerini geçersiz kılar (başlangıçta biçimlerini denetler ve değişirlerse stok sıkıştırmaya geri döner). compression.proactive_prune_tokens değerini kendiniz ayarlamadıkça, modelin bağlam penceresine göre ölçeklenen bir tetikleyiciyle proaktif araç sonucu budamayı etkinleştirir ve her budamadan sonra Hermes'in yeniden budamaya kalan payını kısaltır. Budanmış araç çıktısını bellekten ya da bu oturumun arşivinden döndüren, modelin çağırabildiği bir tameru_expand aracı ekler (web, tarayıcı ve MCP çıktısı güvenilmeyen veri olarak sarılı kalır); karmaşık regex aramaları kısa ömürlü bir yerel Python alt sürecinde çalışır. Ağ çağrısı yoktur; oluşturma günlüğü varsayılan olarak kapalıdır."
maintainer: 0xWhiteMage
tier: community
category: general
docs_url: https://github.com/0xWhiteMage/hermes-tameru-plugin
