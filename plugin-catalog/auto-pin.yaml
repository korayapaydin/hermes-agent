name: auto-pin
repo: https://github.com/bmcfiv/hermes-plugin-auto-pin
sha: 4458088ccfe3b5371e16fdae37753956f1296713
description: "Automatically pin every new interactive session (desktop, CLI, TUI) and the branches you fork from them. Cron, one-shot, subagent and messaging sessions are left alone, and unpinning a session sticks. Disclosure — on each new desktop/CLI/TUI session it sets the session's pinned flag in Hermes's session database (state.db) through the shared SessionDB handle, and records each automatic pin in $HERMES_HOME/auto-pin/ledger.txt; no network, no tools."
description_tr: "Her yeni etkileşimli oturumu (masaüstü, CLI, TUI) ve bunlardan açtığınız dalları otomatik olarak sabitleyin. Cron, tek seferlik, alt ajan ve mesajlaşma oturumlarına dokunulmaz ve bir oturumu sabitleyerek kaldırmak kalıcıdır. Açıklama — her yeni masaüstü/CLI/TUI oturumunda, oturumun sabitlendi bayrağını paylaşılan SessionDB tutamacı üzerinden Hermes'in oturum veritabanında (state.db) ayarlar ve her otomatik sabitlemeyi $HERMES_HOME/auto-pin/ledger.txt dosyasına kaydeder; ağ erişimi yok, araç yok."
maintainer: bmcfiv
tier: community
category: general
requires_hermes: ">=0.21.1"
docs_url: https://github.com/bmcfiv/hermes-plugin-auto-pin#readme
version: "1.0.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
  provides_middleware: []
  requires_env: []
