sha: 6e6ca659ece59b0ce1c28b3b188393491ee5a415
version: "0.1.0"
title: Draft Cards
description: "Email and chat-message drafts as reviewable cards in the Hermes Desktop chat. The agent's draft_card tool stores each draft and its revisions; the card shows recipients, subject and body, highlights the words each revision changed (removed text on demand), supports inline editing, and offers Copy and Open in Mail. The plugin never sends anything: pressing Send records approval of that exact version and posts it to the chat, then the agent sends it with the user's existing mail or messaging tools and reports the outcome with draft_card_status. Disclosure — stores draft text (recipients, subject, body, versions) in the profile's plugin-data/draft-cards/drafts.db (the 500 most recent drafts are kept); the desktop half appends one scoped stylesheet, removed on disable; no network calls, no credentials, no shell commands, no background processes, no telemetry."
description_tr: "E-posta ve sohbet mesajı taslakları, Hermes Desktop sohbetinde incelenebilir kartlar olarak. Ajanın draft_card aracı her taslağı ve revizyonlarını saklar; kart alıcıları, konuyu ve gövdeyi gösterir, her revizyonun değiştirdiği kelimeleri vurgular (silinen metin isteğe bağlı), satır içi düzenlemeyi destekler ve Copy ile Open in Mail seçeneklerini sunar. Eklenti hiçbir şeyi göndermez: Send'e basmak, o tam sürüm için onayı kaydeder ve sohbete düşürür, ardından ajan onu kullanıcının mevcut e-posta veya mesajlaşma araçlarıyla gönderir ve sonucu draft_card_status ile bildirir. Açıklama — taslak metnini (alıcılar, konu, gövde, sürümler) profilin plugin-data/draft-cards/drafts.db dosyasında saklar (en yeni 500 taslak tutulur); masaüstü tarafı, devre dışı bırakıldığında kaldırılan tek bir kapsamlı stil sayfası ekler; ağ çağrısı, kimlik bilgisi, kabuk komutu, arka plan süreci ve telemetri yoktur."
