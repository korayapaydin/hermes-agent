description: "Open-source marketing toolkit for agencies and in-house teams, one listing with three skill groups and 207 skills registered as Hermes skills: Digital Marketing Pro (strategy, SEO/AEO/GEO, paid media, CRM, analytics; 164 skills), ContentForge (fact-checked long-form content with a run auditor; 22 skills) and SocialForge (a content calendar to images, carousels, video and copy; 21 skills). Skills only: no tools, hooks or background processes. Disclosure — Skills only (no tools, hooks or MCP servers). The optional scripts the skills run call third-party APIs (ad, CRM, e-mail, Slack, LLM and image/video providers) only when run, using the user's own keys from environment variables. Live writes need the user's typed yes. For writes the plugin sends itself, the script creates a single-use approval record when it prepares the write, and the agent approves that record after the yes, so Hermes does not prompt before those script runs. Writes through MCP tools rely on the typed yes alone. Paid image and video generation is quoted first. refresh_models.py reads your Anthropic, OpenAI, Gemini and (strategy group) Evolink keys. Keys and data live outside the Hermes profile: SocialForge stores API keys in plain text, plus a copy of any Google service-account file, in ~/socialforge-workspace; brand data goes to ~/.claude-marketing; deliverables are copied to ~/Documents/DigitalMarketingPro and ~/Documents/ContentForge. Nothing installs unless the user says yes; installs are exact-pinned pip packages into the Python that runs the script, plus Playwright's Chromium download. See the README and each group's PRIVACY.md."
description_tr: "Ajanslar ve şirket içi ekipler için açık kaynak pazarlama araç seti; tek bir kayıt, üç yetenek grubu ve Hermes yetenekleri olarak kaydedilmiş 207 yetenek: Digital Marketing Pro (strateji, SEO/AEO/GEO, ücretli medya, CRM, analitik; 164 yetenek), ContentForge (çalıştırma denetleyicisi olan, olguları doğrulanmış uzun içerik; 22 yetenek) ve SocialForge (içerik takviminden görsel, karusel, video ve metne; 21 yetenek). Yalnızca yetenekler: araç, kanca ya da arka plan süreci yok. Açıklama — Yalnızca yetenekler (araç, kanca veya MCP sunucusu yok). Yeteneklerin çalıştırdığı isteğe bağlı betikler, üçüncü taraf API'lerini (reklam, CRM, e-posta, Slack, LLM ve görüntü/video sağlayıcıları) yalnızca çalıştırıldıklarında, kullanıcının ortam değişkenlerindeki kendi anahtarlarıyla çağırır. Canlı yazmalar kullanıcının yazılı \"evet\"ini gerektirir. Eklentinin kendisinin gönderdiği yazmalar için betik, yazmayı hazırlarken tek kullanımlık bir onay kaydı oluşturur ve ajan bu kaydı evetten sonra onaylar; böylece Hermes o betik koşularından önce istemde bulunmaz. MCP araçları üzerinden yapılan yazmalar yalnızca yazılı evete dayanır. Ücretli görüntü ve video üretimi önce fiyatlandırılır. refresh_models.py, Anthropic, OpenAI, Gemini ve (strateji grubu) Evolink anahtarlarınızı okur. Anahtarlar ve veriler Hermes profilinin dışında yaşar: SocialForge API anahtarlarını düz metin olarak ve herhangi bir Google hizmet hesabı dosyasının bir kopyasını ~/socialforge-workspace içinde saklar; marka verileri ~/.claude-marketing konumuna gider; teslimatlar ~/Documents/DigitalMarketingPro ve ~/Documents/ContentForge konumlarına kopyalanır. Kullanıcı evet demedikçe hiçbir şey kurulmaz; kurulumlar, betiği çalıştıran Python'a tam sürümle sabitlenmiş pip paketleri ve Playwright'ın Chromium indirmesidir. README ve her grubun PRIVACY.md dosyasına bakın."
