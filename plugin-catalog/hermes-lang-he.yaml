name: hermes-lang-he
repo: https://github.com/Adolanium/hermes-lang-he
sha: 9e470ec786f5abf7c97d1939dd8898782a36d430
description: >-
  Hebrew (עברית) language pack for Hermes — core CLI, gateway and tips (3,396 of
  3,486 keys on main), TUI (1,331 of 1,356) and Desktop (5,153 of 5,245), with
  Desktop flipped right-to-left. Hermes bundles no Hebrew, so the pack ships all
  three catalogs; values identical to English and entries whose English wording
  depends on an argument (on/off, show/hide) are omitted so they fall back to
  English. Disclosure — text-only catalogs plus an __init__.py whose register()
  is a no-op (kept so Desktop "Install from Git" accepts the pack, #138118);
  registering the pack never changes display.language, the user opts in via
  config.
maintainer: Adolanium
description_tr: "Hermes için İbranice (עברית) dil paketi — çekirdek CLI, ağ geçidi ve ipuçları (main üzerindeki 3,486 anahtarın 3,396'sı), TUI (1,356 anahtarın 1,331'i) ve Masaüstü (5,245 anahtarın 5,153'ü), Masaüstü sağdan sola (RTL) olarak çevrilmiştir. Hermes İbranice barındırmadığından, paket her üç kataloğu da sunar; İngilizce ile aynı olan değerler ve İngilizce ifadesi bir argümana bağlı olan (açık/kapalı, göster/gizle) girişler atlanmıştır, böylece İngilizceye dönerler. Açıklama — Yalnızca metin katalogları ve register() fonksiyonu işlem yapmayan bir __init__.py dosyası (Masaüstü \"Git'ten Yükle\" akışının paketi kabul etmesi için tutulmuştur, #138118); paketin kaydolması display.language ayarını asla değiştirmez, kullanıcı yapılandırma üzerinden bunu seçer."
