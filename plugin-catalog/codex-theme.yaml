name: codex-theme
repo: https://github.com/hey-yx/hermes-codex-theme
sha: 5d0e94aa5a80e02f755b1ab5783f727df7bb1ecd
description: "Codex × ChatGPT inspired theme for the Hermes Desktop chat: dual light/dark palettes that follow the system appearance, graphite-on-paper typography with a 1.625 root line height (measured from ZCode's chat body) and content-spacing presets (1.5/1.625/1.75), the OpenAI radius scale (inline 4px / rows 8px / controls 10px / cards 12px / composer 20px), hairline borders instead of shadows, and an 880px reading column with 768/880/992px presets. Settings → Plugins → Codex Theme offers appearance mode, reading width, content spacing, text & code font presets, user/assistant chat bubble colors and a bilingual (EN/中文) UI as native controls; the theme paints theme-level tokens only and never writes user-configurable settings such as --chat-text-scale. v1.2.0 is a compliance release — the composer-drag and input-focus-guard features of the v1.1 line were removed because they patched prototypes and captured global events, which catalog rule 8 forbids. Disclosure — no network calls, no telemetry, no credentials; registers only through the Desktop plugin SDK (THEMES_AREA, PALETTE_AREA, ctx.registerSettingsPage, ctx.i18n), switches the active theme to Codex once on first install, and keeps its preferences in plugin-scoped ctx.storage."
description_tr: "Hermes Desktop sohbeti için Codex × ChatGPT esintili tema: Sistem görünümünü takip eden çift açık/koyu palet, 1.625 kök satır yüksekliğine sahip (ZCode'un sohbet gövdesinden ölçülmüştür) kağıt üzerinde grafit tipografi ve içerik boşluğu ön ayarları (1.5/1.625/1.75), OpenAI yarıçap ölçeği (satır içi 4px / satırlar 8px / kontroller 10px / kartlar 12px / oluşturucu 20px), gölgeler yerine saç teli ince kenarlıklar ve 768/880/992px ön ayarları olan 880px okuma sütunu. Ayarlar → Eklentiler → Codex Theme; görünüm modu, okuma genişliği, içerik boşluğu, metin ve kod yazı tipi ön ayarları, kullanıcı/asistan sohbet balonu renkleri ve yerel kontroller olarak iki dilli (EN/中文) bir kullanıcı arayüzü sunar; tema yalnızca tema düzeyindeki belirteçleri boyar ve --chat-text-scale gibi kullanıcı tarafından yapılandırılabilir ayarları asla yazmaz. v1.2.0 bir uyumluluk sürümüdür — v1.1 serisinin composer-drag ve input-focus-guard özellikleri, prototipleri yamaladıkları ve küresel olayları yakaladıkları için (katalog kuralı 8 bunu yasaklar) kaldırılmıştır. Açıklama — Ağ çağrısı, telemetri veya kimlik bilgisi yoktur; yalnızca Masaüstü eklenti SDK'sı (THEMES_AREA, PALETTE_AREA, ctx.registerSettingsPage, ctx.i18n) üzerinden kaydolur, ilk kurulumda aktif temayı bir kez Codex olarak değiştirir ve tercihlerini eklenti kapsamlı ctx.storage içinde tutar."
