name: bunny_space-platform
title: Bunny Space
repo: https://github.com/jasm001/hermes-plugin-bunny-space
sha: fcea5421ed9418b6bfc4f292933310e43aa076c5
description: "Bunny Space gateway adapter for Hermes Agent. Connects a Hermes profile (the bot brain) to the Bunny Space relay so the bot joins private rooms, answers its owner, and handles @bot:<slug> mentions in posts and comments. Outbound pull transport; no external dependencies. Disclosure — replies are prompted to be in Spanish; @bot mention tasks and assistance tasks are dispatched to Hermes under the fixed sender id \"owner\" (BUNNY_SPACE_ALLOWED_USERS must contain \"owner\"), and the plugin refuses to dispatch third-party content unless platform_toolsets.bunny_space is restricted to read-only tools (the platform's effective toolset, including MCP and plugin toolsets; add no_mcp when MCP servers are enabled); the private assistance worker is opt-in via BUNNY_SPACE_ASSISTANCE=1 (the relay cannot enable it); setting BUNNY_SPACE_ALLOW_ALL_USERS makes the connector refuse to connect; the relay sets the poll interval and may hand the connector a WebSocket \"wake\" URL it then connects to (wake signals only, no message content)."
description_tr: "Hermes Agent için Bunny Space ağ geçidi bağdaştırıcısı. Bir Hermes profilini (bot beyini) Bunny Space rölesine bağlar; böylece bot özel odalara katılır, sahibine yanıt verir ve gönderiler ile yorumlardaki @bot:<slug> bahislerini işler. Giden çekme (pull) aktarımı; harici bağımlılık yok. Açıklama — yanıtların İspanyolca olması istenir; @bot bahsetme görevleri ve yardım görevleri sabit gönderici kimliği \"owner\" altında Hermes'e dağıtılır (BUNNY_SPACE_ALLOWED_USERS \"owner\" içermelidir) ve platform_toolsets.bunny_space salt okunur araçlarla sınırlandırılmadıkça eklenti üçüncü taraf içeriğini dağıtmayı reddeder (platformun etkin araç seti, MCP ve eklenti araç setleri dahil; MCP sunucuları etkinken no_mcp ekleyin); özel yardım işçisi BUNNY_SPACE_ASSISTANCE=1 ile isteğe bağlıdır (röle bunu etkinleştiremez); BUNNY_SPACE_ALLOW_ALL_USERS ayarlanması bağlayıcının bağlanmayı reddetmesine yol açar; röle yoklama aralığını belirler ve bağlayıcıya daha sonra bağlanacağı bir WebSocket \"wake\" URL'si verebilir (yalnızca uyandırma sinyalleri, mesaj içeriği yok)."
