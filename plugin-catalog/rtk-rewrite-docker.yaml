name: rtk-rewrite-docker
repo: https://github.com/petertaras/hermes-rtk-rewrite-with-docker-support
sha: 929c8f5f86fc544a523f94a92f95a57d4c0d7d40
description: "Community plugin that rewrites Hermes terminal commands through RTK (rtk-ai/rtk, Apache-2.0) so the model sees compact output. Adds a backend gate: it rewrites only for terminal backends a profile opts in to (default local), so a Docker or remote backend without rtk never receives an rtk command. Fail-open pre_tool_call hook (2s timeout). Disclosure — every terminal command on an opted-in backend (default local) is passed to the rtk binary on the Hermes host's PATH (or RTK_BIN) and replaced with rtk's stdout before approval and execution; the plugin does not validate the rewrite, fails open on timeout or error, and downloads nothing (the repo's optional Containerfile fetches a checksum-pinned RTK release only when you build it). Not affiliated with rtk-ai."
description_tr: "Hermes terminal komutlarını RTK (rtk-ai/rtk, Apache-2.0) üzerinden yeniden yazan, böylece modelin sıkıştırılmış çıktı görmesini sağlayan topluluk eklentisi. Bir arka uç kapısı ekler: yalnızca bir profilin katılmayı seçtiği terminal arka uçlarında yeniden yazar (varsayılan local), böylece rtk olmayan bir Docker ya da uzak arka uç asla rtk komutu almaz. Hata durumunda açık kalan pre_tool_call kancası (2 sn zaman aşımı). Açıklama — katılınan bir arka uçtaki (varsayılan local) her terminal komutu, Hermes konağının PATH'indeki (veya RTK_BIN) rtk ikilisine aktarılır ve onay ve yürütmeden önce rtk'nin stdout'u ile değiştirilir; eklenti yeniden yazımı doğrulamaz, zaman aşımı veya hatada açık kalır ve hiçbir şey indirmez (depodaki isteğe bağlı Containerfile, yalnızca siz oluşturduğunuzda sağlama toplamıyla sabitlenmiş bir RTK sürümü indirir). rtk-ai ile bağlantılı değildir."
maintainer: petertaras
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.1.0"
docs_url: https://github.com/petertaras/hermes-rtk-rewrite-with-docker-support#readme
platforms: [linux, macos]
