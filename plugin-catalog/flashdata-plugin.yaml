description: "Web search with Google Search; Google News, Google Images, Google Shopping, Google Video Search and Google Places for research. Use YouTube Search or YouTube Extended Search; retrieve YouTube metadata, YouTube transcripts, YouTube captions and YouTube channel data; get YouTube autocomplete; inspect YouTube trainability as license-label metadata, not training permission. YouTube downloads deliver media to your own storage. One hosted MCP connection and 15 task Skills; bring your own API key and paid FlashData Credits. Disclosure — Connects to FlashData's hosted MCP service (data.flashdata.dev) with your own FLASHDATA_API_KEY; every search, YouTube read or download spends your paid FlashData Credits, and Hermes asks before running only the tools the server does not mark read-only, so most paid searches run without a prompt. The YouTube download tool sends the storage bucket and storage access credentials you supply to FlashData, and those values stay visible in the chat history."
description_tr: "Araştırma için Google Arama ile web araması; Google Haberler, Google Görseller, Google Alışveriş, Google Video Arama ve Google Yerler. YouTube Arama veya Genişletilmiş YouTube Arama kullanın; YouTube meta verilerini, YouTube dökümlerini, YouTube altyazılarını ve YouTube kanal verilerini geri getirin; YouTube otomatik tamamlamayı alın; YouTube eğitilebilirliğini, eğitim izni olarak değil, lisans etiketi meta verisi olarak inceleyin. YouTube indirmeleri medyayı kendi depolama alanınıza iletir. Bir barındırılan MCP bağlantısı ve 15 görev Yeteneği; kendi API anahtarınızı ve ücretli FlashData Kredilerinizi getirin. Açıklama — Kendi FLASHDATA_API_KEY'inizle FlashData'nın barındırılan MCP servisine (data.flashdata.dev) bağlanır; her arama, YouTube okuma veya indirme işlemi ücretli FlashData Kredilerinizi harcar ve Hermes, sunucunun salt okunur olarak işaretlemediği araçları çalıştırmadan önce onay ister, bu nedenle çoğu ücretli arama onay istemi olmadan çalışır. YouTube indirme aracı, sağladığınız depolama kovasını ve depolama erişim kimlik bilgilerini FlashData'ya gönderir ve bu değerler sohbet geçmişinde görünür kalır."
