description: "Field notes for a Hermes install: search known pitfalls before debugging and record new ones with root cause; register every local core edit as a patch note with a declarative checks file, then verify read-only after each hermes update (OK / MISSING / UPSTREAMED / N/A / UNKNOWN with reason) and list core files changed outside the registry. Ships 42 pitfalls and 10 patch recipes checked against 0.22.0. Optional pinned Telegram dashboard edited in place by an hourly no_agent cron job. Portable Agent Plugins v1 package (plugin.json + skills/); no tools, hooks, middleware or env vars; never edits the core or runs patch scripts. Disclosure — its scripts only read the Hermes core (pyproject.toml, read-only git status/diff) and never edit it or run patch scripts; the skill does walk the agent through hand-editing core files from its patch recipes and re-running the owner's re-apply scripts, each only after the user says yes. Network: Telegram Bot API only when the dashboard is enabled (reuses the agent's TELEGRAM_BOT_TOKEN from env or ~/.hermes/.env), and the public GitHub API without credentials (latest release plus compare against the installed commit SHA, cached 12 h; upstream.check=false disables). Writes: the notes store (~/.hermes/field-notes), ~/.hermes/field-notes.json, state and lock files in ~/.hermes/cache, a copy of the cron script in ~/.hermes/scripts when install.py runs (the skill runs it on first use), and one hourly no_agent cron job only when the user runs install_cron.py (it reads ~/.hermes/installs/*/facts.json to find Hermes' own Python and re-runs itself with it). Without a dashboard chat, install_cron.py sends the job's alerts to the Telegram home channel when TELEGRAM_HOME_CHANNEL is set (read from env or ~/.hermes/.env), else local."
description_tr: "Bir Hermes kurulumu için saha notları: hata ayıklamadan önce bilinen tuzakları arayın ve kök nedeniyle birlikte yenilerini kaydedin; her yerel çekirdek düzenlemesini deklaratif bir denetim dosyasıyla yama notu olarak kaydedin, sonra her Hermes güncellemesinden sonra salt okunur doğrulayın (OK / MISSING / UPSTREAMED / N/A / UNKNOWN, nedeniyle) ve kayıt defteri dışında değişen çekirdek dosyalarını listeleyin. 0.22.0 sürümüne karşı denetlenmiş 42 tuzak ve 10 yama tarifi ile gelir. Saatlik bir no_agent cron işiyle yerinde düzenlenen isteğe bağlı sabitlenmiş Telegram panosu. Taşınabilir Agent Plugins v1 paketi (plugin.json + skills/); araç, kanca, ara katman ya da ortam değişkeni yok; çekirdeği asla düzenlemez ya da yama betikleri çalıştırmaz. Açıklama — betikleri yalnızca Hermes çekirdeğini okur (pyproject.toml, salt okunur git status/diff) ve onu asla düzenlemez ya da yama betikleri çalıştırmaz; yetenek, ajanı yama tariflerinden çekirdek dosyaları elle düzenleme ve sahibinin yeniden uygulama betiklerini yeniden çalıştırma konusunda yönlendirir, her biri yalnızca kullanıcı evet dedikten sonra. Ağ: Telegram Bot API yalnızca pano etkinleştirildiğinde (ajanın TELEGRAM_BOT_TOKEN değerini ortamdan veya ~/.hermes/.env dosyasından yeniden kullanır) ve genel GitHub API kimlik bilgisi olmadan (en son sürüm ve kurulu commit SHA'sına karşı karşılaştırma, 12 saat önbelleğe alınır; upstream.check=false devre dışı bırakır). Yazmalar: not deposu (~/.hermes/field-notes), ~/.hermes/field-notes.json, ~/.hermes/cache içindeki durum ve kilit dosyaları, install.py çalıştığında ~/.hermes/scripts içinde cron betiğinin bir kopyası (yetenek ilk kullanımda çalıştırır) ve yalnızca kullanıcı install_cron.py çalıştırdığında saatlik bir no_agent cron işi (Hermes'in kendi Python'unu bulmak için ~/.hermes/installs/*/facts.json okur ve kendini onunla yeniden çalıştırır). Pano sohbeti yoksa install_cron.py, TELEGRAM_HOME_CHANNEL ayarlıysa (ortamdan veya ~/.hermes/.env dosyasından okunur) işin uyarılarını Telegram ana kanalına, aksi halde yerele gönderir."
