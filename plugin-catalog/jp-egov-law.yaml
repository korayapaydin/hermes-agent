name: jp-egov-law
repo: https://github.com/TakeshiTGAL/hermes-plugin-egov-law
sha: 2e96dd28108250b374160077d6e1d9fa4dea55f1
description: 'Japanese laws for Hermes Agent, built on the e-Gov Law API: find a law by name, abbreviation or phrase, read one article as in force today or on a given date, and check amendment history and enforcement dates, with the source credit e-Gov''s terms ask for. Ask for one Japanese law article, such as Article 32 of the Labor Standards Act, and it returns the official law text with the law number and the date that version took effect. Disclosure — sends the law names, article numbers, dates and search phrases you look up to laws.e-gov.go.jp (public API, no key); no other host, nothing written to disk. Registers blueprint jp-egov-law:weekly-amendments and does not create a cron job. When you create a job from that blueprint, one model turn runs once a week (default Mon 09:00, Hermes tz or the host clock if unset, not converted to Japan). A turn that calls a tool is at least two model requests, and there is no daily cap. The agent can schedule it, and scheduling it twice creates two jobs. Silence is not "no amendment". Uninstall leaves the cron until hermes cron remove. Tools stay on every platform, including gateways (a guest can call them; hermes tools disables one). While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off. v0.21.4 and v0.21.5 load the tools and skip the blueprint.'
description_tr: "e-Gov Law API üzerine kurulu olarak Hermes Agent için Japon yasaları: ad, kısaltma ya da ifadeye göre bir yasa bulun, bir maddeyi bugün geçerli olan hâliyle ya da belirli bir tarihteki hâliyle okuyun ve değişiklik geçmişini ve yürürlük tarihlerini denetleyin; e-Gov'nin koşullarının istediği kaynak belirtmesiyle. Tek bir Japon yasa maddesi isteyin — örneğin İş Standartları Kanunu'nun 32. maddesi — o yasanın resmî metnini yasa numarası ve o sürümün yürürlüğe girdiği tarihle birlikte döndürür. Açıklama — Baktığınız yasa adlarını, madde numaralarını, tarihleri ve arama ifadelerini laws.e-gov.go.jp adresine gönderir (genel API, anahtar yok); başka konak yok, diske hiçbir şey yazılmaz. jp-egov-law:weekly-amendments blueprint'ini kaydeder ve bir cron işi oluşturmaz. Bu blueprint'ten bir iş oluşturduğunuzda, haftada bir kez bir model turu çalışır (varsayılan Pzt 09:00, Hermes saat dilimi ya da ayarlanmamışsa konak saati, Japonya saatine çevrilmez). Bir araç çağıran tur en az iki model isteğidir ve günlük üst sınır yoktur. Ajan bunu zamanlayabilir ve iki kez zamanlamak iki iş oluşturur. Sessizlik \"değişiklik yok\" anlamına gelmez. Kaldırma, siz hermes cron remove çalıştırana kadar cron'u bırakır. Araçlar ağ geçitleri dahil her platformda kalır (bir konuk bunları çağırabilir; hermes tools birini devre dışı bırakır). Eklenti etkin olduğu sürece yeteneği, araçların kapalı olduğu yüzeyler dahil her oturumun yetenek dizinine bir satır ekler. v0.21.4 ve v0.21.5 araçları yükler ve blueprint'i atlar."
