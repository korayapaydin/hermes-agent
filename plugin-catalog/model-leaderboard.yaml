sha: 516e2f8d4dd0790f2c486d1fe0b444de5c2b3c10
description: 'Model leaderboard for Hermes Desktop: a full /model-leaderboard page that ranks any OpenRouter model for a chosen Hermes profile — context window, prices, Artificial Analysis indices and curated SWE-bench Verified / LiveCodeBench — with per-profile criteria, six score views (cards, table, score bars, histograms, heatmap, quality-vs-cost Pareto frontier), an OpenRouter news feed (new models, price changes, promos) and a documented REST surface under /api/plugins/model-leaderboard/. Disclosure — outbound HTTPS to OpenRouter''s public model API (catalogue and pricing) on a 60 s poll and a forced refresh every 10 minutes while the page is visible, and to Hugging Face''s public model API (safetensors metadata, for parameter counts) on demand and cached; reads the installed Hermes profiles'' own config.yaml files once, to seed the tracked list from the models those profiles declare; keeps its state in <hermes home>/plugin-data/model-leaderboard/ (seeded from the JSON shipped with the plugin), which LLM_DASH_DATA / LLM_DASH_CACHE_TTL can move or tune; the optional "Auto-fill criteria" action runs on the host LLM facade (ctx.llm.complete_structured), so it spends the user''s configured model tokens; ships one read-only skill (model-leaderboard:refresh-benchmarks) whose only write is a POST to its own /benchmarks route; no API keys of its own, no writes outside its data directory.'
description_tr: "Hermes Masaüstü için model liderlik tablosu: seçilen bir Hermes profili için herhangi bir OpenRouter modelini sıralayan tam bir /model-leaderboard sayfası — bağlam penceresi, fiyatlar, Artificial Analysis indeksleri ve küratörlü SWE-bench Verified / LiveCodeBench — profil başına kriterler, altı puan görünümü (kartlar, tablo, puan çubukları, histogramlar, ısı haritası, kalite-maliyet Pareto sınırı), bir OpenRouter haber akışı (yeni modeller, fiyat değişiklikleri, promosyonlar) ve /api/plugins/model-leaderboard/ altında belgelenmiş bir REST yüzeyi. Bilgilendirme — sayfa görünürken 60 saniyelik bir sorguyla ve her 10 dakikada bir zorunlu yenileme ile OpenRouter'ın kamuya açık model API'sine (katalog ve fiyatlandırma) ve talep üzerine önbelleğe alınmış olarak Hugging Face'in kamuya açık model API'sine (parametre sayıları için safetensors meta verileri) giden HTTPS çağrıları yapar; izlenen listeyi bu profillerin beyan ettiği modellerden oluşturmak için yüklü Hermes profillerinin kendi config.yaml dosyalarını bir kez okur; durumunu <hermes home>/plugin-data/model-leaderboard/ altında (eklentiyle birlikte gelen JSON'dan beslenir) tutar; LLM_DASH_DATA / LLM_DASH_CACHE_TTL bunu taşıyabilir veya ayarlayabilir; isteğe bağlı \\\"Auto-fill criteria\\\" eylemi ana bilgisayar LLM yüzeyinde (ctx.llm.complete_structured) çalışır, dolayısıyla kullanıcının yapılandırılmış model token'larını tüketir; yalnızca kendi /benchmarks rotasına POST yapan tek bir salt okunur yetenek (model-leaderboard:refresh-benchmarks) sunar; kendi API anahtarları yoktur, veri dizini dışında yazma işlemi yapmaz."
