name: dashboard-auth-ldap
repo: https://github.com/angel12/hermes-ldap-auth
sha: 7b871ef375239275e29b1934bbed8ae7573afea3
description: "LDAP / Active Directory password login for the web dashboard. Verifies credentials with an LDAP bind (direct or search-then-bind), never stores passwords, requires ldaps:// or StartTLS, and supports group restriction. Registers the `ldap` dashboard auth provider once dashboard.ldap_auth is configured. Disclosure — dashboard logins are verified by binding to your configured LDAP/AD server with the user's password (TLS with certificate validation required unless allow_insecure is set); sessions are stateless HMAC tokens (12h access / 30d refresh by default) signed with HERMES_DASHBOARD_LDAP_SECRET or a random per-process key, and logout cannot revoke them; group removal and disabled accounts are not re-checked until the refresh token expires; failed logins count toward the directory's account-lockout policy."
description_tr: "Web panosu için LDAP / Active Directory parola girişi. Kimlik bilgilerini bir LDAP bağlantısıyla doğrular (doğrudan ya da önce arama sonra bağlanma), parolaları asla saklamaz, ldaps:// ya da StartTLS gerektirir ve grup kısıtlamasını destekler. `ldap` pano kimlik doğrulama sağlayıcısı, dashboard.ldap_auth yapılandırıldıktan sonra kaydedilir. Açıklama — pano oturum açmaları, kullanıcının parolasıyla yapılandırılmış LDAP/AD sunucunuza bağlanılarak doğrulanır (allow_insecure ayarlanmadıkça sertifika doğrulamalı TLS gerekir); oturumlar, HERMES_DASHBOARD_LDAP_SECRET ya da süreç başına rastgele bir anahtarla imzalanan durumsuz HMAC token'larıdır (varsayılan olarak 12 saat erişim / 30 gün yenileme) ve oturum kapatma bunları iptal edemez; gruptan çıkarma ve devre dışı hesaplar, yenileme token'ının süresi dolana kadar yeniden denetlenmez; başarısız oturum açma girişimleri dizinin hesap kilitleme ilkesine sayılır."
maintainer: angel12
