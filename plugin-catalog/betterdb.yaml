name: betterdb
repo: https://github.com/BetterDB-inc/monitor
subdir: packages/hermes-memory-py
sha: cf54fb5f97afef8b3387ffe91be6272d5da23ea2
version: "0.1.0"
description: "BetterDB long-term memory provider — semantic recall on Valkey / valkey-search via the betterdb-agent-memory SDK. Completed turns are embedded and stored in a vector index; the next turn recalls the most relevant memories with a composite similarity/recency/importance score. Explicit betterdb_remember / betterdb_recall / betterdb_forget tools. Disclosure — turn text and tool-stored facts are embedded through an OpenAI-compatible embeddings endpoint you configure (embeddings_base_url, default api.openai.com) and written to the Valkey instance you point it at; plaintext http:// to a remote host is refused. Opt-in, off by default: a discovery marker (set discovery=true to let BetterDB Monitor enumerate the tier) and SDK usage analytics (set telemetry=true)."
description_tr: "BetterDB uzun süreli hafıza sağlayıcısı — betterdb-agent-memory SDK'sı üzerinden Valkey / valkey-search ile anlamsal geri çağırma. Tamamlanan turlar gömülür ve bir vektör dizininde saklanır; sonraki tur, bileşik benzerlik/tazelik/önem puanıyla en ilgili anıları geri çağırır. Açık betterdb_remember / betterdb_recall / betterdb_forget araçları. Açıklama — tur metni ve araçla saklanan olgular, sizin yapılandırdığınız OpenAI uyumlu bir embeddings uç noktası (embeddings_base_url, varsayılan api.openai.com) üzerinden gömülür ve işaret ettiğiniz Valkey örneğine yazılır; uzak bir konağa düz metin http:// reddedilir. İsteğe bağlı, varsayılan olarak kapalı: bir keşif işaretçisi (BetterDB Monitor'ün katmanı numaralandırmasına izin vermek için discovery=true ayarlayın) ve SDK kullanım analitiği (telemetry=true ayarlayın)."
maintainer: betterdb-inc
