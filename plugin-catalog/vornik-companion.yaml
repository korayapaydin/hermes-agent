name: vornik-companion
repo: https://github.com/EaseIT-cz/vornik
sha: 73bbb88e7c78e3f84d30bc32b223c218c5681c7e
subdir: contrib/hermes-companion
description: "Vornik as Hermes's hardened broker and long-term memory: Hermes holds no credentials; privileged work runs in operator-approved workflows on your own Vornik daemon. Disclosure — talks only to the self-hosted Vornik daemon at VORNIK_URL with VORNIK_BROKER_TOKEN (and VORNIK_MEMORY_TOKEN for memory); broker tools let the agent start operator-approved workflows on that daemon (writes are approved by a person in Vornik); when selected as memory provider it sends each turn's user query for recall, mirrors MEMORY.md and USER.md writes to the daemon, and asks the daemon to stop recalling (not delete) a mirrored entry that Hermes removes or replaces (/vornik-memory lists and /vornik-forget forgets what Vornik keeps); artifact tools expose only named outputs allowed by the approved workflow from completed runs and read bounded text or return short-lived binary download links from the daemon; task diagnosis tools (offered only when the daemon advertises companion-progress) return a broker task's execution events and closed error classes as the daemon serves them to a broker key; hermes vornik approvals on writes security.approval.transport (and vornik_companion.approval_namespace) to Hermes config, after which Hermes's own dangerous-command prompts (the redacted command text) are sent through the local vornikctl agent host-approval to the daemon and answered on the paired phone, any failure or a Vornik outage denying the command unless transport_fallback: builtin is set, and the plugin never decides itself; hermes vornik connect runs the local vornikctl, which adds an MCP entry to Hermes config."
description_tr: "Vornik, Hermes'in sertleştirilmiş aracısı ve uzun süreli belleği olarak: Hermes hiçbir kimlik bilgisi tutmaz; ayrıcalıklı iş, operatörün onayladığı iş akışlarında kendi Vornik daemon'unuzda çalışır. Açıklama — yalnızca VORNIK_URL adresindeki kendi barındırdığınız Vornik daemon'uyla VORNIK_BROKER_TOKEN (ve bellek için VORNIK_MEMORY_TOKEN) kullanarak konuşur; aracı araçları ajanın o daemon üzerinde operatör onaylı iş akışları başlatmasına izin verir (yazmalar Vornik'te bir kişi tarafından onaylanır); bellek sağlayıcısı olarak seçildiğinde her turun kullanıcı sorgusunu geri çağırma için gönderir, MEMORY.md ve USER.md yazmalarını daemon'a yansıtır ve Hermes'in kaldırdığı veya değiştirdiği yansıtılmış bir girdiyi geri çağırmayı durdurmasını (silmeyi değil) ister (/vornik-memory neyi listelerse ve /vornik-forget Vornik'in tuttuklarını unutur); eser araçları yalnızca tamamlanmış koşulardan onaylanmış iş akışının izin verdiği adlandırılmış çıktıları sunar ve sınırlı metin okur veya daemon'dan kısa ömürlü ikili indirme bağlantıları döndürür; görev tanılama araçları (yalnızca daemon companion-progress duyurduğunda sunulur) bir aracı görevinin yürütme olaylarını ve kapalı hata sınıflarını daemon'un bunları bir aracı anahtarına sunduğu biçimde döndürür; hermes vornik approvals, Hermes yapılandırmasına security.approval.transport (ve vornik_companion.approval_namespace) yazar; ardından Hermes'in kendi tehlikeli komut istemleri (sansürlenmiş komut metni) yerel vornikctl ajan ana makine onayı üzerinden daemon'a gönderilir ve eşleştirilmiş telefonda yanıtlanır; herhangi bir hata veya Vornik kesintisi, transport_fallback: builtin ayarlanmadıkça komutu reddeder ve eklenti asla kendi karar vermez; hermes vornik connect yerel vornikctl'yi çalıştırır ve bu da Hermes yapılandırmasına bir MCP girdisi ekler."
maintainer: EaseIT Labs
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://docs.vornik.io/features/companion/
version: "0.22.1"
capabilities:
  provides_tools:
    - vornik_catalog
    - vornik_delegate
    - vornik_result
    - vornik_status
    - vornik_cancel
    - vornik_list_artifacts
    - vornik_read_artifact
    - vornik_task_logs
    - vornik_task_explain
    - vornik_recall
    - vornik_remember
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env:
    - VORNIK_URL
    - VORNIK_BROKER_TOKEN
    - VORNIK_MEMORY_TOKEN
requires_env: []
