subdir: reaction-ledger
description: "Local ledger of the emoji reactions people leave on messages in your Telegram chats with Hermes: /reaction-log counts each message once, with the reactions it has now, and shows per emoji how many messages carry it, in how many chats and how long ago it was last set, or per day with the day's most used emoji, for the last 24 hours, any number of hours or days, or everything recorded; /reaction-log recent lists the newest reaction changes (ten, or up to 100 with /reaction-log recent 50). Only reactions the gateway authorizes reach it. Disclosure — subscribes to gateway_platform_event as an observer only and ignores every event but a reaction change; writes the emoji a message has after the change, a count of custom emoji and 12-digit hashes of the chat and message ids (never a user id, user name or message text) to plugin-data/reaction-ledger/reactions.jsonl, trimmed to 5,000 rows past 2 MB; no network"
description_tr: "Hermes ile Telegram sohbetlerinizde insanların mesajlara bıraktığı emoji tepkilerinin yerel defteri: /reaction-log her mesajı bir kez sayar, sahip olduğu tepkilerle birlikte, ve emoji başına kaç mesajın taşıdığını, kaç sohbette bulunduğunu ve en son ne zaman ayarlandığını gösterir; ya da gün bazında, günün en çok kullanılan emojisiyle, son 24 saat için, istediğiniz sayıda saat veya gün için ya da kaydedilen her şey için; /reaction-log recent en yeni tepki değişikliklerini listeler (on tane, veya /reaction-log recent 50 ile 100'e kadar). Yalnızca ağ geçidinin yetkilendirdiği tepkiler buraya ulaşır. Açıklama — gateway_platform_event'e yalnızca gözlemci olarak abone olur ve tepki değişikliği dışındaki her olayı yok sayar; bir mesajın değişiklikten sonra sahip olduğu emojiyi, özel emoji sayısını ve sohbet ile mesaj kimliklerinin 12 haneli karmalarını (asla bir kullanıcı kimliği, kullanıcı adı veya mesaj metni değil) plugin-data/reaction-ledger/reactions.jsonl dosyasına yazar ve 2 MB'ı aştığında 5.000 satıra kırpar; ağ erişimi yok."
