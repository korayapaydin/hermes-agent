sha: b26b92760b2bfc36a91c280af96b0171c4d00267
subdir: wincred
description: "Resolve Hermes environment variables from the current user's Windows Credential Manager at startup, instead of keeping provider keys in plaintext in .env or auth.json. Config is secrets.wincred.map, an ENV_VAR -> generic-credential-target mapping (bare names or wincred:// names); each value is read with CredReadW in the current user's vault and handed to the secret-source orchestrator, which applies it with the usual precedence, provenance and conflict rules. Values may be UTF-8 or UTF-16LE (cmdkey and the Credential UI write UTF-16); anything that does not decode to text, or that contains interior NULs, is skipped with a warning instead of being injected as a mangled key. Disclosure - this source reads your Windows Credential Manager: only the generic credentials named in the map, with no enumeration of the vault. Resolved values become environment variables of the Hermes process and its children, exactly like .env entries, so anything that can read that environment can see them. The package is read-only and stdlib-only (ctypes): it never creates, updates or deletes credentials, writes no files, starts no subprocesses, makes no network calls and does not self-update. Windows only. Credential Manager is user-scoped, so this raises the at-rest bar for backups, cloud sync and dotfiles; it is not a boundary against code already running as the same user. Applying fetched values stays the orchestrator's job; the plugin never writes os.environ itself. Disclosure — when enabled, reads only the Windows Credential Manager generic credentials named in secrets.wincred.map (no vault enumeration) and injects them as environment variables of the Hermes process and its children, exactly like .env entries; read-only, stdlib ctypes, no subprocesses, no network, no file writes; user-scoped at-rest protection, not a boundary against code already running as the same user."
description_tr: "Hermes ortam değişkenlerini, sağlayıcı anahtarlarını .env veya auth.json dosyasında düz metin olarak tutmak yerine, başlangıçta mevcut kullanıcının Windows Credential Manager deposundan çözer. Yapılandırma secrets.wincred.map'tir: bir ENV_VAR -> genel kimlik bilgisi hedefi eşlemesi (yalın adlar ya da wincred:// adları); her değer mevcut kullanıcının kasasında CredReadW ile okunur ve gizli kaynak orkestratörüne verilir; orkestratör onu varsayılan öncelik, kaynak ve çelişki kurallarıyla uygular. Değerler UTF-8 ya da UTF-16LE olabilir (cmdkey ve Credential UI UTF-16 yazar); metne çözülemeyen ya da içinde NUL bulunan her şey, bozuk bir anahtar olarak enjekte edilmek yerine uyarıyla atlanır. Açıklama — bu kaynak Windows Credential Manager'ınızı okur: yalnızca haritada adlandırılan genel kimlik bilgilerini, kasada numaralandırma yapmadan. Çözülen değerler, tıpkı .env girdileri gibi Hermes sürecinin ve alt süreçlerinin ortam değişkenleri olur; dolayısıyla o ortamı okuyabilen her şey bunları görebilir. Paket salt okunurdur ve yalnızca stdlib (ctypes) kullanır: kimlik bilgilerini asla oluşturmaz, güncellemez veya silmez, dosya yazmaz, alt süreç başlatmaz, ağ çağrısı yapmaz ve kendi kendini güncellemez. Yalnızca Windows. Credential Manager kullanıcı kapsamlıdır, bu yüzden bu, yedeklemeler, bulut eşitleme ve dotfiles için durağan veri engelini artırır; aynı kullanıcı olarak çalışan koda karşı bir sınır değildir. Getirilen değerlerin uygulanması orkestratörün işi olarak kalır; eklenti os.environ'u asla kendisi yazmaz. Açıklama — etkinleştirildiğinde yalnızca secrets.wincred.map içinde adlandırılan Windows Credential Manager genel kimlik bilgilerini okur (kasa numaralandırması yok) ve bunları tıpkı .env girdileri gibi Hermes sürecinin ve alt süreçlerinin ortam değişkenleri olarak enjekte eder; salt okunur, stdlib ctypes, alt süreç yok, ağ yok, dosya yazımı yok; kullanıcı kapsamlı durağan veri koruması, aynı kullanıcı olarak çalışan koda karşı bir sınır değildir."
