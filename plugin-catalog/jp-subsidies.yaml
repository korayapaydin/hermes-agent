sha: 471ed8e7bd3e3dd9430ef86ee933e42da8d7cc73
description: 'Japanese subsidy search and weekly watch, built on the jGrants public API. Disclosure — Searches api.jgrants-portal.go.jp with no API key and no daily request cap; each call waits at most 60 seconds and retries at most twice, and a result is a search match, not proof that every subsidy came back. The plugin has no user list of its own: anyone you allow on your Hermes gateway can call these tools and change this profile''s watch, and the agent can set up a watch by itself. In a Chatwork room listed in CHATWORK_ROOMS, everyone can call them while CHATWORK_ALLOWED_USERS is unset. The tools are on for every platform, including gateways; turn them off per platform with hermes tools. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off. The /subsidies command is outside hermes tools; limit it with allow_admin_from or user_allowed_commands, or disable the plugin. The optional weekly watch is an unattended cron job that runs a script with no model call and is not a sandbox; delivering it to bot-chat instead runs one model turn on the fetched text. If delivery fails after the script runs, those subsidies are already marked seen and the text stays under cron/output/. Uninstall leaves the cron job, scripts/jp-subsidies-weekly-*.py and plugin-data/jp-subsidies/ until you run hermes cron remove and delete the files. The plugin does not store the name or ID of who asked. Not tested against a live gateway, with the Chatwork plugin loaded, or for result sets of several hundred rows.'
description_tr: "jGrants genel API'si üzerine kurulu Japon hibe araması ve haftalık izleme. Açıklama — api.jgrants-portal.go.jp adresini API anahtarı ve günlük istek sınırı olmadan sorgular; her çağrı en fazla 60 saniye bekler ve en fazla iki kez yeniden dener ve bir sonuç, her sübvansiyonun geri döndüğünün kanıtı değil, bir arama eşleşmesidir. Eklentinin kendi kullanıcı listesi yoktur: Hermes ağ geçidinizde izin verdiğiniz herkes bu araçları çağırabilir ve bu profilin izlemesini değiştirebilir, ajan da kendi başına bir izleme kurabilir. CHATWORK_ROOMS içinde listelenen bir Chatwork odasında, CHATWORK_ALLOWED_USERS ayarlanmamışken herkes bunları çağırabilir. Araçlar ağ geçitleri dahil her platformda açıktır; hermes tools ile platform başına kapatın. Eklenti etkinken yeteneği her oturumun yetenek dizinine bir satır ekler; araçların kapatıldığı yüzeyler de buna dahildir. /subsidies komutu hermes tools dışındadır; allow_admin_from veya user_allowed_commands ile sınırlayın ya da eklentiyi devre dışı bırakın. İsteğe bağlı haftalık izleme, model çağrısı yapmadan bir betik çalıştıran ve bir korumalı alan olmayan gözetimsiz bir cron işidir; bot sohbetine teslim edilmesi bunun yerine getirilen metin üzerinde bir model turu çalıştırır. Betik çalıştıktan sonra teslimat başarısız olursa bu hibeler zaten görüldü olarak işaretlenmiştir ve metin cron/output/ altında kalır. Kaldırma, siz hermes cron remove çalıştırıp dosyaları silene kadar cron işini, scripts/jp-subsidies-weekly-*.py dosyalarını ve plugin-data/jp-subsidies/ dizinini bırakır. Eklenti, kimin sorduğunun adını veya kimliğini saklamaz. Canlı bir ağ geçidine karşı, Chatwork eklentisi yüklüyken veya birkaç yüz satırlık sonuç kümeleri için test edilmemiştir."
