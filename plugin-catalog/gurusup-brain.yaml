sha: 4709ca345cb55a1fab809b6b53523c5c0600be6e
description: "Your company's memory in Hermes: search decisions, people, customers and projects across every source your team connected to Gurusup (Slack, HubSpot, Notion, uploaded documents and more), with the sources behind each answer. Portable Agent Plugins v1 package (mcp.json + skills/), remote streamable-http with OAuth 2.1, no local code and no API keys. Disclosure — hosted-only MCP connector with no local code: every tool call goes to Gurusup's server at mcp.brain.gurusup.com under the signed-in Gurusup account (OAuth via `hermes mcp add gurusup-brain --url https://mcp.brain.gurusup.com/mcp --auth oauth`; the bundled mcp.json alone yields 401), and answers are limited to what that account can see; write tools save knowledge to the company's Gurusup workspace (add_company_knowledge, skills_publish) and send issue reports or feedback to Gurusup (report_issue, send_feedback), and request_human_info can message a teammate on Slack or phone them when its dispatch flag is set."
description_tr: "Hermes içinde şirketinizin belleği: ekibinizin Gurusup'a bağladığı her kaynakta (Slack, HubSpot, Notion, yüklenen belgeler ve daha fazlası) kararları, kişileri, müşterileri ve projeleri arayın; her yanıtın arkasındaki kaynaklarla birlikte. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), OAuth 2.1 ile uzak streamable-http, yerel kod ve API anahtarı yok. Açıklama — yerel kodu olmayan, yalnızca barındırılan MCP bağlayıcısı: her araç çağrısı, giriş yapılmış Gurusup hesabı altında Gurusup'un mcp.brain.gurusup.com adresindeki sunucusuna gider (OAuth: `hermes mcp add gurusup-brain --url https://mcp.brain.gurusup.com/mcp --auth oauth`; tek başına paketlenmiş mcp.json 401 verir) ve yanıtlar o hesabın görebildikleriyle sınırlıdır; yazma araçları bilgiyi şirketin Gurusup çalışma alanına kaydeder (add_company_knowledge, skills_publish) ve sorun bildirimlerini ya da geri bildirimi Gurusup'a gönderir (report_issue, send_feedback); request_human_info ise gönderim bayrağı ayarlıysa bir ekip arkadaşına Slack'te mesaj atabilir veya telefonla arayabilir."
