subdir: mcp-serve
description: 'Run Hermes as an MCP server: `hermes mcp-serve` lets any MCP client (Claude Code, Claude
  Desktop, Cursor, Codex) list and read your messaging conversations, poll live events, send messages and
  answer approvals over stdio. `--tools` (off by default) also exposes Hermes'' web, browser, vision, image
  generation, skills and TTS tools; terminal, file and kanban tools are never exposed. Formerly built into
  Hermes core as `hermes mcp serve` (MCP clients change their args to ["mcp-serve"]). Disclosure — the
  connecting MCP client reads the active profile''s conversation history (state.db) and can send messages
  as your connected platform accounts; with `--tools` it also runs Hermes tools under your configured
  provider credentials, which can spend provider credits. The plugin itself makes no network or model
  calls beyond those tool calls and sends.'
description_tr: "Hermes'i bir MCP sunucusu olarak çalıştırın: `hermes mcp-serve`, herhangi bir MCP istemcisinin (Claude Code, Claude Desktop, Cursor, Codex) mesajlaşma konuşmalarınızı listeleyip okumasına, canlı olayları yoklamasına, mesaj göndermesine ve onayları yanıtlamasına stdio üzerinden izin verir. `--tools` (varsayılan olarak kapalı) ayrıca Hermes'in web, tarayıcı, görüntü, görsel üretme, yetenek ve TTS araçlarını açar; terminal, dosya ve kanban araçları hiçbir zaman açılmaz. Önceden Hermes çekirdeğinde `hermes mcp serve` olarak yerleşikti (MCP istemcileri argümanlarını [\"mcp-serve\"] olarak değiştirir). Açıklama — bağlanan MCP istemcisi etkin profilin konuşma geçmişini (state.db) okur ve bağlı platform hesaplarınız olarak mesaj gönderebilir; `--tools` ile ayrıca Hermes araçlarını yapılandırdığınız sağlayıcı kimlik bilgileriyle çalıştırır, bu da sağlayıcı kredisi harcayabilir. Eklentinin kendisi bu araç çağrıları ve gönderimler dışında ağ ya da model çağrısı yapmaz."
