sha: 92e4351a852117a11542210d06e8e5bfb61c3f1a
version: "5.8.35"
description: "Local-first long-term memory and memory-aware context compression for Hermes — SQLite, no account, API key or hosted service required. Captures every turn durably, extracts beliefs with provenance, answers from memory (raw-tier fallback and abstention), derives scoped conclusions, and compresses the context window losslessly with a restorable record. Registers the memory-provider AND context-engine slots from one shared core, and ships the Tapestry dashboard. Disclosure — off-host embedding endpoints are refused by default (RFC1918/ULA/CGNAT and https peers); sending memory excerpts off the host requires opting in via embeddings.allow_remote. Disclosure — the git mirror (engine/gitmirror.py) is on by default and writes plaintext JSONL copies of memory into a local git repo at ~/.hermes/commons/db/chronicle/git; it pushes only when git_remote is configured, and its 'encryption' option is a repeating-key XOR obfuscation, not cryptographic encryption."
description_tr: "Hermes için yerel öncelikli uzun süreli bellek ve bellek farkındalıklı bağlam sıkıştırma — SQLite; hesap, API anahtarı ya da barındırılan servis gerekmez. Her turu kalıcı olarak yakalar, kökeniyle birlikte inançları çıkarır, bellekten yanıt verir (ham katman yedeği ve çekimserlik), kapsamlı sonuçlar türetir ve bağlam penceresini geri yüklenebilir bir kayıtla kayıpsız sıkıştırır. Tek bir ortak çekirdekten hem bellek sağlayıcısı hem bağlam motoru yuvalarını kaydeder ve Tapestry panosunu sunar. Açıklama — ana makine dışı gömme uç noktaları varsayılan olarak reddedilir (RFC1918/ULA/CGNAT ve https eşleri); bellek alıntılarını ana makine dışına göndermek için embeddings.allow_remote ile isteğe bağlı katılım gerekir. Açıklama — git aynası (engine/gitmirror.py) varsayılan olarak açıktır ve belleğin düz metin JSONL kopyalarını ~/.hermes/commons/db/chronicle/git konumundaki yerel bir git deposuna yazar; yalnızca git_remote yapılandırıldığında push eder ve 'encryption' seçeneği kriptografik şifreleme değil, tekrarlayan anahtarlı XOR gizlemesidir."
