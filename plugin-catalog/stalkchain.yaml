title: StalkChain
description: "Crypto research in plain English through the official StalkChain Data MCP server (Streamable HTTP at https://data.stalkchain.com/mcp/directory, OAuth sign-in, no keys in config): check a coin before you buy, vet a trader before you copy them, see what smart money is buying, review a wallet and set price alerts, across Solana, Ethereum, Base, BNB Chain, Monad, Hyperliquid and Robinhood Chain, plus the StonkFun launchpad. Portable Agent Plugins v1 package (mcp.json + 18 skills), no Python or executables; needs a StalkChain account with credits. Read-only: never trades, moves funds or signs anything; the only write is the user's own price alerts, after they confirm. Disclosure — the tool set is served by the remote MCP server at runtime and is not covered by the pinned sha; each tool call sends the tool name and its inputs to data.stalkchain.com and spends the account's credits; price alerts are stored by StalkChain with their destination (account email or a user-given Discord, Slack or Telegram webhook URL, which can embed a bot token) until deleted or fired."
description_tr: "Resmî StalkChain Data MCP sunucusu (https://data.stalkchain.com/mcp/directory adresinde Streamable HTTP, OAuth girişi, yapılandırmada anahtar yok) üzerinden düz İngilizceyle kripto araştırması: bir coin almadan önce denetleyin, bir yatırımcıyı kopyalamadan önce doğrulayın, akıllı paranın ne aldığını görün, bir cüzdanı inceleyin ve fiyat uyarıları kurun — Solana, Ethereum, Base, BNB Chain, Monad, Hyperliquid ve Robinhood Chain genelinde, ayrıca StonkFun fırlatma platformu. Taşınabilir Agent Plugins v1 paketi (mcp.json + 18 yetenek), Python ya da çalıştırılabilir dosya yok; kredili bir StalkChain hesabı gerekir. Salt okunur: asla işlem yapmaz, para taşımaz ve hiçbir şey imzalamaz; tek yazma, kullanıcının onayından sonra kendi fiyat uyarılarıdır. Açıklama — araç kümesi çalışma zamanında uzak MCP sunucusu tarafından sunulur ve sabitlenmiş sha kapsamında değildir; her araç çağrısı araç adını ve girdilerini data.stalkchain.com'a gönderir ve hesabın kredilerini harcar; fiyat uyarıları, hedefleriyle birlikte (hesap e-postası veya kullanıcının verdiği, bot token'ı içerebilen bir Discord, Slack ya da Telegram webhook URL'si) silinene veya tetiklenene kadar StalkChain tarafından saklanır."
