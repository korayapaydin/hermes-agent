name: stream-speed
repo: https://github.com/olric3015/hermes-plugins
sha: d7b48bbe90d18bfdf26ccbf7bd4da6616e7645d6
subdir: stream-speed
description: "How fast each model starts answering and how fast it writes: /speed shows the median and p90 time to first text and the median characters per second per model, provider or day, or lists the newest streams (ten, or up to 100 with /speed recent 50), for the last 24 hours, any number of hours or days, the latest session or everything recorded, from the streaming hooks. Disclosure — writes per-response stream timings (ids, model, timings, character count, no text) to plugin-data/stream-speed/streams.jsonl, trimmed to 5,000 rows past 2 MB; atexit waits up to 1 s; no network"
description_tr: "Her modelin yanıtlamaya ne kadar hızlı başladığı ve ne kadar hızlı yazdığı: /speed, model, sağlayıcı ya da gün başına ilk metne kadar geçen sürenin medyanını ve p90 değerini ve saniyedeki karakter sayısının medyanını gösterir ya da en yeni akışları listeler (on tane ya da /speed recent 50 ile en fazla 100) — son 24 saat, istenen sayıda saat ya da gün, en son oturum ya da kaydedilen her şey için, akış kancalarından. Açıklama — yanıt başına akış sürelerini (kimlikler, model, süreler, karakter sayısı, metin yok) plugin-data/stream-speed/streams.jsonl dosyasına yazar, 2 MB'ı aştığında 5.000 satıra kırpar; atexit en fazla 1 sn bekler; ağ yok."
maintainer: olric3015
tier: community
category: tools
