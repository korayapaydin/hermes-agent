subdir: wait-ledger
description: "Local ledger of the times Hermes stopped to wait for you (approval prompts, clarify questions, password prompts): /waits shows how many waits there were, how many were answered or left unanswered, and how long Hermes stood still in total, typically and at most, per kind of prompt, per platform or per day, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /waits recent lists the newest waits (ten, or up to 100 with /waits recent 50). Disclosure — writes wait metadata (session id, platform, kind of prompt, how it ended, wait time; no prompt text, answer or session key) to plugin-data/wait-ledger/waits.jsonl, trimmed to 5,000 rows past 2 MB; observer only, cannot answer, delay or change a prompt; no network"
description_tr: "Hermes'in sizi beklemek için durduğu anların yerel defteri (onay istemleri, netleştirici sorular, parola istemleri): /waits, bekleme sayısını, yanıtlanan ya da yanıtsız kalanların sayısını ve Hermes'in toplamda, tipik olarak ve en fazla ne kadar hareketsiz kaldığını; istem türüne, platforma ya da güne göre ve son 24 saat, istenen sayıda saat ya da gün, en son oturum ya da kaydedilen her şey için gösterir; /waits recent en yeni beklemeleri listeler (on, ya da /waits recent 50 ile en fazla 100). Açıklama — bekleme üst verilerini (oturum kimliği, platform, istem türü, nasıl sona erdiği, bekleme süresi; istem metni, yanıt ya da oturum anahtarı yok) plugin-data/wait-ledger/waits.jsonl dosyasına yazar, 2 MB'ı aştığında 5.000 satıra kırpar; yalnızca gözlemcidir, bir istemi yanıtlayamaz, geciktiremez ya da değiştiremez; ağ yok."
