sha: ae705c692dd83c5eb0e871053722838af39e213e
description: "Unofficial OpenCode Zen free-model transport for Hermes. Discovers live zero-cost tool-capable models by intersecting OpenCode Zen and models.dev over HTTPS, persists only the last successful intersection for restart fallback, and bidirectionally translates compatible OpenCode and Hermes tool schemas, calls, choices, and replayed history while Hermes executes tools locally. No OpenCode CLI, Node.js, npm, or npx dependency. Disclosure — prompts, tool schemas, tool results, and other conversation content leave the machine for OpenCode and the selected model provider; model availability, retention, data use, and permission are governed by their current terms."
description_tr: "Hermes için gayriresmî OpenCode Zen ücretsiz model taşıması. OpenCode Zen ile models.dev'i HTTPS üzerinden kesiştirerek canlı, sıfır maliyetli, araç destekli modelleri keşfeder, yalnızca son başarılı kesişimi yeniden başlatma yedeği olarak kalıcılaştırır ve Hermes araçları yerel olarak çalıştırırken uyumlu OpenCode ve Hermes araç şemalarını, çağrılarını, seçeneklerini ve yeniden oynanan geçmişi iki yönlü çevirir. OpenCode CLI, Node.js, npm ya da npx bağımlılığı yok. Açıklama — istemler, araç şemaları, araç sonuçları ve diğer sohbet içeriği, OpenCode ve seçilen model sağlayıcısı için makineden ayrılır; model kullanılabilirliği, saklama, veri kullanımı ve izinler onların güncel koşullarına tabidir."
