description: "Search and book real flights and hotels through the hosted LetsFG MCP server (Streamable HTTP, OAuth 2.1 + DCR), with the letsfg travel-booking workflow skill bundled: fares across airlines and the major travel sites, flexible dates, destinations in a region, bookable hotel rates, then book, follow and stop bookings. Portable Agent Plugins v1 package (skills/ only; the server is added by the sign-in command below). Disclosure — hosted-only connector with no local code: every tool call goes to the vendor's remote MCP server at letsfg.co/mcp. Booking tools act on real money: a booking holds the price on the card saved on the user's LetsFG account (captured only once the airline or hotel confirms, released if it fails); per LetsFG, a booking, paid extra or hotel cancellation starts only when the user presses Approve in an e-mail from LetsFG, never from the conversation, and Hermes itself does not prompt before these tools unless you set `trust: untrusted` on the letsfg MCP server. Card details are only ever entered on letsfg.co, never in the conversation. Traveller details given for a booking (name, date of birth, gender, passport, contact, address) are sent to LetsFG and saved on that account. The server and its OAuth sign-in are added with `hermes mcp add letsfg --url https://letsfg.co/mcp --auth oauth --connect-timeout 300`."
description_tr: "Barındırılan LetsFG MCP sunucusu (Streamable HTTP, OAuth 2.1 + DCR) üzerinden gerçek uçuş ve otel arayın ve rezervasyon yapın; paketlenmiş letsfg seyahat rezervasyonu iş akışı yeteneğiyle: havayolları ve büyük seyahat siteleri arasında ücretler, esnek tarihler, bir bölgedeki varış noktaları, rezerve edilebilir otel fiyatları ve ardından rezervasyon, takip ve iptal. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/). Açıklama — yalnızca barındırılan bağlayıcı, yerel kod yok: her araç çağrısı satıcının letsfg.co/mcp adresindeki uzak MCP sunucusuna gider. Rezervasyon araçları gerçek parayla işlem yapar: bir rezervasyon, fiyatı kullanıcının LetsFG hesabında kayıtlı kart üzerinde tutar (yalnızca havayolu ya da otel onayladığında tahsil edilir, başarısız olursa serbest bırakılır); LetsFG'ye göre bir rezervasyon, ücretli ek ya da otel iptali yalnızca kullanıcı LetsFG'den gelen bir e-postada Onayla'ya bastığında başlar, konuşmadan asla başlamaz ve letsfg MCP sunucusunda `trust: untrusted` ayarlamadıkça Hermes bu araçlardan önce kendisi sormaz. Kart bilgileri yalnızca letsfg.co üzerinde girilir, asla konuşmada girilmez. Bir rezervasyon için verilen yolcu bilgileri (ad, doğum tarihi, cinsiyet, pasaport, iletişim, adres) LetsFG'ye gönderilir ve o hesapta saklanır. OAuth `hermes mcp add letsfg --url https://letsfg.co/mcp --auth oauth --connect-timeout 300` ile etkinleştirilmelidir; tek başına paketlenmiş mcp.json 401 verir."
