title: "Hermes Boot Screen"
description: "Six-act boot animation for the Hermes desktop app — black-screen brand reveal, over-exposed whiteout bridge, a technical-dossier plate, an authorization handshake with identity confirmation, and a welcome finale — with audio cues, theme-aware light/dark plates and Esc/Enter/Space controls. Desktop-only: desktop/plugin.js inside the plugin SDK surface; no agent tools, hooks, middleware or env vars. Fully English UI. Adapted from 6shenhonghong9/dsh-startup-screen (MIT). Disclosure — on every Desktop launch (default: once per session) it covers the whole window with a full-screen animation that plays audio and spoken narration and waits for Enter/Space/click on two steps (Esc skips); while it is up it captures Enter/Space/Esc at the document level. Turn it off or switch to daily in its Startup Animation settings page."
description_tr: "Hermes masaüstü uygulaması için altı perdelik açılış animasyonu — siyah ekranlı marka ortaya çıkışı, fazla pozlanmış beyazlık köprüsü, teknik dosya kartı, kimlik doğrulamalı yetkilendirme tokalaşması ve hoş geldin finali — ses ipuçları, temaya duyarlı açık/koyu kartlar ve Esc/Enter/Space kontrolleriyle. Yalnızca masaüstü: eklenti SDK yüzeyi içinde desktop/plugin.js; ajan aracı, hook, ara katman ya da ortam değişkeni yok. Tamamen İngilizce arayüz. 6shenhonghong9/dsh-startup-screen'den uyarlanmıştır (MIT). Açıklama — her Desktop açılışında (varsayılan: oturum başına bir kez) tüm pencereyi ses ve sesli anlatım çalan tam ekran bir animasyonla kaplar ve iki adımda Enter/Space/tıklama bekler (Esc atlar); açık olduğu sürece Enter/Space/Esc tuşlarını belge düzeyinde yakalar. Başlangıç Animasyonu ayarları sayfasından kapatabilir veya günlük moda geçebilirsiniz."
