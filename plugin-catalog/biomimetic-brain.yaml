name: biomimetic-brain
repo: https://github.com/ousiaresearch/biomimetic-brain
sha: efbf72d0afc4dff0ab212542eed584114f88d70d
description: >-
  Meters and a gate for a long-running agent — 25 subsystem state files (energy, fatigue, circadian
  phase, motivation, novelty, attention, conflict, values, open questions), one folded
  brain-state.json the rest of the agent reads, four maintenance passes that keep it honest, and a
  read-only PROCEED / CAUTION / VETO decision gate whose refusals name the numbers behind them.
  Provides the mind-kit skill, which seeds the files, produces the aggregate, schedules the passes and
  teaches the gate. Disclosure — portable Agent Plugins v1 package; it registers no hooks, no tools
  and no middleware, makes no network calls, and reads and writes state files only under the agent
  directory you choose, where a subsystem that has stopped updating reports stale instead of asserting
  an old number. No dependencies beyond the Python standard library (two shell scripts for the
  scheduled passes). Its scripts, when the agent or operator runs them, read and write JSON state
  under the directory chosen with MIND_AGENT_DIR (default an agent/ folder inside the plugin's own
  install dir), read HERMES_HOME/cron/executions.db for cron counts, and execute
  scripts/batch-maintenance.sh or scripts/verify-invariants.py from that agent directory if present;
  no network egress and no LLM calls.
description_tr: "Uzun süre çalışan bir ajan için sayaçlar ve bir kapı — 25 alt sistem durum dosyası (enerji, yorgunluk, sirkadiyen faz, motivasyon, yenilik, dikkat, çatışma, değerler, açık sorular), ajanın geri kalanının okuduğu tek katlanmış brain-state.json, onu dürüst tutan dört bakım turu ve salt okunur bir PROCEED / CAUTION / VETO karar kapısı; retleri arkalarındaki sayıları da adlandırır. Dosyaları tohumlayan, toplamı üreten, turları zamanlayan ve kapıyı öğreten mind-kit yeteneğini sunar. Açıklama — taşınabilir Agent Plugins v1 paketi; hiçbir kanca, araç ve middleware kaydetmez, hiçbir ağ çağrısı yapmaz ve durum dosyalarını yalnızca seçtiğiniz ajan dizini altında okur ve yazar; burada güncellenmeyi durduran bir alt sistem, eski bir sayı ileri sürmek yerine bayat olduğunu bildirir. Python standart kütüphanesi dışında bağımlılık yoktur (zamanlanmış geçişler için iki kabuk betiği). Betikleri, ajan ya da operatör çalıştırdığında, MIND_AGENT_DIR ile seçilen dizin altındaki JSON durumunu okur ve yazar (varsayılan olarak eklentinin kendi kurulum dizini içindeki bir agent/ klasörü), cron sayıları için HERMES_HOME/cron/executions.db dosyasını okur ve varsa o ajan dizininden scripts/batch-maintenance.sh ya da scripts/verify-invariants.py betiklerini çalıştırır; ağ çıkışı ve LLM çağrısı yoktur."
