name: showly
title: Showly
repo: https://github.com/cuboteam/showly-plugin
sha: f3872b21388fe17719f988ebe52f5115cf5d3426
subdir: hermes
description: "Preview, publish, and manage websites hosted on Showly from Hermes Agent, through the hosted Showly MCP server (Streamable HTTP). Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — tool calls go to Showly's hosted MCP server at mcp.showly.ai. The bundled showly-hosting skill makes Showly the default for any deploy, preview or share request that names no provider, and new links default to public (anyone with the link). The showly-reports skill runs a bundled local Node.js renderer (vendored answer-me-with-html 0.4.14, upstream self-update check removed) through the shell and uploads the report directory to Showly when sharing is requested. Sign-in is out of band: `npx @showly/mcp-server login --to hermes` (unpinned) writes MCP_SHOWLY_API_KEY into ~/.hermes/config.yaml."
description_tr: "Barındırılan Showly MCP sunucusu (Streamable HTTP) üzerinden Hermes Agent'ta Showly'de barındırılan web sitelerini önizleyin, yayınlayın ve yönetin. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/). Açıklama — araç çağrıları mcp.showly.ai adresindeki barındırılan Showly MCP sunucusuna gider. Paketle gelen showly-hosting yeteneği, sağlayıcı belirtmeyen her dağıtım, önizleme ya da paylaşım isteğinde Showly'yi varsayılan yapar ve yeni bağlantılar varsayılan olarak herkese açıktır (bağlantıya sahip olan herkes). showly-reports yeteneği, paketle gelen yerel bir Node.js işleyicisini (birlikte dağıtılan answer-me-with-html 0.4.14, üst kaynaktaki kendi kendini güncelleme denetimi kaldırılmış) kabuk üzerinden çalıştırır ve paylaşım istendiğinde rapor dizinini Showly'ye yükler. Oturum açma bant dışıdır: `npx @showly/mcp-server login --to hermes` (sürüm sabitlenmemiş) MCP_SHOWLY_API_KEY değerini ~/.hermes/config.yaml dosyasına yazar."
maintainer: cuboteam
tier: community
category: tools
