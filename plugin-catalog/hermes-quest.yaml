name: hermes-quest
description: "Read-only pixel-art RPG view of real Hermes Kanban and worker activity, with a live web dashboard tab and an optional native Desktop page. The Desktop page currently supports explicit local connections only; registry and SSH remote connections fail closed until a public SDK connection-lifecycle hook is available. Standalone demo data is synthetic. Disclosure — reads local Hermes data outside its own directory (kanban.db, every profile's state.db, profile.yaml, config.yaml model/effort, logs/agent.log, bot-status.json) on each dashboard poll: every /replay or /events request (about every 10 s while the tab is open) runs the bundled Python extractor as a subprocess (argument list, no shell, 30 s timeout); a background thread samples bot-status.json every 30 s (HERMES_QUEST_SAMPLER=off disables it) and writes bot-status history, checkpoint state, a lock and a random 0600 HMAC key under <hermes_home>/hermes-quest/ (not yet plugin-data); profile names and task titles are hidden unless enabled and only shown to host-authenticated dashboard sessions; the Desktop page works only on an explicit local connection; no network calls beyond the local Hermes backend."
description_tr: "Gerçek Hermes Kanban ve işçi etkinliğinin salt okunur piksel sanatlı RPG görünümü; canlı bir web pano sekmesi ve isteğe bağlı yerel bir Desktop sayfasıyla. Desktop sayfası şu anda yalnızca açık yerel bağlantıları destekler; kayıt defteri ve SSH uzak bağlantıları, herkese açık bir SDK bağlantı yaşam döngüsü kancası bulunana kadar kapalı hâlde başarısız olur. Bağımsız demo verisi sentetiktir. Açıklama — her pano yoklamasında kendi dizini dışındaki yerel Hermes verilerini (kanban.db, her profilin state.db dosyası, profile.yaml, config.yaml model/effort, logs/agent.log, bot-status.json) okur: her /replay veya /events isteği (sekme açıkken yaklaşık her 10 s'de bir) paketlenmiş Python çıkarıcısını bir alt süreç olarak çalıştırır (argüman listesi, kabuk yok, 30 s zaman aşımı); bir arka plan iş parçacığı bot-status.json dosyasını her 30 s'de bir örnekler (HERMES_QUEST_SAMPLER=off bunu devre dışı bırakır) ve bot durumu geçmişini, kontrol noktası durumunu, bir kilidi ve rastgele bir 0600 HMAC anahtarını <hermes_home>/hermes-quest/ altına yazar (henüz plugin-data değil); profil adları ve görev başlıkları etkinleştirilmedikçe gizlenir ve yalnızca ana bilgisayar tarafından kimlik doğrulanmış pano oturumlarına gösterilir; Desktop sayfası yalnızca açık bir yerel bağlantıda çalışır; yerel Hermes arka ucu dışında ağ çağrısı yoktur."
