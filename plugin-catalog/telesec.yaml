name: telesec
title: Telesec
repo: https://github.com/neoromantic/telesec
sha: b23cd63358e1a66518106c485402a9033f6b31d9
description: "Telegram Business secretary: transcribes voice notes, round videos, and speech attachments right in the chat, with Settings and per-chat controls in Telegram's Manage Bot panel, plus opt-in text history (with import from a Telegram export), correspondence stats, and contact dossiers. Disclosure — audio goes to the STT backend Hermes is configured with (local or external); transcript cleanup sends chat text through the host ctx.llm; opt-in dossiers send chat text through the Hermes model task telesec_dossier (default Vercel AI Gateway to Google with zero data retention; an optional message check on the same gateway and optional Cloudflare fact extraction are off by default); an owner-sent /dossier posts that contact's stored dossier (without the owner note, but written with it) into the Business chat for the contact to read; runs local ffprobe/ffmpeg (argument lists, no shell) on attached audio; opt-in dossiers run a gateway background thread; modes, opt-in history, and dossiers are stored 0600 under HERMES_HOME/data/telesec; reads only the numeric bot id prefix of TELEGRAM_BOT_TOKEN; no telemetry."
description_tr: "Telegram Business sekreteri: sesli notları, yuvarlak videoları ve konuşma eklerini doğrudan sohbet içinde yazıya döker; Telegram'ın Botu Yönet panelinde Ayarlar ve sohbet başına kontroller sunar, ayrıca isteğe bağlı metin geçmişi (Telegram dışa aktarımından içe aktarma ile), yazışma istatistikleri ve kişi dosyaları sağlar. Bilgilendirme — sesler, Hermes'in yapılandırıldığı STT arka ucuna (yerel veya harici) gider; transkript temizleme, sohbet metnini ana bilgisayar ctx.llm üzerinden gönderir; isteğe bağlı dosyalar, sohbet metnini Hermes model görevi telesec_dossier üzerinden gönderir (varsayılan olarak veri tutma olmadan Google'a Vercel AI Gateway üzerinden; aynı ağ geçidindeki isteğe bağlı mesaj kontrolü ve isteğe bağlı Cloudflare gerçek çıkarımı varsayılan olarak kapalıdır); sahibi tarafından gönderilen /dossier, o kişinin saklanan dosyasını (sahip notu olmadan, ancak onunla yazılarak) kişinin okuması için Business sohbetine gönderir; ekli sesler üzerinde yerel ffprobe/ffmpeg çalıştırır (argüman listeleri, kabuk yok); isteğe bağlı dosyalar bir ağ geçidi arka plan iş parçacığı çalıştırır; modlar, isteğe bağlı geçmiş ve dosyalar HERMES_HOME/data/telesec altında 0600 modunda saklanır; yalnızca TELEGRAM_BOT_TOKEN'ın sayısal bot kimliği ön ekini okur; telemetri yoktur."
