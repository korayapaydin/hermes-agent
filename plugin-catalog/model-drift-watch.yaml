name: model-drift-watch
repo: https://github.com/TakeshiTGAL/hermes-plugin-model-drift
sha: 0102786ba4812e8581f3f6234a453eb26137fa52
description: "Scheduled check that the model you use in Hermes has not quietly got worse: 34 fixed, exactly graded questions (reasoning, instruction following, Japanese, plus your own) run through Hermes cron, each run tested against the same model's own baseline with an exact per-question test and a same-day confirmation run, and a message only for a confirmed drop, a changed served model or a failed measurement. Not yet tried against a real LLM API (checked with a local mock model and real Hermes cron). Disclosure — each check calls your own model through ctx.llm on your bill, capped per check by the plugin (default 120,000 tokens / $0.50, no daily cap; the agent can start checks itself via the model_drift tool, and the scheduled agent turn is extra); price lookup goes through Hermes's pricing code (may fetch OpenRouter/models.dev prices); 10 optional code questions, off by default, run model-written Python in a limited child process (not a hostile-code sandbox) including in unattended cron runs when enabled; `schedule` creates one Hermes cron job that survives plugin removal (run `unschedule` first); writes run history to plugin-data/model-drift-watch; no telemetry."
description_tr: "Hermes'te kullandığınız modelin sessizce kötüleşmediğini denetleyen zamanlanmış kontrol: akıl yürütme, talimat izleme, Japonca ve kendi sorularınız dâhil 34 sabit, tam derecelendirmeli soru, Hermes cron üzerinden çalıştırılır; her koşu aynı modelin kendi temel çizgisine karşı, soru başına tam bir sınav ve aynı gün içinde bir doğrulama koşusuyla denetlenir ve yalnızca doğrulanmış bir düşüş, değişen bir sunulan model ya da başarısız bir ölçüm için mesaj gönderilir. Henüz gerçek bir LLM API'sine karşı denenmedi (yerel bir sahte model ve gerçek Hermes cron ile denetlendi). Açıklama — her kontrol, sizin faturanıza yazılmak üzere ctx.llm üzerinden kendi modelinizi çağırır ve eklenti tarafından kontrol başına sınırlandırılır (varsayılan 120.000 token / $0.50, günlük sınır yok; ajan kontrolleri model_drift aracıyla kendisi başlatabilir ve zamanlanmış ajan turu buna ek olarak gelir); fiyat sorgusu Hermes'in fiyatlandırma kodu üzerinden yapılır (OpenRouter/models.dev fiyatlarını çekebilir); varsayılan olarak kapalı olan 10 isteğe bağlı kod sorusu, etkinleştirildiğinde gözetimsiz cron koşularında da olmak üzere, model tarafından yazılmış Python'u sınırlı bir alt süreçte çalıştırır (düşmanca koda karşı bir koruma alanı değildir); `schedule` eklentinin kaldırılmasından sonra da varlığını sürdüren tek bir Hermes cron işi oluşturur (önce `unschedule` çalıştırın); koşu geçmişini plugin-data/model-drift-watch konumuna yazar; telemetri yok."
maintainer: TakeshiTGAL
