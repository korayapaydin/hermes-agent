name: advisor
repo: https://github.com/ljubomirj/hermes-advisor-plugin
sha: "37e55975611d38212cf082029ece504f207df656"
version: "1.2.0"
title: Advisor
description: "A persistent second model reviews every agent turn. After each turn the plugin hands the transcript to the model you nominate as advisor and delivers its findings as advice in the same session: [NIT], [CONCERN] or [BLOCKER] notes, held back until a later review raises the same point again, so the primary agent is not interrupted by a one-off remark. It reviews, it does not act: the advisor never edits files, calls tools or changes session state, and only reads the turn transcript. This is the backend counterpart of MoA — one extra model, not a committee: the primary agent does the work and the advisor checks it. Port of pi-omplike-advisor (Petr Baudis / pasky), itself rooted in oh-my-pi (Can Boluk). Runs inside the plugin host with no dependencies beyond Hermes itself. Disclosure — once the plugin is enabled, every completed turn costs one extra completion through Hermes's ctx.llm to the advisor model (the primary agent's provider unless you allow a provider/model override under plugins.entries.advisor.llm), carrying the user message, the final reply, every tool call and tool result in the session so far (each clipped to 500 characters) and the contents of a WATCHDOG.md in Hermes's working directory if one exists; deliverable advice is queued into the CLI session as a user-role message, which starts or interrupts an agent turn; state is kept under $HERMES_HOME/advisor/ and reviews run on one background thread; no other network, files or credentials."
description_tr: "Kalıcı bir ikinci model her ajan turunu inceler. Her turdan sonra eklenti, danışman olarak belirlediğiniz modele dökümü verir ve bulgularını aynı oturumda tavsiye olarak iletir: [NIT], [CONCERN] veya [BLOCKER] notları; sonraki bir inceleme aynı noktayı yeniden gündeme getirene kadar geri tutulur, böylece birincil ajan tek seferlik bir notla kesintiye uğramaz. İnceler, eyleme geçmez: danışman asla dosya düzenlemez, araç çağırmaz veya oturum durumunu değiştirmez, yalnızca tur dökümünü okur. Bu, MoA'nın arka uç muadilidir — komite değil, bir ek model: işi birincil ajan yapar, danışman onu denetler. pi-omplike-advisor'ın (Petr Baudis / pasky) aktarımıdır; o da oh-my-pi'ye (Can Boluk) dayanır. Eklenti barındırıcısının içinde, Hermes'in kendisinden başka hiçbir bağımlılık olmadan çalışır. Açıklama — eklenti etkinleştirildiğinde, tamamlanan her tur, Hermes'in ctx.llm'i aracılığıyla danışman modeline fazladan bir tamamlama yaptırır (plugins.entries.advisor.llm altında bir sağlayıcı/model geçersiz kılmasına izin vermediğiniz sürece birincil ajanın sağlayıcısı); bu, kullanıcı mesajını, son yanıtı, o ana kadarki oturumdaki her araç çağrısını ve araç sonucunu (her biri 500 karaktere kırpılır) ve varsa Hermes'in çalışma dizinindeki bir WATCHDOG.md dosyasının içeriğini taşır; iletilebilir tavsiye, CLI oturumuna kullanıcı rolünde bir mesaj olarak kuyruğa alınır ve bu, bir ajan turu başlatır veya kesintiye uğratır; durum $HERMES_HOME/advisor/ altında tutulur ve incelemeler tek bir arka plan iş parçacığında çalışır; başka ağ, dosya veya kimlik bilgisi yoktur."
maintainer: ljubomirj
