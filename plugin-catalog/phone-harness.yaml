sha: 7e3ea6cff1377db4d4f37e852c59493120aa52b6
subdir: integrations/hermes
title: Phone Harness
description: "Drive a real phone from Hermes with one phone_exec tool: an iPhone via iPhone Mirroring on a Mac, an Android over adb, or a cloud phone from Phone Harness Cloud. Disclosure — runs model-written Python on this computer with your user's permissions through the phone-harness package (installed from PyPI); every phone_exec call goes to Hermes's approval prompt unless you opt in to classifier auto-run, a heuristic, bypassable check that decides which scripts ask first; taps and types into your real phone and its apps and accounts; screenshots go to the system temp folder and are attached to the tool result for vision models; a cloud phone streams its screen to Phone Harness Cloud, bills by the minute, and uses phone-harness's own cloud sign-in (~/.config/phone-harness/auth.json); phone-harness's PostHog telemetry (script text, script output, helper arguments) is off under Hermes unless you opt in."
description_tr: "Tek bir phone_exec aracıyla Hermes'ten gerçek bir telefonu sürün: Mac'te iPhone Mirroring ile bir iPhone, adb üzerinden bir Android ya da Phone Harness Cloud'dan bir bulut telefonu. Açıklama — model tarafından yazılmış Python'u bu bilgisayarda, kullanıcınızın izinleriyle phone-harness paketi (PyPI'dan kurulur) aracılığıyla çalıştırır; sınıflandırıcı otomatik çalıştırmaya isteğe bağlı olarak katılmadığınız sürece her phone_exec çağrısı Hermes'in onay istemine gider; bu, hangi betiklerin önce soracağına karar veren sezgisel ve atlatılabilir bir denetimdir; gerçek telefonunuza, uygulamalarına ve hesaplarına dokunur ve metin yazar; ekran görüntüleri sistem geçici klasörüne gider ve görme modelleri için araç sonucuna eklenir; bir bulut telefon, ekranını Phone Harness Cloud'a akıtır, dakika başına faturalandırır ve phone-harness'in kendi bulut oturum açmasını (~/.config/phone-harness/auth.json) kullanır; phone-harness'in PostHog telemetrisi (betik metni, betik çıktısı, yardımcı bağımsız değişkenleri) Hermes altında siz isteğe bağlı olarak katılmadıkça kapalıdır."
maintainer: ShawnPana
