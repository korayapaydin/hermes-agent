name: cortexlayer
repo: https://github.com/Cortex-Layer/cortexlayer-hermes-plugin
sha: 099e4b3e77f73086bbf94fb32e052c864295e2ee
subdir: plugins/memory/cortexlayer
description: >
  CortexLayer memory provider — page-linked long-term memory with link-expansion retrieval,
  wired into Hermes' automatic per-turn recall (prefetch) and persistence (sync_turn), plus a
  pre-compress checkpoint so evidence Hermes' own context compaction would otherwise drop is
  saved first. Platform mode only: each turn's query and conversational content is sent to the
  hosted api.cortexlayer.net (HTTPS, API-key authenticated) for storage/retrieval — no
  local/offline mode. Requires a free CortexLayer account and API key.
description_tr: "CortexLayer bellek sağlayıcısı — bağlantı genişletmeli geri çağırma ile sayfaya bağlı uzun süreli bellek; Hermes'in otomatik tur başına geri çağırmasına (prefetch) ve kalıcılığına (sync_turn) bağlanır, ayrıca sıkıştırma öncesi bir kontrol noktası sunar — böylece Hermes'in kendi bağlam sıkıştırmasının yok sayacağı kanıtlar önce kaydedilir. Yalnızca platform kipi: her turun sorgusu ve sohbet içeriği, barındırılan api.cortexlayer.net adresine (HTTPS, API anahtarıyla kimlik doğrulanır) saklama/erişim için gönderilir — yerel/çevrimdışı kip yoktur. Ücretsiz bir CortexLayer hesabı ve API anahtarı gerekir."
maintainer: Cortex-Layer
tier: community
category: memory
docs_url: https://docs.cortexlayer.net/docs/agents/hermes
version: "0.1.1"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_end
    - on_pre_compress
  provides_middleware: []
  requires_env:
    - CORTEX_API_KEY
