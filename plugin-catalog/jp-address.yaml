name: jp-address
repo: https://github.com/TakeshiTGAL/hermes-plugin-address
sha: 318384409054e0d43329ed4cf002ea61014f3d6c
description: 'Splits one Japanese address into prefecture, city, town and the remainder with address_split, built on Geolonia''s address data (CC BY 4.0, from the Digital Agency address base registry). Give it a Japanese postal address as written, such as 東京都千代田区霞が関2-1-2, and it returns the prefecture, city and town as separate fields. Disclosure — Each call sends at most two HTTPS GET requests, with no API key, to japanese-addresses-v2.geoloniamaps.com or the JP_ADDRESS_BASE_URL you set (plain http only for 127.0.0.1 and localhost). The matched prefecture and municipality names go into the URL path; the house number, the lot and the building name are not sent. JP_ADDRESS_BASE_URL is read for the active profile on each call, and an HTTP proxy set in the environment is not used. The tool is on for every surface, including gateways, and asks for no approval: anyone you allow on your Hermes gateway can call it. Turn a surface off with hermes tools. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off. It writes no files and creates no cron job. A point can be coarser than the town and is not a rooftop geocode, and an address it cannot place for certain comes back as ambiguous or at the municipality instead of a guess. The publisher may change or stop the free host and suggests self-hosting for commercial use. Called from Hermes with five models in a small sample of 18 sessions (see CHANGELOG.md).'
description_tr: "Tek bir Japonca adresi il, şehir, kasaba ve kalan kısım olarak böler; address_split aracıyla, Geolonia'nın adres verisi üzerine kurulmuştur (CC BY 4.0, Digital Agency adres temel kaydından). Japonca bir posta adresini yazıldığı gibi verin, örneğin 東京都千代田区霞が関2-1-2, ve il, şehir ile kasaba ayrı alanlar olarak döner. Açıklama — Her çağrı, API anahtarı olmadan japanese-addresses-v2.geoloniamaps.com adresine veya ayarladığınız JP_ADDRESS_BASE_URL adresine en fazla iki HTTPS GET isteği gönderir (düz http yalnızca 127.0.0.1 ve localhost için). Eşleşen il ve belediye adları URL yoluna girer; kapı numarası, parsel ve bina adı gönderilmez. JP_ADDRESS_BASE_URL her çağrıda etkin profil için okunur ve ortamda ayarlanmış bir HTTP proxy kullanılmaz. Araç, ağ geçitleri dahil her yüzeyde açıktır ve onay istemez: Hermes ağ geçidinizde izin verdiğiniz herkes onu çağırabilir. Bir yüzeyi hermes tools ile kapatın. Eklenti etkinken, eklentinin yeteneği araçların kapalı olduğu yüzeyler dahil her oturumun yetenek dizinine bir satır ekler. Hiçbir dosya yazmaz ve cron işi oluşturmaz. Bir nokta kasabadan daha kaba olabilir ve bir çatı coğrafi kodlaması değildir; kesin olarak yerleştiremediği bir adres, tahmin yerine belirsiz olarak ya da belediye düzeyinde döner. Yayıncı ücretsiz ana makineyi değiştirebilir veya durdurabilir ve ticari kullanım için kendi kendine barındırmayı önerir. Hermes'ten beş modelle, 18 oturumluk küçük bir örnekte çağrıldı (bkz. CHANGELOG.md)."
