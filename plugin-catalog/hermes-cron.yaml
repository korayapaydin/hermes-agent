sha: 2426b4b26a95e98112ac73415dedc8e0dd25c602
description: "Operating skill for Hermes cron: lifecycle rules (pause vs disable vs remove, `in 30m` vs `30m`), four ways to avoid needless LLM runs (no_agent, wakeAgent pre-check, monitor, [SILENT]), verify-after-change, a layered runbook and a read-only doctor that complements `hermes cron doctor` and reports one error across several jobs as one scheduler fault and a cron store that cannot be written. Portable Agent Plugins v1 package (plugin.json + skills/); no tools, hooks, middleware or env vars. Disclosure — skill only, no network; the bundled doctor reads ~/.hermes/cron/jobs.json, ticker stamps and executions.db (or a named profile's store with --profile) read-only, checks the cron directory's permissions and free space without writing, and runs the local hermes cron doctor (argument list, no shell), whose job loader may repair malformed jobs.json entries (--no-builtin skips it)."
description_tr: "Hermes cron için işletim yeteneği: yaşam döngüsü kuralları (durdurmak, devre dışı bırakmak, kaldırmak; `in 30m` ile `30m` arasındaki fark), gereksiz LLM koşularından kaçınmanın dört yolu (no_agent, wakeAgent ön denetimi, izleyici, [SILENT]), değişiklikten sonra doğrulama, katmanlı bir çalışma kitabı ve `hermes cron doctor` komutunu tamamlayan, bir hatayı birkaç iş üzerinden tek bir zamanlayıcı arızası olarak ve yazılamayan bir cron deposu olarak bildiren salt okunur bir doktor. Taşınabilir Agent Plugins v1 paketi (plugin.json + skills/); araç, kanca, ara katman ya da ortam değişkeni yok. Açıklama — yalnızca yetenek, ağ yok; paketlenmiş doktor ~/.hermes/cron/jobs.json, ticker damgaları ve executions.db dosyalarını (veya --profile ile adlandırılmış bir profilin deposunu) salt okunur okur, cron dizininin izinlerini ve boş alanını yazmadan denetler ve yerel hermes cron doctor komutunu çalıştırır (argüman listesi, kabuk yok); bunun iş yükleyicisi bozuk jobs.json girdilerini onarabilir (--no-builtin bunu atlar)."
