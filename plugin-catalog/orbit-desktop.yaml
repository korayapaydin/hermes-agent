description: >-
  Your workspace, shaped by your agent: a bundled browser desktop powered by Hermes. Describe the
  workflow you need; the agent can rearrange windows and panes, customize appearance, build versioned
  sandboxed web apps, and refine your workspace with scoped control, previews and checkpoints.
  Illustrated examples show a project-specific COCS 3D asset viewer and OmniVoice experiment bench;
  these example apps and their backends are not bundled. Includes permission-controlled desktop
  agent-reply notifications (generic alerts while Orbit remains open; browser/OS restrictions apply)
  and 100,000-character chat messages, guidance and drafts. Includes Devplan Studio for guided
  interviews, specifications, phased devplans and circular-development handoff exports. Optional
  conversational interviews require explicit service setup and a working Hermes provider login, and
  send project context to that provider. Includes 14 distinctive interface presets including Nous
  Atelier, with local wallpapers, themed icons and taskbar treatments. Agent chats include inline
  expandable tool activity, running/completed/failed summaries, an activity strip, a workspace agent
  overview and responsive toolbar controls. Missing tool-call IDs are explicitly uncorrelated.
  Embedded apps retain their own styling. Includes a reviewed GitHub app catalog with immutable source
  pins and a portable Live Telemetry package. Catalog sync (operator-run scripts/orbit_catalog.py,
  never triggered by the Hermes tool or at register) reads the entry list from the upstream repo's
  main branch at sync time and downloads third-party static app bundles at their per-entry commit
  pins; installed UI runs in a sandboxed iframe and never executes backend code. Optional telemetry
  backend staging downloads pinned Python; execution requires explicit host-code trust and separate
  private authenticated HTTPS setup. Backend code runs with owner privileges, not a sandbox.
  Disclosure — adapter talks only to the configured local Orbit server (loopback, Bearer capability
  from runtime_dir); mutations off by default. Optional orbit.py setup runs npm ci / node. Bundled
  VNC/Xpra launchers use the Orbit page's hostname and scheme; optional Linux apps require separate
  provisioning. Optional api.typesafe.ai requests require explicit consent and a user-supplied key.
  The 0.2.7 web app's opt-in Show tools panel displays tool call arguments and results for the current
  Hermes conversation, fetched from the local Orbit server and local Hermes session API and kept in
  the browser only. The Nous Atelier theme contains Nous Research logo artwork and is unofficial;
  Orbit is not affiliated with Nous Research.
description_tr: "Çalışma alanınız, ajanınızın biçimlendirdiği gibi: Hermes tarafından desteklenen paketlenmiş bir tarayıcı masaüstü. İhtiyacınız olan iş akışını tanımlayın; ajan pencereleri ve panelleri yeniden düzenleyebilir, görünümü özelleştirebilir, sürümlü sandbox'lanmış web uygulamaları kurabilir ve kapsamı sınırlı denetim, önizlemeler ve kontrol noktalarıyla çalışma alanınızı iyileştirebilir. Örnek görseller, projeye özgü bir COCS 3D varlık görüntüleyicisini ve bir OmniVoice deney tezgâhını gösterir; bu örnek uygulamalar ve arka uçları paketlenmemiştir. İzin denetimli masaüstü ajan-yanıt bildirimlerini (Orbit açık kaldığı sürece genel uyarılar; tarayıcı/işletim sistemi kısıtlamaları geçerlidir) ve 100.000 karakterlik sohbet mesajları, rehberlik ve taslaklar içerir. Rehberli görüşmeler, belirtimler, aşamalı geliştirme planları ve döngüsel geliştirme devir teslimi dışa aktarımları için Devplan Studio içerir. İsteğe bağlı sohbet görüşmeleri açık bir servis kurulumu ve çalışan bir Hermes sağlayıcı girişi gerektirir ve proje bağlamını o sağlayıcıya gönderir. Nous Atelier dâhil 14 ayırt edici arayüz hazır ayarı, yerel duvar kâğıtları, temalı simgeler ve görev çubuğu işlemleri içerir. Ajan sohbetleri, satır içi genişletilebilir araç etkinliği, çalışan/tamamlanan/başarısız özetleri, bir etkinlik şeridi, çalışma alanı ajanına genel bakış ve duyarlı araç çubuğu denetimleri içerir. Eksik araç çağrısı kimlikleri açıkça ilişkisiz bırakılır. Gömülü uygulamalar kendi stillerini korur. Değişmez kaynak sabitlemeleriyle incelenmiş bir GitHub uygulama kataloğu ve taşınabilir bir Canlı Telemetri paketi içerir. Katalog eşitlemesi (operatörün çalıştırdığı scripts/orbit_catalog.py, ne Hermes aracı ne de register aşamasında tetiklenmez) giriş listesini eşitleme anında upstream deposunun main dalından okur ve üçüncü taraf statik uygulama paketlerini giriş başına sabitlenmiş commit'lerinden indirir; kurulu arayüz sandbox'lanmış bir iframe içinde çalışır ve asla arka uç kodu çalıştırmaz. İsteğe bağlı telemetri arka ucu hazırlığı sabitlenmiş Python'u indirir; çalıştırma açık bir konak kodu güveni ve ayrı bir özel, kimlik doğrulamalı HTTPS kurulumu gerektirir. Arka uç kodu sahip ayrıcalıklarıyla çalışır, sandbox'ta değil. Açıklama — Bağdaştırıcı yalnızca yapılandırılmış yerel Orbit sunucusuyla konuşur (loopback, runtime_dir'den Bearer yeteneği); mutasyonlar varsayılan olarak kapalıdır. İsteğe bağlı orbit.py kurulumu npm ci / node çalıştırır. Paketlenmiş VNC/Xpra başlatıcıları Orbit sayfasının ana bilgisayar adını ve şemasını kullanır; isteğe bağlı Linux uygulamaları ayrı sağlama gerektirir. İsteğe bağlı api.typesafe.ai istekleri açık rıza ve kullanıcı tarafından sağlanan bir anahtar gerektirir. 0.2.7 web uygulamasının isteğe bağlı Araçları göster paneli, geçerli Hermes sohbeti için araç çağrısı bağımsız değişkenlerini ve sonuçlarını görüntüler; bunları yerel Orbit sunucusundan ve yerel Hermes oturum API'sinden getirir ve yalnızca tarayıcıda tutar. Nous Atelier teması Nous Research logo görselleri içerir ve resmî değildir; Orbit, Nous Research ile bağlantılı değildir."
