name: holographic
title: Holographic
repo: https://github.com/itpartypattaya/hermes-plugin-holographic
sha: 7488ac32b78f983cff8484209686d59c9b330b76
version: "0.18.3"
description: "Local fact-store memory provider: SQLite with FTS5 keyword search (word forms in English, Russian, Spanish, French, Portuguese, Indonesian, German, Hindi, Arabic, Bengali, Italian, Turkish, Polish and Dutch; Russian and English words of the same root at a lower weight, from bundled DerivBase.Ru (Apache-2.0) and Open English Wordnet (CC BY 4.0) pairs; German compounds and German and Spanish irregular verb forms from bundled Wikidata Lexemes tables (CC0); Chinese, Japanese, Korean and Thai by character n-grams, Chinese also split into words with jieba's dictionary (MIT), Traditional and Simplified Chinese compared as one through a bundled OpenCC table (Apache-2.0), Japanese spelling variants through SudachiDict's (Apache-2.0); synonyms through keywords the agent gives when it stores a fact), trust scores, entities with aliases and HRR (holographic reduced representation) recall, with no API key, network or model calls unless an optional online feature is switched on: search by meaning (embeddings: on) or rescoring by a cross-encoder (rerank: on), both off by default. The provider that shipped in-tree as plugins/memory/holographic, with the same provider name, config (plugins.hermes-memory-store) and memory_store.db, so `hermes update` moves existing users onto it; the schema change is additive and older versions keep working on the file. Taken over from Nous Research's handoff copy (NousResearch/hermes-plugin-holographic) and maintained by itpartypattaya; since 0.1.1 it fixes probe/reason/related/contradict, non-atomic writes and the never-written retrieval_count, gates recall by relevance without repeats, flags duplicates and conflicts when a fact is added, and honours the provider contract (read-only subagent contexts, hermes_home, mirror metadata, backup_paths); since 0.8.0 it keeps the history of every fact (change / end / correct / revert, search and list as_of a date) and `forget` erases a fact with all its versions from the file; since 0.16.0 a name guessed from a fact's text must be shaped like one and stays provisional until a second fact or a person confirms it, and entities can be renamed or deleted (the facts stay). Since 0.18.0 an optional, experimental second stage reorders the recall candidates with a cross-encoder at a /v1/rerank endpoint that answers in Cohere's shape without a key, such as llama-server (rerank: on, off by default). It does not raise hits: on the maintainer's held-out set (126 questions) it cut non-target facts in the top five by about 40 % and lines per turn by about a third, and lost about one target per hundred questions. Disclosure — local only unless an optional online feature (search by meaning or rescoring) is switched on: reads and writes one SQLite file per profile ($HERMES_HOME/memory_store.db unless db_path says otherwise), or with scope: user / chat / thread one file per user or chat in holographic-users/ or holographic-chats/ next to it; each fact version records where it was written (platform, chat type, chat and thread id, session id, the turn author's id and display name, and whether the person said it or the agent inferred it; never chat titles), shown in full by list, history and export and not in recall unless recall_source: short (date, display name, this or another chat); each confirmation of a fact by a person keeps its time, session id and that person's id (no text); forget deletes that and the confirmations with the fact and keeps only an HMAC of the text, keyed by a random key stored in the same file, as a tombstone; delete_entity removes a name, its aliases and links from the entity index (never a fact) and keeps an HMAC of each name the same way (not of an alias only a fact's text gave, which goes without one), and both rewrite the file so freed pages keep no copy; the first writable open after an upgrade that changes the extraction rules relinks the facts to their entities under the new rules (stores up to 2,000 facts and 500,000 characters; larger ones on fact_store rebuild_entities), changing only the names it guessed and their links, never a fact, a declared name or an alias someone gave; subagents never write, but a cron job's explicit fact_store / fact_feedback calls do unless cron_writes: false (on by default); no subprocesses or telemetry (at the debug log level the recall stages log fact ids and scores, never text), and no network calls or credentials unless embeddings: on or rerank: on (both off by default). With embeddings: on, the text of facts, and of messages and fact_store search queries that are not greetings, goes to the OpenAI-compatible embeddings endpoint the user configures, also after cron turns while cron_writes is on (embedding_url; https, plain http only to localhost, a private or link-local address, or a local host name such as one without a dot or ending in .local), with the key read from the environment variable the user names (embedding_key_env, OPENAI_API_KEY unless set, sent as a Bearer token to whatever embedding_url is configured, never stored in config) and no redirects followed; facts that recall would not inject, and facts and messages that look like they hold a secret (checked by pattern, best effort), are not sent; the vectors are kept in the same file (table fact_embeddings), deleted with their fact by forget / end / remove and all of them by the next writable session after the option is switched off; the provider keeps what it received under its own terms; with rerank: on, before a turn the user's message and up to rerank_top_k (40) candidate fact texts, and for a fact_store search its query and results, go to the rerank endpoint the user configures (rerank_url; https, plain http only to localhost, a private or link-local address, or a local host name), with no credentials and no redirects followed; facts that recall would not inject or that look like they hold a secret, and queries that hold one, are not sent; a failure or a slow answer gives the recall of rerank: off and pauses the endpoint (60 s, doubling to 900 s); nothing the endpoint returns is stored; the bundled language dictionaries are gzip-compressed plain-text word lists; with auto_extract on (off by default) user sentences that state a preference or decision are stored."
description_tr: "Yerel olgu deposu bellek sağlayıcısı: FTS5 anahtar kelime aramasıyla SQLite (İngilizce, Rusça, İspanyolca, Fransızca, Portekizce, Endonezce, Almanca, Hintçe, Arapça, Bengalce, İtalyanca, Türkçe, Lehçe ve Felemenkçe biçimler; aynı kökten Rusça ve İngilizce kelimeler daha düşük ağırlıkla, paketlenmiş DerivBase.Ru (Apache-2.0) ve Open English Wordnet (CC BY 4.0) çiftlerinden; Almanca bileşik sözcükler ve Almanca ile İspanyolca düzensiz fiil biçimleri paketlenmiş Wikidata Lexemes tablolarından (CC0); Çince, Japonca, Korece ve Tayca için karakter n-gramları, Çince için ayrıca jieba sözlüğüyle kelimelere bölme (MIT), Geleneksel ve Basitleştirilmiş Çince paketlenmiş OpenCC tablosuyla (Apache-2.0) tek olarak karşılaştırılır, Japonca yazım varyantları SudachiDict ile (Apache-2.0); eş anlamlılar, ajan bir olguyu saklarken verdiği anahtar kelimelerle), güven puanları, takma adlı varlıklar ve HRR (holografik indirgenmiş gösterim) geri çağırması; API anahtarı, ağ ya da model çağrısı yok; istisna, isteğe bağlı anlama dayalı aramanın (gömmeler: açık, varsayılan olarak kapalı) açılmasıdır. Ağaç içinde plugins/memory/holographic olarak gelen, aynı sağlayıcı adı, yapılandırması (plugins.hermes-memory-store) ve memory_store.db dosyasıyla sunulan sağlayıcıdır, böylece `hermes update` mevcut kullanıcıları ona taşır; şema değişikliği eklemeli bir değişikliktir ve eski sürümler dosya üzerinde çalışmaya devam eder. Nous Research'in devir kopyasından (NousResearch/hermes-plugin-holographic) alınmış ve itpartypattaya tarafından sürdürülmüştür; 0.1.1'den bu yana probe/reason/related/contradict, atomik olmayan yazmalar ve hiç yazılmayan retrieval_count sorunlarını giderir, geri çağırmayı ilgiye göre tekrarsız kılar, bir olgu eklenirken kopyaları ve çelişkileri işaretler ve sağlayıcı sözleşmesine uyar (salt okunur alt ajan bağlamları, hermes_home, ayna üst verisi, backup_paths); 0.8.0'dan bu yana her olgunun geçmişini tutar (change / end / correct / revert, arama ve listeleme as_of ile) ve `forget` bir olguyu tüm sürümleriyle dosyadan siler. 0.16.0'dan bu yana bir olgunun metninden tahmin edilen ad, bir ad gibi biçimlendirilmiş olmalı ve ikinci bir olgu ya da bir kişi onu onaylayana kadar geçici kalmalıdır; varlıklar yeniden adlandırılabilir ya da silinebilir (olgular kalır). Açıklama — isteğe bağlı anlama dayalı arama açılmadıkça yalnızca yereldir: profil başına bir SQLite dosyasını okur ve yazar (db_path aksini söylemedikçe $HERMES_HOME/memory_store.db) ya da scope: user / chat / thread ile, onun yanındaki holographic-users/ veya holographic-chats/ içinde kullanıcı ya da sohbet başına bir dosya; her olgu sürümü nereye yazıldığını kaydeder (platform, sohbet türü, sohbet ve ileti dizisi kimliği, oturum kimliği, turu yazan kişinin kimliği ve görünen adı ve bunu kişinin mi söylediği yoksa ajanın mı çıkarsadığı; asla sohbet başlıkları), list, history ve export ile tam olarak gösterilir ve recall_source: short (tarih, görünen ad, bu ya da başka bir sohbet) olmadıkça geri çağırmada gösterilmez; bir olgunun bir kişi tarafından her onaylanması zamanını, oturum kimliğini ve o kişinin kimliğini saklar (metin yok); forget, bunu ve onayları olguyla birlikte siler ve yalnızca aynı dosyada saklanan rastgele bir anahtarla anahtarlanmış metnin bir HMAC'ini mezar taşı olarak tutar; delete_entity, bir adı, takma adlarını ve bağlantılarını varlık dizininden kaldırır (asla bir olguyu) ve her adın bir HMAC'ini aynı şekilde tutar (yalnızca bir olgunun metninden gelen bir takma adınkini değil; o, HMAC olmadan gider) ve her ikisi de dosyayı yeniden yazar, böylece serbest kalan sayfalar kopya tutmaz; çıkarım kurallarını değiştiren bir yükseltmeden sonraki ilk yazılabilir açılış, olguları yeni kurallar altında varlıklarına yeniden bağlar (en fazla 2.000 olgu ve 500.000 karakter saklar; daha büyük olanlar fact_store rebuild_entities ile), yalnızca tahmin ettiği adları ve bağlantılarını değiştirir, asla bir olguyu, bildirilmiş bir adı ya da birinin verdiği bir takma adı değiştirmez; alt ajanlar asla yazmaz, ancak bir cron işinin açık fact_store / fact_feedback çağrıları cron_writes: false olmadıkça yazar (varsayılan olarak açık); alt süreç yok, telemetri yok ve embeddings: on (varsayılan olarak kapalı) olmadıkça ağ çağrısı ya da kimlik bilgisi yok: o zaman olguların ve selamlamalar dışındaki mesajlar ile fact_store arama sorgularının metni, kullanıcının yapılandırdığı OpenAI uyumlu gömme uç noktasına gider, cron_writes açıkken cron turlarından sonra da gider (embedding_url; https, düz http yalnızca localhost, özel ya da bağlantı yerel bir adrese veya nokta içermeyen ya da .local ile biten bir yerel ana makine adına), anahtar kullanıcının adını verdiği ortam değişkeninden okunur (embedding_key_env, ayarlanmadıkça OPENAI_API_KEY, yapılandırılmış embedding_url ne olursa olsun Bearer token olarak gönderilir, config içinde asla saklanmaz) ve yönlendirmeler izlenmez; geri çağırmanın enjekte etmeyeceği olgular ve sır içerdiği görünen olgular ile mesajlar (desenle denetlenir, en iyi çaba) gönderilmez; vektörler aynı dosyada tutulur (fact_embeddings tablosu), forget / end / remove ile ilgili olgularıyla birlikte ve seçenek kapatıldıktan sonraki ilk yazılabilir oturumda tümü silinir; sağlayıcı aldığı verileri kendi koşulları altında tutar; paketlenmiş dil sözlükleri gzip ile sıkıştırılmış düz metin kelime listeleridir; auto_extract açıkken (varsayılan olarak kapalı) tercih veya karar belirten kullanıcı cümleleri saklanır."
maintainer: itpartypattaya
tier: community
category: memory
requires_hermes: ">=0.21.5"
docs_url: https://github.com/itpartypattaya/hermes-plugin-holographic/blob/7488ac32b78f983cff8484209686d59c9b330b76/README.md
known_issues:
- "Word forms are matched by stems, not a dictionary: an irregular form can miss (ponies / pony). A synonym is found only if the fact's keywords name it, unless the optional online search by meaning is on; facts stored without keywords (older ones, auto_extract) need `enrich`."
- "Arabic, Indic scripts, Indonesian, German, Turkish, Polish and Dutch are matched by scanning the facts' text: the first such search after start analyses every fact (about 1-1.5 s at 5,000 facts, 4-6 s at 20,000); stores without such facts never scan. The bundled dictionaries load on the first word of their language (Chinese about 0.2 s and 30 MB)."
- "forget cleans the database file only: Hermes session history, `hermes backup` archives and copies other tools made are not rewritten (tools can read the `forgotten` table and clean their own copies by fact id)."
- "rerank: on is experimental and does not raise hits. On the maintainer's held-out set it lost one target in 126 questions with embeddings off and two with them on, on questions where several facts of one kind compete, against about 40 % fewer non-target facts. Each turn waits for one rerank call: on 4 CPU threads about 120 ms median with jina-reranker-v2-base-multilingual and 340 ms with bge-reranker-v2-m3, capped by rerank_timeout (3 s, lower with embeddings on so that both fit the core's 8 s prefetch budget). The suggested CPU model, jina-reranker-v2-base-multilingual, is CC-BY-NC-4.0 (non-commercial use only); bge-reranker-v2-m3 is Apache-2.0. The plugin ships no model. It sends no key, so a cloud rerank API that requires one (Cohere, Jina) refuses every call; it is tested with llama-server."
