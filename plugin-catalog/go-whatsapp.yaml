name: go-whatsapp
repo: https://github.com/anpicasso/hermes-go-whatsapp
sha: a48546353fe79456bc193402905b17b3e1cd1be6
version: "0.4.1"
requires_hermes: ">=0.21.5"
title: Go WhatsApp
description: >-
  Outbound WhatsApp tools through GOWA: registers GOWA's native MCP server and
  adds device listing, pairing, and removal. Setup can connect an existing
  server or explicitly install pinned GOWA v9.5.0 as a loopback-only
  authenticated native user service on Linux x86_64, macOS x86_64/arm64, or
  Windows x86_64. Disclosure — agents can send messages and mutate WhatsApp
  state through the linked account; session databases grant account access.
  The plugin does not ingest incoming messages or configure webhooks.
description_tr: "GOWA üzerinden giden WhatsApp araçları: GOWA'nın yerel MCP sunucusunu kaydeder ve cihaz listeleme, eşleştirme ve kaldırma ekler. Kurulum, var olan bir sunucuya bağlanabilir ya da sabitlenmiş GOWA v9.5.0 sürümünü yalnızca döngü üzerinde çalışan, kimlik doğrulamalı yerel kullanıcı servisi olarak açıkça kurabilir (Linux x86_64, macOS x86_64/arm64 ya da Windows x86_64). Açıklama — ajanlar bağlı hesap üzerinden mesaj gönderebilir ve WhatsApp durumunu değiştirebilir; oturum veritabanları hesap erişimi verir. Eklenti gelen mesajları almaz ya da webhook yapılandırmaz."
maintainer: anpicasso
tier: community
category: tools
docs_url: https://github.com/anpicasso/hermes-go-whatsapp/blob/a48546353fe79456bc193402905b17b3e1cd1be6/README.md
platforms:
  - linux
  - macos
  - windows
capabilities:
  provides_tools:
    - gowa_devices
    - gowa_device_login
    - gowa_device_remove
  provides_hooks: []
  provides_middleware: []
  requires_env: []
