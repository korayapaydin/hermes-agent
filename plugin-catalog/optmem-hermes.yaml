name: optmem-hermes
repo: https://github.com/rarf/optmem-hermes-plugin
sha: 2868af6620bf07958f833ca354fbeecf2a56b265
subdir: optmem
description: "Independent Hermes integration of Victor Taelin's OptMem design: local, append-only memory with regex/BM25 recall and a bounded wake digest. Hybrid and guarded OptMem-only modes; verified migration and rollback. Local by default. Compaction is manual unless auto_nap is enabled. Optional LLM summaries run only when both auto_nap and llm_summary are on; they send memory blocks to the configured provider via host-owned authentication and may incur token costs. Summaries are lossy, raw records remain recoverable, and conflicts are not resolved automatically. Wake consumes model context. See README for upstream attribution. Disclosure — memory is stored locally under HERMES_HOME; optional auto_nap+llm_summary sends stored memory lines to the user's configured model provider; the optmem-only mode (explicit CLI with --yes) disables Hermes' built-in MEMORY.md/USER.md injection after a verified backup."
description_tr: "Victor Taelin'in OptMem tasarımının Hermes'e bağımsız entegrasyonu: yerel, yalnızca ekleme yapılabilen bellek; regex/BM25 geri çağırma ve sınırlı uyandırma özeti. Karma ve korumalı OptMem-only kipleri; doğrulanmış taşıma ve geri alma. Varsayılan olarak yerel. Sıkıştırma, auto_nap etkinleştirilmedikçe elle yapılır. İsteğe bağlı LLM özetleri yalnızca hem auto_nap hem llm_summary açıkken çalışır; bellek bloklarını konak tarafından sahiplenen kimlik doğrulamayla yapılandırılmış sağlayıcıya gönderir ve token maliyeti doğurabilir. Özetler kayıplıdır, ham kayıtlar kurtarılabilir kalır ve çakışmalar otomatik çözülmez. Uyanma model bağlamı tüketir. Kaynak proje atfı için README'ye bakın. Açıklama — bellek HERMES_HOME altında yerel olarak saklanır; isteğe bağlı auto_nap+llm_summary, saklanan bellek satırlarını kullanıcının yapılandırdığı model sağlayıcısına gönderir; optmem-only kipi (--yes ile açık CLI) doğrulanmış bir yedeklemeden sonra Hermes'in yerleşik MEMORY.md/USER.md enjeksiyonunu devre dışı bırakır."
maintainer: rarf
tier: community
category: memory
