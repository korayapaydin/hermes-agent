version: "0.5.0"
description: >-
  Meshy AI's own MCP server (pinned @meshy-ai/meshy-mcp-server@0.6.5) for text, image and multi-image
  to 3D, texturing, remeshing, rigging, animation, concept images and 3D-print prep, with a bundled
  meshy-3d workflow skill. In Hermes Desktop: inline 3D cards with a download and convert menu, a
  gallery of recent generations and saved models (with a "Made from" history), image sets, and a credit
  chip in the status bar. Every credit-spending call goes through Hermes's approval prompt with its
  estimated cost, and a 200-credit limit per chat makes it ask again. Needs MESHY_API_KEY and Node.js 18+.
  Disclosure — first start downloads the pinned server from npm through npx; it sends prompts and the
  images or models you or the agent name to Meshy's API (api.meshy.ai) under your key, gets only
  MESHY_API_KEY from your profile, and sends no analytics (its User-Agent names Hermes and its version).
  Downloads go to the plugin's data folder or the folder the agent names (never over an existing file); the Desktop backend fetches only from Meshy's
  asset hosts. The skill's helper scripts (model stats, preview render, optional Blender hand-off) run
  locally through the terminal tool.
description_tr: "Meshy AI'nin kendi MCP sunucusu (sabitlenmiş @meshy-ai/meshy-mcp-server@0.6.5); metinden, görselden ve çoklu görselden 3D'ye, doku kaplama, yeniden örgüleme, iskeletleme, animasyon, konsept görselleri ve 3D baskı hazırlığı için, paketlenmiş meshy-3d iş akışı yeteneğiyle birlikte. Hermes Desktop'ta: indirme ve dönüştürme menüsü olan satır içi 3D kartlar, son üretimlerin ve kayıtlı modellerin galerisi (\"Made from\" geçmişiyle), görsel setleri ve durum çubuğunda kredi göstergesi. Kredi harcayan her çağrı, tahmini maliyetiyle Hermes'in onay isteminden geçer ve sohbet başına 200 kredi sınırı yeniden sormasına yol açar. MESHY_API_KEY ve Node.js 18+ gerektirir. Açıklama — ilk başlatmada sabitlenmiş sunucuyu npm'den npx ile indirir; istemleri ve sizin ya da ajanın adlandırdığı görselleri veya modelleri sizin anahtarınızla Meshy API'sine (api.meshy.ai) gönderir, profilinizden yalnızca MESHY_API_KEY alır ve hiçbir analitik verisi göndermez (User-Agent'ı Hermes'i ve sürümünü belirtir). İndirmeler eklentinin veri klasörüne veya ajanın adlandırdığı klasöre gider (var olan bir dosyanın üzerine asla); Desktop arka ucu yalnızca Meshy'nin varlık sunucularından indirir. Yeteneğin yardımcı betikleri (model istatistikleri, önizleme render'ı, isteğe bağlı Blender devri) terminal aracıyla yerel olarak çalışır."
