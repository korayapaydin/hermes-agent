name: unicode-ref
repo: https://github.com/olric3015/hermes-plugins
sha: d33c8c9379ee8d90ef4276ddc61073b28fa32abe
subdir: unicode-ref
description: "@unicode: context references that spell text out character by character for the model: @unicode:\"text\" attaches a table of every character of the quoted text (code point, Unicode name, category) with notes on what does not show on screen: invisible characters and their positions, text-direction controls, spaces other than the ordinary one, Unicode tag characters (decoded), words that mix Latin letters with lookalike Cyrillic, Greek or fullwidth ones, and private-use or unassigned code points; @unicode:U+200B describes up to 20 code points (name, category, UTF-8 bytes, decomposition); the TUI and Desktop composer suggest characters by name. Disclosure — reads only the text of the reference itself, using Python's unicodedata; no network, no files read or written, no subprocess, no credentials; register() only adds the @unicode: reference provider"
description_tr: "@unicode: model için metni karakter karakter yazıp açıklayan bağlam referansları: @unicode:\"text\" alıntılanan metnin her karakteri için bir tablo ekler (kod noktası, Unicode adı, kategori) ve ekranda görünmeyenlerle ilgili notlar taşır: görünmez karakterler ve konumları, metin yönü denetimleri, olağan boşluk dışındaki boşluklar, Unicode etiket karakterleri (çözülmüş), Latin harfleri benzeri Kiril, Yunan ya da tam genişlik harflerle karışan kelimeler ve özel kullanım ya da atanmamış kod noktaları; @unicode:U+200B en fazla 20 kod noktasını tanımlar (ad, kategori, UTF-8 baytları, ayrışma); TUI ve Desktop yazma alanı karakterleri ada göre önerir. Açıklama — yalnızca referansın kendi metnini Python'un unicodedata modülüyle okur; ağ yok, okunan ya da yazılan dosya yok, alt süreç yok, kimlik bilgisi yok; register() yalnızca @unicode: referans sağlayıcısını ekler."
