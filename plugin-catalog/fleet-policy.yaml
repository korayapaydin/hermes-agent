sha: 7d36874a5a625fc2a0c24ee280e34872e5259800
subdir: fleet_policy
description: "For administrators who pin settings through the managed scope: records what each agent role really sends to the provider (model, reasoning effort, service tier, plus the tier the provider says it served) next to the managed-scope state and the effective config (`hermes fleet-policy status --json`); measures cron cost per job — runs, empty runs, $/day, gate present (`crons --cost`); and `watch`, a generic wake gate for cron scripts that replays one read tool on an MCP server and wakes the agent only when new item ids appear (stock `wakeAgent` gate, no LLM call otherwise). Ships two skills (managed-scope admin, recurring tasks). Disclosure — records only model, reasoning effort and service tier per role (no message content, headers or keys) via the pre_api_request and pre_auxiliary_call hooks and a pass-through llm_execution middleware, stored in $HERMES_HOME/fleet-policy/observed.json; crons --cost opens cron/executions.db and state.db read-only and checks each cron run's final reply locally for silence; watch is an operator CLI command that calls one MCP tool at the config's server_url (or the admin-pinned watch_server_url) with config headers in which ${VAR} env values are expanded, follows redirects, and writes seen ids to a state file at the config-chosen path; the recurring-tasks skill has the agent write watch configs under $HERMES_HOME/watches, a script under $HERMES_HOME/scripts and a cron job; no other network access, no telemetry."
description_tr: "Ayarları yönetilen kapsam üzerinden sabitleyen yöneticiler için: her ajan rolünün sağlayıcıya gerçekte ne gönderdiğini (model, akıl yürütme çabası, hizmet katmanı ve sağlayıcının sunulduğunu söylediği katman) yönetilen kapsam durumu ile etkin yapılandırmanın yanında kaydeder (`hermes fleet-policy status --json`); cron maliyetini iş başına ölçer — koşular, boş koşular, $/gün, kapı varlığı (`crons --cost`); ve `watch`'ı, cron betikleri için genel bir uyandırma kapısı olarak sunar — bir MCP sunucusunda tek bir okuma aracını yeniden oynatır ve yalnızca yeni öğe kimlikleri göründüğünde ajanı uyandırır (yerleşik `wakeAgent` kapısı, aksi hâlde LLM çağrısı yok). İki yetenek sunar (yönetilen kapsam yönetimi, yinelenen görevler). Açıklama — rol başına yalnızca modeli, akıl yürütme çabasını ve hizmet katmanını kaydeder (mesaj içeriği, başlık veya anahtar yok); bunu pre_api_request ve pre_auxiliary_call kancaları ile geçişli bir llm_execution ara katmanı üzerinden yapar ve $HERMES_HOME/fleet-policy/observed.json içinde saklar; crons --cost, cron/executions.db ve state.db dosyalarını salt okunur açar ve her cron koşusunun son yanıtını yerel olarak sessizlik açısından denetler; watch, yapılandırmanın server_url adresindeki (veya yöneticinin sabitlediği watch_server_url) tek bir MCP aracını, ${VAR} ortam değerlerinin genişletildiği yapılandırma başlıklarıyla çağıran, yönlendirmeleri izleyen ve görülen kimlikleri yapılandırmanın seçtiği yoldaki bir durum dosyasına yazan bir operatör CLI komutudur; yinelenen görevler yeteneği ajana $HERMES_HOME/watches altında watch yapılandırmaları, $HERMES_HOME/scripts altında bir betik ve bir cron görevi yazdırır; başka ağ erişimi yok, telemetri yok."
