name: field-academy
title: Field Academy
repo: https://github.com/Dgardenhire/hermes-field-academy
sha: 9d4b342535fdcb9948b0b2334b78fcbd1fd14675
description: "Learn Hermes by doing real work. Four paths (Messenger, Traveler, Crossroads, Boundary Keeper) climb Beginner, Intermediate and Advanced to a capstone on a problem of your own, and a fifth, Guide, covers setting Hermes up for a client: practice labs built from made-up data, a proposal, one real service run by a scheduled job for several days, a recovery drill, and a review signed by a reviewer you choose. Every mission ends with a check on something you made; your own Hermes scores your written answers in a new chat; passed missions come back for short spaced reviews; and at the end of a path you can create a Field Record, your own self-issued learning record. Field Academy is an independent community plugin. It is not made, issued or endorsed by Nous Research. Disclosure — no network calls (a source link opens in your browser only when you click it); no credentials, telemetry, shell commands, background processes or self-updates; registers six tools, two hooks, the /academy command and one skill: pre_llm_call may add one sentence offering a practice to the user message, only in interactive desktop, TUI and CLI sessions, and post_tool_call records which tool was used; pressing Try it or a scoring button opens a new chat and sends the practice or scoring prompt there (on an older Hermes it goes to the clipboard instead); the Desktop page calls gateway list methods only (session.list, cron.manage list, skills.manage list, tools.list, mcp.catalog, commands.catalog, setup.runtime_check); stores progress, pasted documents, practice labs, review packets and saved Field Records in $HERMES_HOME/plugin-data/field-academy/; reads a file you name (UTF-8 text, max 5 MiB) and hashes a recording you name without copying it; Guide labs write and check made-up .env and auth.json files inside its own labs folder (refusing to build in a real Hermes home) and never read Hermes's real ones; on the Guide path reads Hermes's run-history database read-only, jobs.json and up to 25 log files (2 MiB each), keeping only timestamps for the job you name, and reads install-stamp.json for the Hermes version; no private Hermes imports."
description_tr: "Gerçek iş yaparak Hermes'i öğrenin. Dört yol (Messenger, Traveler, Crossroads, Boundary Keeper) Başlangıç, Orta ve İleri düzeylerden geçerek kendi probleminize yönelik bir bitirme projesine yükselir; beşinci yol olan Guide ise bir müşteri için Hermes'i kurmayı kapsar: uydurma verilerle kurulmuş pratik laboratuvarlar, bir teklif, zamanlanmış bir işle birkaç gün boyunca çalıştırılan tek bir gerçek servis, bir kurtarma tatbikatı ve seçtiğiniz bir gözden geçirenin imzaladığı bir değerlendirme. Her görev, sizin yaptığınız bir şey üzerinde bir kontrolle biter; kendi Hermes'iniz yazılı yanıtlarınızı yeni bir sohbette puanlar; geçilen görevler kısa aralıklı tekrarlar için geri gelir; bir yolun sonunda, kendinize düzenlediğiniz öğrenme kaydı olan bir Field Record oluşturabilirsiniz. Field Academy bağımsız bir topluluk eklentisidir. Nous Research tarafından üretilmemiş, yayımlanmamış veya desteklenmemiştir. Açıklama — ağ çağrısı yok (bir kaynak bağlantısı yalnızca tıkladığınızda tarayıcınızda açılır); kimlik bilgisi, telemetri, kabuk komutu, arka plan süreci ya da kendi kendini güncelleme yok; altı araç, iki kanca, /academy komutu ve bir yetenek kaydeder: pre_llm_call, kullanıcı mesajına yalnızca etkileşimli masaüstü, TUI ve CLI oturumlarında bir alıştırma öneren tek bir cümle ekleyebilir ve post_tool_call hangi aracın kullanıldığını kaydeder; \"Dene\" ya da bir puanlama düğmesine basmak yeni bir sohbet açar ve alıştırma ya da puanlama istemini oraya gönderir (eski bir Hermes'te bunun yerine panoya gider); Desktop sayfası yalnızca ağ geçidi listeleme yöntemlerini çağırır (session.list, cron.manage list, skills.manage list, tools.list, mcp.catalog, commands.catalog, setup.runtime_check); ilerlemeyi, yapıştırılan belgeleri, alıştırma laboratuvarlarını, inceleme paketlerini ve kaydedilmiş Field Record'ları $HERMES_HOME/plugin-data/field-academy/ içinde saklar; adını verdiğiniz bir dosyayı okur (UTF-8 metin, en fazla 5 MiB) ve adını verdiğiniz bir kaydı kopyalamadan karma değerini alır; Guide laboratuvarları kendi laboratuvar klasörü içinde uydurma .env ve auth.json dosyalarını yazar ve denetler (gerçek bir Hermes ana dizininde oluşturmayı reddeder) ve Hermes'in gerçek dosyalarını asla okumaz; Guide yolunda Hermes'in çalışma geçmişi veritabanını salt okunur, jobs.json dosyasını ve en fazla 25 günlük dosyasını (her biri 2 MiB) okur, adını verdiğiniz iş için yalnızca zaman damgalarını tutar ve Hermes sürümü için install-stamp.json dosyasını okur; özel Hermes içe aktarımları yok."
