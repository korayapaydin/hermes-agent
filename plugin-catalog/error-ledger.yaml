subdir: error-ledger
description: "Local ledger of failed provider calls (rate limits, overloads, timeouts, context overflows): /errors shows how many attempts failed per model, provider or cause, how many Hermes could retry, and the most common HTTP status, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /errors days puts one day on each line, newest first; /errors recent lists the newest failures (ten, or up to 100 with /errors recent 50) and how long ago each happened. Disclosure — writes failed-attempt metadata (ids, provider, model, HTTP status, Hermes's failure class, exception class name, timings; no error message, request or prompt text) to plugin-data/error-ledger/errors.jsonl, trimmed to 5,000 rows past 2 MB; no network"
description_tr: "Başarısız sağlayıcı çağrılarının yerel defteri (hız sınırları, aşırı yük, zaman aşımları, bağlam taşmaları): /errors, model, sağlayıcı ya da nedene göre kaç denemenin başarısız olduğunu, Hermes'in kaçını yeniden deneyebildiğini ve en sık görülen HTTP durumunu, son 24 saat, istenen sayıda saat ya da gün, en son oturum ya da kayıtlı her şey için gösterir; /errors days her güne bir satır koyar, en yeniden başa; /errors recent en yeni hataları (on, ya da /errors recent 50 ile en fazla 100) ve her birinin ne kadar önce olduğunu listeler. Açıklama — başarısız deneme üst verisini (kimlikler, sağlayıcı, model, HTTP durumu, Hermes'in hata sınıfı, istisna sınıfı adı, süreler; hata mesajı, istek veya prompt metni yok) plugin-data/error-ledger/errors.jsonl dosyasına yazar ve 2 MB sonrasında 5.000 satıra kırpar; ağ erişimi yoktur."
