name: bilinc
repo: https://github.com/ReARCLabs/bilinc-hermes-plugin
sha: 1ad81b4aaef8632ba5d6438384f3f063f46a0ebd
version: "1.0.0"
description: "Hosted memory for Hermes with a full history: see what your agent remembered, when it changed and why. Recalls relevant memories before each turn, adds bilinc_recall, bilinc_remember, bilinc_revise and bilinc_forget tools, and mirrors Hermes built-in memory writes. Maintained by ReARC Labs; free plan available. Disclosure — recall queries (the text of each message, when auto_recall is on), tool arguments, mirrored built-in memory writes, the Hermes session id and, only if memory.bilinc.capture_turns is turned on, each turn's user and assistant text are sent over HTTPS to bilinc.space under your BILINC_API_KEY; requests carry User-Agent bilinc-hermes/<version> and X-Bilinc-Client: hermes-plugin headers. Secret-looking strings are redacted before sending. Recall and writes run on background threads inside Hermes; no separate process, local database or telemetry."
description_tr: "Hermes için tam geçmişe sahip barındırılmış bellek: ajanınızın ne hatırladığını, ne zaman ve neden değiştiğini görün. Her turdan önce ilgili anıları geri çağırır, bilinc_recall, bilinc_remember, bilinc_revise ve bilinc_forget araçlarını ekler ve Hermes'in yerleşik bellek yazmalarını yansıtır. ReARC Labs tarafından sürdürülür; ücretsiz plan mevcuttur. Açıklama — geri çağırma sorguları (auto_recall açıkken her iletinin metni), araç bağımsız değişkenleri, yansıtılan yerleşik bellek yazmaları, Hermes oturum kimliği ve yalnızca memory.bilinc.capture_turns açıksa her turun kullanıcı ve asistan metni, BILINC_API_KEY'iniz altında HTTPS üzerinden bilinc.space adresine gönderilir; istekler User-Agent bilinc-hermes/<version> ve X-Bilinc-Client: hermes-plugin başlıklarını taşır. Sır gibi görünen dizeler gönderilmeden önce redakte edilir. Geri çağırma ve yazmalar Hermes içinde arka plan iş parçacıklarında çalışır; ayrı süreç, yerel veritabanı veya telemetri yoktur."
maintainer: ReARCLabs
