name: hermes-call-ledger
repo: https://github.com/skappafrost/hermes-call-ledger
sha: c55671dd61becb30a8b4d5e53cba9926938fb299
description: >-
  Per-call cost ledger for Hermes Desktop: every model call Hermes makes is recorded from the observer hooks (provider, model, tokens, duration, outcome) and paired with the charge the billing provider actually took; works with no billing account, priced by Hermes' own estimate where the price book knows the model. English or Vietnamese; dong or dollars. Disclosure — three observer hooks (post_api_request, post_auxiliary_call, api_request_error) record per-call metadata from every profile in the install (session id, platform, task, provider, model, token counts, duration, finish reason, context length; never prompt, response or tool-argument text) into one shared SQLite ledger at <install root>/plugin-data/call-ledger/calls.sqlite, and import this plugin's own older per-profile ledgers into it once. It caches the vilao.ai model list there and the USD-to-VND rate under the active profile's plugin-data/call-ledger. Network is GET-only: vilao.ai (wallet balance, per-request usage, consumer keys) with VILAO_PAT read through Hermes's secret scope (vilao issues one full-scope token per account, including wallet writes; this plugin only reads), the public vilao.ai model list with no credential, and open.er-api.com for the dollar rate. The first full billing pull pages back through up to ten years of the account's usage. Nothing runs while the Desktop page is closed. Derived from hermes-resetwatch (Adolanium, MIT).
description_tr: "Hermes Desktop için çağrı başına maliyet defteri: Hermes'in yaptığı her model çağrısı gözlemci kancalarından (sağlayıcı, model, token, süre, sonuç) kaydedilir ve faturalama sağlayıcısının fiilen aldığı ücretle eşleştirilir; faturalama hesabı olmadan da çalışır, fiyat kitabı modeli biliyorsa Hermes'in kendi tahminiyle fiyatlanır. İngilizce ya da Vietnamca; đồng ya da dolar. Açıklama — üç gözlemci kanca (post_api_request, post_auxiliary_call, api_request_error), kurulumdaki her profilden çağrı başına meta veriyi (oturum kimliği, platform, görev, sağlayıcı, model, token sayıları, süre, bitiş nedeni, bağlam uzunluğu; asla istem, yanıt veya araç bağımsız değişkeni metni) <install root>/plugin-data/call-ledger/calls.sqlite adresindeki tek bir paylaşılan SQLite defterine kaydeder ve bu eklentinin kendi eski profil başına defterlerini bir kez oraya aktarır. vilao.ai model listesini orada, USD-VND kurunu da etkin profilin plugin-data/call-ledger dizini altında önbelleğe alır. Ağ yalnızca GET'tir: vilao.ai (cüzdan bakiyesi, istek başına kullanım, tüketici anahtarları) — VILAO_PAT, Hermes'in sır kapsamı üzerinden okunur (vilao her hesap için cüzdan yazmaları da dahil tam kapsamlı tek bir token verir; bu eklenti yalnızca okur) —, kimlik bilgisi gerektirmeyen herkese açık vilao.ai model listesi ve dolar kuru için open.er-api.com. İlk tam faturalama çekimi, hesabın kullanımını en fazla on yıl geriye doğru sayfalayarak alır. Masaüstü sayfası kapalıyken hiçbir şey çalışmaz. hermes-resetwatch (Adolanium, MIT) projesinden türetilmiştir."
maintainer: skappafrost
