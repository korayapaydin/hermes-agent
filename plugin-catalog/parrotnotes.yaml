name: parrotnotes
repo: https://github.com/ascetx/parrot-notes-hermes-plugin
sha: 18b2ed0d4b9eacff38e286f34bc08301afe3f0f3
description: >-
  Find, search, summarize and save insights for your ParrotNotes in-person meeting notes
  through the hosted ParrotNotes MCP server (Streamable HTTP, OAuth 2.0 + DCR), with the parrotnotes
  workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/).
  Disclosure — hosted-only connector with no local code: every tool call goes to the vendor's
  remote MCP server at mcp.parrotnotes.app (OAuth via a Supabase auth backend); note titles,
  transcripts and insights from the user's ParrotNotes account are pulled into the session
  context, and text the model passes to save_note_insight is written to that account. OAuth
  must be enabled with `hermes mcp add parrotnotes --url https://mcp.parrotnotes.app/mcp --auth oauth`;
  the bundled mcp.json alone yields 401.
description_tr: "Barındırılan ParrotNotes MCP sunucusu (Streamable HTTP, OAuth 2.0 + DCR) üzerinden, yüz yüze toplantı notlarınız için ParrotNotes içgörülerinizi bulun, arayın, özetleyin ve kaydedin; parrotnotes iş akışı yeteneği pakete dahildir. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/). Açıklama — yerel kod içermeyen, yalnızca barındırılan bağlayıcı: her araç çağrısı satıcının mcp.parrotnotes.app adresindeki uzak MCP sunucusuna gider (kimlik doğrulama, Supabase kimlik doğrulama arka ucu üzerinden OAuth ile yapılır); kullanıcının ParrotNotes hesabındaki not başlıkları, transkriptler ve içgörüler oturum bağlamına çekilir ve modelin save_note_insight aracına geçirdiği metin o hesaba yazılır. OAuth, `hermes mcp add parrotnotes --url https://mcp.parrotnotes.app/mcp --auth oauth` komutuyla etkinleştirilmelidir; paketlenmiş mcp.json tek başına 401 döndürür."
