description: "Research competitor ads, clone the winners, and run campaigns through the hosted AdWhispr MCP. Finds brands verified to be advertising in a niche right now, their longest-running Meta and TikTok ads, Instagram content and Google keyword data; clones a proven ad into a finished image or AI video for your brand (free script approval before any credit is charged); and launches paused campaigns on Meta, Google, TikTok, X and ChatGPT Ads. Portable Agent Plugins v1 package with twenty-four workflow skills; OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required. Disclosure — creates and edits real ad campaigns that spend your ad budgets (always created paused, two-step confirm server-side) and renders videos that use paid credits; the AdWhispr server is marked untrusted, so Hermes asks before every write or spend tool and refuses them in cron and headless runs. Sends research queries and your brand assets to adwhispr.com; sign-in is OAuth through npx mcp-remote@0.1.49."
description_tr: "Rakip reklamları araştırın, kazananları kopyalayın ve barındırılan AdWhispr MCP üzerinden kampanyalar yürütün. Şu anda bir nişte reklam verdiği doğrulanmış markaları, en uzun süredir çalışan Meta ve TikTok reklamlarını, Instagram içeriklerini ve Google anahtar kelime verilerini bulur; kanıtlanmış bir reklamı markanız için bitmiş bir görsele ya da AI videosuna kopyalar (kredi düşülmeden önce ücretsiz senaryo onayı); ve Meta, Google, TikTok, X ile ChatGPT Ads'te duraklatılmış kampanyalar başlatır. Yirmi dört iş akışı yeteneğine sahip taşınabilir Agent Plugins v1 paketi; OAuth, npx stdio üzerinden sabitlenmiş mcp-remote@0.1.49 kullanır, bu yüzden Node.js 20.18.1+ ve npm gerekir. Açıklama — reklam bütçelerinizi harcayan gerçek reklam kampanyaları oluşturur ve düzenler (her zaman duraklatılmış oluşturulur, sunucu tarafında iki adımlı onay) ve ücretli kredi kullanan videolar oluşturur; AdWhispr sunucusu güvenilmez olarak işaretlenmiştir, bu yüzden Hermes her yazma veya harcama aracından önce sorar ve bunları cron ve başsız çalıştırmalarda reddeder. Araştırma sorgularını ve marka varlıklarınızı adwhispr.com'a gönderir; oturum açma, npx mcp-remote@0.1.49 üzerinden OAuth ile yapılır."
