name: entropicmem
repo: https://github.com/Ufonik88/EntropicMem
sha: 7e02412366408234629e759a575edc31eb138721
subdir: "plugins/entropicmem"
description: >-
  Durable local memory for Hermes agents: SQLite FTS5 facts with cited, explainable recall; a
  Markdown vault with knowledge-graph export and an interactive visual graph; and turn-prefetch
  context injection with reason tokens. Write policy auto-redacts high-confidence secrets at write
  time (other PII types are warn-only findings) and stored-content injection screening flags and
  warns on recall and prefetch payloads (flag-and-warn, fail-open by design, not a blocking
  filter). Includes a 34-command CLI, destructive-op gates with automatic backups, and an
  append-only audit log. Disclosure — all memory data (vault markdown, memory.db, index.db, backups) stays local under
  HERMES_HOME/entropicmem/; a shared publish DB defaults to HERMES_HOME/entropicmem-shared/. The CLI init command appends
  ENTROPICMEM_* settings to HERMES_HOME/.env (append-only). Vector embeddings are off by default; only with
  embeddings_enabled: true (provider) or ENTROPICMEM_EMBEDDINGS=1 / query --semantic (CLI) and the optional
  sentence-transformers extra installed does first use download all-MiniLM-L6-v2 weights from huggingface.co;
  otherwise the provider has no network egress. The CLI ingest command fetches a user-supplied URL; CLI
  graph export writes to ./export in the cwd by default and its HTML loads D3/marked from d3js.org and cdn.jsdelivr.net
  when opened; CLI graph serve starts a loopback HTTP server. entropicmem_patch_core edits the plugin's own Core-memory
  markdown (Persona/User_Profile), not Hermes core, and is off by default.
description_tr: "Hermes ajanları için kalıcı yerel bellek: kaynaklı, açıklanabilir geri çağırmaya sahip SQLite FTS5 olguları; bilgi grafiği dışa aktarımı ve etkileşimli görsel grafik sunan bir Markdown kasası; ve gerekçe belirteçleriyle tur öncesi ön getirme bağlam enjeksiyonu. Yazma politikası, yüksek güvenli sırları yazma anında otomatik olarak maskeler (diğer kişisel veri türleri yalnızca uyarı niteliğindedir) ve saklanan içerik enjeksiyon taraması, geri çağırma ve ön getirme yüklerinde işaretler ve uyarır (tasarım gereği engelleyen filtre değil, işaretleyip uyaran bir denetim). 34 komutlu bir CLI, otomatik yedeklemeli yıkıcı işlem kapıları ve yalnızca eklenen bir denetim günlüğü içerir. Açıklama — tüm bellek verileri (kasa markdown'ı, memory.db, index.db, yedekler) yerelde HERMES_HOME/entropicmem/ altında kalır; paylaşılan bir yayın DB'si varsayılan olarak HERMES_HOME/entropicmem-shared/ altındadır. CLI init komutu, ENTROPICMEM_* ayarlarını HERMES_HOME/.env dosyasına ekler (yalnızca ekleme). Vektör gömmeleri varsayılan olarak kapalıdır; yalnızca embeddings_enabled: true (sağlayıcı) ya da ENTROPICMEM_EMBEDDINGS=1 / query --semantic (CLI) ile ve isteğe bağlı sentence-transformers eklentisi kuruluysa ilk kullanımda huggingface.co adresinden all-MiniLM-L6-v2 ağırlıklarını indirir; aksi halde sağlayıcının ağ çıkışı yoktur. CLI ingest komutu kullanıcı tarafından verilen bir URL'yi çeker; CLI graph export varsayılan olarak geçerli dizindeki ./export klasörüne yazar ve HTML'i açıldığında d3js.org ve cdn.jsdelivr.net adreslerinden D3/marked yükler; CLI graph serve geri döngü üzerinde bir HTTP sunucusu başlatır. entropicmem_patch_core, Hermes çekirdeğini değil eklentinin kendi Çekirdek bellek markdown'ını (Persona/User_Profile) düzenler ve varsayılan olarak kapalıdır."
