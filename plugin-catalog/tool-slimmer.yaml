name: tool-slimmer
repo: https://github.com/aliasocracy/hermes-tool-slimmer
sha: 1b90aa592f7423233ea6cdfd44c7188e14ca7ccf
description: "Reduce Hermes tool-schema overhead and show selector savings in the dashboard. Disclosure — optional mode jev (off by default; needs TYPESAFE_API_KEY) sends each turn's request text and up to 32 candidate tool names and descriptions to TypeSafe (api.typesafe.ai); all other modes run locally. Optional user-run scripts can patch Hermes core on older Hermes and install a systemd user self-heal unit; the dashboard advisor edits the tool_slimmer section of config.yaml with a backup."
description_tr: "Hermes araç şeması yükünü azaltın ve panoda seçici tasarrufunu gösterin. Açıklama — isteğe bağlı jev modu (varsayılan olarak kapalı; TYPESAFE_API_KEY gerektirir) her turun istek metnini ve en fazla 32 aday araç adı ile açıklamasını TypeSafe'e (api.typesafe.ai) gönderir; diğer tüm modlar yerelde çalışır. İsteğe bağlı, kullanıcı tarafından çalıştırılan betikler eski Hermes sürümlerinde Hermes çekirdeğini yamalayabilir ve bir systemd kullanıcı kendini onarma birimi kurabilir; pano danışmanı, config.yaml dosyasının tool_slimmer bölümünü yedek alarak düzenler."
maintainer: aliasocracy
tier: community
category: tools
requires_hermes: ">=0.19"
docs_url: https://github.com/aliasocracy/hermes-tool-slimmer#readme
version: "0.8.0"
capabilities:
  provides_tools:
  - tool_slimmer_hydrate_tools
  - tool_slimmer_request_full_tools
  - tool_slimmer_select
  - tool_slimmer_status
  provides_hooks:
  - pre_llm_call
  provides_middleware:
  - llm_request
  requires_env: []
