name: wechat-social-assistant
repo: https://github.com/harrylabsj/hermes-plugin-wechat-social-assistant
sha: fbfc1bd23fc9494ad9c4433de2574954b5f5476f
description: 'Local-first WeChat relationship memory assistant for macOS: captures only what
  is visible in the WeChat window via system OCR/Accessibility, stores everything in a local
  SQLite database (0600/0700 permissions, no cloud), and serves contact briefs, follow-up
  planning, outreach drafts and weekly relationship reports through 32 MCP tools. Engine
  pinned to the immutable PyPI release wechat-social-assistant==1.5.1 over uvx stdio; Portable
  Agent Plugins v1 package (mcp.json + skills/), needs uv on PATH. All data confined to
  PLUGIN_DATA via WSA_ALLOWED_ROOT + path enforcement. Never reads WeChat databases, never
  injects into WeChat, never sends messages — outreach is drafts for human review only. Disclosure — reads WeChat only by screenshotting/OCR-ing and walking the macOS Accessibility tree of the frontmost window (not WeChat''s databases or a bot API), compiles bundled Swift helpers with swiftc into ~/Library/Caches/wechat-social-assistant/bin on first use, and needs Screen Recording (optionally Accessibility) permission for the host terminal; no network egress, never sends messages.'
description_tr: "macOS için yerel öncelikli WeChat ilişki belleği yardımcısı: yalnızca WeChat penceresinde görünenleri sistem OCR/Erişilebilirlik ile yakalar, her şeyi yerel bir SQLite veritabanında saklar (0600/0700 izinleri, bulut yok) ve 32 MCP aracıyla kişi özetleri, takip planlama, iletişim taslakları ve haftalık ilişki raporları sunar. Motor, uvx stdio üzerinden değişmez PyPI sürümüne (wechat-social-assistant==1.5.1) sabitlenmiştir; Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), PATH'te uv gerekir. Tüm veri WSA_ALLOWED_ROOT ve yol uygulamasıyla PLUGIN_DATA içine hapsedilir. WeChat veritabanlarını asla okumaz, WeChat'e asla bir şey enjekte etmez, asla mesaj göndermez — iletişim, yalnızca insan incelemesi için taslaktır. Açıklama — WeChat'i yalnızca ekran görüntüsü alarak/OCR yaparak ve en öndeki pencerenin macOS Erişilebilirlik ağacında gezerek okur (WeChat'in veritabanlarını veya bir bot API'sini değil), ilk kullanımda paketlenmiş Swift yardımcılarını swiftc ile ~/Library/Caches/wechat-social-assistant/bin içine derler ve ana terminal için Ekran Kaydı (isteğe bağlı olarak Erişilebilirlik) izni gerektirir; ağ çıkışı yok, asla mesaj göndermez."
