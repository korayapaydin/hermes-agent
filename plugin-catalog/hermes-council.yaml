name: hermes-council
repo: https://github.com/girayk/hermes-council
sha: 18a66633acc045c251063721a1cf26f9a46d29de
description: "LLM Council (karpathy/llm-council) as a Hermes plugin. Four fixed advisor seats (First-Principles Analyst, Skeptic, Pragmatist, Researcher) answer in parallel, anonymously review and rank each other, and a Chairman model synthesizes the final answer. Members borrow your existing provider credentials - no API keys. Registers a Council group in every model menu, a council_deliberate tool, /council, hermes council CLI, and a desktop panel. Disclosure — council_deliberate and the Council model fan each prompt (as a session model, the whole conversation) out to every seat, judge and chairman model you assign, up to 2N+1 billed calls per turn on your existing provider credentials; it also adds a non-secret \"council\" marker row to auth.json and keeps run history in $HERMES_HOME/council/runs/."
description_tr: "LLM Council (karpathy/llm-council) bir Hermes eklentisidir. Dört sabit danışman koltuğu (İlk İlkeler Analisti, Şüpheci, Pragmatist, Araştırmacı) paralel yanıt verir, birbirlerini anonim olarak inceleyip sıralar ve bir Başkan modeli nihai yanıtı sentezler. Üyeler mevcut sağlayıcı kimlik bilgilerinizi ödünç alır — API anahtarı gerekmez. Her model menüsünde bir Council grubu, council_deliberate aracı, /council, hermes council CLI ve bir masaüstü paneli kaydeder. Açıklama — council_deliberate ve Council modeli her istemi (oturum modeli olarak tüm konuşmayı) atadığınız her koltuğa, hakeme ve başkan modeline dağıtır; mevcut sağlayıcı kimlik bilgilerinizle tur başına 2N+1'e kadar ücretli çağrı yapılır; ayrıca auth.json dosyasına gizli olmayan bir “council” işaretçi satırı ekler ve çalıştırma geçmişini $HERMES_HOME/council/runs/ altında tutar."
maintainer: girayk
tier: community
category: models
