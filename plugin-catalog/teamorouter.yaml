subdir: teamorouter
description: >-
  TeamoRouter as Hermes model providers on one key: `teamorouter` serves Claude models over
  TeamoRouter's native Anthropic Messages API (so Hermes' Anthropic prompt caching and thinking
  apply), and `teamorouter-openai` serves GPT, Gemini, DeepSeek, GLM and Grok models over its
  OpenAI-compatible API. Each /model picker lists that side's tool-capable chat models from
  TeamoRouter's public catalog, leaving out image, service-tier and free-tier variants, and context
  windows come from the same catalog. Maintained by TeamoRouter. Disclosure — registers two model
  providers at import and nothing else (no tools, hooks, commands or threads). Prompts, tool schemas
  and TEAMOROUTER_API_KEY go to https://api.teamorouter.com (/v1/messages and /v1/chat/completions)
  through Hermes' own clients, and TeamoRouter forwards each request to the upstream vendor serving
  the model. The plugin's own request is GET https://api.teamorouter.com/v1/models/pricing, a public
  endpoint, sent without the key and cached for an hour. `teamorouter-openai` requests carry a fixed
  `X-Client-Source: hermes-teamorouter-plugin` header (via the profile's default_headers), used only
  to count traffic from this plugin; Claude requests carry no header from the plugin. No telemetry,
  no files read or written, no stored credentials, no processes.
description_tr: "Tek anahtarla Hermes model sağlayıcıları olarak TeamoRouter: `teamorouter`, Claude modellerini TeamoRouter'ın yerel Anthropic Messages API'si üzerinden sunar (böylece Hermes'in Anthropic istem önbelleklemesi ve düşünme desteği uygulanır) ve `teamorouter-openai`, GPT, Gemini, DeepSeek, GLM ve Grok modellerini OpenAI uyumlu API'si üzerinden sunar. Her /model seçicisi, o tarafın araç destekli sohbet modellerini TeamoRouter'ın genel kataloğundan listeler ve görsel, servis katmanı ve ücretsiz katman varyantlarını dışarıda bırakır; bağlam pencereleri de aynı katalogdan gelir. TeamoRouter tarafından sürdürülür. Açıklama — içe aktarımda iki model sağlayıcısı kaydeder, başka hiçbir şey yapmaz (araç, kanca, komut veya iş parçacığı yok). İstemler, araç şemaları ve TEAMOROUTER_API_KEY, Hermes'in kendi istemcileri aracılığıyla https://api.teamorouter.com adresine (/v1/messages ve /v1/chat/completions) gider ve TeamoRouter her isteği modeli sunan üst satıcıya iletir. Eklentinin kendi isteği, herkese açık bir uç nokta olan GET https://api.teamorouter.com/v1/models/pricing adresine yapılan GET isteğidir; anahtar olmadan gönderilir ve bir saat önbelleğe alınır. `teamorouter-openai` istekleri sabit bir `X-Client-Source: hermes-teamorouter-plugin` başlığı taşır (profilin default_headers ayarı üzerinden) ve bu yalnızca bu eklentiden gelen trafiği saymak için kullanılır; Claude istekleri eklentiden hiçbir başlık taşımaz. Telemetri yok, dosya okunmaz veya yazılmaz, kimlik bilgisi saklanmaz, süreç yok."
