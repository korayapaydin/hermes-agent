name: skill-integrity
version: "0.2.1"
repo: https://github.com/ZidoCode/skill-integrity
sha: 352a190b89a91246487107f016c39bb777d8466c
description: "Rug-pull detection for installed agent skills — fingerprints every file in every skill directory (SHA-256), keeps a profile-local snapshot, and reports exactly which skill files changed, appeared, or vanished since; a skill that mutates after install without the user touching it is the rug-pull signal. A skill directory made unreadable is reported as a finding, never treated as clean. Read-only observer, stdlib-only, zero network calls; blind spots (oversize files, symlinks, permission-denied) are counted and printed, never silent. The wrapper registers an hourly pre_llm_call hook that injects findings into the agent context, plus a /skill-integrity slash command (snapshot | check | show) that creates the baseline snapshot and shows the file-level diff. The CLI supports --state-dir to target the plugin's manifest directly. Skill dirs and state derive from get_hermes_home(), covering non-default profiles. Disclosure — reads (hash-only, read-only) every file under the active profile's skills directory and ~/.claude/skills, stores a mode-0600 snapshot in HERMES_HOME/plugin-data/skill-integrity, and at most hourly injects the names of changed skills into the agent's context."
description_tr: "Kurulu ajan yetenekleri için rug-pull tespiti — her yetenek dizinindeki her dosyanın parmak izini alır (SHA-256), profille özel bir anlık görüntü tutar ve o zamandan beri hangi yetenek dosyalarının değiştiğini, ortaya çıktığını ya da kaybolduğunu tam olarak raporlar; kurulumdan sonra kullanıcıya dokunmadan mutasyona uğrayan bir yetenek rug-pull sinyalidir. Okunamaz hâle getirilmiş bir yetenek dizini asla temiz sayılmaz, bir bulgu olarak raporlanır. Salt okunur gözlemci, yalnızca stdlib, sıfır ağ çağrısı; kör noktalar (aşırı büyük dosyalar, sembolik bağlantılar, izin reddi) sayılır ve yazdırılır, asla sessizce geçilmez. Sarmalayıcı, bulguları ajan bağlamına enjekte eden saatlik bir pre_llm_call hook'u ve temel anlık görüntüyü oluşturup dosya düzeyindeki farkı gösteren bir /skill-integrity eğik çizgi komutu (snapshot | check | show) kaydeder. CLI, eklentinin manifestine doğrudan hedef vermek için --state-dir seçeneğini destekler. Yetenek dizinleri ve durum get_hermes_home()'den türetilir; varsayılan olmayan profiller de kapsanır. Açıklama — etkin profilin yetenekler dizini ve ~/.claude/skills altındaki her dosyayı (yalnızca karma, salt okunur) okur, HERMES_HOME/plugin-data/skill-integrity içinde 0600 kipli bir anlık görüntü saklar ve en fazla saatte bir değişen yeteneklerin adlarını ajanın bağlamına enjekte eder."
