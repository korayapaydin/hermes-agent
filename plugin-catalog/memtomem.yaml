description: "Markdown-first long-term memory shared across your coding agents: a local memtomem MCP server plus six memory skills (index, recall, remember, search, setup, status). Notes live in ~/.memtomem and are searchable from Hermes, Claude Code, Codex CLI and Kimi Code. Runs at user scope. Disclosure — the server is launched with `uvx --python 3.12` and downloaded from PyPI (memtomem[onnx]==0.6.9) on first start, with Python 3.12 if uv cannot find one; it runs as a stdio MCP server for the session and reads the directories you ask it to index. With a fresh BM25-only configuration nothing else leaves the machine; an existing memtomem configuration may enable Hugging Face model downloads, a remote embedding or LLM provider, Cohere reranking or search webhooks. At startup the server also reads the nearest .env found upward from its installed location inside uv's cache (normally ~/.env), setting variables not already present, outside Hermes's MCP environment filtering."
description_tr: "Kodlama ajanlarınız arasında paylaşılan, Markdown öncelikli uzun süreli bellek: yerel bir memtomem MCP sunucusu ve altı bellek yeteneği (index, recall, remember, search, setup, status). Notlar ~/.memtomem altında yaşar ve Hermes, Claude Code, Codex CLI ile Kimi Code'dan aranabilir. Kullanıcı kapsamında çalışır. Açıklama — sunucu `uvx --python 3.12` ile başlatılır ve ilk başlatmada PyPI'den (memtomem[onnx]==0.6.8) indirilir; uv uygun bir Python bulamazsa Python 3.12 kullanılır. Oturum boyunca bir stdio MCP sunucusu olarak çalışır ve indekslemesini istediğiniz dizinleri okur. Yeni bir yalnızca BM25 yapılandırmasında makineden başka hiçbir şey çıkmaz; mevcut bir memtomem yapılandırması Hugging Face model indirmelerini, uzak bir gömme veya LLM sağlayıcısını, Cohere yeniden sıralamasını ya da arama webhook'larını etkinleştirebilir. Başlangıçta sunucu ayrıca uv önbelleği içindeki kurulu konumundan yukarı doğru bulunan en yakın .env dosyasını (normalde ~/.env) okur ve Hermes'in MCP ortam filtresi dışında, henüz mevcut olmayan değişkenleri ayarlar."
