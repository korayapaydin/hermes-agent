# Browserless — cloud browser provider for Hermes' built-in browser tools.
#
# Owner-submitted by a Browserless maintainer. Registers one browser provider (no tools, hooks or
# middleware); select it with `browser.cloud_provider: browserless`.
name: browserless
title: Browserless
repo: https://github.com/browserless/browserless-mcp
sha: "600a5d689fa3f5bdcb5676ffc063b56d18e9bd7c"
subdir: hermes
description: "Run Hermes' built-in browser tools on Browserless cloud browsers: stealth mode, residential proxies, captcha solving and ad blocking, with no local Chrome. One Browserless browser per task; Hermes' agent-browser daemon and CDP supervisor share it through a local CDP multiplexer, and the browser is reconnected after network drops and closed when the task ends. Disclosure — while a browser task runs, starts a background thread with a WebSocket listener on 127.0.0.1 (random port, secret path, local Host header only); connects to Browserless (production-*.browserless.io) with BROWSERLESS_TOKEN, read via get_secret; Browserless usage is metered on your plan, and residential proxy traffic costs more; connections to Browserless carry a browserless-hermes-plugin/<version> User-Agent so Browserless can count plugin usage (opt-out: BROWSERLESS_SOURCE_TAG=false; the browser's own user agent is unchanged); no files written unless BROWSERLESS_MUX_LOG is set; no other telemetry."
description_tr: "Hermes'in yerleşik tarayıcı araçlarını Browserless bulut tarayıcılarında çalıştırın: gizli mod, konut proxy'leri, captcha çözme ve reklam engelleme; yerel Chrome gerekmez. Görev başına bir Browserless tarayıcısı; Hermes'in agent-browser daemon'u ve CDP denetleyicisi onu yerel bir CDP çoklayıcısı üzerinden paylaşır, tarayıcı ağ düşmelerinden sonra yeniden bağlanır ve görev bitince kapatılır. Açıklama — bir tarayıcı görevi çalışırken 127.0.0.1 üzerinde (rastgele port, gizli yol, yalnızca yerel Host başlığı) bir WebSocket dinleyicisi olan bir arka plan iş parçacığı başlatır; get_secret ile okunan BROWSERLESS_TOKEN ile Browserless'a (production-*.browserless.io) bağlanır; Browserless kullanımı planınızda ölçülür ve konut proxy trafiği daha pahalıdır; Browserless'a bağlantılar, Browserless'ın eklenti kullanımını sayabilmesi için browserless-hermes-plugin/<version> User-Agent'ı taşır (iptal: BROWSERLESS_SOURCE_TAG=false; tarayıcının kendi user agent'ı değişmez); BROWSERLESS_MUX_LOG ayarlanmadıkça hiçbir dosya yazılmaz; başka telemetri yoktur."
maintainer: browserless
tier: community
category: web
docs_url: https://github.com/browserless/browserless-mcp/tree/600a5d689fa3f5bdcb5676ffc063b56d18e9bd7c/hermes
requires_hermes: ">=0.21.6"
version: "0.1.2"
image: https://raw.githubusercontent.com/browserless/browserless-mcp/600a5d689fa3f5bdcb5676ffc063b56d18e9bd7c/hermes/assets/banner.jpg
readme: true
known_issues:
  - "If the Browserless session can't start (e.g. wrong token or plan concurrency limit), Hermes falls back to a local browser; set BROWSERLESS_MUX_LOG to see the reason."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - BROWSERLESS_TOKEN
