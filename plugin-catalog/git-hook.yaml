name: git-hook
repo: https://github.com/aean0x/hermes-git-hook
sha: a7303c89b429704a31e2df4212ec4f08ee76692a
description: "Auto fetch/pull before reads, and commit + push only the files each turn changed, for every git worktree Hermes touches. Disclosure — after each turn it commits and pushes (push on by default; GIT_HOOK_PUSH=0 keeps commits local) the changed files of git worktrees under GIT_HOOK_ROOTS (default PROJECTS_ROOT, \"*\" for every repo), pushing to origin HEAD when no upstream is set; it pulls --ff-only before reads. A branch whose direct push the remote refuses on policy grounds (branch protection, a PR-required ruleset) is never committed to again: the hook drops its own unpushed commit, leaves the edit staged and dirty, and reports it once."
description_tr: "Okumalardan önce otomatik fetch/pull ve Hermes'in dokunduğu her git çalışma ağacı için yalnızca her turda değişen dosyaları commit + push. Açıklama — her turdan sonra, GIT_HOOK_ROOTS (varsayılan PROJECTS_ROOT, her depo için \"*\") altındaki git çalışma ağaçlarının değişen dosyalarını commit eder ve push eder (push varsayılan olarak açıktır; GIT_HOOK_PUSH=0 commit'leri yerelde tutar); üst akış ayarlanmamışsa origin HEAD'e push eder; okumalardan önce --ff-only ile pull yapar. Doğrudan push'u uzak tarafından ilke gerekçesiyle (dal koruması, PR gerektiren kural seti) reddedilen bir dala bir daha asla commit edilmez: hook kendi push edilmemiş commit'ini geri alır, düzenlemeyi hazırlanmış ve kirli bırakır ve bunu bir kez bildirir."
maintainer: aean0x
tier: community
category: automation
docs_url: https://github.com/aean0x/hermes-git-hook#readme
version: "0.5.1"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - post_llm_call
    - on_session_end
  provides_middleware: []
  requires_env: []
