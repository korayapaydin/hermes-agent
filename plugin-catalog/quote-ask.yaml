name: quote-ask
repo: https://github.com/freefate258/quote-ask
sha: 194f1715a623f2ca185469047452365e36cb8972
title: "Quote & Ask"
description: 'Codex-style ask-about-selection for Hermes Desktop: select text anywhere in a conversation, and a small pill appears above the selection offering Quote & ask — the selection lands in the message composer as a Markdown quote with the caret on the line below, ready for your question — or Copy, which puts the same Markdown quote on the clipboard. A command-palette entry does the same without the pill. Desktop-only (desktop/plugin.js inside the plugin SDK surface): no agent tools, hooks, middleware or env vars, nothing written to disk, nothing persisted. Disclosure — reads window.getSelection() and the selection rectangle; serializes the selection to Markdown (fenced code with its language, nested lists, bold/italic, links), cut at 4000 characters; writes the draft through host.composer (getDraft/setDraft, falling back to insertText, then ctx.os.writeClipboard) and focuses the composer; ignores selections made inside the composer itself and hides on collapse, scroll or Escape. No network calls, no credentials, no telemetry.'
description_tr: "Hermes Desktop için Codex tarzı seçim hakkında sorma: bir konuşmada herhangi bir yerde metin seçin, seçimin üstünde küçük bir hap belirir ve Quote & ask sunar — seçim, mesaj yazma alanına bir Markdown alıntısı olarak düşer, imleç bir sonraki satırda durur ve sorunuz için hazırdır — ya da Copy, aynı Markdown alıntısını panoya kopyalar. Komut paleti kaydı, hap olmadan aynı işi yapar. Yalnızca Desktop (plugin SDK yüzeyi içinde desktop/plugin.js): ajan araçları, hook, middleware veya ortam değişkeni yok, diske yazılan bir şey yok, kalıcı olan bir şey yok. Açıklama — window.getSelection() ve seçim dikdörtgenini okur; seçimi Markdown'a serileştirir (diliyle birlikte kod bloğu, iç içe listeler, kalın/italik, bağlantılar), 4000 karakterde keser; taslağı host.composer üzerinden yazar (getDraft/setDraft, yedek olarak insertText, ardından ctx.os.writeClipboard) ve yazma alanına odaklanır; yazma alanının kendi içinde yapılan seçimleri yok sayar ve daraltma, kaydırma veya Escape durumunda gizlenir. Ağ çağrısı yok, kimlik bilgisi yok, telemetri yok."
