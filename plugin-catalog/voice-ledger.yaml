sha: 93080fb3cf44ce6e13ab050df64ca66b8eea0d90
subdir: voice-ledger
description: "Local ledger of the voice messages and recordings Hermes transcribes (voice messages from messaging platforms, CLI voice mode): /voice-log shows how many recordings there were, how much audio in total and typically, and how long ago the last one was, per speech-to-text provider, model, source, language or day, for the last 24 hours, any number of hours or days or everything recorded; /voice-log recent lists the newest recordings (ten, or up to 100 with /voice-log recent 50). Disclosure — writes recording metadata (source, provider, model, language, file size read from the file system; no audio, file path, prompt or transcript) to plugin-data/voice-ledger/voice.jsonl, trimmed to 5,000 rows past 2 MB; observer only, always returns None so the transcription request is unchanged; no network"
description_tr: "Hermes'in dönüştürdüğü sesli mesajların ve kayıtların yerel defteri (mesajlaşma platformlarından sesli mesajlar, CLI ses modu): /voice-log, son 24 saat, istenen sayıda saat ya da gün veya kaydedilmiş her şey için; konuşmadan metne sağlayıcısı, model, kaynak, dil ya da güne göre kaç kayıt olduğunu, toplam ve tipik ses miktarını ve son kaydın ne kadar önce olduğunu gösterir; /voice-log recent en yeni kayıtları listeler (on ya da /voice-log recent 50 ile en fazla 100). Açıklama — kayıt üst verilerini (kaynak, sağlayıcı, model, dil, dosya sisteminden okunan dosya boyutu; ses, dosya yolu, istem ya da transkript yok) plugin-data/voice-ledger/voice.jsonl dosyasına yazar, 2 MB'ı aştığında 5.000 satıra kırpar; yalnızca gözlemcidir, her zaman None döndürür, böylece deşifre isteği değişmez; ağ yok."
