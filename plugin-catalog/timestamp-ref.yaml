subdir: timestamp-ref
description: "@ts: context references that turn timestamps into readable times for the model: @ts:1729468800123 attaches the moment in UTC, in the local time zone and as ISO 8601, with its weekday, how long ago or ahead it is, the same moment in Unix seconds, milliseconds and microseconds, and its ISO week; bare numbers are read as seconds, milliseconds, microseconds or nanoseconds by their length (or an s/ms/us/ns suffix) and the block says which; ISO 8601 and RFC 2822 dates and now work too, and up to 10 values in one reference also get the gaps between them; the TUI and Desktop composer preview a value as you type it. Disclosure — reads only the text of the reference itself and the system clock, using Python's datetime; no network, no files read or written, no subprocess, no credentials; register() only adds the @ts: reference provider"
description_tr: "@ts: zaman damgalarını model için okunabilir zamanlara dönüştüren bağlam referansları: @ts:1729468800123 anı UTC'de, yerel zaman diliminde ve ISO 8601 olarak, haftanın günüyle, ne kadar önce veya sonra olduğuyla, aynı anın Unix saniye, milisaniye ve mikrosaniye cinsinden karşılığıyla ve ISO haftasıyla ekler; yalın sayılar uzunluklarına (veya s/ms/us/ns sonekine) göre saniye, milisaniye, mikrosaniye veya nanosaniye olarak okunur ve blok hangisi olduğunu belirtir; ISO 8601 ve RFC 2822 tarihleri ve now da çalışır; tek bir referanstaki 10 değere kadar olan değerler aralarındaki boşlukları da alır; TUI ve Masaüstü oluşturucusu, siz yazarken değeri önizler. Bilgilendirme — yalnızca referansın kendi metnini ve sistem saatini Python'un datetime modülüyle okur; ağ erişimi, dosya okuma/yazma, alt işlem veya kimlik bilgisi yoktur; register() yalnızca @ts: referans sağlayıcısını ekler."
