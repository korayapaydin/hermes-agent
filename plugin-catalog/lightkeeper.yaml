name: lightkeeper
repo: https://github.com/Light5566/claude-lightkeeper
sha: 5126b570feb4a4365e9b3308bcb1029e4822f972
description: "An Obsidian-compatible map of how your codebase works (modules, flows, integrations, platform traps, decisions), kept outside the repo and kept honest by hooks: a primer on the first turn, pointers to the notes that own what you are asking about or editing, and a reminder through the verify gate when code moved but the map did not. Eight lightkeeper:* skills carry the procedures (init, seed, tidy, trace, release, knowledge-vault, vault-sync, vault-tidy); the vault CLI (find, check, sync, status, log, export) works from any shell. Not a memory provider. Disclosure — each hook runs python3 on the plugin's own scripts as a synchronous subprocess with a 10 s timeout (on every user message, after every write_file and patch, at the verify step and at session end), and those scripts run read-only git commands (rev-parse, remote get-url, worktree list, ls-tree, status, log) in the session's checkout and in the vault folder; the session primer and prompt hints put text from the vault's notes into the model's context; the hooks read the vault registry ~/.claude/vaults and the vault folders it lists, and write only inside the vault (_meta/index.json), a small per-session state file in the system temporary directory ($TMPDIR), and the plugin's own data directory; the init, seed, sync, tidy, trace and release procedures run the vault CLI through the terminal and commit to the vault's own git repository, and vault init appends the vault to ~/.claude/vaults and, only when you pass its opt-in flags, copies a vault launcher to ~/.local/bin (--install-cli), installs report-only post-merge and pre-push hooks in your code checkouts (--git-hook), or adds a post-commit hook that pushes every vault commit to the remote you name (--backup-remote); vault export writes an HTML map that loads d3 7.9.0 from cdnjs.cloudflare.com when opened; no other network calls, no telemetry, no credentials, no dependencies beyond Python 3.9 and git. Silent until a vault covers the session's working directory."
description_tr: "Kod tabanınızın nasıl çalıştığının (modüller, akışlar, entegrasyonlar, platform tuzakları, kararlar) Obsidian uyumlu bir haritası; depo dışında tutulur ve kancalarla güncel tutulur: ilk turda bir giriş, sorduğunuz veya düzenlediğiniz şeylerin sahibi olan notlara işaretçiler ve kod taşındığında ancak harita taşınmadığında verify kapısı aracılığıyla bir hatırlatıcı. Sekiz adet lightkeeper:* yeteneği prosedürleri (init, seed, tidy, trace, release, knowledge-vault, vault-sync, vault-tidy) taşır; vault CLI (find, check, sync, status, log, export) herhangi bir kabuktan çalışır. Bir bellek sağlayıcısı değildir. Bilgilendirme — her kanca, eklentinin kendi betiklerini 10 saniye zaman aşımıyla senkron bir alt işlem olarak python3 ile çalıştırır (her kullanıcı mesajında, her write_file ve patch işleminden sonra, verify adımında ve oturum sonunda) ve bu betikler oturumun checkout'unda ve vault klasöründe salt okunur git komutları (rev-parse, remote get-url, worktree list, ls-tree, status, log) çalıştırır; oturum girişi ve istem ipuçları, vault notlarındaki metni modelin bağlamına yerleştirir; kancalar vault kayıt defterini ~/.claude/vaults ve listelediği vault klasörlerini okur ve yalnızca vault (_meta/index.json), sistem geçici dizininde ($TMPDIR) küçük bir oturum başına durum dosyası ve eklentinin kendi veri dizini içine yazar; init, seed, sync, tidy, trace ve release prosedürleri vault CLI'yı terminal üzerinden çalıştırır ve vault'un kendi git deposuna commit yapar; vault init, vault'u ~/.claude/vaults'a ekler ve yalnızca onay bayraklarını ilettiğinizde bir vault başlatıcıyı ~/.local/bin'e kopyalar (--install-cli), kod checkout'larınıza yalnızca rapor veren post-merge ve pre-push kancaları yükler (--git-hook) veya her vault commit'ini belirttiğiniz uzak sunucuya iten bir post-commit kancası ekler (--backup-remote); vault export, açıldığında cdnjs.cloudflare.com'dan d3 7.9.0'ı yükleyen bir HTML haritası yazar; başka ağ çağrısı, telemetri, kimlik bilgisi yoktur, Python 3.9 ve git dışındaki bağımlılıklar yoktur. Bir vault oturumu kapsayana kadar sessiz kalır..."
