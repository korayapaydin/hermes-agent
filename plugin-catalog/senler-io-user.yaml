name: senler-io-user
title: Senler.io
repo: https://github.com/SenlerBot/senler-io-user-hermes-plugin
sha: 2294619a45f313f7c4d7c6b75bfa8e3781659253
description: "Get task-specific guidance for Senler agents, automations and knowledge, connect your account through MCP OAuth, and automate selected webhook events with an outbound Relay connection. Disclosure — Hermes installs the declared `python-socks[asyncio]` dependency for native SOCKS proxy support. First activation of the enabled plugin adds a `senler-io-user` MCP server (mcp-senler-io-user.senler.io; OAuth handled by Hermes) to the profile's config.yaml and records completion through plugin settings, which native uninstall clears. Reinstalling and enabling the plugin prepares a missing MCP again. The old durable marker from 0.5.2–0.5.3 is ignored, so upgrading restores a missing entry once, including an entry manually removed before this upgrade. Existing compatible and disabled connections are preserved; later loads in the same installation respect manual removal. Explicit chat setup can restore a removed connection. Relay setup enables a `senler-io` gateway platform in the same profile. Once you enable automation, the gateway keeps an outbound WSS connection to a Senler-supplied Relay address and runs unattended agent turns on incoming Senler events (customer messages, leads, etc.); the platform is `trusted_inbound`, so these events bypass Hermes allowlists and pairing, and customer text reaches the model as untrusted data. During those runs a hook allows the Senler MCP and native tool discovery and pins customer replies to the event's dialog, but other Senler MCP writes run without a Hermes approval prompt, limited only by your saved instructions and your Senler account permissions. Relay credentials, instructions, event payloads and reports are stored unencrypted in `<HERMES_HOME>/senler-io-relay.sqlite3`; result reports (up to 16,000 characters) and this machine's hostname (as the Relay client name) are sent to Senler. Configured monitoring also stores notification recipients, queued texts and delivery receipts in that database; the selected native Hermes messaging adapter sends summaries and delivery-test messages to the saved recipient."
description_tr: "Senler ajanları, otomasyonları ve bilgisi için göreve özgü rehberlik alın, hesabınızı MCP OAuth ile bağlayın ve seçili webhook olaylarını giden bir Relay bağlantısıyla otomatikleştirin. Açıklama — Hermes, yerel SOCKS proxy desteği için bildirilen `python-socks[asyncio]` bağımlılığını kurar. Etkin eklentinin ilk etkinleştirilmesi, profilin config.yaml dosyasına bir `senler-io-user` MCP sunucusu (mcp-senler-io-user.senler.io; OAuth Hermes tarafından yönetilir) ekler ve tamamlanmayı eklenti ayarları üzerinden kaydeder; yerel kaldırma bunu temizler. Eklentinin yeniden kurulup etkinleştirilmesi eksik bir MCP'yi yeniden hazırlar. 0.5.2–0.5.3 sürümünden kalan eski kalıcı işaret yok sayılır, böylece yükseltme eksik bir girdiyi bir kez geri getirir; bu yükseltmeden önce elle kaldırılmış bir girdi de buna dahildir. Mevcut uyumlu ve devre dışı bağlantılar korunur; aynı kurulumdaki sonraki yüklemeler elle kaldırmaya saygı duyar. Açık sohbet kurulumu kaldırılmış bir bağlantıyı geri getirebilir. Relay kurulumu aynı profilde bir `senler-io` ağ geçidi platformunu etkinleştirir. Otomasyonu etkinleştirdiğinizde ağ geçidi, Senler tarafından sağlanan bir Relay adresine giden bir WSS bağlantısı tutar ve gelen Senler olaylarında (müşteri mesajları, potansiyel müşteriler vb.) gözetimsiz ajan turları çalıştırır; platform `trusted_inbound` olduğundan bu olaylar Hermes izin listelerini ve eşleştirmeyi atlar ve müşteri metni modele güvenilmeyen veri olarak ulaşır. Bu koşular sırasında bir kanca Senler MCP'sine ve yerel araç keşfine izin verir ve müşteri yanıtlarını olayın diyaloğuna sabitler, ancak diğer Senler MCP yazmaları Hermes onay istemi olmadan çalışır; yalnızca kaydedilmiş talimatlarınız ve Senler hesap izinlerinizle sınırlıdır. Relay kimlik bilgileri, talimatlar, olay yükleri ve raporlar `<HERMES_HOME>/senler-io-relay.sqlite3` dosyasında şifrelenmemiş olarak saklanır; sonuç raporları (16.000 karaktere kadar) ve bu makinenin ana makine adı (Relay istemci adı olarak) Senler'e gönderilir. Yapılandırılmış izleme ayrıca bildirim alıcılarını, kuyruğa alınmış metinleri ve teslim makbuzlarını o veritabanında saklar; seçilen yerel Hermes mesajlaşma bağdaştırıcısı özetleri ve teslim testi mesajlarını kaydedilmiş alıcıya gönderir."
