name: atmorouter
title: AtmoRouter
repo: https://github.com/bayuh85/hermes-atmorouter
sha: fd1002c51cc7069696a5db5b391faed77279f910
description: "AtmoRouter — OpenAI-compatible gateway; one key for Claude, GPT, Gemini, GLM, Kimi, Qwen, DeepSeek, MiniMax and Grok models, with the /model picker fed by the live GET /v1/models catalog. Disclosure — sends your prompts, conversation history, tool definitions, tool results and ATMOROUTER_API_KEY to atmorouter.dev, which forwards each request to the upstream infrastructure serving the chosen model; that infrastructure's location and retention vary per model and zero retention is not promised (AtmoRouter states it keeps metadata, not prompt or response content, in its usage records and does not train on API content; https://atmorouter.dev/privacy). Usage is billed per token from a prepaid AtmoRouter balance (USDC on Solana or QRIS); prices vary by capacity tier and a request can route to any listed tier, including tiers above official pricing, unless you set maximum prices under Budgets; failed upstream requests are not billed and the plugin itself makes no payments."
description_tr: "AtmoRouter — OpenAI uyumlu ağ geçidi; Claude, GPT, Gemini, GLM, Kimi, Qwen, DeepSeek, MiniMax ve Grok modelleri için tek bir anahtar sağlar; /model seçicisi canlı GET /v1/models kataloğundan beslenir. Açıklama — İstemlerinizi, konuşma geçmişini, araç tanımlarını, araç sonuçlarını ve ATMOROUTER_API_KEY'i atmorouter.dev adresine gönderir; burası her isteği seçilen modeli sunan üst altyapıya iletir; bu altyapının konumu ve veri saklama politikası modele göre değişir ve sıfır saklama sözü verilmez (AtmoRouter, kullanım kayıtlarında istem veya yanıt içeriğini değil, yalnızca üst verileri sakladığını ve API içeriğiyle eğitim yapmadığını belirtir; https://atmorouter.dev/privacy). Kullanım, ön ödemeli bir AtmoRouter bakiyesinden (Solana üzerinde USDC veya QRIS) belirteç başına faturalandırılır; fiyatlar kapasite katmanına göre değişir ve bir istek, Bütçeler altında maksimum fiyatlar belirlemediğiniz sürece resmi fiyatlandırmanın üzerindeki katmanlar da dahil olmak üzere listelenen herhangi bir katmana yönlendirilebilir; başarısız olan üst istekler faturalandırılmaz ve eklentinin kendisi herhangi bir ödeme yapmaz."
