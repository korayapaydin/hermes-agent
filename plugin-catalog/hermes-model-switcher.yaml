# Community catalog entry — hermes-model-switcher
#
# Owner-submitted: the PR author (nicolasestrem) owns and maintains the repo below.
# Exact-SHA pin (40-hex, resolves as a COMMIT on the repo). Dashboard-only plugin:
# the whole code surface is a Dashboard extension tab served through the plugin host.
name: hermes-model-switcher
repo: https://github.com/nicolasestrem/hermes-model-switcher
sha: d62530d906307154e16ed98bb9b4be10ea6fef56
description: >-
  Choose models across Hermes profiles from a Dashboard tab: a per-profile
  picker built on host-supplied model data (SDK-authenticated
  GET /api/model/options), a preview of provider/model intent across every
  supported model-selection slot (main, delegation, auxiliary, judge,
  fallback, MoA, cron, plugin and specialist), and one-click apply or revert
  with presets.
  Main-slot preview shows intended provider/model, not the exact persisted
  diff; the exact diff is shown only after host readback. Disclosure — its
  apply route reads and edits the profiles' config.yaml (that is the plugin's
  function) through public seams only: POST /api/model/set for main and
  compatible auxiliary slots, and public hermes_cli.config load/save under the
  target home for other slots; credential presence checks use public
  profile-scoped secret helpers (agent.secret_scope), and profile discovery
  uses public hermes_constants. The plugin makes no direct third-party
  requests and opens no provider caches or pricing registries directly, but
  its browser tab does call the host's /api/model/* routes through the
  Dashboard SDK, and the host options route may itself initiate provider or
  pricing I/O even without an explicit refresh request, so reads are not
  guaranteed cache-only.
  It runs no shell commands or background processes and reports nothing. The
  private undo journal stores a full pre-change snapshot of each config it
  edits, which can contain sensitive fields including embedded credentials.
  Saved presets also persist reviewed change values, potentially including
  inline credentials or credential-bearing base URLs, in presets.json (0600)
  under get_hermes_home()/state/hermes-model-switcher/ (0700).
  The host write route has no expected-revision check: readback surfaces many
  foreign edits as recovery_required, but a concurrent same-key edit can be
  overwritten undetected and full-state deletions retain an unrelated-write
  race, so not every foreign edit is guaranteed to surface.
maintainer: Nico Estrem
description_tr: "Bir Yönetim Paneli sekmesinden Hermes profilleri arasında modelleri seçin: Host tarafından sağlanan model verileriyle (SDK kimlik doğrulamalı GET /api/model/options) oluşturulmuş profil başına bir seçici, desteklenen her model seçme yuvası (ana, delegasyon, yardımcı, yargıç, yedek, MoA, cron, eklenti ve uzman) genelinde sağlayıcı/model niyetinin bir önizlemesi ve ön ayarlar ile tek tıkla uygulama veya geri alma özelliği. Ana yuva önizlemesi, tam olarak kaydedilmiş farkı değil, hedeflenen sağlayıcı/modeli gösterir; tam fark yalnızca host geri okumasından sonra gösterilir. Açıklama — Uygulama rotası, profillerin config.yaml dosyasını (eklentinin işlevi budur) yalnızca genel eklemler üzerinden okur ve düzenler: Ana ve uyumlu yardımcı yuvalar için POST /api/model/set ve diğer yuvalar için hedef ana dizin altında genel hermes_cli.config yükleme/kaydetme; kimlik bilgisi varlık kontrolleri genel profil kapsamlı gizli yardımcıları (agent.secret_scope) kullanır ve profil keşfi genel hermes_constants'ı kullanır. Eklenti doğrudan üçüncü taraf istekleri yapmaz ve sağlayıcı önbelleklerini veya fiyatlandırma kayıtlarını doğrudan açmaz, ancak tarayıcı sekmesi Yönetim Paneli SDK'sı üzerinden host'un /api/model/* rotalarını çağırır ve host seçenekler rotası, açık bir yenileme isteği olmasa bile sağlayıcı veya fiyatlandırma G/Ç işlemlerini başlatabilir, bu nedenle okumaların yalnızca önbellekten olduğu garanti edilemez. Kabuk komutu veya arka plan süreci çalıştırmaz ve hiçbir şey raporlamaz. Özel geri alma günlüğü, düzenlediği her yapılandırmanın değişiklik öncesi tam bir anlık görüntüsünü saklar; bu, gömülü kimlik bilgileri dahil hassas alanlar içerebilir. Kaydedilmiş ön ayarlar ayrıca incelenmiş değişiklik değerlerini, potansiyel olarak satır içi kimlik bilgilerini veya kimlik bilgisi taşıyan temel URL'leri get_hermes_home()/state/hermes-model-switcher/ (0700) altında presets.json (0600) içinde saklar. Host yazma rotasının beklenen-revizyon kontrolü yoktur: Geri okuma birçok yabancı düzenlemeyi recovery_required olarak ortaya çıkarır, ancak eşzamanlı aynı-anahtar düzenlemesi fark edilmeden üzerine yazılabilir ve tam durum silmeleri ilgisiz-yazma yarışı riskini taşır, bu nedenle her yabancı düzenlemenin ortaya çıkacağı garanti edilmez."
