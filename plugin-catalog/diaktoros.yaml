sha: baf20324f54360b2dfd44f855ab6292df8f742cc
description: "Unattended GitHub pull-request review between two Hermes agents: one pushes fixes, a different one reviews, rounds are capped in verdicts, a watchdog reports silent stalls, and the loop never merges. Disclosure — runs unattended Hermes agent turns inside bubblewrap (terminal and file tools, no network, no credentials); a host-side broker and the CLI write to GitHub (reviews, comments, labels, issues, repo webhooks, and opt-in fixer pushes, which may push CI fixes, merge commits of the base into a PR's own branch to resolve conflicts, and issue-fix branches and PRs, including an opt-in auto-fix that hands issues its triage seat labels (never P0-P2, capped per day) to the fixer without a maintainer, plus an opt-in clean merge of the base into a review-only author's same-repository PR branch when it conflicts or falls behind, a branch the loop does not own; it never merges a PR) with repo-scope PAT files you provide; edits Hermes's webhook_subscriptions.json directly and its watchdog re-adds this loop's routes while armed; writes gate scripts into the seat profiles' scripts/ folders and creates one hermes cron job (its migrate command replaces the old hermes-review-loop job and copies that plugin's settings); its backup command writes a 0600 archive of the plugin's state, including webhook route secrets, to a path you choose, and restore writes one back into the Hermes home and recreates the cron job (restore only archives you made: a crafted one can place files anywhere under the Hermes home); downloads PR archives from codeload.github.com, failed CI job logs from GitHub's log storage (redirected, without the token) and Rust crates from crates.io on the host; an opt-in observer feed posts loop notices and an optional weekly report to the chat you name; opt-in shadow reviews spend a second profile's model tokens on reviews that are recorded but never posted; its optional Desktop page and local dashboard API read loop state and can re-arm a failed run as `hermes dk retry` would, and doctor compares the installed commit with the plugin's latest GitHub release (read-only); deletes its own state and closed-PR review dirs in roots you configure; on OAuth seats its host proxy may force Hermes token refreshes that rewrite ~/.claude, ~/.codex, ~/.qwen and profile auth.json credentials, and on Claude subscription logins it identifies as Claude Code (Claude Code user-agent, x-app and OAuth beta headers). Nothing runs until you arm a loop. Linux only."
description_tr: "İki Hermes ajanı arasında gözetimsiz GitHub çekme isteği incelemesi: biri düzeltmeleri gönderir, başka biri inceler, turlar hüküm sayısıyla sınırlanır, bir izleyici sessiz takılmaları bildirir ve döngü asla birleştirmez. Açıklama — bubblewrap içinde gözetimsiz Hermes ajan turları çalıştırır (terminal ve dosya araçları, ağ yok, kimlik bilgisi yok); ana makine tarafındaki bir aracı ve CLI, sağladığınız depo kapsamlı PAT dosyalarıyla GitHub'a yazar (incelemeler, yorumlar, etiketler, sorunlar, depo webhook'ları ve isteğe bağlı düzeltici gönderimler; bunlar CI düzeltmelerini, çakışmaları çözmek için temel dalın commit'lerini bir PR'ın kendi dalına birleştirmeyi ve sorun düzeltme dalları ile PR'ları gönderebilir; buna bir bakımcı olmadan sorunlara triyaj koltuğu etiketlerini (asla P0-P2 değil, günlük sınırlı) düzelticiye veren isteğe bağlı bir otomatik düzeltme ve çakıştığında ya da geride kaldığında temel dalın yalnızca inceleme yapan bir yazarın aynı depodaki PR dalına isteğe bağlı temiz birleştirmesi de dahildir; bu, döngünün sahip olmadığı bir daldır; asla bir PR'ı birleştirmez); Hermes'in webhook_subscriptions.json dosyasını doğrudan düzenler ve izleyicisi kurulu olduğu sürece bu döngünün rotalarını yeniden ekler; koltuk profillerinin scripts/ klasörlerine kapı betikleri yazar ve bir hermes cron işi oluşturur (migrate komutu eski hermes-review-loop işini değiştirir ve o eklentinin ayarlarını kopyalar); yedekleme komutu, webhook rota sırları dahil eklentinin durumunun 0600 izinli bir arşivini seçtiğiniz bir yola yazar ve restore birini Hermes ana dizinine geri yazar ve cron işini yeniden oluşturur (yalnızca kendi oluşturduğunuz arşivleri geri yükleyin: hazırlanmış bir arşiv Hermes ana dizini altında herhangi bir yere dosya yerleştirebilir); ana makinede codeload.github.com'dan PR arşivlerini, GitHub'ın günlük depolamasından başarısız CI iş günlüklerini (yönlendirilmiş, token olmadan) ve crates.io'dan Rust crate'lerini indirir; isteğe bağlı bir gözlemci akışı, adını verdiğiniz sohbete döngü bildirimleri ve isteğe bağlı haftalık rapor gönderir; isteğe bağlı gölge incelemeler, kaydedilen ama hiç yayımlanmayan incelemeler için ikinci bir profilin model token'larını harcar; isteğe bağlı Desktop sayfası ve yerel pano API'si döngü durumunu okur ve başarısız bir koşuyu `hermes dk retry` yapacakmış gibi yeniden kurabilir, doctor ise kurulu commit'i eklentinin en son GitHub sürümüyle karşılaştırır (salt okunur); yapılandırdığınız köklerde kendi durumunu ve kapatılmış PR inceleme dizinlerini siler; OAuth koltuklarında ana makine proxy'si, ~/.claude, ~/.codex, ~/.qwen ve profil auth.json kimlik bilgilerini yeniden yazan Hermes token yenilemelerini zorlayabilir ve Claude abonelik girişlerinde Claude Code olarak tanımlanır (Claude Code user-agent, x-app ve OAuth beta başlıkları). Bir döngüyü kurmadan hiçbir şey çalışmaz. Yalnızca Linux."
