subdir: approval-ledger
description: "Local ledger of Hermes's approval prompts (dangerous commands, protected writes, MCP consent, smart-mode verdicts): /approval-log shows how often each rule asked, how many prompts were approved, denied or left unanswered, and how long a person took to answer, per rule, per surface or per day, for the last 24 hours, any number of hours or days, the latest session or everything recorded; /approval-log recent lists the newest decisions (ten, or up to 100 with /approval-log recent 50). Disclosure — writes decision metadata (session id, surface, rule label, answer, timings; no command, description or session key) to plugin-data/approval-ledger/approvals.jsonl, trimmed to 5,000 rows past 2 MB; observer only, cannot answer or change an approval; no network"
description_tr: "Hermes'in onay istemlerinin yerel defteri (tehlikeli komutlar, korumalı yazmalar, MCP onayı, akıllı kip hükümleri): /approval-log, her kuralın ne sıklıkta sorduğunu, kaç istemin onaylandığını, reddedildiğini ya da yanıtsız kaldığını ve bir kişinin yanıtlamak için ne kadar süre harcadığını kural, yüzey veya gün bazında son 24 saat, istenen sayıda saat ya da gün, en son oturum veya kayıtlı her şey için gösterir; /approval-log recent en yeni kararları listeler (on, ya da /approval-log recent 50 ile en fazla 100). Açıklama — karar üst verisini (oturum kimliği, yüzey, kural etiketi, yanıt, süreler; komut, açıklama veya oturum anahtarı yok) plugin-data/approval-ledger/approvals.jsonl dosyasına yazar ve 2 MB sonrasında 5.000 satıra kırpar; yalnızca gözlemcidir, bir onayı yanıtlayamaz veya değiştiremez; ağ erişimi yoktur."
