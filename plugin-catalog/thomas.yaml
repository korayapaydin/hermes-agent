name: thomas
repo: https://github.com/keppy/hermes-plugin-thomas
sha: 7302ab947f99e3adb16e78e139794fe1696134f8
description: >-
  Fine-tune a small calibrated encoder classifier on Modal and rate it with gonogo. Every GPU launch
  goes through the human approval gate with the exact config shown; data checks and evaluation run
  locally for free. Disclosure — thomas_encoder_train spends the user's Modal GPU credits and uploads
  the chosen training JSONL rows to Modal after the human approval gate; the base model is downloaded
  from Hugging Face on the Modal side. Training and inference run in a separate Python interpreter the
  user configures via THOMAS_PYTHON (with the author's thomas package, torch and modal installed); the
  Hermes venv only gets gonogo-eval. Runs and artifacts are written under HERMES_HOME/thomas/runs; the
  eval tool writes report files to the path the model supplies.
description_tr: "Modal üzerinde küçük, kalibre edilmiş bir kodlayıcı sınıflandırıcısı eğitin ve gonogo ile derecelendirin. Her GPU başlatma, tam yapılandırma gösterilerek insan onay kapısından geçer; veri denetimleri ve değerlendirme yerelde ücretsiz çalışır. Açıklama — thomas_encoder_train, insan onay kapısından sonra kullanıcının Modal GPU kredilerini harcar ve seçilen eğitim JSONL satırlarını Modal'a yükler; temel model Modal tarafında Hugging Face'ten indirilir. Eğitim ve çıkarım, kullanıcının THOMAS_PYTHON ile yapılandırdığı ayrı bir Python yorumlayıcısında (yazarın thomas paketi, torch ve modal kurulu olarak) çalışır; Hermes venv'ine yalnızca gonogo-eval kurulur. Çalıştırmalar ve çıktılar HERMES_HOME/thomas/runs altına yazılır; değerlendirme aracı rapor dosyalarını modelin verdiği yola yazar."
maintainer: keppy
tier: community
category: tools
requires_hermes: ">=0.21"
platforms: [linux, macos]
version: "0.1.3"
docs_url: https://github.com/keppy/hermes-plugin-thomas#readme
capabilities:
  provides_tools:
    - thomas_check_data
    - thomas_encoder_train
    - thomas_run_status
    - thomas_encoder_eval
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
