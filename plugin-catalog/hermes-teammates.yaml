name: hermes-teammates
repo: https://github.com/100yenadmin/hermes-teammates
sha: de85f5d4793e122cde98342bddd6e1bf3cd53459
description: "Give your agent a team: named subagents with their own instructions, tools and model, which it assigns work to, checks on and steers mid-task. The operator defines the roster; the agent follows up with a digest of earlier results and can work a Kanban teammates lane with a review handoff. Launches subagents only through the public ctx.subagent_lifecycle API. Stock Hermes; no patched core. Disclosure — adds six tools (teammates_roster, teammate_assign, teammate_check, teammate_wait, teammate_message, teammate_stop) and a /teammates command; the model picks only a teammate name, and the operator's config decides what it means. Teammates run as in-process Hermes subagents using credentials selected by Hermes from the parent, delegation settings or an operator-configured teammate route where supported. Toolsets narrow the parent's tools at toolset granularity only (the file toolset includes write_file and patch); Hermes can add inherited MCP toolsets back unless delegation.inherit_mcp_toolsets is false. A teammate with invalid settings refuses to launch. A delegated child cannot start teammates. Steering uses the lifecycle steer where Hermes provides it, otherwise delegate_task's steer action with the turn-bound parent. Under plugins.isolation: host every tool except the roster refuses. Optionally the roster is read from an operator-named YAML file (roster_file, relative to the profile home or absolute, so several profiles can share one); the plugin never writes it. It keeps a per-profile SQLite run ledger in its plugin-data folder (goals, statuses, clipped summaries, role hashes and available token receipts; no full transcripts). It does not read credential stores. Where supported in-process, subagent_start and post_api_request hooks collect token receipts for mapped child sessions. For a card assigned to its non-profile lane, it claims the card through the Kanban DB, heartbeats the claim and its worker, then moves the card to review without a reviewer, or blocks it on failure, a stop or an unavailable result; it never completes a card. It runs one in-process monitor thread per run to retain finished results and, for lane runs, keep the claim alive; no network calls, child processes or self-updates of its own. Completion-notice code exists but never injects on current Hermes because the host cannot bind notices to the receiving session; use teammate_wait instead. Includes a report-a-problem skill: the agent drafts a bug report and files it to this repository with gh only after the user approves the draft."
description_tr: "Hermes için adlandırılmış alt ajan takım arkadaşları: operatör bir kadro tanımlar (talimatlar, araç setleri, model) ve ajan onlara iş atar, sonuçları denetler, çalışan bir takım arkadaşına yön verir, önceki sonuçların özetiyle takip eder ve bir inceleme devriyle birlikte bir Kanban takım arkadaşları şeridinde çalışabilir. Alt ajanları yalnızca herkese açık ctx.subagent_lifecycle API'si üzerinden başlatır. Stok Hermes'tir; yamalanmış çekirdek yok. Açıklama — altı araç (teammates_roster, teammate_assign, teammate_check, teammate_wait, teammate_message, teammate_stop) ve bir /teammates komutu ekler; model yalnızca bir takım arkadaşı adı seçer ve operatörün yapılandırması bunun ne anlama geldiğine karar verir. Takım arkadaşları, Hermes'in üst öğeden, delegasyon ayarlarından ya da desteklendiği yerde operatör tarafından yapılandırılmış bir takım arkadaşı rotasından seçtiği kimlik bilgilerini kullanan süreç içi Hermes alt ajanları olarak çalışır. Araç setleri, üst öğenin araçlarını yalnızca araç seti ayrıntı düzeyinde daraltır (dosya araç seti write_file ve patch içerir); delegation.inherit_mcp_toolsets false olmadıkça Hermes devralınan MCP araç setlerini geri ekleyebilir. Geçersiz ayarlara sahip bir takım arkadaşı başlamayı reddeder. Devredilmiş bir alt öğe takım arkadaşı başlatamaz. Yönlendirme, Hermes'in sağladığı yerde yaşam döngüsü yönlendirmesini, aksi halde turla bağlı üst öğeyle delegate_task'ın yönlendirme eylemini kullanır. plugins.isolation: host altında kadro dışındaki her araç reddeder. İsteğe bağlı olarak kadro, operatör tarafından adlandırılmış bir YAML dosyasından okunur (roster_file, profil ana dizinine göreli ya da mutlak, böylece birkaç profil bir tanesini paylaşabilir); eklenti onu asla yazmaz. Eklenti verisi klasöründe profil başına bir SQLite çalışma defteri tutar (hedefler, durumlar, kısaltılmış özetler, rol karmaları ve mevcut token makbuzları; tam döküm yok). Kimlik bilgisi depolarını okumaz. Süreç içinde desteklendiği yerde subagent_start ve post_api_request kancaları, eşlenen alt oturumlar için token makbuzları toplar. Profil dışı şeridine atanmış bir kart için kartı Kanban DB üzerinden sahiplenir, sahiplenmeyi ve çalışanını kalp atışıyla canlı tutar, ardından kartı gözden geçirene olmadan incelemeye taşır ya da başarısızlık, durdurma veya sonucun bulunamaması durumunda engeller; bir kartı asla tamamlamaz. Tamamlanan sonuçları saklamak ve şerit çalışmalarında sahiplenmeyi canlı tutmak için çalışma başına bir süreç içi izleme iş parçacığı çalıştırır; kendi ağ çağrısı, alt süreci ya da kendi kendini güncellemesi yoktur. Tamamlama bildirimi kodu vardır ancak mevcut Hermes'te asla enjekte etmez çünkü ana makine bildirimleri alan oturuma bağlayamaz; bunun yerine teammate_wait kullanın. Bir sorun bildirme yeteneği içerir: ajan bir hata raporu taslağı hazırlar ve yalnızca kullanıcı taslağı onayladıktan sonra gh ile bu depoya iletir."
