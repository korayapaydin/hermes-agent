name: orcaslicer
repo: https://github.com/mazzanfar/hermes-orcaslicer
sha: 8fc3a5a40ef4e0c639b76cefd90ad9a48a1a51ec
version: "0.5.1"
title: OrcaSlicer for Hermes
description: >-
  Prepare, slice, preflight and export 3D prints with stock OrcaSlicer profiles.
  Includes explicit printer upload/control, camera snapshots and monitoring
  through supported protocols. Protocol and hardware limits are documented.
  Independent of OrcaSlicer and Nous Research.
  Disclosure — executes the installed local slicer and exposes printer upload,
  start, pause, resume and cancel; agent-supplied confirmation is not independent
  human authentication. Printer/camera credentials are read from ORCA_*/HERMES_ORCA_*
  environment variables named in tool arguments (HTTPS required unless allow_plaintext_credentials
  is set); plugin state lives in ~/.hermes-orca (HERMES_ORCA_HOME), outside HERMES_HOME.
description_tr: "Stok OrcaSlicer profilleriyle 3B baskıları hazırlayın, dilimleyin, ön denetimden geçirin ve dışa aktarın. Açık yazıcı yükleme/denetimi, kamera anlık görüntüleri ve desteklenen protokollerle izleme dâhil. Protokol ve donanım sınırları belgelenmiştir. OrcaSlicer ve Nous Research'ten bağımsız. Açıklama — kurulu yerel dilimleyiciyi çalıştırır ve yazıcıya yükleme, başlatma, duraklatma, sürdürme ve iptal etme olanaklarını sunar; ajan tarafından sağlanan onay, bağımsız bir insan kimlik doğrulaması değildir. Yazıcı/kamera kimlik bilgileri, araç bağımsız değişkenlerinde adlandırılan ORCA_*/HERMES_ORCA_* ortam değişkenlerinden okunur (allow_plaintext_credentials ayarlanmadıkça HTTPS gerekir); eklenti durumu ~/.hermes-orca (HERMES_ORCA_HOME) altında, HERMES_HOME dışında tutulur."
maintainer: mazzanfar
tier: community
