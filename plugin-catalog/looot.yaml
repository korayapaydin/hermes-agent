name: looot
repo: https://github.com/loootai/hermes-looot
sha: b4d9a4a212139938c7e8c1b10d5e73f8b0b70c59
description: "looot gives Hermes one sign-in and one prepaid balance for 2,500+ data API endpoints from 90+ providers: work emails and phones, company and people search, Google results, web pages as markdown, news, local businesses. Portable Agent Plugins v1 package with the hosted MCP server (remote streamable-http, OAuth 2.1 with dynamic client registration) and 21 skills. Disclosure — the run tool spends your prepaid looot balance (Hermes asks before each paid call and refuses them in unattended runs); the names, domains and emails you look up are sent to looot.ai and its upstream data providers; a `looot` server you define in config.yaml replaces the package's and drops that prompt unless you add `trust: untrusted`."
description_tr: "looot, Hermes'e 90'dan fazla sağlayıcıdan 2.500'den fazla veri API ucu için tek bir giriş ve tek bir ön ödemeli bakiye verir: iş e-postaları ve telefonları, şirket ve kişi araması, Google sonuçları, markdown olarak web sayfaları, haberler, yerel işletmeler. Barındırılan MCP sunucusu (uzak streamable-http, dinamik istemci kaydıyla OAuth 2.1) ve 21 yetenek içeren Taşınabilir Agent Plugins v1 paketi. Açıklama — run aracı ön ödemeli looot bakiyenizi harcar (Hermes her ücretli çağrıdan önce sorar ve gözetimsiz çalışmalarda bunları reddeder); aradığınız adlar, alan adları ve e-postalar looot.ai ve üst veri sağlayıcılarına gönderilir; config.yaml içinde tanımladığınız bir `looot` sunucusu paketinkinin yerini alır ve `trust: untrusted` eklemediğiniz sürece bu istemi devre dışı bırakır."
