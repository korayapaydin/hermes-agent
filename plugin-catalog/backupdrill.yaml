title: BackupDrill
description: "Back up a Supabase project to your own S3, R2 or B2 bucket with the open-source backupdrill CLI (the Postgres database, plus Storage files once their S3 keys are set), then restore the snapshot into a throwaway Postgres in Docker to check it comes back. Disclosure — a skill only, with no Python, hooks or server: it has the agent run npx -y backupdrill@2.7.1 in shell commands, which npx downloads from npm on first run. The CLI connects to the user's Supabase project and their own bucket, and a drill pulls a postgres image from Docker Hub. The connection string and bucket keys stay in a .env.backupdrill file the user fills in; each command loads it in a subshell and never prints it. Nothing is sent to BackupDrill."
description_tr: "Açık kaynaklı backupdrill CLI ile bir Supabase projesini kendi S3, R2 veya B2 kovanıza yedekleyin (Postgres veritabanı ve S3 anahtarları ayarlandıktan sonra Depolama dosyaları), ardından yedeği Docker'daki geçici bir Postgres'e geri yükleyerek geri geldiğini kontrol edin. Açıklama — Python, kanca veya sunucu içermeyen, yalnızca bir yetenektir: Ajanın kabuk komutlarında npx -y backupdrill@2.7.1 çalıştırmasını sağlar, npx bunu ilk çalıştırmada npm'den indirir. CLI, kullanıcının Supabase projesine ve kendi kovasına bağlanır ve bir tatbikat Docker Hub'dan bir postgres imajı çeker. Bağlantı dizesi ve kova anahtarları, kullanıcının doldurduğu bir .env.backupdrill dosyasında kalır; her komut bunu bir alt kabukta yükler ve asla yazdırmaz. BackupDrill'e hiçbir şey gönderilmez."
