description: 'Local-first WeRead (微信读书) reading companion: syncs bookshelf, reading
  stats and notes to the local machine and turns them into private reading cards and
  weekly/monthly reviews through 8 MCP tools, with a built-in fictional demo mode for
  previews. Engine pinned to an immutable git commit (e5f6673) over npx stdio; Portable
  Agent Plugins v1 package (mcp.json + skills/), needs Node.js 20+ on PATH. All data stays
  in PLUGIN_DATA; never posts to WeRead — cards and reviews are local files saved only
  after user confirmation. Disclosure — live mode sends your WEREAD_API_KEY as a Bearer token plus book ids and paging cursors to i.weread.qq.com (Tencent''s WeRead agent gateway) and nothing else; the engine''s MCP tool descriptions and error messages are Chinese-only while the skills are English-first; the engine''s npm dependencies resolve as caret ranges at first launch.'
description_tr: "Yerel öncelikli WeRead (微信读书) okuma arkadaşı: kitaplığı, okuma istatistiklerini ve notları yerel makineye eşitler ve 8 MCP aracıyla bunları özel okuma kartlarına ve haftalık/aylık incelemelere dönüştürür; önizlemeler için yerleşik kurgusal demo kipi vardır. Motor, npx stdio üzerinden değişmez bir git işlemesine (e5f6673) sabitlenmiştir; Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), PATH'te Node.js 20+ gerekir. Tüm veriler PLUGIN_DATA içinde kalır; WeRead'e asla gönderi yapılmaz — kartlar ve incelemeler, yalnızca kullanıcı onayından sonra kaydedilen yerel dosyalardır. Açıklama — canlı kip, WEREAD_API_KEY değerinizi Bearer token olarak ve kitap kimlikleri ile sayfalama imleçlerini i.weread.qq.com adresine (Tencent'in WeRead ajan ağ geçidi) gönderir, başka hiçbir şey göndermez; motorun MCP araç açıklamaları ve hata mesajları yalnızca Çince, yetenekler ise İngilizce önceliklidir; motorun npm bağımlılıkları ilk açılışta caret aralıkları olarak çözümlenir."
