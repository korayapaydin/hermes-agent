name: zalo-platform
repo: https://github.com/moken627-hub/hermes-plugin-zalo
sha: 5a989368d0877c930e76fcc75ea125e7af7ea872
description: "Zalo Bot Platform gateway adapter for Hermes Agent — relays messages between Zalo DMs/groups and the agent over the official Bot API (bot-api.zaloplatforms.com), long-polling or webhook mode. Adds slash commands and moderation. Zero extra dependencies (uses httpx, already a Hermes dependency). Production-tested on multiple Vietnamese deployments. Disclosure — connects to the third-party Zalo Bot API (bot-api.zaloplatforms.com) with your bot token; long-polling by default, or opt-in webhook mode with a listener on 127.0.0.1 by default that checks the X-Bot-Api-Secret-Token header; the setup wizard writes ZALO_* values to ~/.hermes/.env; group chat history is stored locally under <HERMES_HOME>/zalo-history."
description_tr: "Hermes Agent için Zalo Bot Platform ağ geçidi bağdaştırıcısı — mesajları Zalo DM/grupları ile ajan arasında resmî Bot API'si (bot-api.zaloplatforms.com) üzerinden aktarır, uzun yoklama ya da webhook kipi. Eğik çizgi komutları ve denetim ekleri. Ek bağımlılık yok (zaten bir Hermes bağımlılığı olan httpx'i kullanır). Birden fazla Vietnamca dağıtımında üretimde test edilmiştir. Açıklama — bot token'ınızla üçüncü taraf Zalo Bot API'sine (bot-api.zaloplatforms.com) bağlanır; varsayılan olarak uzun yoklama yapar ya da isteğe bağlı webhook kipini kullanır; bu kipte varsayılan olarak 127.0.0.1 üzerinde X-Bot-Api-Secret-Token başlığını kontrol eden bir dinleyici bulunur; kurulum sihirbazı ZALO_* değerlerini ~/.hermes/.env dosyasına yazar; grup sohbet geçmişi <HERMES_HOME>/zalo-history altında yerel olarak saklanır."
maintainer: moken627-hub
tier: community
category: platform
requires_hermes: ">=0.19"
