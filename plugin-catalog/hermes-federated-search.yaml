name: hermes-federated-search
repo: https://github.com/kumaxs/hermes-federated-search
sha: 566b3ccc6aeff7e39c19dcfd779ade107827043c
description: "Federated web search backend (provider name `federated`): fans one query out to multiple configured search backends in parallel and returns merged, deduplicated, relevance-ranked results (keyword scoring; optional LLM re-rank with automatic fallback). Phase 2 — official settings-page exposure (config_schema, six keys) merged with the legacy web.federated block, and per-line multi-card credential pools (environment-variable names only) with automatic failover and host-aligned cooldowns. Phase 3 — a desktop card config page (Settings → Plugins; opt-in via Settings → Skills & Tools → Plugins): one card per line, two-level membership checkboxes (backends / credentials), add/remove lines and keys, a per-line Key rotation strategy (pool_strategy), an LLM ranker model picker (seventh schema key `ranker`), and a current-settings string with paste import; no type picker/badges (`type` round-trips verbatim); every edit serializes back to the settings tree (string ↔ UI parity). The LLM re-rank request pins thinking off (`reasoning_effort=off`) and the card page states it. Disclosure — reads the operator's config.yaml (read-only) for its own settings (web.federated and plugins.entries.hermes-federated-search.settings); sends the query to the operator-configured sub-backends (registered providers or custom HTTP endpoints); no telemetry, no subprocesses, no credential storage (key values stay in the runtime environment)."
description_tr: "Federe web araması arka ucu (sağlayıcı adı `federated`): tek bir sorguyu paralel olarak yapılandırılmış birden çok arama arka ucuna dağıtır ve birleştirilmiş, yinelenenleri temizlenmiş, ilgililiğe göre sıralanmış sonuçlar döndürür (anahtar kelime puanlaması; otomatik geri dönüşle isteğe bağlı LLM yeniden sıralaması). Aşama 2 — eski web.federated bloğuyla birleştirilmiş resmi ayarlar sayfası sunumu (config_schema, altı anahtar) ve satır başına çoklu kart kimlik bilgisi havuzları (yalnızca ortam değişkeni adları) ile otomatik hata devri ve ana makineye göre hizalanmış bekleme süreleri. Aşama 3 — bir masaüstü kart yapılandırma sayfası (Ayarlar → Eklentiler; Ayarlar → Yetenekler ve Araçlar → Eklentiler üzerinden etkinleştirilir): satır başına bir kart, iki kademeli üyelik onay kutuları (arka uçlar / kimlik bilgileri), satır ve anahtar ekleme/kaldırma, satır başına anahtar döndürme stratejisi (pool_strategy), bir LLM sıralayıcı model seçici (yedinci şema anahtarı `ranker`) ve yapıştırarak içe aktarılabilen bir geçerli ayarlar dizesi; tür seçici/rozet yok (`type` olduğu gibi geri döner); her düzenleme ayarlar ağacına geri serileştirilir (dize ↔ arayüz eşliği). LLM yeniden sıralama isteği düşünmeyi kapalı tutar (`reasoning_effort=off`) ve kart sayfası bunu belirtir. Açıklama — kendi ayarları için işletmecinin config.yaml dosyasını (salt okunur) okur (web.federated ve plugins.entries.hermes-federated-search.settings); sorguyu işletmeci tarafından yapılandırılmış alt arka uçlara gönderir (kayıtlı sağlayıcılar veya özel HTTP uç noktaları); telemetri yok, alt süreç yok, kimlik bilgisi depolama yok (anahtar değerleri çalışma zamanı ortamında kalır)."
