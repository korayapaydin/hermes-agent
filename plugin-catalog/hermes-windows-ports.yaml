subdir: windows-ports
description: >-
  Answer "who holds this port" on Windows. win_port_owners reads the TCP and UDP owner
  tables through iphlpapi (the same rows netstat -ano prints, with the owning PID attached)
  and resolves each PID to its image name and path, returning one structured record per
  endpoint. Filters cover one port, several ports, a process substring, the protocol (tcp,
  udp or both), the TCP state (listen, established, any state name, or all; UDP rows report
  bound) and IPv6 inclusion, with a record cap and a per-process summary of the rows
  returned. Built for the failure mode that stalls agents on Windows: a gateway, backend or
  bridge that cannot bind, where the error names a port but not the process holding it.
  netstat -ano prints columns, not fields, and its PID still needs a second command
  (tasklist, or a PowerShell round-trip) to become an image name; this tool is one
  in-process call instead of a shell parse plus a join, with no child process and no
  dependency on PowerShell being installed or allowed by execution policy. A protected
  process whose image cannot be queried keeps its PID and reports
  a null process name instead of failing the call. Disclosure - the tool reports the local
  and remote addresses, ports, PIDs and process image paths that netstat -ano and Task
  Manager already show, and those values reach the model; treat the output like any other
  local diagnostic listing. Read-only: no socket is opened, bound or connected, the only
  process access is QueryFullProcessImageName with PROCESS_QUERY_LIMITED_INFORMATION to read
  an image name, and there is no memory reading, no handle inheritance and no injection.
  Stdlib-only (ctypes): no Python dependencies, no child processes, no network calls, no file
  writes, no self-update. Windows only.
maintainer: Yicheng-Mark
description_tr: "Windows üzerinde \\\"bu portu kim tutuyor\\\" sorusuna yanıt verir. win_port_owners, iphlpapi aracılığıyla TCP ve UDP sahip tablolarını okur (netstat -ano'nun yazdırdığı satırların aynısı, ancak sahip olan PID eklenmiş halidir) ve her bir PID'yi görüntü adına ve yoluna çözerek uç nokta başına yapılandırılmış bir kayıt döndürür. Filtreler; tek bir portu, birkaç portu, bir işlem alt dizgisini, protokolü (tcp, udp veya her ikisi), TCP durumunu (listen, established, herhangi bir durum adı veya tümü; UDP satırları bound olarak bildirilir) ve IPv6 dahil edilmesini kapsar; ayrıca bir kayıt sınırı ve döndürülen satırların işlem başına özeti bulunur. Windows'taki ajanları duraksatan hata modu için oluşturulmuştur: bağlama yapamayan bir ağ geçidi, arka uç veya köprü olduğunda, hata bir port adını belirtir ancak onu tutan işlemi belirtmez. netstat -ano alanlar değil sütunlar yazdırır ve PID'sinin bir görüntü adına dönüşmesi için hala ikinci bir komuta (tasklist veya bir PowerShell döngüsü) ihtiyaç vardır; bu araç, bir kabuk ayrıştırması ve birleştirme işlemi yerine tek bir işlem içi çağrı yapar, alt işlem başlatmaz ve PowerShell'in yüklü olmasına veya yürütme politikası tarafından izin verilmesine bağımlı değildir. Görüntüsü sorgulanamayan korumalı bir işlem, PID'sini korur ve çağrıyı başarısız kılmak yerine boş bir işlem adı bildirir. Bilgilendirme - araç, netstat -ano ve Görev Yöneticisi'nin zaten gösterdiği yerel ve uzak adresleri, portları, PID'leri ve işlem görüntü yollarını bildirir ve bu değerler modele ulaşır; çıktıyı diğer yerel tanılam listeleri gibi değerlendirin. Salt okunurdur: hiçbir soket açılmaz, bağlanmaz veya bağlanmaz; tek işlem erişimi, bir görüntü adını okumak için PROCESS_QUERY_LIMITED_INFORMATION ile QueryFullProcessImageName'dir; bellek okuma, tutamaç kalıtımı veya enjeksiyon yoktur. Yalnızca standart kütüphane (ctypes) kullanılır: Python bağımlılıkları, alt işlemler, ağ çağrıları, dosya yazımları veya otomatik güncellemeler yoktur. Yalnızca Windows."
