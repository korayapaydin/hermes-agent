name: woof
repo: https://github.com/recastsystems/hermes-woof
sha: 2c82b34eb386a490d25439757556f6bab84048af
description: "Plan, launch, watch and compare WOOF weather simulations on your own NVIDIA GPU: size runs with WOOF's own planner, launch them locally or on an ssh/WSL GPU host, get maps in the chat while the forecast runs, compare physics or resolution, run multi-arm research campaigns and score runs against radar and surface observations. Disclosure — runs need Linux x86_64 with an NVIDIA GPU (plan-only elsewhere); the user-run hermes woof install pip-installs recast-woof>=1.0.0,<1.1 into ~/woof-env and downloads WOOF tables and optional geography (about 1.6 GB); runs execute the WOOF CLI as detached background jobs writing to ~/woof-runs and fetch public weather data; run events are pushed into the chat as user-role messages; the optional serve/ scripts download llama.cpp and a Qwen GGUF and start an unauthenticated local model server."
description_tr: "WOOF hava durumu benzetimlerini kendi NVIDIA GPU'nuzda planlayın, başlatın, izleyin ve karşılaştırın: koşuları WOOF'un kendi planlayıcısıyla boyutlandırın, yerel olarak ya da bir ssh/WSL GPU konağında başlatın, tahmin sürerken sohbette haritalar alın, fizik ya da çözünürlük karşılaştırın, çok kollu araştırma kampanyaları yürütün ve koşuları radar ile yüzey gözlemlerine karşı puanlayın. Açıklama — Koşular Linux x86_64 ve NVIDIA GPU gerektirir (başka yerlerde yalnızca planlama); kullanıcının çalıştırdığı hermes woof install, recast-woof>=1.0.0,<1.1 paketini pip ile ~/woof-env içine kurar ve WOOF tablolarını ve isteğe bağlı coğrafyayı (yaklaşık 1,6 GB) indirir; koşular WOOF CLI'yi ~/woof-runs dizinine yazan ayrık arka plan işleri olarak çalıştırır ve genel hava durumu verilerini getirir; koşu olayları sohbete kullanıcı rolünde mesajlar olarak itilir; isteğe bağlı serve/ betikleri llama.cpp ve bir Qwen GGUF indirir ve kimlik doğrulaması olmayan yerel bir model sunucusu başlatır."
maintainer: recastsystems
tier: community
category: tools
version: "0.1.0"
docs_url: https://github.com/recastsystems/hermes-woof#readme
capabilities:
  provides_tools:
    - woof_doctor
    - woof_catalog
    - woof_docs
    - woof_plan
    - woof_launch
    - woof_status
    - woof_stop
    - woof_show
    - woof_compare
    - woof_campaign
    - woof_score
    - woof_report
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - on_session_end
  provides_middleware: []
  requires_env: []
