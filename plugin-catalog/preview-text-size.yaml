title: Preview Text Size
description: "Larger or smaller text in the Hermes Desktop file preview pane: scales the rendered Markdown from 90% to 175%, independent of Chat Text Size and UI Scale, through a row in Settings → Appearance, three command-palette entries and rebindable shortcuts (⌘⌥=, ⌘⌥-, ⌘⌥0 on macOS; unbound by default on Windows and Linux, where Ctrl+Alt is AltGr). The Source and Diff views keep their size. Disclosure — desktop-only (desktop/plugin.js inside the plugin SDK surface); appends one stylesheet that sets CSS zoom on the preview's [data-preview-markdown] element, removed on disable, so a Desktop release that renames that attribute turns the plugin into a no-op; stores the chosen size in plugin storage; no network calls, credentials, shell commands, background processes or telemetry."
description_tr: "Hermes Masaüstü dosya önizleme panelinde daha büyük veya küçük metin: oluşturulan Markdown'u, Sohbet Metin Boyutu ve UI Ölçeğinden bağımsız olarak %90'dan %175'e kadar ölçeklendirir; bu işlem Ayarlar → Görünüm altındaki bir satır, üç komut paleti girişi ve yeniden atanabilir kısayollar (macOS'ta ⌘⌥=, ⌘⌥-, ⌘⌥0; Windows ve Linux'ta varsayılan olarak atanmamıştır, burada Ctrl+Alt, AltGr'dir) üzerinden yapılır. Kaynak ve Fark görünümleri boyutlarını korur. Bilgilendirme — yalnızca masaüstü (eklenti SDK yüzeyi içindeki desktop/plugin.js); önizlemenin [data-preview-markdown] öğesi üzerinde CSS zoom ayarlayan bir stil sayfası ekler, devre dışı bırakıldığında kaldırılır, bu nedenle bu özniteliği yeniden adlandıran bir Masaüstü sürümü eklentiyi etkisiz hale getirir; seçilen boyutu eklenti depolamasında saklar; ağ çağrısı, kimlik bilgisi, kabuk komutu, arka plan işlemi veya telemetri yoktur."
