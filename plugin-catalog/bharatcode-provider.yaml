description: "BharatCode (bharatcode.ai) OpenAI-compatible model provider — free student tier, native /model integration. Disclosure — model provider; prompts, tool schemas and BHARATCODE_API_KEY go to bharatcode.ai (BharatCode, India), which processes prompts through third-party inference partners, some outside India; outside paid Pro (complimentary or referral Pro included) BharatCode may retain private prompt/response logs for debugging, abuse review and product quality, and even on paid Pro a flagged account can have a time-limited sample of up to 100 prompts and responses captured for security review."
description_tr: "BharatCode (bharatcode.ai) OpenAI uyumlu model sağlayıcısı — ücretsiz öğrenci katmanı, yerleşik /model entegrasyonu. Açıklama — model sağlayıcısı; istemler, araç şemaları ve BHARATCODE_API_KEY bharatcode.ai adresine (BharatCode, Hindistan) gider; bu servis istemleri üçüncü taraf çıkarım ortakları üzerinden işler ve bunların bazıları Hindistan dışındadır; ücretli Pro dışında (ücretsiz ya da referans Pro dahil) BharatCode özel istem/yanıt günlüklerini hata ayıklama, kötüye kullanım incelemesi ve ürün kalitesi için saklayabilir ve ücretli Pro'da bile işaretlenmiş bir hesabın en fazla 100 istem ve yanıtından oluşan süre sınırlı bir örnek güvenlik incelemesi için yakalanabilir."
maintainer: thenabbu
