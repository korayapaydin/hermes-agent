name: honcho
repo: https://github.com/plastic-labs/honcho
sha: e2d2aba182862deeb846e5cd4a30a41bce0ed82a
subdir: hermes-plugin-honcho
version: "1.0.0"
description: "Honcho is memory infrastructure for building stateful agents that understand changing people, agents, groups, projects, and ideas over time. Store messages and events, let Honcho reason in the background, then query peer representations, session context, search results, or natural-language insights from any model or framework. Use it managed at api.honcho.dev, run a local stack with the honcho CLI, or self-host the server yourself. Maintained by Plastic Labs; the same provider that shipped in-tree. Disclosure — conversation turns, derived conclusions and peer/session ids are sent to the Honcho API (api.honcho.dev by default, or the self-hosted base_url you configure) under your HONCHO_API_KEY; every request also carries X-Honcho-Host (Hermes version and OS platform) and X-Honcho-Plugin (plugin version) headers that Honcho records for usage attribution."
description_tr: "Honcho, değişen insanları, ajanları, grupları, projeleri ve fikirleri zamanla anlayan durumlu ajanlar kurmak için bellek altyapısıdır. Mesajları ve olayları saklayın, Honcho'nun arka planda akıl yürütmesine izin verin, ardından eş temsilleri, oturum bağlamını, arama sonuçlarını ya da doğal dil içgörülerini herhangi bir modelden ya da çerçeveden sorgulayın. api.honcho.dev adresinde yönetilen olarak kullanın, honcho CLI ile yerel bir yığın çalıştırın ya da sunucuyu kendiniz barındırın. Plastic Labs tarafından sürdürülür; ağaç içinde gelen sağlayıcının aynısıdır. Açıklama — konuşma turları, çıkarılan sonuçlar ve eş/oturum kimlikleri, HONCHO_API_KEY'iniz altında Honcho API'sine (varsayılan olarak api.honcho.dev ya da kendiniz barındırdığınız ve yapılandırdığınız base_url) gönderilir; her istek ayrıca Honcho'nun kullanım atfı için kaydettiği X-Honcho-Host (Hermes sürümü ve işletim sistemi platformu) ve X-Honcho-Plugin (eklenti sürümü) başlıklarını taşır."
maintainer: plastic-labs
tier: community
category: memory
