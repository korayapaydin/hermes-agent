name: telegram_dashboard_probe
title: Telegram Dashboard
repo: https://github.com/bablobanov/hermes-agent-telegram-dashboard
sha: a2bac7cb336d4bd6e95c2f5f5d295317e69a5589
subdir: plugin/telegram_dashboard_probe
description: "One pinned Telegram message with the state of your Hermes on one phone screen: gateway, backup, config drift, the cron ticker and its jobs, whether the Telegram channel is deaf, whether the agent sees its rules and whether its memory writes stand unapproved, account limits and version. Read-only, no LLM calls, nothing to press. Disclosure — Claude and Codex limits come from Hermes' own account-usage fetcher, called every tick (which, like /usage, may refresh OAuth tokens through Hermes' own auth code); at most once per limits_refresh_seconds (default 900 s) the Grok weekly pool is read from https://cli-chat-proxy.grok.com/v1/billing and /v1/settings with the xai-oauth token Hermes resolves (which, like any Hermes request to xAI, may refresh that OAuth token and save it to auth.json, or clear a dead one, through Hermes' own auth code), sending the header x-xai-token-auth xai-grok-cli that identifies the request as the Grok CLI (an undocumented xAI host Hermes itself does not use), and Kimi Code windows from the kimi-coding base URL /v1/usages with the kimi-coding key Hermes resolves (which, like any Hermes key lookup without a usable key in .env or the environment, may save Hermes' credential pool back to auth.json once when loading it changes something, e.g. a placeholder key in .env) and a User-Agent of claude-code/0.1.0 (undocumented provider surfaces), and up to four operator-configured limits_sources, if set, each with one GET to http on loopback only (127.0.0.1, localhost or ::1), with no proxy and no redirect, optionally sending Authorization: Bearer with the value of an environment variable the operator names (never a *_BOT_TOKEN one); every tick the tail of HERMES_HOME/logs/errors.log (the last 256 KB; the whole file, up to 4 MB, until the first successful read) is read for Gemini HTTP 429 lines, of which only the time, limit, retry and model are kept, and for the engine's own 'Failed to send Telegram message' lines, of which only the time is kept, never the message text; with a memory provider configured, the last 256 KB of the same log are also read for the engine's warnings about that provider, of which only the time and whether one says unavailable are kept; every tick HERMES_HOME/cron/jobs.json is read for each job's id, name, enabled flag, state, times, status and failure streak (never prompt, script, deliver, skills or the model) and the ticker's marker files for their epoch, and HERMES_HOME/cron/executions.db is opened read-only (sqlite3 mode=ro with PRAGMA query_only, in a worker under the tick's deadline) for the job_id, status, delivery_outcome and time columns of failed or undelivered runs, never the error column; the engine's error texts are reduced to the kind of the error in a word and never reach the screen or the record; the connected Telegram adapter's public property send_path_degraded is read every tick, and, as a capability and not a contract, four private attributes of the live adapter object (_updates_received_total, _polling_generation, _polling_last_progress_monotonic, _polling_generation_started_monotonic) are read as attributes, nothing is called on it, and an adapter without them shows no data for that line; every tick HERMES_HOME/state.db is opened read-only the same way for the newest saved system prompt of each platform the running gateway lists in HERMES_HOME/gateway_state.json, and the project context files the engine would load (.hermes.md or HERMES.md in that directory and each parent up to the git root, the AGENTS.override.md / AGENTS.md / agents.md chain from the git root down, CLAUDE.md, .cursorrules and .cursor/rules/*.mdc; up to 4 MB each, links followed as the engine follows them) are read from the directory that prompt names (else the engine's TERMINAL_CWD or the gateway's working directory), and .hermes.md, HERMES.md and the AGENTS names also from the gateway's working directory and HERMES_HOME, which may be outside HERMES_HOME; to tell whether the prompt carries them as they are on disk; only a verdict, the file names, sizes and times are kept, never the prompt's or a file's text; every tick HERMES_HOME/memories/MEMORY.md and USER.md (up to 4 MB each) are read to count their characters against the limits, the waiting writes in HERMES_HOME/pending/memory and pending/skills (up to 2,000 files) for their names and times and, of the memory ones (up to 256 KB each), each add's target and length, and the time of HERMES_HOME/skills/.curator_ledger.jsonl; never a notebook's, an entry's or a waiting write's text, and nothing there is written; the private hermes_cli.version_info._cached_version_info and the signature of agent.prompt_builder._read_text_with_timeout are read from modules the gateway already imported, and nothing is called or changed on them; the release check keeps only each release's version and publication time and downloads, installs or replaces nothing; config.yaml is read through Hermes' own YAML parser for the memory limits, switches, approval gate and provider name, skills.write_approval and each platform's skip_context_files; the plugin's own code never reads the Telegram bot token and never writes vendor credential files (Hermes' auth code it calls for Grok and Kimi may, as said above), and no request the plugin's own code sends with a token in a header follows a redirect; the latest Hermes release is read from api.github.com without a token at most once per 15 minutes (releases/latest with the last answer's ETag; the release list releases?per_page=100 only when Latest names another version); an operator-configured drift_command, if set, runs as a subprocess; the delivery record is written under HERMES_HOME/plugin-data/."
description_tr: "Tek bir sabitlenmiş Telegram mesajıyla Hermes'in durumunu tek telefon ekranında görün: ağ geçidi, yedekleme, yapılandırma kayması, cron tikleyicisi ve işleri, Telegram kanalının sağır olup olmadığı, ajanın kurallarını görüp görmediği ve bellek yazmalarının onaysız kalıp kalmadığı, hesap sınırları ve sürüm. Salt okunur, LLM çağrısı yok, basılacak bir şey yok. Açıklama — Claude ve Codex sınırları, her tikte çağrılan Hermes'in kendi hesap kullanımı getiricisinden gelir (/usage gibi, Hermes'in kendi kimlik doğrulama kodu üzerinden OAuth belirteçlerini yenileyebilir); Grok haftalık havuzu, limits_refresh_seconds başına en fazla bir kez (varsayılan 900 s), Hermes'in çözdüğü xai-oauth belirteciyle https://cli-chat-proxy.grok.com/v1/billing ve /v1/settings adreslerinden okunur (bu, xAI'ye yapılan her Hermes isteği gibi, söz konusu OAuth belirtecini yenileyip auth.json'a kaydedebilir veya ölü bir belirteci Hermes'in kendi kimlik doğrulama kodu üzerinden temizleyebilir), isteği Grok CLI olarak tanımlayan x-xai-token-auth xai-grok-cli başlığı gönderilir (Hermes'in kendisinin kullanmadığı, belgelenmemiş bir xAI sunucusu) ve Kimi Code pencereleri, kimi-coding temel URL'sinin /v1/usages yolundan Hermes'in çözdüğü kimi-coding anahtarıyla okunur (bu, .env veya ortamda kullanılabilir bir anahtar olmadan yapılan her Hermes anahtar araması gibi, yüklenmesi bir şeyi değiştirdiğinde, ör. .env içindeki bir yer tutucu anahtar, Hermes'in kimlik bilgisi havuzunu bir kez auth.json'a geri kaydedebilir) ve claude-code/0.1.0 User-Agent'ı kullanılır (belgelenmemiş sağlayıcı yüzeyleri); ayrıca ayarlanmışsa en fazla dört işletmeci tarafından tanımlanan limits_sources, her biri yalnızca geri döngüde (127.0.0.1, localhost veya ::1) http'ye tek bir GET ile, proxy ve yönlendirme olmadan, isteğe bağlı olarak işletmecinin adlandırdığı bir ortam değişkeninin değeriyle Authorization: Bearer göndererek (asla bir *_BOT_TOKEN değişkeni değil); her tikte HERMES_HOME/logs/errors.log dosyasının sonu (son 256 KB; ilk başarılı okumaya kadar 4 MB'a kadar dosyanın tamamı) Gemini HTTP 429 satırları için okunur ve bunlardan yalnızca zaman, sınır, yeniden deneme ve model saklanır; ayrıca motorun kendi “Telegram iletisi gönderilemedi” satırları için okunur ve bunlardan yalnızca zaman saklanır, mesaj metni asla; bir bellek sağlayıcısı yapılandırıldığında aynı günlüğün son 256 KB'ı, motorun o sağlayıcıyla ilgili uyarıları için de okunur ve bunlardan yalnızca zaman ve birinin kullanılamaz olduğunu söyleyip söylemediği saklanır; her tikte HERMES_HOME/cron/jobs.json, her işin kimliği, adı, etkin bayrağı, durumu, zamanları, statüsü ve başarısızlık serisi için (asla prompt, script, deliver, skills veya model) ve tikleyicinin işaretçi dosyaları da dönemleri için okunur; HERMES_HOME/cron/executions.db salt okunur açılır (PRAGMA query_only ile sqlite3 mode=ro, tikin son teslim süresi içinde bir çalışan içinde) ve başarısız veya teslim edilmemiş çalıştırmaların job_id, status, delivery_outcome ve time sütunları için okunur, error sütunu asla; motorun hata metinleri, hatanın türüne tek kelimeyle indirgenir ve ekrana ya da kayda asla ulaşmaz; bağlı Telegram bağdaştırıcısının genel send_path_degraded özelliği her tikte okunur ve bir sözleşme değil bir yetenek olarak, canlı bağdaştırıcı nesnesinin dört özel özniteliği (_updates_received_total, _polling_generation, _polling_last_progress_monotonic, _polling_generation_started_monotonic) öznitelik olarak okunur, nesne üzerinde hiçbir şey çağrılmaz ve bunlara sahip olmayan bir bağdaştırıcı o satır için veri göstermez; her tikte HERMES_HOME/state.db aynı şekilde salt okunur açılır ve çalışan Ağ Geçidi'nin HERMES_HOME/gateway_state.json içinde listelediği her platformun en yeni kaydedilmiş sistem istemi için okunur; motorun yükleyeceği proje bağlam dosyaları (o dizinde ve git köküne kadar her üst dizinde .hermes.md veya HERMES.md, git kökünden aşağıya AGENTS.override.md / AGENTS.md / agents.md zinciri, CLAUDE.md, .cursorrules ve .cursor/rules/*.mdc; her biri 4 MB'a kadar, bağlantılar motorun izlediği gibi izlenir) söz konusu istemin adlandırdığı dizinden (yoksa motorun TERMINAL_CWD'sinden veya Ağ Geçidi'nin çalışma dizininden) okunur; .hermes.md, HERMES.md ve AGENTS adları ayrıca Ağ Geçidi'nin çalışma dizininden ve HERMES_HOME'dan okunur, ki bunlar HERMES_HOME dışında olabilir; bu, istemin bunları diskte oldukları gibi taşıyıp taşımadığını anlamak içindir; yalnızca bir sonuç, dosya adları, boyutları ve zamanları saklanır, istemin veya bir dosyanın metni asla; her tikte HERMES_HOME/memories/MEMORY.md ve USER.md (her biri 4 MB'a kadar) karakterlerini sınırlara göre saymak için okunur; HERMES_HOME/pending/memory ve pending/skills içindeki bekleyen yazmalar (2.000 dosyaya kadar) adları ve zamanları için ve bellek olanlardan (her biri 256 KB'a kadar) her eklemenin hedefi ve uzunluğu için, ve HERMES_HOME/skills/.curator_ledger.jsonl dosyasının zamanı okunur; bir not defterinin, bir girdinin veya bekleyen bir yazmanın metni asla; oraya hiçbir şey yazılmaz; özel hermes_cli.version_info._cached_version_info ve agent.prompt_builder._read_text_with_timeout imzası, Ağ Geçidi'nin zaten içe aktardığı modüllerden okunur ve bunlar üzerinde hiçbir şey çağrılmaz veya değiştirilmez; sürüm denetimi yalnızca her sürümün numarasını ve yayın zamanını saklar ve hiçbir şey indirmez, kurmaz veya değiştirmez; config.yaml, bellek sınırları, anahtarlar, onay kapısı ve sağlayıcı adı, skills.write_approval ve her platformun skip_context_files değeri için Hermes'in kendi YAML ayrıştırıcısı üzerinden okunur; eklentinin kendi kodu Telegram bot belirtecini asla okumaz ve satıcı kimlik bilgisi dosyalarını asla yazmaz (Grok ve Kimi için çağırdığı Hermes kimlik doğrulama kodu, yukarıda söylendiği gibi, yazabilir) ve eklentinin kendi kodunun başlıkta belirteçle gönderdiği hiçbir istek yönlendirme izlemez; en yeni Hermes sürümü api.github.com'dan belirteç olmadan 15 dakikada en fazla bir kez okunur (releases/latest, son yanıtın ETag'iyle; sürüm listesi releases?per_page=100 yalnızca Latest başka bir sürümü adlandırdığında); işletmeci tarafından tanımlanan drift_command ayarlanmışsa bir alt süreç olarak çalışır; teslim kaydı HERMES_HOME/plugin-data/ altına yazılır."
