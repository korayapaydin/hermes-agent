version: "0.21.10"
title: "Alan's Way Plugin: Computer Use"
description: "Computer-use provider for Hermes: the stock computer_use tool drives desktop apps on the user's computer through the Alan's Workspace app, and on the VM's own desktop when the computer is offline. Needs the Alan's Way Plugin's workspace setup. Select it with computer_use.backend: alans-way-computer (the Alan's Way Plugin's setup.sh sets this when it installs the provider; in the catalog flow it prints the command). Disclosure — starts the workspace router from the profile's mcp_servers.workspace_browser block (command and args from config.yaml, with a filtered environment plus HERMES_WORKSPACE_ALLOW_DESKTOP_ACTIONS=1, which lets this private router child serve desktop input) as a long-running node child per session. The filtered environment passes PATH, HOME, locale and OS basics, plus DISPLAY, XAUTHORITY and DBUS_SESSION_BUS_ADDRESS so the router's VM-desktop fallback finds the X display and session bus, plus HERMES_HOME set to the bound profile's home, under which the router appends a content-free serving log to logs/workspace-router.log; no keys or tokens. It talks to the router over stdio (app lists, element trees, screenshots and input actions). The router reaches the user's computer over SSH on the user's tailnet and falls back to the VM's desktop, where it uses xdotool, a screenshot tool and the AT-SPI accessibility bus if they are installed (the provider installs none of them). On the user's Mac the provider can bring the target app to the front when the model asks for it (focus_app with raise_window, or an input action with delivery_mode foreground), and the Alan's Workspace host does so only after the user has been idle for at least 2 seconds; focus_app can also launch a named app, or open a document or folder by absolute path in its app (the host refuses app bundles, executables, scripts and off-limits apps). Every input action still goes through Hermes's computer_use approval gate, with raising and foreground input under their own approval scopes (the cua:<action>:background entries in command_allowlist that the Alan's Way Plugin's --allow-desktop-actions adds skip the prompt for background input, focus_app and launches, not for raising or foreground input). The provider itself makes no network calls. On Hermes 0.21.5, which has no provider API, it installs and does nothing. Since 0.21.0, captures keep element numbers stable across action replies on Mac and Windows, fold in changed controls and report removed numbers; a truncated list never treats unseen controls as removed. Linux keeps the whole-tree generation guard, so capture again before acting by number after a change. Action replies describe nearby changes and can mark the effect confirmed. Default som captures skip the screenshot call entirely when finite snapshot window geometry proves named controls cover at least 35%; older snapshots without geometry still fetch a screenshot to measure coverage and may omit it from the model; mode vision explicitly includes it and mode ax requests no screenshot. Replies identify the coordinate space and explain locked screens, missing permissions, unreadable or cut trees, hung apps and uncertain outcomes before a retry. Captures request generation-based snapshot deltas, validate them against the held tree and retry once for a full list on invalid or mismatched deltas; older apps may return full or unchanged lists. Once a reply identifies a window, later captures, screenshots and input stay bound to that window; capture(window_id=...) selects another. Mismatched window replies clear the target and require a fresh capture. Desktop actions carry expect_host from the observed host so a routing switch refuses input before dispatch; app IDs and element numbers must be reacquired after a switch. Element trees, generation, bound window ID, screenshots' geometry and host OS are session memory, with no new persistent provider state, tools, hooks, middleware, required environment variables or direct network destinations. Hermes's unmodified CI-pinned scanner reports SAFE: 0 HIGH, 2 MEDIUM (python_subprocess: the long-running
  router Popen in __init__.py and its bounded 40-second --probe subprocess) and 0 LOW. Browser commit approvals are separate from this provider's unchanged computer_use approval gate."
description_tr: "Hermes için bilgisayar kullanımı sağlayıcısı: hazır computer_use aracı, Alan's Workspace uygulaması üzerinden kullanıcının bilgisayarındaki masaüstü uygulamalarını, bilgisayar çevrimdışıyken ise sanal makinenin kendi masaüstünü yönetir. Alan's Way eklentisinin çalışma alanı kurulumu gerekir. computer_use.backend: alans-way-computer ile seçilir (Alan's Way eklentisinin setup.sh dosyası sağlayıcıyı kurarken bunu ayarlar; katalog akışında komut yazdırılır). Açıklama — çalışma alanı yönlendiricisini profilin mcp_servers.workspace_browser bloğundan (komut ve bağımsız değişkenler config.yaml dosyasından, filtrelenmiş bir ortam ve bu özel yönlendirici alt sürecinin masaüstü girdisi sunmasına izin veren HERMES_WORKSPACE_ALLOW_DESKTOP_ACTIONS=1 ile) oturum başına uzun ömürlü bir node alt süreci olarak başlatır. Filtrelenmiş ortam PATH, HOME, yerel ayar ve işletim sistemi temellerini, ayrıca yönlendiricinin sanal makine masaüstü geri dönüşünün X görüntüsünü ve oturum veri yolunu bulması için DISPLAY, XAUTHORITY ve DBUS_SESSION_BUS_ADDRESS değişkenlerini geçirir; anahtar ya da token yoktur. Yönlendiriciyle stdio üzerinden konuşur (uygulama listeleri, öğe ağaçları, ekran görüntüleri ve girdi eylemleri). Yönlendirici, kullanıcının bilgisayarına kullanıcının tailnet'i üzerinden SSH ile ulaşır ve sanal makinenin masaüstüne geri döner; orada kuruluysa xdotool, bir ekran görüntüsü aracı ve AT-SPI erişilebilirlik veri yolunu kullanır (sağlayıcı bunların hiçbirini kurmaz). Sağlayıcı kullanıcının bilgisayarındaki odaklanmış pencereyi asla ele geçirmez ve her girdi eylemi yine de Hermes'in computer_use onay kapısından geçer (Alan's Way eklentisinin --allow-desktop-actions seçeneğinin eklediği command_allowlist içindeki cua:*:background girdileri istemi atlar). Sağlayıcının kendisi hiçbir ağ çağrısı yapmaz. Sağlayıcı API'si olmayan Hermes 0.21.5 üzerinde kurulur ve hiçbir şey yapmaz. 0.21.0'dan bu yana yakalamalar, Mac ve Windows'ta eylem yanıtları boyunca öğe numaralarını sabit tutar, değişen denetimleri içine katar ve kaldırılan numaraları bildirir; kesilmiş bir liste, görülmemiş denetimleri asla kaldırılmış saymaz. Linux, tüm ağaç nesil korumasını korur; bu yüzden bir değişiklikten sonra numarayla işlem yapmadan önce yeniden yakalayın. Eylem yanıtları yakındaki değişiklikleri açıklar ve etkiyi doğrulanmış olarak işaretleyebilir. Varsayılan som yakalamaları pencereyi ölçmek için yine bir ekran görüntüsü alır, ancak adlandırılmış denetimler en az %35'ini kapsıyorsa bunu modelden çıkarır; vision kipi bunu açıkça içerir ve ax kipi ekran görüntüsü istemez. Yanıtlar koordinat uzayını belirtir ve yeniden denemeden önce kilitli ekranları, eksik izinleri, okunamayan ya da kesilmiş ağaçları, askıda kalan uygulamaları ve belirsiz sonuçları açıklar. Öğe ağaçları, nesil, ekran görüntülerinin geometrisi ve ana makine işletim sistemi oturum belleğidir; yeni kalıcı sağlayıcı durumu, araç, kanca, ara katman, zorunlu ortam değişkeni ya da doğrudan ağ hedefi yoktur. Tarayıcı commit onayları, bu sağlayıcının değişmeyen computer_use onay kapısından ayrıdır."
