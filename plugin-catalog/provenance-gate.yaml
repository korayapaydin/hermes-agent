name: provenance-gate
title: Provenance Gate
repo: https://github.com/simin-yuan/hermes-provenance-gate
sha: d8ded75deef198694639d8653c1834a26f3b0372
version: "0.1.3"
description: >-
  Flags memory and skill_manage writes that state a user decision ("the user decided ...", "用户决定 ...")
  without the user's own words: each such sentence needs a quote that appears verbatim in text the user
  typed in this session, shares key words with the decision and does not drop a negation. A patch is
  checked by the text it produces. Observe mode (the default) records flagged writes and `hermes
  provenance-gate report` lists them; block mode refuses them and tells the model how to fix the write.
  Measured on an independent blind set of 133 lines: precision 1.000, recall 0.694.
  Disclosure — two hooks (pre_llm_call, pre_tool_call); keeps a local copy of the text the user types,
  with its sender_id and session link, and an evidence log of checked claims under
  plugin-data/provenance-gate (30-day default retention, `hermes provenance-gate purge`); reads
  MEMORY.md, USER.md and skill files to reproduce what a patch produces; no network, no credentials,
  never asks for approval.
description_tr: "Kullanıcının kendi sözleri olmadan bir kullanıcı kararını ifade eden (\"the user decided ...\", \"用户决定 ...\") bellek ve skill_manage yazmalarını işaretler: bu türden her cümle, bu oturumda kullanıcının yazdığı metinde birebir geçen, kararla anahtar kelimeleri paylaşan ve bir olumsuzluğu düşürmeyen bir alıntıya ihtiyaç duyar. Bir yama, ürettiği metin üzerinden denetlenir. İzleme modu (varsayılan) işaretlenen yazmaları kaydeder ve `hermes provenance-gate report` bunları listeler; engelleme modu onları reddeder ve modele yazmanın nasıl düzeltileceğini söyler. 133 satırlık bağımsız bir kör küme üzerinde ölçüldü: precision 1.000, recall 0.694. Açıklama — iki kanca (pre_llm_call, pre_tool_call); kullanıcının yazdığı metnin, gönderen kimliği ve oturum bağlantısıyla birlikte yerel bir kopyasını ve denetlenen iddiaların bir kanıt günlüğünü plugin-data/provenance-gate altında tutar (varsayılan 30 gün saklama, `hermes provenance-gate purge`); bir yamanın ne ürettiğini yeniden oluşturmak için MEMORY.md, USER.md ve yetenek dosyalarını okur; ağ yok, kimlik bilgisi yok, asla onay istemez."
