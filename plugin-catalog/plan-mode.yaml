name: plan-mode
title: Plan mode
repo: https://github.com/100yenadmin/hermes-plan-mode
sha: ee4a245fbc2b2d874f3a5021963bef6c358d17fb
description: 'Claude Code-style plan mode for Hermes: the agent explores and writes a plan, and edits nothing else until you
  approve it. It works on every interactive Hermes surface: /plan or /planmode on blocks mutating Hermes tools dispatched
  through pre_tool_call (writes outside .hermes/plans, terminal, code execution, delegation, MCP) while the agent
  explores, asks clarifying questions and writes a plan. The agent shows the complete plan, submits it with
  plan_mode(submit) and one approval card asks: approve and auto-accept edits, approve and review each file edit
  (when Hermes approvals are on, every write_file and patch then gets Hermes'' approval prompt with its path and a
  preview), or keep planning; Other sends feedback, and the revised plan says what changed since the last revision.
  Once approved, it implements in the same turn and tracks todo_list progress. To change the plan yourself, keep
  planning, run /planmode edit, save, then /planmode show and /planmode approve; the text you were shown is saved as
  an approved snapshot, so later edits to the file do not change the approval. The classic profile
  (plan_profile: classic), approval_card: false and surfaces without a card use Hermes'' own approval prompt
  (gateway buttons, the TUI/Desktop card, the CLI panel or /approve). When yolo or approvals.mode: off would
  auto-approve, it asks through clarify instead, so a person still decides. By default plans are compact and
  decision-complete, the lean profile asks at most three targeted questions, and the agent does not commit unless
  asked (plan_style, plan_profile, allow_commits and plan_skill settings). Classic CLI enforced on every supported
  Hermes; gateway, TUI and Desktop from Hermes v2026.9.24 (0.21.5), and refused on older builds; 0.21.6 recommended.
  On the interactive classic CLI, Hermes'' inline diff shows a new plan file in full, so the agent does not retype it
  (write_once). A report-a-problem skill drafts a bug report and files it with gh only after you approve the draft.
  Disclosure — plan-mode does not enforce Codex app-server exec/applyPatch or TUI /background and btw side agents.
  A plan is approved only on its approval card (a clarify question only the plugin issues and checks), through
  Hermes'' own approval prompt, or with /planmode approve. It reads nine groups of internal Hermes seams for session
  identity, workspace, profile, skills.inline_shell and the classic CLI''s inline diff, each guarded with a documented fallback. It creates
  .hermes/plans under the session working directory, reads plan files there, saves the approved text of an edited
  plan as a new file under .hermes/plans/approved, and keeps per-session state in plugin state. It adds a turn note
  while planning or executing, a ≤200-char system-prompt hint, and a one-line footer to short replies on chat
  platforms. When a turn ends while a submitted plan still awaits approval and no approval card was answered, it adds
  one line to that reply on any surface, whatever its length, saying how to approve (unless footer is off). When you
  pick "Always" on a plan approval or a per-edit review, Hermes core writes a
  plugin_rule:plan-mode entry to command_allowlist in config.yaml; each entry is keyed to one plan revision, so it
  cannot approve another plan. With allow_gateway_injection: true it queues one message to start work after a typed
  /planmode approve. On TUI, Desktop and hermes serve sessions (lean profile, plan_once) it reads the visible reply
  text from post_api_request while planning and saves its <proposed_plan> block as the plan file. On the interactive
  classic CLI (lean, write_once) it checks that Hermes printed a newly written plan file in full, then tells the agent
  not to retype it. Its report-a-problem skill has the agent file to the plugin repository with gh only after the user
  approves the exact saved draft. The plugin itself makes no network calls, launches no subprocesses and has no
  self-updater.'
description_tr: "Hermes için Claude Code tarzı plan kipi: ajan keşfeder ve bir plan yazar, siz onaylayana kadar başka hiçbir şeyi düzenlemez. Her etkileşimli Hermes yüzeyinde çalışır: /plan ya da /planmode, ajan keşfederken, netleştirici sorular sorarken ve bir plan yazarken pre_tool_call üzerinden gönderilen Hermes'i değiştiren araçları (.hermes/plans dışındaki yazmalar, terminal, kod çalıştırma, delegasyon, MCP) engeller. Ajan planın tamamını gösterir, plan_mode(submit) ile gönderir ve tek bir onay kartı şunları sorar: düzenlemeleri otomatik kabul et, her dosya düzenlemesini tek tek gözden geçir (Hermes onayları açıkken her write_file ve patch, yolu ve önizlemesiyle birlikte Hermes'in onay istemini alır) ya da planlamaya devam et; \"Diğer\" geri bildirim gönderir ve revize edilen plan, son revizyondan bu yana neyin değiştiğini söyler. Onaylandıktan sonra aynı turda uygular ve todo_list ilerlemesini izler. Planı kendiniz değiştirmek için planlamaya devam edin, /planmode edit komutunu çalıştırın, kaydedin, ardından /planmode show ve /planmode approve deyin; size gösterilen metin onaylı bir anlık görüntü olarak kaydedilir, böylece dosyadaki sonraki düzenlemeler onayı değiştirmez. Klasik profil (plan_profile: classic), approval_card: false ve kartı olmayan yüzeyler Hermes'in kendi onay istemini kullanır (ağ geçidi düğmeleri, TUI/Desktop kartı, CLI paneli ya da /approve). yolo ya da approvals.mode: off otomatik onaylayacakken, bunun yerine clarify üzerinden sorar, böylece kararı yine bir insan verir. Varsayılan olarak planlar kısa ve karar açısından eksiksizdir, yalın profil en fazla üç hedefli soru sorar ve ajan istemedikçe commit yapmaz (plan_style, plan_profile, allow_commits ve plan_skill ayarları). Klasik CLI, desteklenen her Hermes'te uygulanır; ağ geçidi, TUI ve Desktop Hermes v2026.9.24 (0.21.5) sürümünden itibaren çalışır ve daha eski derlemelerde reddedilir; 0.21.6 önerilir. Etkileşimli klasik CLI'da Hermes'in satır içi farkı yeni plan dosyasını tam olarak gösterdiği için ajan onu yeniden yazmaz (write_once). Bir sorun bildirme yeteneği hata raporu taslağı hazırlar ve yalnızca taslağı onayladıktan sonra gh ile dosyalar. Açıklama — plan-mode, Codex app-server exec/applyPatch'i veya TUI /background ve btw yan ajanlarını zorunlu kılmaz. Bir plan yalnızca onay kartında (yalnızca eklentinin sorduğu ve denetlediği bir clarify sorusu), Hermes'in kendi onay istemi üzerinden veya /planmode approve ile onaylanır. Oturum kimliği, çalışma alanı, profil, skills.inline_shell ve klasik CLI'ın satır içi farkı için dokuz grup dahili Hermes dikişini okur; her biri belgelenmiş bir geri dönüşle korunur. Oturum çalışma dizini altında .hermes/plans oluşturur, oradaki plan dosyalarını okur, düzenlenmiş bir planın onaylanan metnini .hermes/plans/approved altında yeni bir dosya olarak kaydeder ve oturum başına durumu eklenti durumunda tutar. Planlama veya yürütme sırasında bir tur notu, ≤200 karakterlik bir sistem istemi ipucu ve sohbet platformlarındaki kısa yanıtlara tek satırlık bir alt bilgi ekler. Bir tur, gönderilmiş bir plan hâlâ onay beklerken ve hiçbir onay kartı yanıtlanmamışken bittiğinde, herhangi bir yüzeyde o yanıta uzunluğu ne olursa olsun nasıl onaylanacağını söyleyen bir satır ekler (alt bilgi kapalı değilse). Bir plan onayında veya düzenleme başına incelemede \"Always\" seçtiğinizde, Hermes çekirdeği config.yaml dosyasındaki command_allowlist'e bir plugin_rule:plan-mode girdisi yazar; her girdi tek bir plan revizyonuna bağlıdır, bu yüzden başka bir planı onaylayamaz. allow_gateway_injection: true ile, yazılan bir /planmode approve komutundan sonra işe başlamak için bir mesaj kuyruğa alır. TUI, Desktop ve hermes serve oturumlarında (yalın profil, plan_once) planlama sırasında post_api_request üzerinden görünür yanıt metnini okur ve <proposed_plan> bloğunu plan dosyası olarak kaydeder. Etkileşimli klasik CLI'da (yalın, write_once) Hermes'in yeni yazılmış bir plan dosyasını tam olarak yazdırdığını denetler, ardından ajana onu yeniden yazmamasını söyler. Sorun bildirme yeteneği, ajanın yalnızca kullanıcı tam olarak kaydedilmiş taslağı onayladıktan sonra gh ile eklenti deposuna dosyalamasını sağlar. Eklentinin kendisi hiçbir ağ çağrısı yapmaz, hiçbir alt süreç başlatmaz ve kendi kendini güncelleyicisi yoktur."
