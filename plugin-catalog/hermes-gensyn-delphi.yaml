name: hermes-gensyn-delphi
repo: https://github.com/TakeshiTGAL/hermes-gensyn-plugins
sha: 9325a7b15d815ca05983885ddd6615eae5f2b7a6
subdir: packages/delphi
description: "Seven read-only tools. Disclosure — Seven read-only tools for Gensyn Delphi prediction markets; no funds move and nothing is signed or sent. Needs Node.js 20.18+ and a manual `npm ci --ignore-scripts` in the plugin folder (installs the pinned @gensyn-ai/gensyn-delphi-sdk and its locked npm deps) before the tools work. Runs a local Node subprocess per call (25 s deadline, not a sandbox). Sends your DELPHI_API_ACCESS_KEY only to delphi-api.gensyn.ai (testnet) or api.delphi.fyi (mainnet); history and quotes read api.goldsky.com and gensyn-testnet/mainnet.g.alchemy.com without the key, and quotes use a throwaway in-memory key the SDK requires. Tools are on for every surface by default, including messaging gateways, where anyone admitted can run these reads on the owner's key (rate limit 30 requests per minute per process); disable per surface with `hermes tools`."
description_tr: "Gensyn Delphi tahmin piyasaları için yedi salt okunur araç. Açıklama — Hiçbir fon hareket etmez ve hiçbir şey imzalanmaz ya da gönderilmez. Araçların çalışması için Node.js 20.18+ ve eklenti klasöründe elle `npm ci --ignore-scripts` gerekir (sabitlenmiş @gensyn-ai/gensyn-delphi-sdk paketini ve kilitli npm bağımlılıklarını kurar). Çağrı başına yerel bir Node alt süreci çalıştırır (25 saniye süre sınırı, korumalı alan değil). DELPHI_API_ACCESS_KEY anahtarınızı yalnızca delphi-api.gensyn.ai (testnet) ya da api.delphi.fyi (mainnet) adresine gönderir; geçmiş ve fiyat teklifleri api.goldsky.com ve gensyn-testnet/mainnet.g.alchemy.com adreslerini anahtar olmadan okur, fiyat teklifleri SDK'nın gerektirdiği tek kullanımlık bellek içi bir anahtar kullanır. Araçlar varsayılan olarak her yüzeyde açıktır; kabul edilen herkesin sahibin anahtarıyla bu okumaları çalıştırabildiği mesajlaşma ağ geçitleri dahil (süreç başına dakikada 30 istek sınırı); yüzey başına `hermes tools` ile devre dışı bırakın."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.4"
version: "0.2.0"
platforms:
  - linux
  - macos
capabilities:
  provides_tools:
    - delphi_list_markets
    - delphi_get_market
    - delphi_get_positions
    - delphi_query_subgraph
    - delphi_compute_edge
    - delphi_quote_buy
    - delphi_quote_sell
  provides_hooks:
    - transform_tool_result
  provides_middleware: []
  requires_env:
    - DELPHI_API_ACCESS_KEY
    - DELPHI_NETWORK
    - DELPHI_WALLET_ADDRESS
