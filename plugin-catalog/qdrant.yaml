version: "0.1.8"
image: https://raw.githubusercontent.com/kuehnberger/hermes-qdrant-memory/5241e51274c657251776659bfb651aae4ba4bf1d/docs/banner.jpg
description: "Dense semantic memory for Hermes, stored in a Qdrant collection you host. Each turn becomes one point — user and assistant text verbatim, no LLM summarization step — embedded on-device at 384 dimensions with fastembed (ONNX; the default install is 206 MB of runtime dependencies with no torch, versus ~1.2 GB when sentence-transformers was a hard dependency) and recalled by cosine search with an optional session_id payload filter, so a result quotes what was actually said. Registers 7 tools: qdrant_search, qdrant_upsert, qdrant_recall, qdrant_collect, qdrant_prepare, qdrant_forget (point-targeted deletion, dry-run by default, no delete-all), and md_search (local markdown knowledge index). An optional recall-indicator display, display.level (off | summary | verbose, default off), adds latency and collection to the chat indicator at summary and one numeric line per operation to the log at verbose — numbers and identifiers only, never recalled message text or search-result snippets (the md_search line also echoes the query you searched — your own input, not recalled content); it is separate from the older top-level progress knob (off | minimal | verbose), which gates status events. sentence-transformers is selectable on GPU hosts; both backends produce identical vectors for all-MiniLM-L6-v2, so switching backends needs no re-embedding. A circuit breaker (5 consecutive I/O failures, 120 s cooldown) degrades to no new memories instead of crashing, and is_available()/check_backend()/unavailable_reason() distinguish a misconfiguration from a dead server. Optional hybrid dense+sparse RRF search (default off): one config key enables dense+BM25 RRF fusion. A fresh collection declares the sparse vector at creation and an existing dense-only store gets it added in place (Qdrant >= 1.18) with one bundled backfill command; measured +0.024 recall@10 on the LongMemEval 1,000-example benchmark. INT8 quantization is not implemented. Local embedded Qdrant mode is not supported: the provider is REST-only and needs a reachable server. Disclosure — all memory content (verbatim user and assistant turns) is stored in and read back from the Qdrant server at the configured url (default http://localhost:6333); QDRANT_API_KEY is only needed for Qdrant Cloud, is kept in .env and read through the Hermes secret scope, and is never written to config.yaml or qdrant.json. Disclosure — the only other outbound traffic is a one-time download of the embedding model weights (plus the 10 MB Qdrant/bm25 sparse model when hybrid is on) from huggingface.co (fastembed falls back to storage.googleapis.com/qdrant-fastembed if that fails); embedding runs on-device and no memory content goes to any other party. Disclosure — settings are stored in <HERMES_HOME>/qdrant.json (created 0600, no credentials) and last-operation status in <HERMES_HOME>/qdrant-status.json. Disclosure — md_search returns snippets of local markdown to the model from ~/.hermes/skills, the Obsidian vault at ~/Documents/hermes_default, ~/.hermes/hermes-agent/website and any path in the md_docs_roots key of qdrant.json; its index is built only when you run scripts/md_ingest.py and lives in <base Hermes home>/state/md-search/ (shared by all profiles). Disclosure — the optional semantic tier (md_ingest.py --semantic, and md_search queries with few lexical hits) sends embedding vectors plus file-path labels and section headings, never chunk text, to a separate hermes_md_docs collection on the Qdrant server named by the QDRANT_URL env var (default http://localhost:6333, no API key), and downloads paraphrase-multilingual-MiniLM-L12-v2 from huggingface.co on first use. Disclosure — the plugin is not a server and registers no MCP server, but it is loaded in-process into every Hermes process that embeds, so each one pays its own model copy (measured ~194-211 MB per process). Disclosure — the bundled scripts/backfill_memory.py (run by hand; a dry run unless --yes) reads a profile's Hermes session database (<profile>/state.db, read-only) and copies every stored user, assistant and tool message from every session source (cli, cron, subagent, gateway), in 2,000-character chunks, into the collection at the url in qdrant.json (default http://localhost:6333); nothing reads state.db unless you run it."
description_tr: "Hermes için yoğun anlamsal bellek; kendinizde barındırdığınız bir Qdrant koleksiyonunda saklanır. Her tur tek bir nokta olur — kullanıcı ve asistan metni birebir, LLM özetleme adımı yok — cihaz üzerinde fastembed ile 384 boyutta gömülür (ONNX; varsayılan kurulum torch olmadan 206 MB çalışma zamanı bağımlılığıdır, sentence-transformers zorunlu bağımlılık olduğunda ~1,2 GB ile karşılaştırıldığında) ve isteğe bağlı bir session_id yük filtresiyle kosinüs aramasıyla geri çağrılır, böylece bir sonuç gerçekte ne söylendiğini alıntılar. 7 araç kaydeder: qdrant_search, qdrant_upsert, qdrant_recall, qdrant_collect, qdrant_prepare, qdrant_forget (nokta hedefli silme, varsayılan olarak kuru çalıştırma, hepsini silme yok) ve md_search (yerel markdown bilgi dizini). İsteğe bağlı bir geri çağırma göstergesi görünümü, display.level (off | summary | verbose, varsayılan off), summary düzeyinde sohbet göstergesine gecikme ve koleksiyon ekler, verbose düzeyinde ise her işlem için günlüğe tek bir sayı satırı yazar — yalnızca sayılar ve tanımlayıcılar, asla geri çağrılan mesaj metni ya da arama sonucu alıntıları değil (md_search satırı da aradığınız sorguyu yankılar — kendi girdiniz, geri çağrılan içerik değil); bu, durum olaylarını denetleyen daha eski üst düzey ilerleme düğmesinden (off | minimal | verbose) ayrıdır. sentence-transformers, GPU'lu konaklarda seçilebilir; her iki arka uç da all-MiniLM-L6-v2 için birebir aynı vektörleri üretir, bu yüzden arka uç değiştirmek yeniden gömme gerektirmez. Bir devre kesici (5 ardışık G/Ç hatası, 120 sn bekleme) çökmek yerine yeni bellek oluşturmamaya düşer ve is_available()/check_backend()/unavailable_reason() yapılandırma hatasını ölü sunucudan ayırır. İsteğe bağlı karma yoğun+sparse RRF araması (varsayılan olarak kapalı): tek bir yapılandırma anahtarı yoğun+BM25 RRF birleşimini etkinleştirir. Yeni bir koleksiyon sparse vektörü oluşturulurken tanımlar, yalnızca yoğun vektör içeren mevcut bir depo ise bunu yerinde ekler (Qdrant >= 1.18) ve bunun için paketlenmiş tek bir geri doldurma komutu gelir; LongMemEval 1.000 örneklik kıyaslamasında recall@10 değerinde +0,024 ölçüldü. INT8 kuantizasyonu uygulanmaz. Yerel gömülü Qdrant kipi desteklenmez: sağlayıcı yalnızca REST'tir ve erişilebilir bir sunucu gerektirir. Açıklama — tüm bellek içeriği (birebir kullanıcı ve asistan turları) yapılandırılmış url'deki Qdrant sunucusunda saklanır ve oradan geri okunur (varsayılan http://localhost:6333); QDRANT_API_KEY yalnızca Qdrant Cloud için gereklidir, .env dosyasında tutulur ve Hermes gizli kapsamı üzerinden okunur, config.yaml veya qdrant.json dosyasına asla yazılmaz. Açıklama — diğer tek giden trafik, huggingface.co'dan gömme modeli ağırlıklarının (karma açıkken ayrıca 10 MB Qdrant/bm25 sparse modelinin) tek seferlik indirilmesidir (fastembed başarısız olursa storage.googleapis.com/qdrant-fastembed adresine geri döner); gömme cihaz üzerinde çalışır ve hiçbir bellek içeriği başka bir tarafa gitmez. Açıklama — ayarlar <HERMES_HOME>/qdrant.json dosyasında (0600 izinle oluşturulur, kimlik bilgisi yok) ve son işlem durumu <HERMES_HOME>/qdrant-status.json dosyasında saklanır. Açıklama — md_search, modele ~/.hermes/skills, ~/Documents/hermes_default adresindeki Obsidian kasası, ~/.hermes/hermes-agent/website ve qdrant.json dosyasının md_docs_roots anahtarındaki her yoldan yerel markdown parçacıkları döndürür; dizini yalnızca scripts/md_ingest.py çalıştırdığınızda oluşturulur ve <base Hermes home>/state/md-search/ altında yaşar (tüm profillerce paylaşılır). Açıklama — isteğe bağlı anlamsal katman (md_ingest.py --semantic ve az sözcüksel eşleşme içeren md_search sorguları), parça metnini asla değil, gömme vektörlerini ve dosya yolu etiketlerini ve bölüm başlıklarını QDRANT_URL ortam değişkeniyle adlandırılan Qdrant sunucusundaki ayrı bir hermes_md_docs koleksiyonuna gönderir (varsayılan http://localhost:6333, API anahtarı yok) ve ilk kullanımda huggingface.co'dan paraphrase-multilingual-MiniLM-L12-v2 modelini indirir. Açıklama — eklenti bir sunucu değildir ve hiçbir MCP sunucusu kaydetmez, ancak gömme yapan her Hermes sürecine süreç içinde yüklenir, bu yüzden her biri kendi model kopyasını öder (süreç başına ~194-211 MB ölçüldü). Açıklama — paketlenmiş scripts/backfill_memory.py (elle çalıştırılır; --yes olmadan kuru çalıştırma) bir profilin Hermes oturum veritabanını (<profile>/state.db, salt okunur) okur ve her oturum kaynağından (cli, cron, subagent, gateway) saklanan her kullanıcı, asistan ve araç mesajını 2.000 karakterlik parçalar halinde qdrant.json dosyasındaki url'deki koleksiyona (varsayılan http://localhost:6333) kopyalar; onu çalıştırmadıkça hiçbir şey state.db dosyasını okumaz."
maintainer: kuehnberger
tier: community
category: memory
requires_hermes: ">=0.21.5"
docs_url: https://github.com/kuehnberger/hermes-qdrant-memory#readme
known_issues:
- "Windows on ARM is unsupported: grpcio, pulled in by qdrant-client, has no win_arm64 wheel. Linux and macOS on x86_64/arm64 and Windows x86_64 are supported."
- "Local embedded Qdrant mode is not supported — the provider is REST-only and requires a reachable server."
- "md_search returns 'no markdown index yet' until you run the bundled ingest script once (python scripts/md_ingest.py, lexical only and fast; add --semantic for the embedding tier, which takes about 7 minutes for 5500 chunks on a 5-core CPU). No background process does this for you."
- "Running the plugin's pytest suite inside an installed copy still changes the PM dependency stamp (the .pytest_cache directory is hashed as a build input); only an upstream core change can exclude gitignored state."
capabilities:
  provides_tools:
  - qdrant_search
  - qdrant_upsert
  - qdrant_recall
  - qdrant_collect
  - qdrant_prepare
  - qdrant_forget
  - md_search
  provides_hooks: []
  provides_middleware: []
  requires_env: []
