name: web-toon
repo: https://github.com/drew-dot-com/hermes-toon
sha: fb0892bd1ee6630309adeeaa68fd37454be247d3
version: "0.1.2"
subdir: src/hermes_toon
description: "Paid web extract over TOON: web_extract pays a TOON node about $0.001 per page from a local payer sidecar; the node fetches through an Anyone network exit and returns markdown with a wuzzy/crawl v1 content hash. Disclosure — with TOON_PAYER_URL set and web.extract_backend toon, every web_extract URL goes to the user's anonfetch payer sidecar and spends about $0.001 from its TOON payment channel with no per-call confirmation; the sidecar's daily cap and origin allowlist are the only spending controls; pages are fetched through Anyone network exits."
description_tr: "TOON üzerinden ücretli web çıkarma: web_extract, yerel bir ödeme yardımcı süreci aracılığıyla her sayfa için bir TOON düğümüne yaklaşık 0,001 ABD doları öder; düğüm, bir Anyone ağ çıkışı üzerinden getirir ve wuzzy/crawl v1 içerik hash'iyle markdown döndürür. Açıklama — TOON_PAYER_URL ayarlıyken ve web.extract_backend toon iken, her web_extract URL'si kullanıcının anonfetch ödeme yardımcı sürecine gider ve çağrı başına onay olmaksızın TOON ödeme kanalından yaklaşık 0,001 ABD doları harcar; yardımcı sürecin günlük üst sınırı ve kaynak izin listesi tek harcama denetimidir; sayfalar Anyone ağ çıkışları üzerinden getirilir."
maintainer: drew-dot-com
tier: community
category: web
requires_hermes: ">=0.21.3"
docs_url: https://github.com/drew-dot-com/hermes-toon#install
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - TOON_PAYER_URL
