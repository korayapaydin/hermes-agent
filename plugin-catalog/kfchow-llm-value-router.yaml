name: kfchow-llm-value-router
repo: https://github.com/kfchow-ai/kfchow-llm-value-router
sha: "39a6944280c2156f816df8641d3d01d743aec564"
description: >-
  Per-turn LLM routing: on each matching turn a TypeSafe Jev classifier call (api.typesafe.ai) receives turn-shape
  features plus the first 1200 chars of the last user message (shadow mode included) and labels it free/paid;
  high-confidence routine turns are downgraded to the provider's configured free rung, strategic mid-rung turns on
  Nous are escalated to the configured premium rung after a 2-token billed credit probe (Nous only, fail-closed).
  Fail-open, shadow-by-default, per-provider rungs from the user's lane2_config.json (leaderboard resolver script
  optional). Probe model id is fixed in code (z-ai/glm-5.3-flash). Disclosure — once you list models in
  ~/.hermes/jev/lane2_config.json, the first call of each matching turn sends message/tool counts and the first 1,200
  characters of the last user message (send_excerpt, on by default) to TypeSafe Jev at api.typesafe.ai with your
  JEVI_API_KEY, in shadow mode as well as live; in live mode Jev's answer switches the request (and every later call
  of that turn, via an llm_execution wrapper) to the free, flash or premium model you configured on the same provider;
  with escalation set up on Nous it sends a 2-token billed ping to the Nous inference API with NOUS_API_KEY at most
  every 5 minutes; every turn appends a decision row (with that excerpt on routed turns) to
  ~/.hermes/jev/lane2-live.jsonl, which is never rotated.
description_tr: "Tur başına LLM yönlendirme: eşleşen her turda bir TypeSafe Jev sınıflandırıcı çağrısı (api.typesafe.ai), tur şekli özellikleri ve son kullanıcı mesajının ilk 1200 karakterini (gölge kipi dâhil) alır ve turu ücretsiz/ücretli olarak etiketler; yüksek güvenli rutin turlar sağlayıcının yapılandırılmış ücretsiz basamağına indirilir, Nous'ta stratejik orta basamak turlar ise 2 token'lık faturalı kredi denemesinden sonra yapılandırılmış premium basamağa yükseltilir (yalnızca Nous, hata durumunda kapalı). Hata durumunda açık kalır, varsayılan olarak gölgedir, kademeler kullanıcının lane2_config.json dosyasından sağlayıcı başına tanımlanır (sıralama tablosu çözümleyici betiği isteğe bağlıdır). Deneme model kimliği kodda sabittir (z-ai/glm-5.3-flash). Açıklama — ~/.hermes/jev/lane2_config.json dosyasında modelleri listeledikten sonra, eşleşen her turun ilk çağrısı mesaj/araç sayılarını ve son kullanıcı mesajının ilk 1.200 karakterini (send_excerpt, varsayılan olarak açık) JEVI_API_KEY anahtarınızla api.typesafe.ai adresindeki TypeSafe Jev'e gönderir; gölge kipinde olduğu kadar canlı kipte de. Canlı kipte Jev'in yanıtı isteği (ve o turun sonraki her çağrısını, bir llm_execution sarmalayıcısı üzerinden) aynı sağlayıcıda yapılandırdığınız ücretsiz, flash ya da premium modele yönlendirir; Nous'ta yükseltme kuruluysa, en fazla her 5 dakikada bir NOUS_API_KEY ile Nous çıkarım API'sine 2 token'lık faturalı bir ping gönderir; her tur ~/.hermes/jev/lane2-live.jsonl dosyasına bir karar satırı ekler (yönlendirilen turlarda o alıntıyla birlikte) ve bu dosya hiçbir zaman döndürülmez."
