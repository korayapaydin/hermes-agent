description: "Windows desktop plugin that switches which Codex login and which Claude subscription account every local Hermes profile uses, with one idle-only, verified restart of the gateway (and, on Hermes before 0.22, of Hermes Desktop). Refuses while any profile is busy, restores the previous selection if a step fails, and writes a receipt that says whether the switch took effect. Disclosure — Windows only. A switch rewrites, through Hermes's own commands, the Codex credential order in every profile's auth.json and the CLAUDE_SUBSCRIPTION_DIRECTSDK_CONFIG_DIR line in every profile's .env, so every profile that has the plugin enabled spends the same selected Codex login and the same Claude login (one Hermes-owned claude-auth folder; no token is copied between profiles). It reads Codex tokens from each profile's auth.json. On Hermes 0.22 and later it stops and restarts the gateway once Hermes's own idle proof and the gateway's drain report idle, and Hermes Desktop stays open and reconnects; on earlier Hermes it also reads the Desktop backends' dashboard session token from their process environment and closes and reopens Hermes Desktop (work started in the seconds after the idle check is cut off). It sends the target Codex token to OpenAI's usage endpoint and Claude login tokens to Anthropic's OAuth profile endpoint (also when the setup screen opens); if the target Claude login has expired it first runs the claude CLI once so the CLI renews its own token, which rotates that login's refresh token. No telemetry and no automatic account rotation."
description_tr: "Her yerel Hermes profilinin hangi Codex oturumunu ve hangi Claude abonelik hesabını kullandığını değiştiren Windows masaüstü eklentisi; ağ geçidinin (ve Hermes 0.22'den önce Hermes Desktop'ın) yalnızca boşta iken, doğrulanmış tek bir yeniden başlatılmasıyla. Herhangi bir profil meşgulken reddeder, bir adım başarısız olursa önceki seçimi geri yükler ve geçişin etkili olup olmadığını belirten bir onay kaydı yazar. Açıklama — Yalnızca Windows. Bir geçiş, Hermes'in kendi komutları aracılığıyla her profilin auth.json dosyasındaki Codex kimlik bilgisi sırasını ve her profilin .env dosyasındaki CLAUDE_SUBSCRIPTION_DIRECTSDK_CONFIG_DIR satırını yeniden yazar; böylece eklentisi etkin olan her profil aynı seçili Codex oturumunu ve aynı Claude oturumunu kullanır (Hermes'e ait tek bir claude-auth klasörü; profiller arasında hiçbir token kopyalanmaz). Codex token'larını her profilin auth.json dosyasından okur. Hermes 0.22 ve sonrasında, Hermes'in kendi boşta kanıtı ve ağ geçidinin drain raporu boşta bildirdiğinde ağ geçidini bir kez durdurup yeniden başlatır ve Hermes Desktop açık kalıp yeniden bağlanır; daha eski Hermes'te ayrıca Desktop arka uçlarının pano oturum token'ını süreç ortamlarından okur ve Hermes Desktop'ı kapatıp yeniden açar (boşta denetiminden sonraki saniyelerde başlayan iş kesilir). Hedef Codex token'ını OpenAI'nin kullanım uç noktasına ve Claude oturum token'larını Anthropic'in OAuth profil uç noktasına gönderir (kurulum ekranı açıldığında da); hedef Claude oturumunun süresi dolmuşsa, CLI kendi token'ını yenilesin diye önce claude CLI'sini bir kez çalıştırır; bu da o oturumun yenileme token'ını döndürür. Telemetri yok ve otomatik hesap döndürme yok."
