name: post-cortex
repo: https://github.com/julymetodiev/hermes-plugin-post-cortex
sha: 46ab2b97452ca9bd4fe3e7b4027e9f9715e895a5
description: "Self-hosted long-term memory through a post-cortex daemon (https://github.com/julymetodiev/post-cortex): typed records (decisions, fixed problems, code changes) in an entity graph with local semantic search. Recalls related records from the profile's workspace before each turn, puts the user card and the workspace's project card in the system prompt, mirrors built-in memory writes as records, and adds post_cortex_search, post_cortex_record and post_cortex_context (graph neighbours and reverse dependencies of named components) plus the post-cortex:memory skill. Records and captured turns carry the author hermes:<profile>. Profiles are mapped to shared workspaces by name glob, so a team of profiles recalls each other's records. Disclosure — talks only to the post-cortex daemon at the configured URL (default http://127.0.0.1:3737; a remote daemon over plain HTTP should sit on a private network or behind TLS): each non-trivial user prompt (up to 2,000 characters) is sent as a search query, and built-in memory writes and post_cortex_record calls are sent as records; with the opt-in capture setting (off by default) each completed turn of the primary agent is sent too: the user's message (with the sender's display name when Hermes knows it), the final reply, tool names and file paths, never tool output; nothing goes to third parties. Disclosure — the daemon stores records (and captured turns, deleted after its message_retention_days) in its own database and redacts credentials, e-mail addresses, phone numbers and public IPv4 addresses on write. Disclosure — PCX_TOKEN (and optionally PCX_URL) is read through the Hermes secret scope; the only local state is $HERMES_HOME/post-cortex.json (0600, never holds the token). No threads or processes of its own (capture runs on Hermes' sync worker), no shell commands, no deletes in post-cortex; cron and subagent runs never write automatically."
description_tr: "post-cortex daemon'u (https://github.com/julymetodiev/post-cortex) üzerinden kendi kendine barındırılan uzun süreli bellek: varlık grafiğinde yerel anlamsal aramayla tipli kayıtlar (kararlar, çözülen sorunlar, kod değişiklikleri). Her turdan önce profilin çalışma alanından ilgili kayıtları hatırlar, sistem istemine kullanıcı kartını ve çalışma alanının proje kartını koyar, yerleşik bellek yazmalarını kayıtlar olarak yansıtır ve post_cortex_search, post_cortex_record ile post_cortex_context'i (graf komşuları ve adlandırılmış bileşenlerin ters bağımlılıkları) ve post-cortex:memory yeteneğini ekler. Kayıtlar ve yakalanan turlar hermes:<profile> yazarını taşır. Profiller ada göre glob ile paylaşılan çalışma alanlarına eşlenir; böylece bir profil ekibi birbirinin kayıtlarını hatırlar. Açıklama — yalnızca yapılandırılmış URL'deki post-cortex daemon'u ile konuşur (varsayılan http://127.0.0.1:3737; düz HTTP üzerinden uzak bir daemon özel bir ağda veya TLS arkasında olmalıdır): önemsiz olmayan her kullanıcı istemi (2.000 karaktere kadar) arama sorgusu olarak gönderilir, yerleşik bellek yazmaları ve post_cortex_record çağrıları kayıt olarak gönderilir; isteğe bağlı yakalama ayarıyla (varsayılan olarak kapalı) birincil ajanın tamamlanan her turu da gönderilir: kullanıcının mesajı (Hermes biliyorsa gönderenin görünen adıyla), son yanıt, araç adları ve dosya yolları; araç çıktısı asla. Hiçbir şey üçüncü taraflara gitmez. Açıklama — daemon, kayıtları (ve yakalanan turları, message_retention_days sonrasında silinir) kendi veritabanında saklar ve yazma sırasında kimlik bilgilerini, e-posta adreslerini, telefon numaralarını ve genel IPv4 adreslerini gizler. Açıklama — PCX_TOKEN (ve isteğe bağlı olarak PCX_URL) Hermes gizli kapsamı üzerinden okunur; tek yerel durum $HERMES_HOME/post-cortex.json dosyasıdır (0600, token'ı asla tutmaz). Kendi iş parçacığı veya süreci yoktur (yakalama Hermes'in eşitleme çalışanında çalışır), kabuk komutu yoktur, post-cortex içinde silme yoktur; cron ve alt ajan koşuları asla otomatik yazmaz."
maintainer: julymetodiev
