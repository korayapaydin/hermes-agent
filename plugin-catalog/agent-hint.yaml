name: agent-hint
repo: https://github.com/dachaimahogany/hermes-agent-hint
sha: 5601d2353529352fb89c5ad85a1a9d3a68150cbb
description: "Give the inference engine behind each request a standard, machine-readable view of the agent session that produced it. Injects an X-Agent-Hint header (base64url JSON: session identity and call index, lifecycle state, soft priority, a cache-pinning hint, optional measured statistics) on main LLM requests, and can emit session lifecycle events out of band as local ndjson or as POSTs to a URL you configure. Request bodies are never modified, and nothing is added or sent until the plugin is enabled. Lets a scheduler pin a session to the instance already holding its KV cache, or rank a user-blocked session above background work, without teaching the engine anything about the client. Disclosure — when enabled, every main LLM request carries an X-Agent-Hint header (base64url JSON with the session id, call index, lifecycle state, priority and cache hints) to whatever provider is configured, not only hint-aware engines; with status_sink: http the same session events and usage/latency statistics are POSTed to the status_url you set, and ndjson writes them under $HERMES_HOME."
description_tr: "Her isteğin arkasındaki çıkarım motoruna, onu üreten ajan oturumunun standart ve makine tarafından okunabilir bir görünümünü verin. Ana LLM isteklerine bir X-Agent-Hint başlığı enjekte eder (base64url JSON: oturum kimliği ve çağrı dizini, yaşam döngüsü durumu, yumuşak öncelik, önbelleğe sabitleme ipucu, isteğe bağlı ölçülmüş istatistikler) ve oturum yaşam döngüsü olaylarını bant dışı olarak yerel ndjson ya da yapılandırdığınız bir URL'ye POST olarak yayımlayabilir. İstek gövdeleri asla değiştirilmez ve eklenti etkinleştirilene kadar hiçbir şey eklenmez veya gönderilmez. Zamanlayıcının bir oturumu KV önbelleğini zaten tutan örneğe sabitlemesine ya da kullanıcı tarafından engellenmiş bir oturumu arka plan işinin üzerine sıralamasına izin verir; motora istemci hakkında hiçbir şey öğretmeden. Açıklama — etkinleştirildiğinde, her ana LLM isteği, yalnızca ipucunu anlayan motorlara değil, yapılandırılmış hangi sağlayıcı olursa olsun ona bir X-Agent-Hint başlığı (oturum kimliği, çağrı dizini, yaşam döngüsü durumu, öncelik ve önbellek ipuçlarını içeren base64url JSON) taşır; status_sink: http ile aynı oturum olayları ve kullanım/gecikme istatistikleri ayarladığınız status_url'ye POST edilir ve ndjson bunları $HERMES_HOME altına yazar."
maintainer: dachaimahogany
tier: community
category: general
docs_url: https://github.com/dachaimahogany/hermes-agent-hint#readme
version: "0.5.1"
requires_hermes: ">=0.21.6"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - on_session_end
    - on_session_finalize
    - pre_tool_call
    - post_tool_call
    - pre_approval_request
    - post_approval_response
    - subagent_start
    - subagent_stop
    - post_api_request
  provides_middleware:
    - llm_request
  requires_env: []
