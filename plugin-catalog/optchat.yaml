name: optchat
repo: https://github.com/aska-digital/optchat-memory
sha: "7b0f3abd65b95996366d0495787c95af981ea587"
subdir: optchat
description: "OptChat-style endless memory for Hermes: an append-only verbatim log plus a binary summary tree, exposed as recall through the MemoryProvider ABC. Background compactor builds the tree with a cheap auxiliary model (call_llm task optchat_compact); prefetch returns a fixed-budget view of the whole history; optchat_zoom/optchat_date tools open any line down to the verbatim message. Disclosure — every turn's user messages, agent replies, tool calls and tool results (each result capped at 30,000 characters, after Hermes's secret redaction) are appended permanently to unencrypted owner-only files under $HERMES_HOME/optchat/, with no deletion or retention limit; a background compactor sends those messages and the surrounding summary view to your auxiliary model route (task optchat_compact) for summarization; each turn injects up to view_budget_chars (default 16,000) of that history into the model context."
description_tr: "OptChat tarzı, Hermes için sonsuz bellek: yalnızca eklenen birebir günlük ve ikili bir özet ağacı, MemoryProvider ABC üzerinden geri çağırma olarak sunulur. Arka plan sıkıştırıcısı ağacı ucuz bir yardımcı modelle kurar (call_llm görevi optchat_compact); ön getirme, tüm geçmişin sabit bütçeli bir görünümünü döndürür; optchat_zoom/optchat_date araçları herhangi bir satırı birebir mesaja kadar açar. Açıklama — her turun kullanıcı mesajları, ajan yanıtları, araç çağrıları ve araç sonuçları (her sonuç, Hermes'in gizli bilgi redaksiyonundan sonra 30.000 karakterle sınırlanır) $HERMES_HOME/optchat/ altındaki şifrelenmemiş, yalnızca sahibinin erişebildiği dosyalara kalıcı olarak eklenir; silme ya da saklama sınırı yoktur; arka plan sıkıştırıcısı bu mesajları ve çevresindeki özet görünümünü özetleme için yardımcı model rotanıza (optchat_compact görevi) gönderir; her tur bu geçmişten view_budget_chars (varsayılan 16.000) kadarını model bağlamına enjekte eder."
maintainer: ahrazzle
