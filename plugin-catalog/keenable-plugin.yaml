sha: ffa97c924415f7b6e3517d900694272efac8af41
description: "Web search and page fetching through Keenable's hosted MCP server, with search and research skills: single-site and publish-date filters, result and snippet limits, and page fetches that return only what a prompt asks for. Works without an API key; an optional KEENABLE_API_KEY lifts the keyless rate limits. Adds direct MCP tools beside Hermes's built-in Keenable web backend and leaves web_search / web_extract provider selection unchanged. Disclosure: connects to Keenable's hosted MCP server at `api.keenable.ai` and sends it the search queries, URLs and fetch prompts the agent issues, labelled with the header `X-Keenable-Title: hermes-plugin`; sends `X-API-Key` only when the user adds the optional config.yaml entry with their key."
description_tr: "Arama ve araştırma yetenekleri ile Keenable'ın barındırılan MCP sunucusu üzerinden web araması ve sayfa çekme: tek site ve yayınlanma tarihi filtreleri, sonuç ve snippet sınırları ve yalnızca bir istemin istediği içeriği döndüren sayfa çekmeleri. API anahtarı olmadan çalışır; isteğe bağlı bir KEENABLE_API_KEY, anahtarsız hız sınırlarını kaldırır. Hermes'in yerleşik Keenable web arka ucunun yanına doğrudan MCP araçları ekler ve web_search / web_extract sağlayıcı seçimini değiştirmez. Bilgilendirme: `api.keenable.ai` adresindeki Keenable barındırılan MCP sunucusuna bağlanır ve ajanın oluşturduğu arama sorgularını, URL'leri ve çekme istemlerini `X-Keenable-Title: hermes-plugin` üst bilgisiyle gönderir; `X-API-Key` yalnızca kullanıcı isteğe bağlı config.yaml girişini kendi anahtarıyla eklediğinde gönderilir."
