subdir: crontab-ref
description: "@crontab: context references that explain a cron expression for the model: @crontab:\"0 9 * * 1-5\" (or a shortcut such as @crontab:@daily) attaches a plain-words reading (\"At 09:00 on Monday through Friday.\"), each field on its own row, whether Hermes's /cron takes it as a cron expression (shortcuts, ? and 5#3 are not), its next five runs in Hermes's timezone setting worked out the way cron/jobs.py computes next runs, and notes on day of month OR day of week, * in the minute field, steps that do not divide the hour or day, days 29-31 and 7 as Sunday; the TUI and Desktop composer suggest examples and preview an expression as you type it. The reading comes from croniter, the library Hermes's scheduler uses. Disclosure — reads only the text of the reference itself, the system clock and Hermes's timezone setting (HERMES_TIMEZONE, else timezone from the loaded config through hermes_cli.config), using croniter (already installed with Hermes) and Python's standard library; no network, no files read or written, no subprocess, no credentials read, no cron job created, changed or run; the @crontab: reference and its explanation become part of the message sent to your model provider and saved in the session history; register() only adds the @crontab: reference provider."
description_tr: "@crontab: Model için bir cron ifadesini açıklayan bağlam referansları: @crontab:\"0 9 * * 1-5\" (veya @crontab:@daily gibi bir kısayol), düz kelimelerle bir okuma (\"Pazartesi'den Cuma'ya saat 09:00'da.\"), her alan kendi satırında, Hermes'in /cron'unun bunu bir cron ifadesi olarak kabul edip etmediği (kısayollar, ? ve 5#3 kabul edilmez), Hermes'in zaman dilimi ayarına göre cron/jobs.py'nin bir sonraki çalıştırmaları hesaplama şekliyle belirlenmiş sonraki beş çalışması ve ayın günü VEYA haftanın günü, dakika alanındaki *, saati veya günü bölmeyen adımlar, 29-31 arası günler ve Pazar olarak 7. gün hakkında notlar ekler; TUI ve Masaüstü oluşturucu, siz yazarken örnekler önerir ve ifadeyi önizler. Okuma, Hermes'in zamanlayıcısının kullandığı croniter kütüphanesinden gelir. Açıklama — Yalnızca referansın kendi metnini, sistem saatini ve Hermes'in zaman dilimi ayarını (HERMES_TIMEZONE, aksi takdirde hermes_cli.config üzerinden yüklü yapılandırmadan) croniter (Hermes ile birlikte yüklü gelir) ve Python standart kütüphanesini kullanarak okur; ağ erişimi, dosya okuma/yazma, alt süreç veya kimlik bilgisi okuması yoktur, cron işi oluşturulmaz, değiştirilmez veya çalıştırılmaz; @crontab: referansı ve açıklaması, model sağlayıcınıza gönderilen mesajın ve oturum geçmişinin bir parçası olur; register() yalnızca @crontab: referans sağlayıcısını ekler."
