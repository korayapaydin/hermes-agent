name: doc-markdown
repo: https://github.com/TakeshiTGAL/hermes-plugin-doc-markdown
sha: 4206b7f8066fe84f2c295f480a441f47154d9315
description: "Convert one local file to Markdown with doc_convert on Linux and macOS, built on Microsoft's MarkItDown. Microsoft and MarkItDown are trademarks of the Microsoft group of companies. Disclosure — the doc_markdown toolset is on by default on every surface, including a gateway, so anyone you allow there can call doc_convert; stop it with hermes tools. It does not fetch pages. Unattended sessions still convert when Hermes calls the tool. This plugin creates no cron job. A child process runs MarkItDown with no Hermes keys in its environment; on macOS the plugin runs ps about every 10 ms to watch that child's memory. It stops 8 seconds after its converters load, at 60 seconds if loading never finishes, or above 922746880 bytes. It is not a sandbox: after realpath it may read any allowlisted path it can open. Unpublished Hermes code locates the Hermes home, and a failed check refuses the path. Removal deletes the plugin directory, not the markitdown package. Windows was not tested."
description_tr: "Tek bir yerel dosyayı Linux ve macOS'ta doc_convert ile Markdown'a dönüştürün; Microsoft'un MarkItDown'u üzerine kuruludur. Microsoft ve MarkItDown, Microsoft şirketler grubunun tescilli markalarıdır. Açıklama — doc_markdown araç takımı, bir ağ geçidi dahil her yüzeyde varsayılan olarak açıktır; dolayısıyla orada izin verdiğiniz herkes doc_convert'i çağırabilir; hermes tools ile durdurun. Sayfaları getirmez. Gözetimsiz oturumlar, Hermes aracı çağırdığında yine dönüştürme yapar. Bu eklenti hiçbir cron işi oluşturmaz. Bir alt süreç, ortamında hiçbir Hermes anahtarı olmadan MarkItDown'u çalıştırır; macOS'ta eklenti, o alt sürecin belleğini izlemek için yaklaşık her 10 ms'de bir ps çalıştırır. Dönüştürücüleri yüklendikten 8 saniye sonra, yükleme hiç bitmezse 60 saniyede veya 922.746.880 baytın üzerinde durur. Bu bir korumalı alan değildir: realpath sonrasında açabildiği izin listesindeki herhangi bir yolu okuyabilir. Yayımlanmamış Hermes kodu Hermes ana dizinini bulur ve başarısız bir denetim yolu reddeder. Kaldırma, markitdown paketini değil eklenti dizinini siler. Windows test edilmedi."
maintainer: TakeshiTGAL
