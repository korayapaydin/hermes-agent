name: inline-platform
repo: https://github.com/inline-chat/inline
sha: 2d3b360da0430684eabab2d946eca0e725c08aa5
subdir: plugins/hermes-agent/plugin/inline
description: >-
  Use Hermes Agent from Inline work-chat DMs, chats, and reply threads.
  Disclosure — the setup wizard can, on explicit opt-in, download
  https://inline.chat/cli/install.sh and pipe it to sh without a checksum,
  then run the vendor inline CLI login; on connect the adapter publishes
  your Hermes slash-command list and the names and descriptions of installed
  skills to the Inline server (INLINE_SYNC_COMMANDS=false disables); error
  telemetry is off unless a Sentry DSN is set.
description_tr: "Hermes Agent'ı Inline iş sohbeti DM'lerinden, sohbetlerden ve yanıt iş parçacıklarından kullanın. Açıklama — kurulum sihirbazı, açık onay verilmesi durumunda https://inline.chat/cli/install.sh dosyasını indirip bir sağlama toplamı olmadan sh'e aktarabilir, ardından satıcının inline CLI oturum açma komutunu çalıştırabilir; bağlanınca bağdaştırıcı, Hermes eğik çizgi komutu listenizi ve yüklü yeteneklerin adlarını ve açıklamalarını Inline sunucusuna yayımlar (INLINE_SYNC_COMMANDS=false bunu devre dışı bırakır); bir Sentry DSN ayarlanmadıkça hata telemetrisi kapalıdır."
maintainer: morajabi
tier: community
category: platform
requires_hermes: ">=0.21.3"
version: "0.0.21"
capabilities:
  provides_tools:
    - inline
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - INLINE_TOKEN
