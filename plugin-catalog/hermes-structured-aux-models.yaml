description: Routes selected Hermes auxiliary tasks (approval, MCP sampling, compression) through bounded
  Jev decision calls on OpenRouter instead of free-form chat prompts, failing open to the operator's own
  auxiliary provider for anything it cannot express as a decision. Disclosure — sends redacted approval
  prompts, MCP tool names and compression transcript blocks to openrouter.ai using your OpenRouter key
  (read-only); on any error approvals escalate to you, never auto-approve; the default decision_model
  is a moving alias, pin it.
description_tr: "Seçili Hermes yardımcı görevlerini (onay, MCP örnekleme, sıkıştırma), serbest biçimli sohbet istemleri yerine OpenRouter üzerinden sınırlı Jev karar çağrılarıyla yönlendirir; karar olarak ifade edemediği her şeyde operatörün kendi yardımcı sağlayıcısına açık kalarak düşer. Açıklama — redakte edilmiş onay istemlerini, MCP araç adlarını ve sıkıştırma döküm bloklarını OpenRouter anahtarınızı kullanarak openrouter.ai adresine gönderir (salt okunur); herhangi bir hatada onaylar size yükseltilir, asla otomatik onaylanmaz; varsayılan decision_model değişen bir takma addır, sabitleyin."
