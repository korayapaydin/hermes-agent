title: Hermes Pokémon
description: "A cozy pixel-art companion garden for Hermes Desktop with three starters, nicknames, fetch, berries, XP, and optional evolution through all nine starter forms. The companion keeps you company on long turns, reacts quietly to failures, to what Hermes is doing and to turns finishing in other chats, and lives through seasons with real day length and moon phases, offline showers, wild visitors it greets in character, old-friend cameos, keepsakes, milestones that leave a bench, a lantern and bunting in the garden, and a sapling that grows with the days. Reachable from the keyboard, the status bar and the command palette. Independent fan project bundling CHUNSOFT Pokémon sprites and SpriteCollab community contributions; artwork is excluded from the source-code MIT license. Uses local plugin storage and read-only session activity, with no runtime network requests, credentials, backend, or model calls. Disclosure — independent fan project bundling CHUNSOFT Pokémon sprites and SpriteCollab contributions that are excluded from the MIT code license; reads session busy state and message-complete/tool-start/tool-complete events read-only (other chats contribute only \"a turn finished\"), focuses the composer (caret only, no text) or reveals its own pane only on a user click or command, saves a PNG snapshot to your downloads only when you click Save a snapshot, and keeps companion state in plugin storage; no network or model calls."
description_tr: "Hermes Desktop için sıcak, piksel sanatlı eşlikçi bahçesi: üç başlangıç, takma adlar, yakalama, yaban meyveleri, deneyim puanı ve dokuz başlangıç formunun tamamı boyunca isteğe bağlı evrim. Eşlikçi sizinle uzun turlarda birlikte olur, hatalara, Hermes'in yaptığı işlere ve başka sohbetlerde biten turlara sessizce tepki verir; gerçek gün uzunluğu ve ay evreleriyle mevsimler boyunca yaşar, çevrimdışı sağanaklar, karakterine uygun selamladığı yaban ziyaretçileri, eski dost cameo'ları, hatıralar, bahçede bir bank, bir fener ve çıngırak bırakan kilometre taşları ve günlerle büyüyen bir fidan içerir. Klavyeden, durum çubuğundan ve komut paletinden erişilir. CHUNSOFT Pokémon sprite'larını ve SpriteCollab topluluk katkılarını paketleyen bağımsız bir hayran projesi; çizimler kaynak kodun MIT lisansının dışındadır. Yerel eklenti depolamasını ve salt okunur oturum etkinliğini kullanır; çalışma zamanında ağ isteği, kimlik bilgisi, arka uç ya da model çağrısı yoktur. Açıklama — MIT kod lisansının dışında tutulan CHUNSOFT Pokémon sprite'larını ve SpriteCollab katkılarını paketleyen bağımsız bir hayran projesidir; oturumun meşgul durumunu ve message-complete/tool-start/tool-complete olaylarını salt okunur biçimde okur (diğer sohbetler yalnızca \"bir tur tamamlandı\" bilgisiyle katkıda bulunur), yazma alanına odaklanır (yalnızca imleç, metin yok) ya da kendi panelini yalnızca kullanıcı tıklaması veya komutuyla açar, yalnızca \"Anlık görüntü kaydet\" düğmesine tıkladığınızda indirilenler klasörüne bir PNG anlık görüntüsü kaydeder ve eşlikçi durumunu eklenti depolamasında tutar; ağ ya da model çağrısı yoktur."
