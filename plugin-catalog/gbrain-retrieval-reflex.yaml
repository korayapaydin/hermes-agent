name: gbrain-retrieval-reflex
repo: https://github.com/aean0x/hermes-gbrain-retrieval-reflex
sha: 78516ca629588612ebfc0a7ca86944fbb63d7dd8
description: "pre_llm_call hook plugin, enabled with `hermes plugins enable`: injects ambient context from a GBrain instance before each turn (volunteer_context, then a hybrid-query fallback). Not a `memory.provider`. Silent no-op when GBrain is unreachable or no token is set. Disclosure — before each non-trivial turn the last six user and assistant messages (truncated) and the current message are sent with a GBRAIN_TOKEN bearer token to GBRAIN_MCP_URL (default http://127.0.0.1:3131/mcp), and returned brain-page text is injected into the turn."
description_tr: "pre_llm_call kanca eklentisi, `hermes plugins enable` ile etkinleştirilir: her turdan önce bir GBrain örneğinden ortam bağlamı enjekte eder (önce volunteer_context, sonra hibrit sorgu yedeği). Bir `memory.provider` değildir. GBrain'a erişilemiyorsa ya da token ayarlanmamışsa sessizce hiçbir şey yapmaz. Açıklama — her önemsiz olmayan turdan önce son altı kullanıcı ve asistan mesajı (kısaltılmış) ve geçerli mesaj, bir GBRAIN_TOKEN bearer token'ıyla GBRAIN_MCP_URL adresine (varsayılan http://127.0.0.1:3131/mcp) gönderilir ve döndürülen beyin sayfası metni tura enjekte edilir."
maintainer: aean0x
