name: hermes-slash-router
repo: https://github.com/raitoxlol/hermes-slash-router
sha: 2088919f4c59927aa2d47f21bb12e639453c1a2a
description: "Jev-powered routing for misspelled, shortened, and meaning-based slash commands in the Hermes Desktop composer. Preserves drafts when unsure. Requires a TypeSafe API key; every non-exact lookup uses paid TypeSafe API usage. Disclosure — every non-exact slash token is sent through the plugin's local backend to api.typesafe.ai (paid, your TYPESAFE_API_KEY) together with the Desktop command catalog (names and descriptions), any prior route, up to 8 saved correction explanations and any clarification you type into its panel; message arguments and conversation content are not sent; the backend reads HERMES_HOME/.env only to check whether TYPESAFE_API_KEY is set."
description_tr: "Hermes Desktop yazma alanında yanlış yazılmış, kısaltılmış ve anlam temelli eğik çizgi komutları için Jev destekli yönlendirme. Emin olmadığında taslakları korur. Bir TypeSafe API anahtarı gerekir; her tam olmayan arama ücretli TypeSafe API kullanımıdır. Açıklama — tam olmayan her eğik çizgi belirteci, eklentinin yerel arka ucu üzerinden api.typesafe.ai'ye (ücretli, TYPESAFE_API_KEY'iniz) Desktop komut kataloğu (adlar ve açıklamalar), varsa önceki yönlendirme, en fazla 8 kayıtlı düzeltme açıklaması ve panelinde yazdığınız herhangi bir açıklama ile birlikte gönderilir; mesaj bağımsız değişkenleri ve konuşma içeriği gönderilmez; arka uç, HERMES_HOME/.env dosyasını yalnızca TYPESAFE_API_KEY'in ayarlı olup olmadığını denetlemek için okur."
maintainer: raitoxlol
tier: community
category: desktop
requires_hermes: ">=0.21.2"
docs_url: https://github.com/raitoxlol/hermes-slash-router#readme
version: "0.3.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - TYPESAFE_API_KEY
