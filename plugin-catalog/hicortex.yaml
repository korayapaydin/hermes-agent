readme: true
capabilities:
  provides_tools:
    - hicortex_search
    - hicortex_get
    - hicortex_recent
    - hicortex_ingest
    - hicortex_lessons
    - hicortex_index
    - hicortex_graph
    - hicortex_update
    - hicortex_delete
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HICORTEX_URL
    - HICORTEX_AUTH_TOKEN
