name: hicortex
repo: https://github.com/gamaze-labs/hicortex-hermes-plugin
sha: 3321a063bffb087dfcedc239a6f7aaf1ac0b8ef6
description: "Shared fleet memory for Hermes agents: every connected agent learns from all other agents connected to the memory, wherever they run. Sessions across machines and harnesses are distilled into one common brain overnight — what one learns, the whole fleet recalls. Pushes a compact per-turn recall index (entries lazy-load via hicortex_get), injects fresh lessons plus a per-agent standing context block at session start — lesson blocks are delimited and carry an explicit reference-data framing line and provenance header — and exposes the full 9-tool memory surface (search, get, recent, ingest, lessons, index, graph, update, delete) through the shared server. The same server also serves Claude Code, OpenClaw, Pi and opencode agents, so mixed-harness fleets share one brain. Stdlib-only, no pip dependencies. Requires a running Hicortex server (npx @gamaze/hicortex init on any machine); data flow: each user message is sent to your configured Hicortex server for recall (default http://localhost:8787); session distillation runs on the server. Disclosure — sends every user message (and profile name) to your configured Hicortex server each turn for recall, default http://localhost:8787, plain http with a bearer token is accepted for remote servers with a one-time log warning; the server's standing Identity text and lessons are injected into the system prompt; the model can permanently update or delete shared fleet memories via hicortex_update / hicortex_delete without confirmation."
description_tr: "Hermes ajanları için paylaşılan filo belleği: belleğe bağlı her ajan, nerede çalışırsa çalışsın diğer tüm ajanlardan öğrenir. Makineler ve koşum ortamları arasındaki oturumlar bir gece içinde tek bir ortak beyine damıtılır — birinin öğrendiğini tüm filo hatırlar. Kompakt bir tur başına geri çağırma dizisi gönderir (girdiler hicortex_get ile tembel yüklenir), oturum başlangıcında taze dersler ve ajan başına kalıcı bir bağlam bloğu enjekte eder — ders blokları sınırlandırılmıştır ve açık bir referans veri çerçevesi satırı ile köken başlığı taşır — ve paylaşılan sunucu üzerinden 9 araçlık bellek yüzeyinin tamamını (search, get, recent, ingest, lessons, index, graph, update, delete) sunar. Aynı sunucu Claude Code, OpenClaw, Pi ve opencode ajanlarına da hizmet verir, böylece karışık koşum ortamlı filolar tek bir beyin paylaşır. Yalnızca standart kütüphane, pip bağımlılığı yok. Çalışan bir Hicortex sunucusu gerekir (herhangi bir makinede npx @gamaze/hicortex init); veri akışı: her kullanıcı mesajı, geri çağırma için yapılandırdığınız Hicortex sunucusuna gönderilir (varsayılan http://localhost:8787); oturum damıtma sunucuda çalışır. Açıklama — her kullanıcı mesajını (ve profil adını) geri çağırma için her turda yapılandırdığınız Hicortex sunucusuna gönderir, varsayılan http://localhost:8787; uzak sunucular için bearer token ile düz http, tek seferlik bir günlük uyarısıyla kabul edilir; sunucunun kalıcı Identity metni ve dersleri sistem istemine enjekte edilir; model, paylaşılan filo anılarını hicortex_update / hicortex_delete aracılığıyla onay almadan kalıcı olarak güncelleyebilir veya silebilir."
maintainer: gamaze-labs
tier: community
category: memory
docs_url: https://github.com/gamaze-labs/hicortex-hermes-plugin#readme
