name: unbrowse
repo: https://github.com/unbrowse-ai/unbrowse
sha: a82c59dfb05583836ecfa21fdc3f8a2ea73bfb76
subdir: plugins/hermes
description: "Unbrowse: websites as APIs. Read any page as clean markdown, run tasks on sites through learned first-party APIs (no browser), and drive a cloud browser with saved logins when nothing matches. Also a web_extract backend and a guard that routes public-web browser_* calls to Unbrowse. Disclosure — hosted service: page URLs, task text and tool arguments are sent to unbrowse.ai with your API key, pages are fetched and site logins are stored on Unbrowse's side, and verified calls bill the Unbrowse account; once UNBROWSE_API_KEY is set the plugin blocks the built-in browser_* tools and web_extract on public URLs by default (settings blockBrowser/blockWebExtract, or UNBROWSE_ALLOW_BUILTIN_BROWSER=1)."
description_tr: "Unbrowse: web siteleri API olarak. Herhangi bir sayfayı temiz markdown olarak okuyun, sitelerde öğrenilmiş birinci taraf API'lerle görevler çalıştırın (tarayıcı yok) ve hiçbir şey eşleşmediğinde kayıtlı girişlerle bulut tarayıcıyı sürün. Ayrıca bir web_extract arka ucu ve genel web'deki browser_* çağrılarını Unbrowse'a yönlendiren bir koruma korkuluğu. Açıklama — barındırılan hizmet: sayfa URL'leri, görev metni ve araç bağımsız değişkenleri API anahtarınızla unbrowse.ai'ye gönderilir, sayfalar getirilir ve site oturum açma bilgileri Unbrowse tarafında saklanır, doğrulanmış çağrılar Unbrowse hesabından ücretlendirilir; UNBROWSE_API_KEY ayarlandığında eklenti, yerleşik browser_* araçlarını ve genel URL'lerde web_extract'i varsayılan olarak engeller (blockBrowser/blockWebExtract ayarları veya UNBROWSE_ALLOW_BUILTIN_BROWSER=1)."
maintainer: unbrowse-ai
tier: community
category: web
docs_url: https://github.com/unbrowse-ai/unbrowse/tree/main/plugins/hermes
version: "12.1.0"
capabilities:
  provides_tools:
  - unbrowse_canvas_read
  - unbrowse_canvas_put
  - unbrowse_run
  - unbrowse_inspect
  - unbrowse_resume
  - unbrowse_cancel
  - unbrowse_learn
  - unbrowse_browse_open
  - unbrowse_browse_snapshot
  - unbrowse_browse_act
  - unbrowse_forget
  - unbrowse_credentials_list
  - unbrowse_credentials_request
  - unbrowse_credentials_status
  - unbrowse_browse_finish
  - unbrowse_browse_close
  - unbrowse_scrape
  - unbrowse_map
  - unbrowse_sites
  - unbrowse_credits
  - unbrowse_usage
  - unbrowse_index
  - unbrowse_index_status
  - unbrowse_discover
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - UNBROWSE_API_KEY
