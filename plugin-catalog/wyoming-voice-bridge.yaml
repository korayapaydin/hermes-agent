name: wyoming-voice-bridge
repo: https://github.com/TakeshiTGAL/hermes-plugin-wyoming-voice-bridge
sha: 7be4db8548a82a8745981d47e79d1623a173a54b
description: "Wyoming speech-to-text and text-to-speech for a Wyoming server you run (stt/tts provider `wyoming`), plus a wyoming_voice_status tool that lists the server's models and voices. Disclosure — Audio and text to speak go to the WYOMING_* host:port you set over cleartext, unauthenticated TCP (public addresses accepted). Once selected, the providers send speech in every session, including cron and webhooks. Non-WAV audio is converted with your local ffmpeg. wyoming_voice_status asks for approval on each call and refuses under cron, yolo, approvals off, -q and unattended platforms; answering \"always\" leaves a command_allowlist line in config.yaml. It calls internal Hermes approval, config and write-guard helpers, so a Hermes update can disable the status tool or speech file writes (both fail closed)."
description_tr: "Çalıştırdığınız bir Wyoming sunucusu için Wyoming sesten metne ve metinden sese (stt/tts sağlayıcısı `wyoming`), ayrıca sunucunun modellerini ve seslerini listeleyen bir wyoming_voice_status aracı. Açıklama — ses ve okunacak metin, ayarladığınız WYOMING_* ana bilgisayar:port adresine şifrelenmemiş, kimlik doğrulaması olmayan TCP üzerinden gider (genel adresler kabul edilir). Bir kez seçildikten sonra sağlayıcılar, cron ve webhook'lar dahil her oturumda konuşmayı gönderir. WAV olmayan ses, yerel ffmpeg'inizle dönüştürülür. wyoming_voice_status her çağrıda onay ister ve cron, yolo, onaylar kapalı, -q ve katılımsız platformlarda reddeder; \"always\" yanıtı config.yaml'de bir command_allowlist satırı bırakır. Hermes'in iç onay, yapılandırma ve yazma koruması yardımcılarını çağırır, bu yüzden bir Hermes güncellemesi durum aracını veya konuşma dosyası yazmalarını devre dışı bırakabilir (ikisi de kapalı yönde başarısız olur)."
maintainer: TakeshiTGAL
tier: community
category: voice
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-wyoming-voice-bridge#readme
