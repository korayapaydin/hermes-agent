name: mnemoverse
repo: https://github.com/mnemoverse/claude-plugin
sha: 0e36727a2432410a642d4980d24a0ad33d05a8d2
description: "Persistent memory for agents, shared across tools: save preferences, decisions and lessons and recall them later by natural-language search; rating a recalled memory as helpful or misleading re-ranks what comes back next; shared rooms (beta) let several people's agents work from one memory. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/) pointing at the hosted Mnemoverse MCP server (Streamable HTTP, OAuth 2.1 + DCR); the two bundled skills load under a namespaced name. Disclosure — hosted-only connector; Hermes runs no code from the package (scripts/ holds the repository's own CI checks). Every tool call goes to the vendor's remote MCP server at mcp.mnemoverse.com (authorization server auth.mnemoverse.com, browser sign-in on console.mnemoverse.com); memories the agent writes are stored in the signed-in user's Mnemoverse account, and recalled memories are pulled into the session context. OAuth tokens are held and refreshed by Hermes, never by the package. No telemetry, background process or self-update code."
description_tr: "Araçlar arasında paylaşılan, ajanlar için kalıcı bellek: tercihleri, kararları ve dersleri kaydedin, sonra doğal dil aramasıyla hatırlayın; hatırlanan bir belleği yararlı ya da yanıltıcı olarak puanlamak, bir sonraki seferde dönecekleri yeniden sıralar; paylaşımlı odalar (beta), birden fazla kişinin ajanının tek bir bellekten çalışmasını sağlar. Barındırılan Mnemoverse MCP sunucusuna (Streamable HTTP, OAuth 2.1 + DCR) yönelen Taşınabilir Agent Plugins v1 paketi (plugin.json + mcp.json + skills/); paketlenen iki yetenek, ad alanıyla nitelenmiş bir ad altında yüklenir. Açıklama — yalnızca barındırılan bağlayıcı; Hermes paketten hiçbir kod çalıştırmaz (scripts/ deponun kendi CI denetimlerini barındırır). Her araç çağrısı satıcının mcp.mnemoverse.com adresindeki uzak MCP sunucusuna gider (yetkilendirme sunucusu auth.mnemoverse.com, tarayıcıda oturum açma console.mnemoverse.com); ajanın yazdığı bellekler oturum açmış kullanıcının Mnemoverse hesabında saklanır ve hatırlanan bellekler oturum bağlamına çekilir. OAuth token'ları paket tarafından değil, Hermes tarafından tutulur ve yenilenir. Telemetri, arka plan süreci veya kendi kendini güncelleme kodu yoktur."
