name: day-panel
title: Today (day panel)
repo: https://github.com/brunosouzas/hermes-day-panel
sha: 2a971fec47d16829b73c95fe053eac6f12389903
description: "A Today page in Hermes Desktop, plus hermes day show and check, built from sections you list in a YAML file: any program that prints JSON (your tracker, a script of yours), your open GitHub pull requests and review requests through gh, one read-only tool of an MCP server you already configured, and your AI providers' limit windows from hermes usage. Items can carry a colour, a progress bar and a relative time; the page follows the Desktop theme. Ships a demo page that needs no login or network. Read-only and no model calls; merging a pull request from the page is off by default and needs a preview and a confirmation pinned to the head commit. Disclosure — runs the programs your sources file names (no shell), plus gh and hermes usage, as your user with your existing logins; calls a configured MCP server's tool only when the server marks it readOnlyHint, in a child process that imports three undocumented Hermes MCP modules (there is no public seam for this yet); reads only the sources file; writes nothing to disk; logs carry section names and exit statuses, not source output. No credentials stored, no telemetry."
description_tr: "Hermes Desktop'da bir Today sayfası, ayrıca hermes day show ve check; bir YAML dosyasında listelediğiniz bölümlerden oluşturulur: JSON yazdıran herhangi bir program (kendi takipçiniz, kendi betiğiniz), gh üzerinden açık GitHub pull request'leriniz ve inceleme istekleriniz, zaten yapılandırdığınız bir MCP sunucusunun salt okunur tek bir aracı ve hermes usage'tan yapay zekâ sağlayıcılarınızın limit pencereleri. Öğeler renk, ilerleme çubuğu ve göreli zaman taşıyabilir; sayfa Desktop temasını izler. Oturum açma veya ağ gerektirmeyen bir demo sayfası içerir. Salt okunur ve model çağrısı yok; sayfadan bir pull request'i birleştirmek varsayılan olarak kapalıdır ve head commit'e sabitlenmiş bir önizleme ile onay gerektirir. Açıklama — kaynak dosyanızda adı geçen programları (kabuk olmadan), ayrıca gh ve hermes usage'ı, kendi kullanıcı hesabınızla, mevcut oturum açma bilgilerinizle çalıştırır; yapılandırılmış bir MCP sunucusunun aracını yalnızca sunucu onu readOnlyHint olarak işaretlediğinde, üç belgelenmemiş Hermes MCP modülünü içe aktaran bir alt süreçte çağırır (bunun için herkese açık bir uzantı noktası henüz yok); yalnızca kaynaklar dosyasını okur; diske hiçbir şey yazmaz; günlükler kaynak çıktısını değil bölüm adlarını ve çıkış durumlarını taşır. Saklanan kimlik bilgisi yok, telemetri yok."
