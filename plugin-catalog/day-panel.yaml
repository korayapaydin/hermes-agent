known_issues:
  - "The mcp_tool source imports undocumented Hermes MCP internals (discover_mcp_tools, _tool_is_read_only, mcp_prefixed_tool_name); a Hermes release can break that one source until the plugin is updated. The other sources do not use them."
  - "Under plugins.isolation: host the hermes day terminal command is not available (Hermes skips plugin CLI commands in the host); the Desktop page still works."
  - "The Desktop half ships disabled, like every plugin's: turn it on in Capabilities → Plugins."
