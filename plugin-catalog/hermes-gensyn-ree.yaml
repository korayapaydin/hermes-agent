name: hermes-gensyn-ree
repo: https://github.com/TakeshiTGAL/hermes-gensyn-plugins
sha: 9325a7b15d815ca05983885ddd6615eae5f2b7a6
subdir: packages/ree
description: "ree_validate_receipt, ree_verify_receipt, ree_infer. Validate does not re-execute and does not stand behind text_output, finish_reason, token_count, model.name, or ree_version. Verify re-executes on CPU. Infer runs one of three small models and writes one receipt. Disclosure — Starts containers from the local image gensynai/ree:v0.8.0 (pinned by digest) and never pulls it; running docker pull yourself is consent to the REE-Binary-License. ree_verify_receipt and ree_infer mount ~/.cache/gensyn and ~/.cache/huggingface read-write (a Hugging Face token file stored there is visible to the container; no token is passed in the environment), may download Hugging Face weights for any model a receipt names, and their container network is not limited to Hugging Face; they ask for Hermes approval on every call and refuse under cron, yolo, approvals off, single-query, unattended runs, host isolation, or when the approval API is missing. ree_validate_receipt runs with network none, does not ask, and returns no receipt text. Any person admitted to one of your gateways can call these tools and approve containers on your Docker daemon; disable per surface with hermes tools. Choosing \"always\" adds one config.yaml allowlist line per call and never covers the next call. New receipts and temporary work files are written under ~/.cache/hermes-ree; nothing is stored under HERMES_HOME. The container is not a hostile-code sandbox. No cron is created."
description_tr: "ree_validate_receipt, ree_verify_receipt ve ree_infer araçları. ree_validate_receipt yeniden çalıştırmaz ve text_output, finish_reason, token_count, model.name ya da ree_version alanlarının arkasında durmaz. ree_verify_receipt CPU üzerinde yeniden çalıştırır. ree_infer üç küçük modelden birini çalıştırır ve tek bir receipt yazar. Açıklama — konteynerleri yerel gensynai/ree:v0.8.0 imajından başlatır (özet ile sabitlenmiştir) ve onu asla çekmez; kendiniz docker pull çalıştırmanız REE-Binary-License için rıza demektir. ree_verify_receipt ve ree_infer, ~/.cache/gensyn ve ~/.cache/huggingface dizinlerini okuma-yazma olarak bağlar (orada saklanan bir Hugging Face token dosyası konteyner tarafından görülebilir; ortamda hiçbir token aktarılmaz), bir receipt'in adlandırdığı herhangi bir model için Hugging Face ağırlıklarını indirebilir ve konteyner ağları Hugging Face ile sınırlı değildir; her çağrıda Hermes onayı ister ve cron, yolo, onaylar kapalı, tek sorgu, gözetimsiz koşular, host yalıtımı altında ya da onay API'si yokken reddeder. ree_validate_receipt, network none ile çalışır, sormaz ve receipt metni döndürmez. Ağ geçitlerinizden birine kabul edilen herhangi bir kişi bu araçları çağırabilir ve Docker daemon'ınızda konteynerleri onaylayabilir; hermes tools ile yüzey bazında devre dışı bırakın. \"always\" seçmek çağrı başına config.yaml dosyasına bir izin listesi satırı ekler ve sonraki çağrıyı asla kapsamaz. Yeni receipt'ler ve geçici çalışma dosyaları ~/.cache/hermes-ree altında yazılır; HERMES_HOME altında hiçbir şey saklanmaz. Konteyner, düşmanca kod için bir korumalı alan değildir. Cron oluşturulmaz."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.6"
