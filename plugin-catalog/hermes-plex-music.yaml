name: hermes-plex-music
repo: https://github.com/imzacksong/hermes-plex-music
sha: c583d6fdaac61d2108bada99b275460b4d08a993
description: "Mini-Plexamp for Hermes Desktop: statusbar player for your Plex music library — likes synced to Liked Songs, custom playlists with rename/delete, shuffle + repeat, sleep timer, queue editing, OS media keys. Needs only Plex Media Server. Zero API keys, zero model tokens. Disclosure — talks only to the Plex Media Server you configure (default http://127.0.0.1:32400), sending your Plex token in the request URL as Plex requires; the token is stored in Desktop plugin storage, and the optional \"Get token…\" button reads the Plex `.LocalAdminToken` file you pick. Likes and playlist create/rename/delete write to your Plex server. No agent tools, no telemetry."
description_tr: "Hermes Desktop için Mini-Plexamp: Plex müzik kitaplığınız için durum çubuğu oynatıcısı — Beğenilen Şarkılar ile eşitlenen beğeniler, yeniden adlandırma/silme destekli özel oynatma listeleri, karıştırma + tekrar, uyku zamanlayıcısı, sıra düzenleme ve işletim sistemi medya tuşları. Yalnızca Plex Media Server gerekir. Sıfır API anahtarı, sıfır model token'ı. Açıklama — yalnızca yapılandırdığınız Plex Media Server ile konuşur (varsayılan http://127.0.0.1:32400) ve Plex'in gerektirdiği şekilde Plex token'ınızı istek URL'sinde gönderir; token, Desktop eklenti deposunda saklanır ve isteğe bağlı “Token al…” düğmesi seçtiğiniz Plex `.LocalAdminToken` dosyasını okur. Beğeniler ve oynatma listesi oluşturma/yeniden adlandırma/silme işlemleri Plex sunucunuza yazar. Ajan aracı yok, telemetri yok."
maintainer: imzacksong
