description: "Exact Western and Vedic astrology through the Astro Agents MCP server (Streamable HTTP at https://astro-agent.dev/mcp, no sign-in, no keys in config): birth chart, transits, synastry, kundli with D1-D60 divisional charts, Vimshottari dashas, doshas, panchang and Gun Milan, computed from the NASA/JPL DE440 ephemeris with no LLM; every result carries a SHA-256 hash. Bundles the astrology skill (when to call which tool, input conventions). Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code; every tool call sends the birth date, time and coordinates it is given to astro-agent.dev, and the tool set is served by that server at runtime, not covered by the pinned sha. Each client gets 3 free calls, after which a tool returns REST payment instructions (x402 or MPP); nothing is charged over MCP and the package holds no wallet or key."
description_tr: "Astro Agents MCP sunucusu üzerinden kesin Batı ve Vedik astrolojisi (https://astro-agent.dev/mcp adresinde akışlanabilir HTTP, giriş yok, yapılandırmada anahtar yok): Doğum haritası, transitler, sinastri, D1-D60 bölümsel haritalarla kundli, Vimshottari dashaları, doshalar, panchang ve Gun Milan; LLM olmadan NASA/JPL DE440 efemerisinden hesaplanır; her sonuç bir SHA-256 karması taşır. Astroloji yeteneğini (hangi aracın ne zaman çağrılacağı, girdi kuralları) paketler. Agent Plugins v1 paketi (plugin.json + mcp.json + skills/), yalnızca yapılandırma içerir. Açıklama — Yerel kodu olmayan yalnızca barındırılan bir bağlayıcıdır; her araç çağrısı verilen doğum tarihini, saatini ve koordinatlarını astro-agent.dev adresine gönderir ve araç seti çalışma zamanında bu sunucu tarafından sağlanır, sabitlenmiş sha kapsamına girmez. Her istemciye 3 ücretsiz çağrı verilir, sonrasında bir araç REST ödeme talimatlarını (x402 veya MPP) döndürür; MCP üzerinden hiçbir ücret alınmaz ve paket herhangi bir cüzdan veya anahtar tutmaz."
