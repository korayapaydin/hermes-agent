title: HyAtlas Memory
description: "HyAtlas 5 — self-hosted 8-layer memory provider backed by a pure-Go single-binary server you run yourself (chromem-go vectors, in-process BGE-small embeddings, hybrid vector + keyword search, bitemporal knowledge graph with source citations). Embeddings, the vector index and stored memories are kept locally. Ships agent tools (hyatlas_status/search/recent/add), a `hermes hyatlas` CLI, a Desktop pane with a starmap graph view, and a web dashboard. Disclosure — requires the separate hyatlas-go server, installed by the user. The plugin never downloads or bundles it, and it talks only to the configured server (default 127.0.0.1:19528). Embeddings are computed locally; stored memories leave the machine only in the LLM calls described below. Extraction is opt-in and uses an LLM you choose: `hermes memory setup` asks for any OpenAI-compatible endpoint, model and key, and stores the key in Hermes's .env as HYATLAS_LLM_KEY. The plugin reads that key only through Hermes's get_secret and reads no Hermes credential. A plain key file named by HYATLAS_LLM_KEY_FILE also works; the server reads it on every call, so do not point it at another program's credentials such as Hermes auth.json. The server has no default endpoint and makes no LLM call until the endpoint, the model and a key are all present; while the endpoint and model are set but no key has arrived, /api/v1/status reports llm \"awaiting_key\". `hermes memory setup`, the repo installer and the sample launcher pre-fill a free Nous Portal endpoint and model (and setup defaults to ultra mode), but nothing is sent until a key is supplied. A server the plugin starts gets that key in its environment; for a server started another way (the launcher, a service) that reports \"awaiting_key\", the plugin (at most every 10 minutes) and `hermes hyatlas doctor` POST the key over plain HTTP to /api/v1/llm/key, only when the configured server host is this machine; the server accepts it only from a loopback address and keeps it in memory only, never on disk. Once configured, each turn's user and assistant text goes to that endpoint (not tool output or context summaries; capped at 12,000 characters), together with up to 5 related stored facts, 3 entity pages and 5 open intentions of that owner so the model can update them instead of duplicating them. In the default ultra mode the server also sends topic-grouped batches of up to 50 stored facts to it every 6 hours (every 20 minutes while earlier batches are still pending) and supersedes (hides but keeps) the facts the model marks merged or stale, recording a reason for each drop. It also records relations corroborated across turns in the local knowledge graph (HYATLAS_CONSOLIDATE_GRAPH=off disables that). Once a day per owner (HYATLAS_CROSS_SCHEMA_EVERY; off disables it) ultra also sends up to 40 of that owner's stored patterns to find up to 3 that hold across topics. In pro and ultra modes it also sends each owner's open intentions, recent summaries and newest facts to rewrite a short Now page, at most every 15 minutes (HYATLAS_NOW_EVERY), and, after a 30-minute pause in an owner's writes (HYATLAS_EPISODE_GAP; off disables it), up to 40 of that stretch's facts to write one episode summary. HYATLAS_RECONCILE=on (off by default) adds a second LLM call per write that sends the new facts together with similar stored ones (including those under user IDs grouped with the owner by HYATLAS_USER_ALIASES) so the model can update, replace or link them; it is meant for a local model. An optional HYATLAS_LLM_FALLBACK_MODEL, tried only when a primary call fails, receives the same text; it is sent the primary key only when it uses the same host. Turns written while the endpoint was unreachable or before a key arrived are extracted later by a catch-up pass (every 10 minutes by default, HYATLAS_CATCHUP_EVERY; rows up to 7 days old, HYATLAS_CATCHUP_MAX_AGE), sending the same text a write would have sent. `hermes hyatlas doctor` sends one short test prompt (\"Reply with the single word OK.\") to the endpoint and writes, finds and deletes one test memory.
  When you replace or remove an entry with Hermes's memory tool, the plugin asks the local server to retire the matching memory (reversible); nothing leaves the machine. HYATLAS_MODE=lite makes no LLM call. Server endpoints that rewrite stored data are off unless the server runs with HYATLAS_ADMIN=on. The spawned server gets an allowlisted environment (OS essentials plus HYATLAS_*), not the agent's keys. auto_start is off by default; when on, Hermes starts the server as soon as it loads the plugin, and a server started by auto_start or `hermes hyatlas start` keeps running after Hermes exits until `hermes hyatlas stop`. On Windows, if a hyatlas-go.ps1 launcher is configured, `hermes hyatlas start/stop` runs it; the repo's sample launcher reads no credentials (since 4.8.0 it no longer reads Hermes auth.json). No telemetry."
description_tr: "HyAtlas 5 — kendi çalıştırdığınız, saf Go ile yazılmış tek ikili dosyalık bir sunucuyla desteklenen, kendi sunucunuzda barındırılan 8 katmanlı bellek sağlayıcısı (chromem-go vektörleri, süreç içi BGE-small gömme, hibrit vektör + anahtar kelime araması, kaynak alıntılı iki zamanlı bilgi grafiği). Gömme, vektör dizini ve saklanan bellekler yerelde kalır. Ajan araçları (hyatlas_status/search/recent/add), bir `hermes hyatlas` CLI'ı, yıldız haritası grafik görünümlü bir Desktop paneli ve bir web panosu gelir. Açıklama — kullanıcı tarafından kurulan ayrı hyatlas-go sunucusunu gerektirir. Eklenti onu asla indirmez veya paketlemez ve yalnızca yapılandırılmış sunucuyla konuşur (varsayılan 127.0.0.1:19528). Gömmeler yerelde hesaplanır; saklanan bellekler makineden yalnızca aşağıda açıklanan LLM çağrılarında çıkar. Çıkarım isteğe bağlıdır ve seçtiğiniz bir LLM kullanır: `hermes memory setup` herhangi bir OpenAI uyumlu uç nokta, model ve anahtar sorar ve anahtarı Hermes'in .env dosyasında HYATLAS_LLM_KEY olarak saklar. Eklenti bu anahtarı yalnızca Hermes'in get_secret'i üzerinden okur ve hiçbir Hermes kimlik bilgisini okumaz. HYATLAS_LLM_KEY_FILE ile adlandırılan düz bir anahtar dosyası da çalışır; sunucu onu her çağrıda okur, bu yüzden onu Hermes auth.json gibi başka bir programın kimlik bilgilerine yönlendirmeyin. Sunucunun varsayılan bir uç noktası yoktur ve uç nokta, model ve anahtarın üçü de mevcut olana kadar hiçbir LLM çağrısı yapmaz; uç nokta ve model ayarlıyken henüz anahtar gelmemişse /api/v1/status, llm için \"awaiting_key\" bildirir. `hermes memory setup`, depo yükleyicisi ve örnek başlatıcı ücretsiz bir Nous Portal uç noktası ve modelini önceden doldurur (ve setup varsayılan olarak ultra kipine geçer), ancak anahtar sağlanana kadar hiçbir şey gönderilmez. Eklentinin başlattığı sunucu bu anahtarı ortamında alır; başka bir şekilde (başlatıcı, bir servis) başlatılan ve \"awaiting_key\" bildiren bir sunucu için eklenti (en fazla 10 dakikada bir) ve `hermes hyatlas doctor`, anahtarı düz HTTP üzerinden /api/v1/llm/key adresine POST eder; yalnızca yapılandırılmış sunucu ana bilgisayarı bu makineyse. Sunucu anahtarı yalnızca geri döngü adresinden kabul eder ve yalnızca bellekte tutar, asla diskte tutmaz. Yapılandırıldıktan sonra her turun kullanıcı ve asistan metni bu uç noktaya gider (araç çıktısı veya bağlam özetleri değil; 12.000 karakterle sınırlıdır), yanında o sahibin en fazla 5 ilgili saklanmış olgusu, 3 varlık sayfası ve 5 açık niyetiyle birlikte; böylece model bunları çoğaltmak yerine güncelleyebilir. Varsayılan ultra kipinde sunucu ayrıca her 6 saatte bir (önceki toplu işler hâlâ beklemedeyken her 20 dakikada bir) konuya göre gruplanmış en fazla 50 saklanmış olgu gönderir ve modelin birleştirilmiş ya da eskimiş olarak işaretlediği olguların yerine geçer (gizler ama saklar), her düşüş için bir neden kaydeder. Ayrıca turlar arasında doğrulanan ilişkileri yerel bilgi grafiğine kaydeder (HYATLAS_CONSOLIDATE_GRAPH=off bunu devre dışı bırakır). Sahip başına günde bir kez (HYATLAS_CROSS_SCHEMA_EVERY; off devre dışı bırakır) ultra ayrıca o sahibin saklanmış kalıplarından en fazla 40 tanesini, konular arasında geçerli olan en fazla 3 tanesini bulmak için gönderir. Pro ve ultra kiplerinde ayrıca her sahibin açık niyetlerini, son özetlerini ve en yeni olgularını kısa bir Now sayfasını yeniden yazmak için gönderir, en fazla 15 dakikada bir (HYATLAS_NOW_EVERY) ve bir sahibin yazmalarında 30 dakikalık bir duraklamadan sonra (HYATLAS_EPISODE_GAP; off devre dışı bırakır) o dönemin en fazla 40 olgusunu tek bir bölüm özeti yazmak için gönderir. HYATLAS_RECONCILE=on (varsayılan olarak kapalı) her yazma için ikinci bir LLM çağrısı ekler; bu çağrı yeni olguları benzer saklanmış olanlarla birlikte gönderir (HYATLAS_USER_ALIASES ile sahiple gruplanmış kullanıcı kimlikleri altındakiler dahil), böylece model bunları güncelleyebilir, değiştirebilir veya bağlayabilir; yerel bir model için tasarlanmıştır. İsteğe bağlı HYATLAS_LLM_FALLBACK_MODEL yalnızca birincil çağrı başarısız olduğunda denenir ve aynı metni alır; birincil anahtar ona yalnızca aynı ana bilgisayarı kullanıyorsa gönderilir. Uç nokta ulaşılamazken veya bir anahtar gelmeden önce yazılan turlar daha sonra bir yetişme geçişiyle çıkarılır (varsayılan olarak her 10 dakikada bir, HYATLAS_CATCHUP_EVERY; 7 güne kadar eski satırlar, HYATLAS_CATCHUP_MAX_AGE) ve bir yazmanın göndereceği aynı metni gönderir. `hermes hyatlas doctor` uç noktaya kısa bir test istemi gönderir (\"Reply with the single word OK.\") ve bir test belleğini yazar, bulur ve siler. Hermes'in bellek aracıyla bir girdiyi değiştirdiğinizde veya kaldırdığınızda eklenti yerel sunucudan eşleşen belleği emekliye ayırmasını ister (geri alınabilir); hiçbir şey makineden çıkmaz. HYATLAS_MODE=lite hiçbir LLM çağrısı yapmaz. Saklanan verileri yeniden yazan sunucu uç noktaları, sunucu HYATLAS_ADMIN=on ile çalışmadıkça kapalıdır. Başlatılan sunucu izin listesine alınmış bir ortam alır (işletim sistemi temelleri artı HYATLAS_*), ajanın anahtarlarını değil. auto_start varsayılan olarak kapalıdır; açıkken Hermes eklentiyi yükler yüklemez sunucuyu başlatır ve auto_start ya da `hermes hyatlas start` ile başlatılan bir sunucu, Hermes çıktıktan sonra `hermes hyatlas stop` çalıştırılana kadar çalışmaya devam eder. Windows'ta, bir hyatlas-go.ps1 başlatıcı yapılandırılmışsa `hermes hyatlas start/stop` onu çalıştırır; deponun örnek başlatıcısı hiçbir kimlik bilgisi okumaz (4.8.0'dan beri Hermes auth.json dosyasını artık okumaz). Telemetri yok."
