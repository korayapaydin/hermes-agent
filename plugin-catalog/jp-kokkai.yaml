name: jp-kokkai
repo: https://github.com/TakeshiTGAL/hermes-plugin-kokkai
sha: 7047db976671e39c69285d4b21dee00c026b19cb
description: 'Lists Diet meetings and returns a short speech excerpt, with kokkai_search, kokkai_speech, and kokkai_watch. Disclosure — Talks only to kokkai.ndl.go.jp over HTTPS GET with no API key. kokkai_search returns meeting metadata and the official meeting URL, and does not return speech text. kokkai_speech reads /api/speech and returns at most 10 excerpts, each at most 240 characters, with the speaker, the meeting name, the date, and the speech URL. Those excerpts are not written to plugin-data. The tools are on for every surface, including gateways: anyone you allow on your Hermes gateway, and a guest in a room with an empty allowlist, can search, read a speech excerpt, add a watch, and approve it. Turn a surface off with hermes tools. kokkai_watch add creates one cron job that runs a model turn once a day, at the hour you pick in Hermes''s own timezone, with no daily cap. It stays after uninstall until you run hermes cron remove, with -p and the profile name when the profile is not default. Adding or removing a watch asks for Hermes approval every time and is refused under cron, yolo, approvals off, unattended sessions, and plugins.isolation: host. Answering "always" adds an unused line to config.yaml. Under plugins.isolation: host the watch cannot save seen speech IDs and says so on every run. The watch relies on private parts of Hermes, so an update can stop it. State (your watch words, seen speech IDs, and the job id) stays in plugin-data/jp-kokkai after uninstall.'
description_tr: "Japonya Dieti toplantılarını listeler ve kokkai_search, kokkai_speech ve kokkai_watch ile kısa bir konuşma alıntısı döndürür. Açıklama — yalnızca kokkai.ndl.go.jp ile HTTPS GET üzerinden ve API anahtarı olmadan konuşur. kokkai_search, toplantı üst verisini ve resmî toplantı URL'sini döndürür ve konuşma metni döndürmez. kokkai_speech, /api/speech okur ve konuşmacı, toplantı adı, tarih ve konuşma URL'siyle birlikte en fazla 10 alıntı, her biri en fazla 240 karakter döndürür. Bu alıntılar plugin-data içine yazılmaz. Araçlar ağ geçitleri dâhil her yüzeyde açıktır: Hermes ağ geçidinizde izin verdiğiniz herkes ve izin listesi boş bir odadaki konuk, arama yapabilir, bir konuşma alıntısı okuyabilir, bir izleme ekleyebilir ve onaylayabilir. Bir yüzeyi hermes tools ile kapatın. kokkai_watch add, günde bir kez, Hermes'in kendi saat diliminde seçtiğiniz saatte, günlük sınır olmadan bir model turu çalıştıran bir cron işi oluşturur. Kaldırma sonrasında, profil varsayılan değilse -p ve profil adıyla birlikte hermes cron remove çalıştırana kadar kalır. İzleme eklemek ya da kaldırmak her seferinde Hermes onayı ister ve cron, yolo, onaylar kapalı, gözetimsiz oturumlar ve plugins.isolation: host altında reddedilir. \"always\" yanıtı config.yaml dosyasına kullanılmayan bir satır ekler. plugins.isolation: host altında izleme, görülen konuşma kimliklerini kaydedemez ve bunu her çalışmada söyler. İzleme, Hermes'in özel bölümlerine dayanır, bu yüzden bir güncelleme onu durdurabilir. Durum (izleme kelimeleriniz, görülen konuşma kimlikleri ve iş kimliği) kaldırma sonrasında plugin-data/jp-kokkai içinde kalır."
