title: Advanced Delegation
description: 'Two extra delegation modes for `delegate_task`, next to the built-in default. Model routes
  (`delegation.backend: model_map`): the agent picks a named model route per subagent from a list you
  define (e.g. fast, deep, local). Profile routes (`delegation.backend: profile_routes`): the agent runs a
  subagent as one of your Hermes profiles, with that profile''s own model, credentials, skills and SOUL.md.
  Only route names and their one-line descriptions reach the model. Adds `hermes delegation config` (pick
  the mode and edit its routes; `--show` prints the setup) and the `/delegation` slash command (save a mode
  for the next session, or `--now` to apply it to the current chat). Needs Hermes 0.22.5 or newer, the
  first release with pluggable delegation providers; Hermes 0.22.0 to 0.22.4 refuses to install it, and on
  a core older than 0.22.0 it installs, logs one warning and does nothing. Disclosure — no
  Python dependencies and no network or model calls of its own; subagents run through core''s
  `delegate_task` on the routes you configured. Writes only `delegation.backend` and
  `delegation.backends.*` (model_map / profile_routes) in the active profile''s config.yaml, through
  core''s config writer. A model route''s optional `api_key` is stored in config.yaml in plain text
  (`provider:` keeps keys in .env / auth.json). Listing a profile under profile routes lets this
  profile''s subagents use that profile''s credentials, SOUL.md and terminal policy.'
description_tr: "`delegate_task` için yerleşik varsayılanın yanında iki ek devretme modu. Model rotaları (`delegation.backend: model_map`): ajan, tanımladığınız listeden (örn. fast, deep, local) her alt ajan için adlandırılmış bir model rotası seçer. Profil rotaları (`delegation.backend: profile_routes`): ajan, bir alt ajanı Hermes profillerinizden biri olarak çalıştırır; o profilin kendi modeli, kimlik bilgileri, yetenekleri ve SOUL.md dosyasıyla. Modele yalnızca rota adları ve tek satırlık açıklamaları ulaşır. `hermes delegation config` komutunu (modu seçin ve rotalarını düzenleyin; `--show` kurulumu yazdırır) ve `/delegation` slash komutunu (sonraki oturum için bir mod kaydedin veya `--now` ile geçerli sohbete uygulayın) ekler. Hermes 0.22.5 veya üstünü gerektirir; takılabilir devretme sağlayıcılarının geldiği ilk sürüm budur. Hermes 0.22.0 ile 0.22.4 arası kurulumu reddeder; 0.22.0'dan eski bir çekirdekte ise kurulur, tek bir uyarı günlükler ve hiçbir şey yapmaz. Açıklama — Python bağımlılığı yoktur ve kendi ağ ya da model çağrısını yapmaz; alt ajanlar çekirdeğin `delegate_task` aracıyla, sizin yapılandırdığınız rotalar üzerinden çalışır. Etkin profilin config.yaml dosyasına yalnızca `delegation.backend` ve `delegation.backends.*` (model_map / profile_routes) yazar; bunu çekirdeğin yapılandırma yazıcısıyla yapar. Bir model rotasının isteğe bağlı `api_key` değeri config.yaml içinde düz metin olarak saklanır (`provider:` anahtarları .env / auth.json içinde tutar). Bir profili profil rotaları altında listelemek, bu profilin alt ajanlarının o profilin kimlik bilgilerini, SOUL.md dosyasını ve terminal ilkesini kullanmasına izin verir."
