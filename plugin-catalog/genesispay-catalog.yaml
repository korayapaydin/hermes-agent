title: GenesisPay Catalog
description: "Search products, services and shops listed on GenesisPay and read their verified-purchase reviews through the hosted, read-only GenesisPay Catalog MCP server (Streamable HTTP at https://catalog.genesispay.finance/mcp/catalog, no sign-in, no key), with a catalog skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no Python or executables. Disclosure — network calls to catalog.genesispay.finance, operated by GenesisPay (Genesis Technologies): search terms, filters and ids reach that server; no credentials are stored; all four tools are read-only and none pays, orders or changes anything; the tool set is served by the remote MCP server at runtime and is not covered by the pinned sha."
description_tr: "Barındırılan, salt okunur GenesisPay Catalog MCP sunucusu (https://catalog.genesispay.finance/mcp/catalog adresinde akışlanabilir HTTP, giriş yok, anahtar yok) ve beraberinde gelen bir katalog yeteneği ile GenesisPay'de listelenen ürünleri, hizmetleri ve mağazaları arayın ve doğrulanmış satın alma yorumlarını okuyun. Taşınabilir Agent Plugins v1 paketi (mcp.json + skills/), Python veya yürütülebilir dosya içermez. Açıklama — GenesisPay (Genesis Technologies) tarafından işletilen catalog.genesispay.finance adresine ağ çağrıları yapılır; arama terimleri, filtreler ve kimlikler bu sunucuya ulaşır; hiçbir kimlik bilgisi saklanmaz; dört aracın tamamı salt okunurdur ve hiçbiri ödeme yapmaz, sipariş vermez veya hiçbir şeyi değiştirmez; araç seti çalışma zamanında uzak MCP sunucusu tarafından sağlanır ve sabitlenmiş sha kapsamına girmez."
