name: kanban-task-threads
repo: https://github.com/diegomarino/kanban-task-threads
sha: 467284665eb18360e9c32cd8fe4ff76690a66231
description: "Give every Hermes kanban task a live Discord forum thread with a rewritten status card and append-only event log. Disclosure — sends task and lifecycle data to the configured Discord webhook (no host allowlist). Cards and event replies use built-in or operator-configured templates and may include identifiers, titles, status, assignment, branch and workspace metadata, relationships and blocking details, comments, event actors, reviewers, reasons, summaries, and configured dashboard links; the comment excerpt length is configurable. Fixed prerequisite announcements additionally send the prerequisite task ID, title, assignee, and up to 140 characters of its body and are not template-configurable. The absolute workspace path is off by default and requires explicit opt-in. Reads the kanban database read-only and stores thread mapping state under <kanban_home>/kanban/plugins/kanban-task-threads/. With an optional existing publisher-profile Discord bot token, reads forum and thread metadata; creates or repairs managed status tags and emojis; replaces applied tags on plugin-managed threads; renames threads; and archives or unarchives them. Discord fetches webhook avatars from the configured HTTPS asset origin. Disclosure — the avatar asset origin defaults to the author-hosted https://diegomarino.github.io/kanban-task-threads (disable with avatars_enabled: false). With the bot token the periodic metadata audit also lists the guild's active threads (filtered to the forum) and may rewrite the forum's available-tag list to add the 11 managed status tags (requires Manage Channels)."
description_tr: "Her Hermes kanban görevine, yeniden yazılmış bir durum kartı ve yalnızca eklenen bir olay günlüğüyle canlı bir Discord forum iş parçacığı verin. Açıklama — görev ve yaşam döngüsü verilerini yapılandırılmış Discord webhook'una gönderir (ana makine izin listesi yok). Kartlar ve olay yanıtları yerleşik veya operatörce yapılandırılmış şablonlar kullanır ve tanımlayıcıları, başlıkları, durumu, atamayı, dal ve çalışma alanı üst verilerini, ilişkileri ve engelleme ayrıntılarını, yorumları, olay aktörlerini, inceleyicileri, nedenleri, özetleri ve yapılandırılmış pano bağlantılarını içerebilir; yorum alıntısı uzunluğu yapılandırılabilir. Sabit ön koşul duyuruları ayrıca ön koşul görevinin kimliğini, başlığını, atananı ve gövdesinden en fazla 140 karakteri gönderir ve şablonla yapılandırılamaz. Mutlak çalışma alanı yolu varsayılan olarak kapalıdır ve açık katılım gerektirir. Kanban veritabanını salt okunur okur ve iş parçacığı eşleme durumunu <kanban_home>/kanban/plugins/kanban-task-threads/ altında saklar. İsteğe bağlı, mevcut bir publisher-profile Discord bot token'ıyla forum ve iş parçacığı üst verilerini okur; yönetilen durum etiketlerini ve emojilerini oluşturur veya onarır; eklenti tarafından yönetilen iş parçacıklarındaki uygulanmış etiketleri değiştirir; iş parçacıklarını yeniden adlandırır; ve onları arşivler veya arşivden çıkarır. Discord, webhook avatarlarını yapılandırılmış HTTPS varlık kaynağından getirir. Açıklama — avatar varlık kaynağı varsayılan olarak yazar tarafından barındırılan https://diegomarino.github.io/kanban-task-threads adresidir (avatars_enabled: false ile devre dışı bırakın). Bot token'ıyla periyodik üst veri denetimi ayrıca sunucunun etkin iş parçacıklarını listeler (foruma filtrelenmiş) ve 11 yönetilen durum etiketini eklemek için forumun kullanılabilir etiket listesini yeniden yazabilir (Manage Channels gerektirir)."
