name: fish-audio
title: Fish Audio
repo: https://github.com/100yenadmin/fish-audio-hermes
sha: f7ae982e3bd44c8ed3c2489c887850fbb3c2c702
description: "Lifelike voices for your agent: Fish Audio's expressive text-to-speech in 80+ languages, plus transcription, voice cloning and a voice library. The official Fish Audio plugin: Fish's Drama 3 model with word-level direction, speech-to-text, Fish Audio's community voice library, voice cloning and voice design, with a Voices page in Hermes Desktop. Fish Audio becomes a Hermes speech and transcription provider for voice replies, read-aloud, voice notes and Desktop dictation, with sentence-by-sentence streaming in CLI voice mode and Desktop, and live dictation captions on Hermes 0.21.6+ (stt.streaming: true). Adds the fish_speak, fish_voices and fish_transcribe tools, /fish and hermes fish commands, and four skills. Disclosure — sends your Fish API key and the text, audio (with file names) and voice titles, tags, descriptions, cover images and design instructions you ask it to process to api.fish.audio, or to the base_url you configure, and reads your Fish wallet for balances and model choice; with live dictation on, microphone audio streams to api.fish.audio's realtime speech-to-text endpoint while you speak, billed per committed phrase rounded up to a second; synthesis, transcription, cloning and voice design are paid requests billed to your Fish account, except the free s2.1-pro-free model (free through 30 November 2026), whose requests Fish may use to improve its models. The key comes from the profile's secret scope (Hermes stores it in the profile .env; a single-profile install may also read FISH_API_KEY from the environment). Generated audio and subtitles are written to Hermes's audio cache; clone samples and recordings it uploads must be regular audio files, and Hermes config, secret and credential paths are refused. Cloning and deleting voices from chat or the model tools go through Hermes's approval gate and follow your approval settings. The Desktop Voices page and a Fish Audio settings page add gateway routes under /api/plugins/fish-audio/, behind the Hermes dashboard's existing authentication. On the Voices page, previews, clones and voice designs are billed; cloning a voice or saving a designed one creates a voice in your Fish account; cloning and deleting are confirmed on the page (a speaker-consent box, a typed voice name) instead of through Hermes's approval gate; and Use sets the profile's Fish voice, and its speech provider when none is set. The settings page and /fish alias can set or reset the profile's Fish model and voice and save up to 50 voice names in the profile's config. Preview and design audio files are deleted from the gateway once returned; a design's audio is held in gateway memory so you can save it, until it is saved, a later design or save finds it over an hour old, or the gateway stops; clone uploads are deleted after the clone, or by the next upload once idle for 15 minutes. With a key set, Desktop reads your Fish wallet when an agent is selected and about every five minutes, for the status-bar credit; favourites stay in Desktop's plugin storage on that computer, and fetched previews stay in the window's memory until it closes. Includes a report-a-problem skill: the agent drafts a bug report and files it to this plugin's repository as a public GitHub issue or comment with your gh login only after you approve the exact text; reports leave out keys, credit amounts and your own voice ids, and security problems go to the repository's private advisory form instead. No telemetry."
description_tr: "Ajanınız için gerçekçi sesler: Fish Audio'nun 80'den fazla dilde etkileyici metinden sese dönüşümü, ayrıca sesten-metne, ses klonlama ve bir ses kütüphanesi. Fish Audio'nun resmî eklentisi: kelime düzeyinde yönlendirme sunan Drama 3 modeli, konuşmadan metne, Fish Audio'nun topluluk ses kütüphanesi, ses klonlama ve ses tasarımı; Hermes Desktop'ta bir Sesler sayfasıyla. Fish Audio, sesli yanıtlar, sesli okuma, sesli notlar ve Desktop dikte için bir Hermes konuşma ve yazıya dökme sağlayıcısı olur; CLI ses kipinde ve Desktop'ta cümle cümle akış, Hermes 0.21.6+ sürümünde canlı dikte altyazıları (stt.streaming: true) sunar. fish_speak, fish_voices ve fish_transcribe araçlarını, /fish ve hermes fish komutlarını ve dört yeteneği ekler. Açıklama — Fish API anahtarınızı ve işlemesini istediğiniz metni, sesi (dosya adlarıyla birlikte) ve ses başlıklarını, etiketleri, açıklamaları, kapak görsellerini ve tasarım talimatlarını api.fish.audio adresine ya da yapılandırdığınız base_url adresine gönderir ve bakiye ile model seçimi için Fish cüzdanınızı okur; canlı dikte açıkken, siz konuşurken mikrofon sesi api.fish.audio'nun gerçek zamanlı konuşmadan metne uç noktasına akar ve her taahhüt edilen ifade için bir saniyeye yuvarlanarak faturalandırılır; sentez, yazıya dökme, klonlama ve ses tasarımı Fish hesabınıza faturalandırılan ücretli isteklerdir; ücretsiz s2.1-pro-free modeli (30 Kasım 2026'ya kadar ücretsiz) hariçtir ve Fish bu modelin isteklerini modellerini geliştirmek için kullanabilir. Anahtar, profilin gizli kapsamından gelir (Hermes bunu profil .env dosyasında saklar; tek profilli bir kurulum FISH_API_KEY değişkenini ortamdan da okuyabilir). Üretilen ses ve altyazılar Hermes'in ses önbelleğine yazılır; yüklediği klon örnekleri ve kayıtlar normal ses dosyaları olmalıdır ve Hermes yapılandırma, sır ve kimlik bilgisi yolları reddedilir. Sohbetten ya da model araçlarından ses klonlama ve silme, Hermes'in onay kapısından geçer ve onay ayarlarınıza uyar. Desktop Sesler sayfası ve bir Fish Audio ayarlar sayfası, /api/plugins/fish-audio/ altına, Hermes gösterge panelinin mevcut kimlik doğrulamasının arkasına ağ geçidi rotaları ekler. Sesler sayfasında önizlemeler, klonlar ve ses tasarımları faturalandırılır; bir sesi klonlamak ya da tasarlanmış bir sesi kaydetmek Fish hesabınızda bir ses oluşturur; klonlama ve silme, Hermes'in onay kapısı yerine sayfada onaylanır (bir konuşmacı onay kutusu, yazılan bir ses adı); ve Kullan, profilin Fish sesini ve hiçbiri ayarlanmamışsa konuşma sağlayıcısını ayarlar. Ayarlar sayfası ve /fish takma adı, profilin Fish modelini ve sesini ayarlayabilir ya da sıfırlayabilir ve profile ait config içinde en fazla 50 ses adı kaydedebilir. Önizleme ve tasarım ses dosyaları döndürüldükten sonra ağ geçidinden silinir; bir tasarımın sesi kaydedebilmeniz için ağ geçidi belleğinde tutulur; ta ki kaydedilene, daha sonraki bir tasarım ya da kaydetme onu bir saatten eski bulana veya ağ geçidi durana kadar; klon yüklemeleri klonlamadan sonra ya da 15 dakika boşta kaldıktan sonraki ilk yüklemede silinir. Bir anahtar ayarlıyken Desktop, bir ajan seçildiğinde ve yaklaşık her beş dakikada bir, durum çubuğundaki kredi için Fish cüzdanınızı okur; favoriler o bilgisayardaki Desktop eklenti deposunda kalır ve getirilen önizlemeler pencere kapanana kadar pencerenin belleğinde kalır. Bir sorun bildirme yeteneği içerir: ajan bir hata raporu taslağı hazırlar ve yalnızca siz tam metni onayladıktan sonra gh oturumunuzla bu eklentinin deposuna herkese açık bir GitHub sorunu ya da yorumu olarak iletir; raporlar anahtarları, kredi tutarlarını ve kendi ses kimliklerinizi içermez ve güvenlik sorunları bunun yerine deponun özel bildirim formuna gider. Telemetri yok."
