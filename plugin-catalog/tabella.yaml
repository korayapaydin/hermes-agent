name: tabella
repo: https://github.com/dyiapanis/tabella
sha: 449e75462dc227789ef5c64e828c4db577f40ee5
description: >-
  Document lifecycle for agents in one package: create .docx/.xlsx/.pptx/.pdf/.odt/.ods/.odp
  from structured JSON or raw HTML/CSS, convert between formats via pandoc + LaTeX, and read
  any document — anydoc (Rust, office formats and text PDFs to Markdown, in-process) with
  LiteParse + Tesseract OCR fallback for scanned PDFs and images, plus PDF text editing with
  output-directory guards. Ships as an Agent Plugins v1 package (auto-discovered plugin.json +
  mcp.json declaring a stdio MCP server — the client spawns it per the v1 lifecycle,
  PLUGIN_ROOT/PLUGIN_DATA injected — plus an optional self-host streamable-HTTP server;
  first run of either bootstraps the dependency venv). The HTTP lane binds to 127.0.0.1 only
  and requires Bearer auth out of the box: a random token is generated into
  PLUGIN_DATA on first run (TABELLA_TOKEN overrides); requests with an Origin
  header or a non-JSON body are rejected, and model-supplied HTML cannot fetch
  network or local-file resources (data: URIs only — the same fetcher now also
  guards CSS input, not just HTML). Pandoc invocations are argument-safe:
  extra_args is allowlisted (--toc, --number-sections, -V key=value) and
  from_format/to_format are validated against the built-in format-name grammar
  (^[a-z0-9_]+([+-][a-z0-9_]+)*$), closing pandoc's *.lua reader/writer
  code-exec path; both servers re-exec into the dependency venv after
  bootstrap. Disclosure — Python
  deps (python-docx, openpyxl, python-pptx, weasyprint, odfpy, Pillow, lxml, PyMuPDF,
  firecrawl-anydoc, liteparse — 10 direct packages, transitives included in a 25-package
  closure) are pinned to exact versions with sha256 hashes in requirements-pinned.txt and
  installed with --require-hashes into a venv under PLUGIN_DATA or ~/.venvs/docs
  (scripts/setup.sh on Linux/macOS; on Windows the venv is built with the standard
  library's venv module — no bash or MSYS2 needed); system pandoc is required for
  conversion, a TeX engine (e.g. texlive-xetex) only when the output format is PDF
  (weasyprint for HTML->PDF); OCR needs the tesseract binary (UB-Mannheim build on
  Windows); all conversion, reading, OCR
  and PDF editing run locally with no network or telemetry; nothing is uploaded; read,
  convert, and PDF-edit tools access exactly the filesystem paths you pass; doc_create_document
  additionally containment-checks its output paths against the configured output directory
  (escape warns). Linux and Windows are CI-tested platforms (five-lane smoke battery on
  windows-latest: stdio lifecycle through a natively bootstrapped venv, create, read,
  pdf-from-html via the GTK runtime, pandoc convert).
description_tr: "Ajanlar için tek pakette belge yaşam döngüsü: yapılandırılmış JSON'dan veya ham HTML/CSS'den .docx/.xlsx/.pptx/.pdf/.odt/.ods/.odp oluşturun, pandoc + LaTeX ile formatlar arasında dönüştürün ve her belgeyi okuyun — anydoc (Rust, ofis formatları ve metin tabanlı PDF'leri süreç içinde Markdown'a) ve taranmış PDF'ler ile görseller için LiteParse + Tesseract OCR yedeği, ayrıca çıktı dizini korumalı PDF metin düzenleme. Agent Plugins v1 paketi olarak gelir (otomatik keşfedilen plugin.json + stdio MCP sunucusu bildiren mcp.json — istemci onu v1 yaşam döngüsüne göre başlatır, PLUGIN_ROOT/PLUGIN_DATA enjekte edilir — artı isteğe bağlı bir kendi kendine barındıran streamable-HTTP sunucusu; ikisinden ilkinin ilk çalıştırması bağımlılık venv'ini başlatır). HTTP hattı yalnızca 127.0.0.1'e bağlanır ve kutudan çıktığı gibi Bearer kimlik doğrulaması gerektirir: ilk çalıştırmada PLUGIN_DATA içine rastgele bir belirteç üretilir (TABELLA_TOKEN bunu geçersiz kılar); Origin başlığı olan veya JSON olmayan gövdeli istekler reddedilir ve modelin sağladığı HTML ağ veya yerel dosya kaynaklarını getiremez (yalnızca data: URI'leri — aynı getirici artık yalnızca HTML'yi değil CSS girdisini de koruyor). Pandoc çağrıları argüman açısından güvenlidir: extra_args izin listelidir (--toc, --number-sections, -V key=value) ve from_format/to_format yerleşik format adı dilbilgisine karşı doğrulanır (^[a-z0-9_]+([+-][a-z0-9_]+)*$), bu da pandoc'un *.lua okuyucu/yazıcı kod çalıştırma yolunu kapatır; her iki sunucu da bootstrap sonrasında bağımlılık venv'ine yeniden exec yapar. Açıklama — Python bağımlılıkları (python-docx, openpyxl, python-pptx, weasyprint, odfpy, Pillow, lxml, PyMuPDF, firecrawl-anydoc, liteparse — 10 doğrudan paket, geçişli olanlar 25 paketlik bir kapanışta) requirements-pinned.txt içinde tam sürümlere ve sha256 karma değerlerine sabitlenmiştir ve scripts/setup.sh tarafından --require-hashes ile PLUGIN_DATA altındaki veya ~/.venvs/docs içindeki bir venv'e kurulur; PDF dönüştürme için pandoc ve texlive-xetex sistem paketleri (HTML->PDF için weasyprint) gerekir; OCR, tesseract ikilisini gerektirir; tüm dönüştürme, okuma, OCR ve PDF düzenleme ağ veya telemetri olmadan yerel olarak çalışır; hiçbir şey yüklenmez; read, convert ve PDF düzenleme araçları tam olarak verdiğiniz dosya sistemi yollarına erişir; doc_create_document ayrıca çıktı yollarını yapılandırılmış çıktı dizinine karşı kapsama denetiminden geçirir (dışarı çıkma uyarı verir). Linux test edilen platformdur."
