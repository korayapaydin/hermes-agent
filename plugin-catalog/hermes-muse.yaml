name: hermes-muse
repo: https://github.com/xiaohei-info/hermes-muse
sha: 0dade28130b6901dfa2dd81a067856441948d33c
version: "0.3.1"
description: >-
  A proactive companion for Hermes: follows accepted goals (active/done/cancelled),
  prepares sourced research and Feed articles,
  maintains memory, and assembles rolling 30-day or natural-month calendar views.
  Read-only local Dashboard/Desktop pages show Feed, Ideas and Goals; profile
  selection cannot install, enable or disable Muse in any profile.
  One Skill, one state tool and six fixed recurring jobs; selected notices and
  weekly/monthly reports go to the active profile's Bot Chat and run an assistant
  turn there. Sources, authorization, quiet hours and actual result/delivery
  receipts remain distinct; partial coverage is not global availability.
  Disclosure: first load creates profile-local files/SQLite state and owned Cron
  scripts/jobs. Private/local input inbox rows retain their first 8000 characters
  and source identities, with associated chat/user routing IDs when present.
  The newest 500 remain; older rows are cleaned on later input only after both
  hourly/nightly cursors cover them. Unprocessed backlog can exceed 500 and has no
  fixed retention time. Native conversations/tool results are read separately;
  research records can retain returned payloads. Idempotency journals and
  oversized tool results stay in the profile state database without automatic
  expiry and may contain written content or tool output. Bounded conversation
  previews support full revision-checked paging. Delegates are instructed to
  remain read-only under inherited permissions, not sandboxed. Workers always use
  public delegate_task dispatch and follow the user's delegation settings; leave
  delegation.provider/model empty to keep the parent model. New Cron watches
  require cron.allow_agent_scheduling; local goal registration creates no job.
  Watch prompt/stop fields each allow 4000 characters; new repeating watches
  (interval or cron) must be at least 30 minutes apart, one-off schedules are
  exempt. Windows is not supported (POSIX file locks) and CI does not cover it.
  Background work incurs normal model/tool costs. No telemetry, self-updater,
  mandatory service, core/SOUL replacement or phone/read-receipt guarantee.
  Native remove retains data/tasks for the documented owned-only cleanup.
description_tr: "Hermes için proaktif bir yoldaş: kabul edilen hedefleri izler (etkin/tamamlandı/iptal), kaynaklı araştırmalar ve Feed makaleleri hazırlar, belleği korur ve kayan 30 günlük ya da takvim ayına dayalı görünümler oluşturur. Salt okunur yerel Dashboard/Desktop sayfaları Feed, Ideas ve Goals bölümlerini gösterir; profil seçimi hiçbir profilde Muse'u kuramaz, etkinleştiremez ya da devre dışı bırakamaz. Tek bir Yetenek, tek bir durum aracı ve altı sabit yinelenen iş; seçili bildirimler ile haftalık/aylık raporlar etkin profilin Bot Chat'ine gider ve orada bir asistan turu çalıştırır. Kaynaklar, yetkilendirme, sessiz saatler ve fiilî sonuç/teslim makbuzları ayrı kalır; kısmi kapsam, genel erişilebilirlik anlamına gelmez. Açıklama — ilk yükleme, profile özgü dosyalar/SQLite durumu ve sahipli Cron betikleri/işleri oluşturur. Özel/yerel girdi gelen kutusu satırları, ilk 8.000 karakterini ve kaynak kimliklerini, varsa ilişkili sohbet/kullanıcı yönlendirme kimlikleriyle birlikte saklar. En yeni 500 satır kalır; daha eski satırlar, ancak hem saatlik hem gecelik imleçler onları kapsadıktan sonra sonraki girdide temizlenir. İşlenmemiş birikim 500'ü aşabilir ve sabit bir saklama süresi yoktur. Yerel konuşmalar/araç sonuçları ayrı okunur; araştırma kayıtları döndürülen yükleri saklayabilir. Yinelenebilirlik günlükleri ve boyutu aşan araç sonuçları, otomatik sona erme olmadan profil durum veritabanında kalır ve yazılmış içerik ya da araç çıktısı barındırabilir. Sınırlı konuşma önizlemeleri, tam revizyon denetimli sayfalamayı destekler. Temsilcilere, devralınan izinler altında salt okunur kalmaları talimatı verilir; korumalı alanda değildirler. Çalışanlar her zaman genel delegate_task gönderimini kullanır ve kullanıcının delegasyon ayarlarını izler; üst modeli korumak için delegation.provider/model alanlarını boş bırakın. Yeni Cron izlemeleri cron.allow_agent_scheduling gerektirir; yerel hedef kaydı hiçbir iş oluşturmaz. İzleme istem/durdurma alanlarının her biri 4.000 karaktere izin verir; yeni yinelenen izlemeler (aralık veya cron) en az 30 dakika arayla olmalıdır, tek seferlik zamanlamalar muaftır. Windows desteklenmez (POSIX dosya kilitleri) ve CI bunu kapsamaz. Arka plan çalışması normal model/araç maliyetlerine yol açar. Telemetri, kendini güncelleyici, zorunlu hizmet, çekirdek/SOUL değişimi veya telefon/okundu makbuzu garantisi yoktur. Yerel kaldırma, belgelenmiş yalnızca sahipli temizliğe yönelik verileri/görevleri korur."
maintainer: xiaohei-info
