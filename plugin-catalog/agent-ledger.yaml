name: agent-ledger
version: "0.4.4"
repo: https://github.com/ZidoCode/agent-ledger
sha: e9eba114cbebd9c4f55a90efe2eb3e1afe70a336
description: "Write-ahead ledger for agent side effects, with an OWASP Agentic Top 10 posture scorer. Disclosure — records the arguments (up to 4000 chars: terminal commands, file contents, MCP args) and a 300-char result digest of every state-changing tool call in a local plaintext SQLite ledger under HERMES_HOME/plugin-data/agent-ledger/ that is never pruned; injects a warning listing this session's unconfirmed calls into the next turn's context; an optional policy engine (off by default; you add policy.json and set policy_mode) can refuse matching tool calls before they run; the optional posture_daily.py script, run from your own cron, sends a score summary to Telegram with the bot token you give it."
description_tr: "Ajan yan etkileri için yazma öncesi defter ve OWASP Agentic Top 10 durum puanlayıcısı. Açıklama — durum değiştiren her araç çağrısının bağımsız değişkenlerini (4.000 karaktere kadar: terminal komutları, dosya içerikleri, MCP bağımsız değişkenleri) ve 300 karakterlik sonuç özetini, HERMES_HOME/plugin-data/agent-ledger/ altındaki ve asla temizlenmeyen yerel, düz metin bir SQLite defterine kaydeder; bu oturumun onaylanmamış çağrılarını listeleyen bir uyarıyı bir sonraki turun bağlamına enjekte eder; isteğe bağlı bir ilke motoru (varsayılan olarak kapalı; policy.json ekleyip policy_mode ayarlarsınız) eşleşen araç çağrılarını çalıştırmadan önce reddedebilir; kendi cron'unuzdan çalıştırılan isteğe bağlı posture_daily.py betiği, ona verdiğiniz bot token'ıyla Telegram'a bir puan özeti gönderir."
maintainer: ZidoCode
tier: community
category: tools
requires_hermes: ">=0.19.0"
docs_url: https://github.com/ZidoCode/agent-ledger#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - on_session_start
  provides_middleware: []
  requires_env: []
