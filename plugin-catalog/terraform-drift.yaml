name: terraform-drift
repo: https://github.com/TakeshiTGAL/hermes-plugin-terraform-drift
sha: 787dd77e63a5f9b593034fa13fccb12fdece6cb1
description: Compare pinned Terraform provider and module versions with the public registry. Disclosure — tools are on for every Hermes surface, including the gateway. Stop a surface with hermes tools disable --platform <name> terraform-drift, or the plugin with hermes plugins disable terraform-drift. Nothing is written under plugin-data/terraform-drift, and there is no key. Only the directory you name is read, and only .tf, .tf.json, and .terraform.lock.hcl. Symlinks and .. are refused, and .env, tfvars, .terraform, backend values, and hashes are not returned. The provider pin is the lock version, not the required_providers constraint. A module pin is an exact version only. GET calls only registry.terraform.io and, for a github.com source, raw.githubusercontent.com CHANGELOG.md. Redirects and proxy variables are ignored. A timeout or failed read leaves latest empty and is not called current. Semver orders versions, so 1.10.0 is newer than 1.9.0. The digest text is not sent and no cron job is created. known keeps newer versions, and omitting it does not call rows new today. There is no approval card. Before the call, name the directory and say there is no init, plan, apply, or state write. Cron, yolo, and approvals off can still run this read. MIT, no daily cap, requires Hermes >=0.21.4.
description_tr: "Sabitlenmiş Terraform sağlayıcı ve modül sürümlerini genel kayıt defteri ile karşılaştırın. Bilgilendirme — araçlar, ağ geçidi dahil tüm Hermes yüzeylerinde açıktır. Bir yüzeyi `hermes tools disable --platform <name> terraform-drift` ile veya eklentiyi `hermes plugins disable terraform-drift` ile durdurun. plugin-data/terraform-drift altına hiçbir şey yazılmaz ve bir anahtar yoktur. Yalnızca belirttiğiniz dizin okunur ve yalnızca .tf, .tf.json ve .terraform.lock.hcl dosyaları alınır. Sembolik bağlantılar ve .. reddedilir; .env, tfvars, .terraform, backend değerleri ve hash'ler döndürülmez. Sağlayıcı sabitlemesi, required_providers kısıtlaması değil, kilit (lock) sürümüdür. Bir modül sabitlemesi yalnızca kesin bir sürümdür. GET çağrıları yalnızca registry.terraform.io ve github.com kaynağı için raw.githubusercontent.com CHANGELOG.md adreslerini çağırır. Yönlendirmeler ve proxy değişkenleri yoksayılır. Zaman aşımı veya başarısız okuma, latest'i boş bırakır ve mevcut (current) olarak adlandırılmaz. Semver sürümleri sıralar, dolayısıyla 1.10.0, 1.9.0'dan daha yenidir. Özet metni gönderilmez ve cron işi oluşturulmaz. known daha yeni sürümleri tutar ve bunun eksik olması satırların bugün yeni olduğu anlamına gelmez. Onay kartı yoktur. Çağrıdan önce dizini belirtin ve init, plan, apply veya state yazımı olmadığını söyleyin. Cron, yolo ve onaylar kapalıyken bile bu okuma işlemi çalışabilir. MIT, günlük sınır yok, Hermes >=0.21.4 gerektirir."
