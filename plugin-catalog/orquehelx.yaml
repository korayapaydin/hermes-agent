name: orquehelx
repo: https://github.com/TicoraX/OrqueHelx
sha: 964896e44979b29755dd880c5eb2557909e88bf6
subdir: orquehelx
description: >-
  Per-call delegation across your own subscriptions. The model sends each subagent to a named route with
  delegate_to(route, goal, context); each route pins a provider Hermes already knows (Claude, Codex or
  Antigravity subscription plugins, ACP provider plugins) and a model. delegate_task, by contrast, uses the
  one target in config.yaml. Subagents launch through ctx.subagent_lifecycle. A child counts as out of quota
  only on an unambiguous provider error or a measured window at 100 %, and the route never switches on its
  own: a policy decides whether the parent asks you, picks another route, or waits. Disclosure: a
  pre_tool_call hook blocks delegate_task spawns while routes are configured (list/steer/stop pass); an
  api_request_error hook records quota errors in memory. Quota is read with Hermes' fetch_account_usage
  (Anthropic and OpenAI Codex) on /ohx quota and after a provider error. No other network egress, no files
  written.
description_tr: "Kendi abonelikleriniz arasında çağrı başına delegasyon. Model, her alt ajanı delegate_to(route, goal, context) ile adlandırılmış bir rotaya gönderir; her rota, Hermes'in zaten bildiği bir sağlayıcıyı (Claude, Codex ya da Antigravity abonelik eklentileri, ACP sağlayıcı eklentileri) ve bir modeli sabitler. Buna karşılık delegate_task, config.yaml içindeki tek hedefi kullanır. Alt ajanlar ctx.subagent_lifecycle üzerinden başlatılır. Bir alt ajan ancak belirsiz bir sağlayıcı hatasında ya da %100 ölçülen bir pencerede kotanın dışında sayılır ve rota asla kendi kendine geçmez: bir politika, ebeveynin size sorup soramayacağını, başka bir rota seçip seçmeyeceğini ya da bekleyip beklemeyeceğini karar verir. Açıklama — rota yapılandırılmışken bir pre_tool_call kancası delegate_task başlatmalarını engeller (list/steer/stop geçer); bir api_request_error kancası kota hatalarını bellekte kaydeder. Kota, /ohx quota üzerinde ve bir sağlayıcı hatasından sonra Hermes'in fetch_account_usage işleviyle (Anthropic ve OpenAI Codex) okunur. Başka ağ çıkışı yok, dosya yazılmaz."
maintainer: TicoraX
tier: community
category: automation
requires_hermes: ">=0.22.0"
docs_url: https://github.com/TicoraX/OrqueHelx/blob/964896e44979b29755dd880c5eb2557909e88bf6/README.md
version: "0.3.0"
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - delegate_to
  provides_hooks:
    - api_request_error
    - pre_tool_call
  provides_middleware: []
  requires_env: []
